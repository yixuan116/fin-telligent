<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Center Economics | AI / Compute / Data Center</title>
<meta name="description" content="Every tracked US AI data center on one map: bars whose height is linear in IT power, coloured by owner, from the first 48 MW site in 2021 to 12 GW running today. Data: Epoch AI (CC-BY).">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.4.0/maplibre-gl.css"
      integrity="sha512-DBNed2oEjOrfIRj8Czuzs7padWawLWbA64OoDekn8gs2a3J6WOaR5xXfnFgaxKGpxIuSn/rAo/PsgOgO6PZ/vA=="
      crossorigin="anonymous" referrerpolicy="no-referrer">

<style>
  /* ============================================================
     Tokens. The nav and the page chrome reuse the series variables
     from ai-compute-datacenter-economics/index.html so the three parts
     read as one site. The map stage keeps its own dark tokens in both
     light and dark mode -- this page is built to be projected, and a
     light basemap washes out the bars.
     ============================================================ */
  :root {
    --bg: #f5f6f8;
    --glass-bg: #ffffff;
    --glass-border: rgba(0, 0, 0, 0.06);
    --text-primary: #1a1a2e;
    --text-secondary: #4a4a68;
    --text-muted: #8b8ba0;
    --accent: #4f5bd5;
    --accent-soft: rgba(79, 91, 213, 0.1);
    --radius: 12px;
    --page-max: 1440px;
    --page-gutter: 32px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    /* Map stage: fixed, never themed. */
    --stage-bg: #11151a;
    --stage-panel: rgba(12, 16, 21, 0.82);
    --stage-panel-solid: #121820;
    --stage-border: rgba(255, 255, 255, 0.14);
    --stage-text: #f2f5f8;
    --stage-text-dim: #9fb0c0;
    --stage-text-faint: #64748b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- series nav (copied from part 1, three edits applied) ---------- */

  .series-nav {
    --series-tab-pad-x: 14px;
    background: #ffffff;
    border-bottom: 1px solid #e4e5ea;
    overflow-x: hidden;
  }
  .series-nav-inner {
    max-width: var(--page-max); margin: 0 auto; padding: 0 var(--page-gutter);
    display: flex; align-items: stretch; gap: 4px;
    flex-wrap: nowrap;
  }
  .series-tab {
    display: flex; align-items: center; gap: 8px;
    flex: 0 1 auto; min-width: 0;
    padding: 18px var(--series-tab-pad-x) 15px;
    border-bottom: 3px solid transparent;
    font-size: 0.86rem; font-weight: 500; line-height: 1.25;
    color: var(--text-muted);
    text-decoration: none;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .series-tab:first-child { padding-left: 0; }
  .series-tab-label {
    display: block; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  a.series-tab:hover { color: var(--text-primary); }
  .series-nav[data-current="cart"]       .series-tab[data-tab="cart"],
  .series-nav[data-current="compute"]    .series-tab[data-tab="compute"],
  .series-nav[data-current="datacenter"] .series-tab[data-tab="datacenter"] {
    color: var(--text-primary);
    font-weight: 600;
    border-bottom-color: var(--accent);
  }
  .series-tab.is-soon { color: #8e8e9c; cursor: default; }
  .series-tab-flag {
    flex-shrink: 0;
    font-size: 0.58rem; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; white-space: nowrap;
    color: #7c7c8a; background: #eeeef3;
    border-radius: 999px; padding: 3px 8px;
  }
  .series-tab-short { display: none; }

  @media (max-width: 620px) {
    .series-nav { --series-tab-pad-x: 7px; }
    .series-nav-inner { gap: 0; }
    .series-tab { flex-direction: column; align-items: flex-start; gap: 2px; padding: 12px var(--series-tab-pad-x) 10px; font-size: 0.76rem; }
    .series-tab-full { display: none; }
    .series-tab-short { display: inline; }
    .series-tab-flag { font-size: 0.52rem; padding: 2px 6px; letter-spacing: 0.04em; }
  }

  /* ---------- stage ---------- */

  #stage {
    position: relative;
    width: 100%;
    height: calc(100vh - 56px);
    min-height: 560px;
    background: var(--stage-bg);
    overflow: hidden;
    color: var(--stage-text);
  }

  #map, #deck-canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
  }
  #deck-canvas { z-index: 2; }
  .maplibregl-ctrl-attrib { display: none; }

  .stage-panel {
    background: var(--stage-panel);
    border: 1px solid var(--stage-border);
    border-radius: 10px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  /* ---------- scene buttons ---------- */

  #scene-bar {
    position: absolute; z-index: 5;
    top: 16px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: flex-start; gap: 8px;
  }
  .scene-group { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .scene-btn {
    font-family: inherit;
    font-size: 0.82rem; font-weight: 700; letter-spacing: 0.02em;
    padding: 9px 20px;
    border-radius: 999px;
    border: 1px solid var(--stage-border);
    background: var(--stage-panel);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: var(--stage-text-faint);
    cursor: not-allowed;
  }
  .scene-btn.is-ready { cursor: pointer; }
  .scene-btn.is-ready:hover { color: var(--stage-text); border-color: rgba(255, 255, 255, 0.3); }
  .scene-btn.is-active {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
  }
  .scene-btn[aria-disabled="true"] { opacity: 0.7; }

  /* ---------- counters ---------- */

  #counters {
    position: absolute; z-index: 5;
    top: 16px; left: 16px;
    padding: 12px 16px 11px;
    min-width: 168px;
  }
  .counter + .counter { margin-top: 9px; }
  .counter-label {
    display: block;
    font-size: 0.6rem; font-weight: 700; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--stage-text-dim);
    margin-bottom: 2px;
  }
  .counter-value {
    display: block;
    font-size: 1.6rem; font-weight: 800; line-height: 1.05;
    font-variant-numeric: tabular-nums;
  }
  .counter-value .unit { font-size: 0.8rem; font-weight: 700; color: var(--stage-text-dim); margin-left: 3px; }

  /* ---------- how we know ----------
     A quiet link under the counters. It is deliberately small and un-pilled
     so it does not read as a fifth scene button next to Who / Where / Why /
     When. */

  /* Sits at the end of the footnote line rather than beside the counters, so
     the top-left panel carries numbers only. */
  #how-btn {
    font-family: inherit; font-size: inherit; font-weight: 700;
    padding: 0; margin-left: 2px;
    border: 0; background: none;
    color: var(--stage-text-dim);
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
  }
  #how-btn:hover { color: var(--stage-text); }

  #how-scrim {
    position: absolute; inset: 0; z-index: 9;
    background: rgba(6, 9, 13, 0.55);
    display: none;
  }
  #how-scrim.is-open { display: block; }

  #how-panel {
    position: absolute; z-index: 10;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: min(560px, calc(100% - 48px));
    max-height: calc(100% - 64px);
    overflow-y: auto;
    padding: 20px 22px 18px;
    background: var(--stage-panel-solid);
    border: 1px solid var(--stage-border);
    border-radius: 12px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.6);
    display: none;
  }
  #how-panel.is-open { display: block; }

  .how-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; margin-bottom: 12px;
  }
  .how-title {
    font-size: 0.6rem; font-weight: 700; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--stage-text-dim);
  }
  #how-close {
    flex-shrink: 0;
    width: 24px; height: 24px; margin: -4px -4px 0 0;
    border: 1px solid var(--stage-border); border-radius: 6px;
    background: transparent; color: var(--stage-text-dim);
    font-size: 0.9rem; line-height: 1; cursor: pointer;
  }
  #how-close:hover { background: rgba(255, 255, 255, 0.12); color: var(--stage-text); }

  .how-headline {
    margin: 0 0 16px;
    font-size: 1rem; font-weight: 700; line-height: 1.45;
    color: var(--stage-text);
  }

  .how-steps {
    display: flex; align-items: stretch; gap: 0;
    margin-bottom: 16px;
  }
  .how-step {
    flex: 1;
    padding: 10px 12px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    font-size: 0.72rem; line-height: 1.4;
    color: var(--stage-text);
  }
  .how-step-n {
    display: block;
    font-size: 0.56rem; font-weight: 800; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--stage-text-faint);
    margin-bottom: 4px;
  }
  .how-arrow {
    flex-shrink: 0;
    display: flex; align-items: center;
    padding: 0 7px;
    color: var(--stage-text-faint); font-size: 0.9rem;
  }

  .how-fact { display: flex; gap: 10px; font-size: 0.78rem; line-height: 1.5; }
  .how-fact + .how-fact { margin-top: 7px; }
  .how-fact-label {
    flex-shrink: 0; width: 92px;
    font-size: 0.6rem; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--stage-text-faint);
    padding-top: 3px;
  }
  .how-fact-value { color: var(--stage-text); }
  .how-fact-value strong { color: #ffd37a; font-weight: 800; }
  .how-fact-note {
    display: block; margin-top: 2px;
    font-size: 0.64rem; color: var(--stage-text-faint);
  }

  .how-footnote {
    margin: 15px 0 0; padding-top: 11px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    font-size: 0.66rem; line-height: 1.5; color: var(--stage-text-faint);
  }

  @media (max-width: 620px) {
    .how-steps { flex-direction: column; gap: 0; }
    .how-arrow { padding: 4px 0; justify-content: center; transform: rotate(90deg); }
    .how-fact { flex-direction: column; gap: 2px; }
    .how-fact-label { width: auto; padding-top: 0; }
  }

  /* ---------- legend ---------- */

  #legend {
    position: absolute; z-index: 5;
    top: 16px; right: 16px;
    width: 232px;
    max-height: calc(100% - 150px);
    display: flex; flex-direction: column;
    padding: 11px 6px 10px 12px;
  }
  .legend-head {
    font-size: 0.6rem; font-weight: 700; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--stage-text-dim);
    padding-right: 6px; margin-bottom: 8px;
  }
  .legend-rows { overflow-y: auto; padding-right: 6px; min-height: 0; }
  .legend-rows::-webkit-scrollbar { width: 6px; }
  .legend-rows::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.16); border-radius: 3px; }
  .legend-row {
    display: grid; grid-template-columns: 11px 1fr auto;
    align-items: center; gap: 8px;
    padding: 3px 0;
    font-size: 0.74rem;
    transition: opacity 0.25s ease;
  }
  .legend-row.is-zero { opacity: 0.32; }
  .legend-row.is-pickable { cursor: pointer; border-radius: 4px; }
  .legend-row.is-pickable:hover { background: rgba(255, 255, 255, 0.07); }
  .legend-row.is-picked {
    background: rgba(255, 255, 255, 0.12);
    opacity: 1;
  }

  /* Who builds adds a second number per owner, so the row grows a column and
     the head grows matching captions. */
  #legend.is-two-col .legend-row {
    grid-template-columns: 11px 1fr 52px 52px;
  }
  /* Scoped to the owner head: #size-key carries a .legend-head of its own and
     must stay a plain caption rather than becoming a four-column grid. */
  #legend.is-two-col > #legend-head {
    display: grid;
    grid-template-columns: 11px 1fr 52px 52px;
    gap: 8px;
    align-items: end;
  }
  .legend-head-name { grid-column: 1 / span 2; }
  .legend-head-col { text-align: right; }
  .legend-mw-then { color: var(--stage-text); }
  .legend-swatch { width: 11px; height: 11px; border-radius: 3px; }
  .legend-name {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--stage-text);
  }
  .legend-mw {
    font-variant-numeric: tabular-nums;
    color: var(--stage-text-dim); font-weight: 700;
  }

  /* ---------- caption ----------
     Directly under the scene buttons at the top, not over the map, so it never
     sits on Texas or the Midwest. Smaller than the old overlay card, and with
     no panel behind it so it reads as a caption rather than a dialog. */

  #headline {
    position: absolute; z-index: 5;
    top: 96px; left: 50%; transform: translateX(-50%);
    width: max-content;
    max-width: min(560px, calc(100% - 420px));
    margin: 0;
    text-align: center;
    font-size: 0.82rem; font-weight: 600; line-height: 1.45;
    letter-spacing: 0.01em;
    color: var(--stage-text);
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.85), 0 0 26px rgba(0, 0, 0, 0.7);
    opacity: 0; visibility: hidden;
    transition: opacity 0.9s ease, visibility 0.9s;
  }
  #headline.is-shown { opacity: 1; visibility: visible; }

  /* ---------- size key ---------- */

  #size-key {
    margin-top: 11px; padding-top: 10px; padding-right: 6px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    flex-shrink: 0;
  }
  #size-key-bars { display: block; margin-top: 2px; }

  /* ---------- timeline ---------- */

  #timeline {
    position: absolute; z-index: 5;
    left: 16px; right: 16px; bottom: 44px;
    display: flex; align-items: center; gap: 14px;
    padding: 12px 16px;
  }
  #play {
    flex-shrink: 0;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid var(--stage-border);
    background: rgba(255, 255, 255, 0.08);
    color: var(--stage-text);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s ease;
  }
  #play:hover { background: rgba(255, 255, 255, 0.18); }
  #play svg { display: block; fill: currentColor; }

  .track-wrap { flex: 1; min-width: 0; }
  .track-top {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 0.68rem; color: var(--stage-text-dim);
    margin-bottom: 2px;
  }
  .track-now { font-weight: 800; color: var(--stage-text); font-size: 0.8rem; }

  /* The Who builds scene is a snapshot, so the track is held at Today. */
  #timeline.is-locked #slider { cursor: not-allowed; opacity: 0.55; }
  #timeline.is-locked #play { opacity: 0.4; pointer-events: none; }
  #timeline.is-locked #track-hint::before {
    content: "\01F512";
    margin-right: 5px;
    font-size: 0.8em;
  }

  /* The slider is the primary control, so it gets a real grab handle and a
     generous hit area rather than a hairline. */
  #slider {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 22px;
    background: transparent;
    cursor: grab;
    margin: 0;
  }
  #slider:active { cursor: grabbing; }
  #slider::-webkit-slider-runnable-track {
    height: 4px; border-radius: 2px;
    background: var(--track-fill);
  }
  #slider::-moz-range-track {
    height: 4px; border-radius: 2px;
    background: var(--track-fill);
  }
  #slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: #ffffff;
    border: 2px solid #11151a;
    margin-top: -6px;
    box-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
  }
  #slider::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: #ffffff; border: 2px solid #11151a;
    box-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
  }
  #slider:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

  .track-ticks {
    position: relative; height: 13px;
    font-size: 0.56rem; color: var(--stage-text-faint);
  }
  .track-tick {
    position: absolute; top: 0;
    transform: translateX(-50%);
    white-space: nowrap;
  }
  .track-tick.is-locked { color: #475569; }
  .track-tick.is-today { color: var(--stage-text); font-weight: 800; }

  /* ---------- site card ---------- */

  #site-card {
    position: absolute; z-index: 6;
    width: 266px;
    padding: 13px 15px 12px;
    background: var(--stage-panel-solid);
    border: 1px solid var(--stage-border);
    border-radius: 10px;
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.55);
    pointer-events: none;
    display: none;
  }
  #site-card.is-pinned { pointer-events: auto; }
  .card-name { font-size: 0.92rem; font-weight: 800; line-height: 1.25; margin-bottom: 2px; }
  .card-owner {
    display: flex; align-items: center; gap: 6px;
    font-size: 0.72rem; color: var(--stage-text-dim);
    margin-bottom: 9px;
  }
  .card-owner .legend-swatch { width: 9px; height: 9px; }
  .card-rows { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 0.74rem; }
  .card-key { color: var(--stage-text-faint); white-space: nowrap; }
  .card-val { color: var(--stage-text); font-variant-numeric: tabular-nums; }
  .card-note {
    margin-top: 9px; padding-top: 8px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    font-size: 0.64rem; color: var(--stage-text-faint); line-height: 1.45;
  }
  .card-approx { color: #d97e00; font-weight: 700; }
  .card-status { font-weight: 700; }

  /* ---------- footnote ---------- */

  #footnote {
    position: absolute; z-index: 5;
    left: 16px; right: 16px; bottom: 12px;
    text-align: center;
    font-size: 0.62rem; line-height: 1.5;
    color: var(--stage-text-faint);
  }

  /* ---------- loading / error ---------- */

  #stage-status {
    position: absolute; inset: 0; z-index: 8;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px;
    background: var(--stage-bg);
    font-size: 0.86rem; color: var(--stage-text-dim);
    text-align: center; padding: 24px;
  }
  #stage-status.is-hidden { display: none; }
  .spinner {
    width: 32px; height: 32px; border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.14);
    border-top-color: #ffffff;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 900px) {
    #legend { display: none; }
    #counters { padding: 9px 12px 8px; min-width: 136px; }
    .counter-value { font-size: 1.25rem; }
    #scene-bar { top: auto; bottom: 150px; }
    .scene-btn { font-size: 0.74rem; padding: 7px 13px; }
    /* No legend at this width, so the caption may use the full column. */
    #headline { top: 150px; max-width: calc(100% - 32px); font-size: 0.74rem; }
  }
</style>
</head>
<body>

  <!-- Series nav. Three edits from part 1's copy, as its comment block
       prescribes: data-current is this page's tab, every href is prefixed
       with ../ because the sub-pages sit one level deeper, and the Data
       Center span became an <a> while part 1 went back to being a link. -->
  <nav class="series-nav" data-current="datacenter" aria-label="AI / Compute / Data Center series">
    <div class="series-nav-inner">

      <a class="series-tab" data-tab="cart" href="../">
        <span class="series-tab-label">
          <span class="series-tab-full">AI Unit Economics</span>
          <span class="series-tab-short">AI Economics</span>
        </span>
      </a>

      <span class="series-tab is-soon" data-tab="compute" aria-disabled="true">
        <span class="series-tab-label">
          <span class="series-tab-full">Compute Economics</span>
          <span class="series-tab-short">Compute</span>
        </span>
        <span class="series-tab-flag">
          <span class="series-tab-full">Coming soon</span>
          <span class="series-tab-short">Soon</span>
        </span>
      </span>

      <a class="series-tab" data-tab="datacenter" href="./" aria-current="page">
        <span class="series-tab-label">
          <span class="series-tab-full">Data Center Economics</span>
          <span class="series-tab-short">Data Center</span>
        </span>
      </a>

    </div>
  </nav>

  <main id="stage">
    <div id="map"></div>
    <canvas id="deck-canvas"></canvas>

    <!-- Scene switches. Only the timeline is wired in this step; the four
         buttons are deliberately visible and inert so the shape of the full
         piece is legible from the first frame. -->
    <!-- Five flat buttons in value-chain order. Filled from CONFIG.scenes so
         a later step only has to flip its scene's `ready` flag. -->
    <div id="scene-bar" role="tablist" aria-label="Scenes"></div>

    <p id="headline"></p>

    <div id="counters" class="stage-panel">
      <div class="counter">
        <span class="counter-label" id="counter-power-label">IT power</span>
        <span class="counter-value" id="counter-power">&mdash;</span>
      </div>
      <div class="counter">
        <span class="counter-label" id="counter-sites-label">Sites live</span>
        <span class="counter-value" id="counter-sites">&mdash;</span>
      </div>
    </div>

    <div id="legend" class="stage-panel">
      <div class="legend-head" id="legend-head">Owner</div>
      <div class="legend-rows" id="legend-rows"></div>
      <div id="size-key">
        <div class="legend-head" id="size-key-head">Bar height = IT power</div>
        <svg id="size-key-bars" aria-hidden="true"></svg>
      </div>
    </div>

    <div id="timeline" class="stage-panel">
      <button type="button" id="play" aria-label="Play the timeline to today">
        <svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"></path></svg>
      </button>
      <div class="track-wrap">

    </p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.4.0/maplibre-gl.js"
        integrity="sha512-V0VCR62R076Ezy2E5xflGqGPDhGYWzebW9NQlh2y2qvAGzBu2xxuCsIF9DXLPasvmNNoQ5bSd+9wl+zOwwJ0Kg=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdn.jsdelivr.net/npm/deck.gl@9.3.11/dist.min.js"></script>

<script>
(function () {
  "use strict";

  /* ==========================================================================
     CONFIG -- every piece of on-screen wording and every colour lives here, so
     later scenes only add entries rather than editing the render code.
     ========================================================================== */
  var CONFIG = {
    data: {
      sites: "data/sites.json",
      states: "data/us_states.geojson",
      mask: "data/us_mask.geojson",
      chiller: "data/chiller_rule.json"
    },

    /* Owner colours for the dark stage, in two tiers.

       The six owners the demo is about carry vivid, widely separated hues:
       blue, green, amber, red, magenta, violet. That subset measures 16.3
       worst-pair normal-vision delta-E against this surface and 7.4 on the
       CVD test, inside the band that is legal with secondary encoding.

       The seven small owners are muted and spread across lightness as well as
       hue: slate, teal, olive, purple-grey, tan, wine, steel. Colocation was
       a near-white in the earlier dark build and is now a proper mid slate,
       which costs a little separation -- across all thirteen the worst pair
       is 10.1 -- but keeps every bar readable as a colour rather than as
       paper. No two owners share a hue family, and identity never rests on
       colour alone: the legend names every owner, hovering fades the rest,
       and the card repeats the owner in text. */
    ownerColors: {
      "Google":          "#4a9eff",
      "Meta":            "#3ddc84",
      "Amazon":          "#ffb347",
      "Oracle":          "#ff5a4d",
      "Microsoft":       "#ff5fd2",
      "SpaceXAI":        "#8b5cf6",
      "Colocation":      "#5f84a8",
      "CoreWeave":       "#2a9d8f",
      "Softbank":        "#6f7a3a",
      "AI XPV Platform": "#7d5ea0",
      "Cipher Mining":   "#c99a63",
      "Core42":          "#a15b68",
      "Nebius":          "#7fb3c4"
    },
    ownerFallback: "#94a3b8",

    map: {
      /* The no-labels dark basemap: the only type on the map is this page's
         own state codes, so Canada, Mexico and the oceans stay unlabelled. */
      style: "https://basemaps.cartocdn.com/gl/dark-matter-nolabels-gl-style/style.json",

      /* Flat and top-down. The camera is fitted to these bounds on load and
         on resize, so the contiguous US fills whatever viewport it gets. The
         top padding leaves room for the scene buttons and the caption, since
         the bars rise into that space. */
      conusBounds: [[-124.8, 24.4], [-66.9, 49.4]],
      fitPadding: { top: 150, bottom: 118, left: 28, right: 28 },
      pitch: 0,
      bearing: 0,

      /* Everything outside the country is dimmed so the US reads as a lit
         stage rather than one landmass among several. */
      maskColor: "rgba(3, 5, 8, 0.93)",
      stateFillColor: "rgba(150, 182, 230, 0.035)",
      stateLineColor: "rgba(150, 175, 210, 0.26)",
      stateLineWidth: 0.6,

      /* Bars, not spikes: a fixed-width rectangle with a square top. Height
         is strictly linear in MW and scaled so the tallest site today, 1,037
         MW, stands about 160 px high. */
      barWidthPx: 10,
      pxPerMW: 0.1543,
      fillAlpha: 0.92,
      outlineLighten: 1.35,     /* outline = fill lightened, for a dark stage */
      outlineWidthPx: 0.9,
      hoverFadeAlpha: 0.3,      /* other bars while one is hovered */
      ownerFadeAlpha: 0.25,     /* other owners while one is isolated */
      /* The under-construction outline: no fill, just the owner's colour. */
      plannedOutlineWidthPx: 1.1,
      plannedOutlineAlpha: 0.85,

      /* Bars whose bases land within this many pixels of each other are
         spread sideways so none is hidden behind its neighbour. */
      collisionGapPx: 12,
      collisionVicinityPx: 26,

      growMs: 700,

      stateLabelSize: 11,
      stateLabelDim: [150, 165, 185, 150],
      stateLabelLive: [222, 234, 248, 245],
      /* The halo that keeps a code readable where a bar sits behind it. */
      stateLabelOutlineWidth: 3,
      stateLabelOutlineColor: [6, 9, 13, 215],
      leaderColor: [120, 140, 165, 130]
    },

    labels: {
      power: "IT power",
      sites: "Sites live",
      legend: "Owner",
      sizeKey: "Bar height = IT power",
      dragHint: "Drag, or use the left and right arrow keys",
      todayStop: "Today"
    },

    /* Reference bars, drawn at exactly the map's own pixels per MW. */
    sizeKey: [1000, 500, 100],

    card: {
      owner: "Owner",
      users: "Users",
      state: "State",
      powerNow: "IT power now",
      power2030: "IT power 2030",
      firstOperational: "First operational",
      source: "Source: Epoch AI",
      approximate: "Approximate location",
      approximateWhy: {
        postcode: "pinned to the postcode, not the building",
        city: "pinned to the city, not the building",
        county: "pinned to the county, not the building"
      },
      noneYet: "not yet operational",
      undisclosedUsers: "Undisclosed"
    },

    /* The "How we know" panel. Every string lives here; the one number in it
       is filled from data/chiller_rule.json, which build_sites.py computes
       from Epoch's own chiller measurements. */
    howWeKnow: {
      /* The link in the footer; the panel itself still says "How we know". */
      button: "Data & method",
      title: "How we know",
      headline: "Nobody publishes these numbers. Epoch counted the cooling fans from space.",
      steps: [
        "Satellite images and permits",
        "Count cooling fans and towers",
        "Cooling capacity \u2248 heat from chips \u2192 IT power"
      ],
      ruleLabel: "Rule of thumb",
      /* {kw} is the median kW of cooling per fan, rounded to the nearest 5. */
      ruleTemplate: "One chiller fan \u2248 <strong>{kw} kW</strong> of chips.",
      ruleNote: "Median across {models} air-cooled chiller models of 500 kW and above.",
      exampleLabel: "Example",
      example: "Daikin EWAD 850: 12 fans \u2192 817 kW of cooling.",
      footnote: "All power figures are estimates. Epoch tracks the largest frontier AI sites, about 43% of global AI compute.",
      closeLabel: "Close"
    },

    /* Scenes, in the order Up and Down step through them. The opening scene
       has no button of its own; the five buttons are the ones after it, in
       value-chain order. Only the scenes marked ready are reachable -- the
       rest stay visible and inert until their own step lands. */
    sceneOrder: ["opening", "who", "why", "chips", "forwhom", "when"],
    scenes: {
      opening: {
        ready: true,
        headline: "From 1 site to 60 in five years. 12 GW of frontier AI compute now running in the US.",
        headlineAt: "today"
      },
      who: {
        ready: true,
        button: "Who builds",
        headline: "Google leads today. Oracle leads by 2030.",
        headlineAlways: true,
        legendToday: "Today",
        legend2030: "2030",
        lockHint: "Fixed at today for this scene",
        status: {
          live: "Live",
          expanding: "Expanding",
          construction: "Under construction"
        },
        statusLabel: "Status",
        hint: "Click an owner in the legend to isolate it",
        /* The outlines reach 2030, and the tallest is 2,263 MW, which is 349
           px at the map's own scale -- tall enough to run off the top of a
           northern state. Asking fitBounds for more headroom does not help:
           extra padding zooms out as much as it shifts, and bar heights are
           fixed in pixels, so the bases rise again almost as fast. Instead the
           whole scene slides down at the same zoom, which buys headroom
           without shrinking the country.

           It does not buy enough for every bar. At 0.1543 px per MW the
           largest 2030 site, Microsoft Fairwater Wisconsin at 2,263 MW, needs
           349 px above a base in the upper Midwest, and that plus the country
           plus the timeline does not fit the viewport at any single zoom. A
           70 px shift keeps every bar base clear of the timeline and leaves
           only that one outline running past the top edge; the alternative
           would be rescaling this scene, which would break both the stated
           160 px scale and the size key. */
        shiftDownPx: 70
      },
      why:     { ready: false, button: "Why there" },
      chips:   { ready: false, button: "Chips" },
      forwhom: { ready: false, button: "For whom" },
      when:    { ready: false, button: "When" }
    },

    footnote: "84% of tracked frontier AI capacity is in the US. IT power is the power available to chips. Data: Epoch AI (CC-BY), downloaded Oct 26, 2026."
  };

  /* ==========================================================================
     State
     ========================================================================== */
  var SITES = [];
  var STATES = [];
  var CHILLER = null;
  var STOPS = [];
  var TODAY_INDEX = 0;
  var stopIndex = 0;
  var deckInstance = null;
  var mapInstance = null;
  var playTimer = null;
  var pinnedSite = null;
  var hoverSite = null;
  var sceneId = "opening";
  var highlightOwner = null;   /* set by clicking a legend row in Who builds */
  var openingStopIndex = 0;    /* remembered so leaving a scene restores it */
  var lastPointer = { x: 0, y: 0 };
  var viewState = null;

  /* Spike heights are animated here rather than through deck's own attribute
     transitions: the data is re-sorted every stop so tall bars draw behind
     short ones, and deck matches transitions by index, which that reordering
     would scramble. */
  var anim = { from: {}, to: {}, start: 0, frame: null };
  var shown = {};              /* MW currently displayed, per site name */

  var el = function (id) { return document.getElementById(id); };

  /* ==========================================================================
     Formatting
     ========================================================================== */
  function splitPower(mw) {
    if (mw >= 1000) return { value: (mw / 1000).toFixed(1), unit: "GW" };
    return { value: String(Math.round(mw)), unit: "MW" };
  }

  function powerText(mw) {
    var p = splitPower(mw);
    return p.value + " " + p.unit;
  }

  function stopLabel(stop) {
    if (stop.isToday) return CONFIG.labels.todayStop;
    return stop.key.slice(0, 4) + " " + stop.key.slice(4);
  }

  function escapeHtml(text) {
    return String(text == null ? "" : text).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function hexToRgb(hex) {
    var h = hex.replace("#", "");
    return [
      parseInt(h.slice(0, 2), 16),
      parseInt(h.slice(2, 4), 16),
      parseInt(h.slice(4, 6), 16)
    ];
  }

  function darken(rgb, factor) {
    return rgb.map(function (c) { return Math.round(c * factor); });
  }

  function lighten(rgb, factor) {
    return rgb.map(function (c) { return Math.min(255, Math.round(c * factor)); });
  }

  function ownerColor(owner) {
    return CONFIG.ownerColors[owner] || CONFIG.ownerFallback;
  }

  /* ==========================================================================
     Timeline model
     ========================================================================== */
  function buildStops(periods) {
    var stops = periods.map(function (key) {
      return { key: key, isToday: false, locked: false };
    });

    var asOf = CONFIG.asOf;
    var asOfYear = Number(asOf.slice(0, 4));
    var asOfMonth = Number(asOf.slice(5, 7));
    var afterKey = asOfMonth > 6 ? asOfYear + "H2" : asOfYear + "H1";

    var insertAt = stops.findIndex(function (s) { return s.key === afterKey; });
    insertAt = insertAt === -1 ? stops.length - 1 : insertAt;
    stops.splice(insertAt + 1, 0, { key: "today", isToday: true, locked: false });

    stops.forEach(function (stop, i) {
      stop.locked = i > insertAt + 1;
      stop.label = stopLabel(stop);
    });
    return stops;
  }

  function powerAt(site, stop) {
    if (stop.isToday) return site.it_mw_as_of;
    return site.it_mw_by_period[stop.key] || 0;
  }

  function liveAt(stop) {
    return SITES.filter(function (s) { return powerAt(s, stop) > 0; });
  }

  /* ==========================================================================
     Bar geometry

     deck.gl has no screen-space rectangle, so each bar is a four-point polygon
     in lon/lat whose size is converted back from pixels. Longitude degrees per
     pixel is constant in Web Mercator; latitude degrees per pixel shrinks with
     the cosine of the latitude, so a bar in Texas and one in North Dakota need
     different conversions or the northern one comes out visibly taller for the
     same MW.
     ========================================================================== */
  var degPerPx = { lon: 0.01 };
  var offsetDeg = {};          /* sideways nudge per site, in degrees of lon */

  /* Derived from the zoom rather than from a live viewport. deck.gl asserts
     if getViewports() is called before its first render, and the closed form
     is exact anyway: at deck's zoom convention the world is 512 * 2^z pixels
     wide, so a pixel spans 360 / (512 * 2^z) degrees of longitude, and
     cos(latitude) times that in latitude. Checked against unproject at 27, 39
     and 49 degrees north: agreement to within 0.04%. */
  function refreshScale() {
    if (!viewState) return;
    degPerPx.lon = 360 / (512 * Math.pow(2, viewState.zoom));
    layoutOffsets();
  }

  function mercatorY(lat) {
    return Math.log(Math.tan(Math.PI / 4 + (lat * Math.PI / 180) / 2));
  }

  /* Bars standing on nearly the same spot would hide each other, so sites
     whose bases fall within a few pixels are spread sideways around their
     shared centre. The spread is computed from position alone, never from
     height, so a bar does not slide as the timeline moves; and over all 77
     sites rather than the live ones, so it does not shift as sites appear. */
  function layoutOffsets() {
    var cfg = CONFIG.map;
    if (!SITES.length || !viewState) return;

    var worldPx = 512 * Math.pow(2, viewState.zoom);
    var points = SITES.map(function (site) {
      return {
        name: site.name,
        x: (site.lon / 360) * worldPx,
        y: -(mercatorY(site.lat) / (2 * Math.PI)) * worldPx
      };
    }).sort(function (a, b) { return a.x - b.x; });

    /* One sweep along x: a point joins the running cluster when it is close
       to the previous point in x and in the same horizontal band. */
    var clusters = [];
    var current = [points[0]];
    for (var i = 1; i < points.length; i++) {
      var prev = points[i - 1];
      var here = points[i];
      if (here.x - prev.x < cfg.collisionGapPx &&
          Math.abs(here.y - prev.y) < cfg.collisionVicinityPx) {
        current.push(here);
      } else {
        clusters.push(current);
        current = [here];
      }
    }
    clusters.push(current);

    offsetDeg = {};
    clusters.forEach(function (cluster) {
      if (cluster.length === 1) { offsetDeg[cluster[0].name] = 0; return; }
      cluster.forEach(function (point, index) {
        var slot = index - (cluster.length - 1) / 2;
        offsetDeg[point.name] = slot * cfg.collisionGapPx * degPerPx.lon;
      });
    });
  }

  function barPolygon(site, mw, floorMW) {
    var cfg = CONFIG.map;
    var halfW = (cfg.barWidthPx / 2) * degPerPx.lon;
    var dx = offsetDeg[site.name] || 0;
    var perMW = cfg.pxPerMW * degPerPx.lon * Math.cos(site.lat * Math.PI / 180);
    var left = site.lon + dx - halfW;
    var right = site.lon + dx + halfW;
    /* floorMW lifts the base, which is how the under-construction outline
       starts where the solid bar stops. */
    var bottom = site.lat + (floorMW || 0) * perMW;
    var top = site.lat + mw * perMW;
    /* Square top: the two upper corners sit at the same latitude. */
    return [[
      [left, bottom],
      [right, bottom],
      [right, top],
      [left, top]
    ]];
  }

  /* ==========================================================================
     Animation

     On every move the displayed MW eases from what is on screen to the new
     value, so a bar that has just come alive grows up from the ground and a
     bar that was already standing slides to its new height.
     ========================================================================== */
  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

  function displayedMW(site) {
    var to = anim.to[site.name] || 0;
    if (anim.start === 0) return to;
    var from = anim.from[site.name] || 0;
    var t = Math.min(1, (performance.now() - anim.start) / CONFIG.map.growMs);
    return from + (to - from) * easeOut(t);
  }

  function startAnimation(stop, instant) {
    var cfg = CONFIG.map;
    anim.from = {};
    anim.to = {};
    SITES.forEach(function (site) {
      var was = shown[site.name] || 0;
      var now = powerAt(site, stop);
      /* A site that has just gone live starts at zero, so its bar rises out
         of the ground rather than appearing at full height. */
      anim.from[site.name] = instant ? now : was;
      anim.to[site.name] = now;
      shown[site.name] = now;
    });

    if (anim.frame) { cancelAnimationFrame(anim.frame); anim.frame = null; }
    if (instant) { anim.start = 0; paint(); return; }

    anim.start = performance.now();
    var ends = anim.start + cfg.growMs;
    var tick = function () {
      paint();
      if (performance.now() >= ends) {
        anim.frame = null;
        anim.start = 0;
        paint();
        return;
      }
      anim.frame = requestAnimationFrame(tick);
    };
    anim.frame = requestAnimationFrame(tick);
  }

  /* ==========================================================================
     Scenes
     ========================================================================== */
  function scene() { return CONFIG.scenes[sceneId]; }
  function isWho() { return sceneId === "who"; }

  /* The buttons are the scenes after the opening one, so the opening scene
     shows no button as active. */
  function buttonScenes() {
    return CONFIG.sceneOrder.filter(function (id) { return id !== "opening"; });
  }

  function renderSceneBar() {
    el("scene-bar").innerHTML = buttonScenes().map(function (id) {
      var cfg = CONFIG.scenes[id];
      var classes = "scene-btn" + (cfg.ready ? " is-ready" : "") +
                    (id === sceneId ? " is-active" : "");
      return '<button type="button" class="' + classes + '" data-scene="' + id + '"' +
        (cfg.ready ? '' : ' aria-disabled="true" disabled') +
        ' aria-selected="' + (id === sceneId ? "true" : "false") + '">' +
        escapeHtml(cfg.button) + "</button>";
    }).join("");
  }

  function setScene(id) {
    var cfg = CONFIG.scenes[id];
    if (!cfg || !cfg.ready || id === sceneId) return;

    if (sceneId === "opening") openingStopIndex = stopIndex;

    sceneId = id;
    highlightOwner = null;
    pinnedSite = null;
    hoverSite = null;
    hideCard();
    renderSceneBar();

    if (isWho()) {
      /* The scene is a snapshot of today against 2030, so the timeline is
         parked at Today and held there. */
      goTo(TODAY_INDEX, { force: true, silent: true });
    } else {
      /* Back to the opening scene exactly where it was left. */
      goTo(openingStopIndex, { force: true, silent: true });
    }
    syncTimelineLock();
    applyView(fittedView());
    draw();
    paint();
  }

  /* Up and Down walk the order. A scene that is not ready yet stops the walk
     rather than being skipped, so the reader never lands somewhere blank. */
  function stepScene(delta) {
    var order = CONFIG.sceneOrder;
    var next = order[order.indexOf(sceneId) + delta];
    if (next && CONFIG.scenes[next] && CONFIG.scenes[next].ready) setScene(next);
  }

  function syncTimelineLock() {
    var slider = el("slider");
    var locked = isWho();
    slider.disabled = locked;
    el("timeline").classList.toggle("is-locked", locked);
    el("track-hint").textContent = locked
      ? CONFIG.scenes.who.lockHint
      : CONFIG.labels.dragHint;
  }

  /* ==========================================================================
     Layers
     ========================================================================== */
  function focusName() {
    var focus = pinnedSite || hoverSite;
    return focus ? focus.name : null;
  }

  function fillAlphaFor(site) {
    var cfg = CONFIG.map;
    var base = Math.round(255 * cfg.fillAlpha);

    /* Isolating an owner from the legend and hovering a single bar are two
       ways of saying "this one"; hovering wins while it is active. */
    var focus = focusName();
    if (focus) {
      return site.name === focus ? base : Math.round(255 * cfg.hoverFadeAlpha);
    }
    if (highlightOwner) {
      return site.owner === highlightOwner
        ? base
        : Math.round(255 * cfg.ownerFadeAlpha);
    }
    return base;
  }

  function stateLabelLayers(stop) {
    var cfg = CONFIG.map;
    var liveStates = {};
    liveAt(stop).forEach(function (site) {
      if (site.state) liveStates[site.state] = true;
    });

    /* A state whose label would only collide in the northeast is parked just
       off its own coast, and is shown only once it has something to say. */
    var labels = STATES.filter(function (f) {
      return f.properties.code &&
        (!f.properties.offshore || liveStates[f.properties.code]);
    });
    var leaders = labels.filter(function (f) { return f.properties.offshore; });

    var layers = [];
    if (leaders.length) {
      layers.push(new deck.LineLayer({
        id: "state-leaders",
        data: leaders,
        widthUnits: "pixels",
        getWidth: 0.8,
        getSourcePosition: function (f) { return f.properties.anchor; },
        getTargetPosition: function (f) { return f.properties.label; },
        getColor: cfg.leaderColor
      }));
    }

    layers.push(new deck.TextLayer({
      id: "state-labels",
      data: labels,
      pickable: false,
      characterSet: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
      fontFamily: '"Helvetica Neue", Helvetica, Arial, sans-serif',
      fontWeight: 600,
      getPosition: function (f) { return f.properties.label; },
      getText: function (f) { return f.properties.code; },
      getSize: cfg.stateLabelSize,
      sizeUnits: "pixels",
      getColor: function (f) {
        return liveStates[f.properties.code] ? cfg.stateLabelLive : cfg.stateLabelDim;
      },
      getTextAnchor: "middle",
      getAlignmentBaseline: "center",
      /* A signed-distance font lets the glyphs carry a dark outline, which is
         what keeps OH, VA, AZ, MS and AL legible against a bar behind them. */
      fontSettings: { sdf: true, radius: 12 },
      outlineWidth: cfg.stateLabelOutlineWidth,
      outlineColor: cfg.stateLabelOutlineColor,
      updateTriggers: { getColor: stop.key }
    }));

    return layers;
  }

  function barRows() {
    /* Each row carries the MW currently on screen and, in the Who builds
       scene, the 2030 figure the hollow outline reaches. Sorted tallest
       first so a tall bar is drawn behind the shorter ones in front of it. */
    var who = isWho();
    return SITES.map(function (site) {
      var mw = who ? site.it_mw_as_of : displayedMW(site);
      return {
        site: site,
        mw: mw,
        planned: who ? site.it_mw_2030h1 : 0
      };
    }).filter(function (row) {
      return row.mw > 0.01 || row.planned > 0.01 ||
             (anim.to[row.site.name] || 0) > 0;
    }).sort(function (a, b) {
      return Math.max(b.mw, b.planned) - Math.max(a.mw, a.planned);
    });
  }

  function barLayers() {
    var cfg = CONFIG.map;
    var focus = focusName();
    var rows = barRows();
    var layers = [];

    if (isWho()) {
      /* The gap between what is running and what is funded. Drawn before the
         solid bars so a solid bar always sits in front of its own outline. */
      var planned = rows.filter(function (row) { return row.planned > row.mw + 0.01; });
      layers.push(new deck.PolygonLayer({
        id: "bars-planned",
        data: planned,
        pickable: false,
        filled: false,
        stroked: true,
        extruded: false,
        lineWidthUnits: "pixels",
        lineJointRounded: false,
        getPolygon: function (row) {
          return barPolygon(row.site, row.planned, row.mw);
        },
        getLineColor: function (row) {
          var alpha = Math.round(255 * cfg.plannedOutlineAlpha *
                                 (fillAlphaFor(row.site) / (255 * cfg.fillAlpha)));
          return hexToRgb(ownerColor(row.site.owner)).concat(alpha);
        },
        getLineWidth: cfg.plannedOutlineWidthPx
      }));
    }

    layers.push(new deck.PolygonLayer({
      id: "bars",
      data: rows,
      pickable: true,
      filled: true,
      stroked: true,
      extruded: false,
      lineWidthUnits: "pixels",
      lineJointRounded: false,
      getPolygon: function (row) { return barPolygon(row.site, row.mw); },
      getFillColor: function (row) {
        return hexToRgb(ownerColor(row.site.owner)).concat(fillAlphaFor(row.site));
      },
      getLineColor: function (row) {
        var isFocus = row.site.name === focus;
        /* On a dark stage the outline reads as a highlight, so it lightens
           the fill rather than darkening it. */
        return lighten(hexToRgb(ownerColor(row.site.owner)),
                       isFocus ? cfg.outlineLighten * 1.25 : cfg.outlineLighten)
          .concat(isFocus ? 255 : fillAlphaFor(row.site));
      },
      getLineWidth: function (row) {
        return row.site.name === focus ? cfg.outlineWidthPx * 2.2 : cfg.outlineWidthPx;
      },
      onHover: onHover,
      onClick: onClick
    }));

    return layers;
  }

  function paint() {
    if (!deckInstance) return;
    var stop = STOPS[stopIndex];
    deckInstance.setProps({
      /* Bars first, labels second: a state code has to stay readable where a
         bar stands on top of it, so the type is drawn over the bars rather
         than under them. */
      layers: barLayers().concat(stateLabelLayers(stop))
    });
  }

  /* ==========================================================================
     Panels
     ========================================================================== */
  function renderCounters(stop) {
    var live = liveAt(stop);
    var total = live.reduce(function (sum, s) { return sum + powerAt(s, stop); }, 0);
    var p = splitPower(total);
    el("counter-power").innerHTML =
      escapeHtml(p.value) + '<span class="unit">' + p.unit + "</span>";
    el("counter-sites").textContent = String(live.length);
  }

  function ownerTotals(key, stop) {
    var totals = {};
    Object.keys(CONFIG.ownerColors).forEach(function (owner) { totals[owner] = 0; });
    SITES.forEach(function (site) {
      if (!(site.owner in totals)) totals[site.owner] = 0;
      totals[site.owner] += key === "stop" ? powerAt(site, stop) : site[key];
    });
    return totals;
  }

  function legendRowHtml(owner, cells, muted) {
    var classes = "legend-row" + (muted ? " is-zero" : "") +
      (highlightOwner === owner ? " is-picked" : "") +
      (isWho() ? " is-pickable" : "");
    return '<div class="' + classes + '" data-owner="' + escapeHtml(owner) + '">' +
      '<span class="legend-swatch" style="background:' + ownerColor(owner) + '"></span>' +
      '<span class="legend-name" title="' + escapeHtml(owner) + '">' +
        escapeHtml(owner) + "</span>" +
      cells +
    "</div>";
  }

  function renderLegend(stop) {
    var who = CONFIG.scenes.who;

    if (!isWho()) {
      el("legend").classList.remove("is-two-col");
      el("legend-head").textContent = CONFIG.labels.legend;
      var totals = ownerTotals("stop", stop);
      var rows = Object.keys(totals).map(function (owner) {
        return { owner: owner, mw: totals[owner] };
      }).sort(function (a, b) {
        return b.mw - a.mw || a.owner.localeCompare(b.owner);
      });
      el("legend-rows").innerHTML = rows.map(function (row) {
        return legendRowHtml(row.owner,
          '<span class="legend-mw">' +
            (row.mw > 0 ? escapeHtml(powerText(row.mw)) : "&ndash;") + "</span>",
          row.mw <= 0);
      }).join("");
      return;
    }

    /* Who builds: today beside 2030, ordered by 2030 because that is the
       claim the scene is making. */
    el("legend").classList.add("is-two-col");
    el("legend-head").innerHTML =
      '<span class="legend-head-name">' + escapeHtml(CONFIG.labels.legend) + "</span>" +
      '<span class="legend-head-col">' + escapeHtml(who.legendToday) + "</span>" +
      '<span class="legend-head-col">' + escapeHtml(who.legend2030) + "</span>";

    var nowT = ownerTotals("it_mw_as_of");
    var thenT = ownerTotals("it_mw_2030h1");
    var ranked = Object.keys(thenT).map(function (owner) {
      return { owner: owner, now: nowT[owner], then: thenT[owner] };
    }).sort(function (a, b) {
      return b.then - a.then || a.owner.localeCompare(b.owner);
    });

    el("legend-rows").innerHTML = ranked.map(function (row) {
      return legendRowHtml(row.owner,
        '<span class="legend-mw">' +
          (row.now > 0 ? escapeHtml(powerText(row.now)) : "&ndash;") + "</span>" +
        '<span class="legend-mw legend-mw-then">' +
          (row.then > 0 ? escapeHtml(powerText(row.then)) : "&ndash;") + "</span>",
        row.then <= 0);
    }).join("");
  }

  /* Three reference bars, drawn at exactly the map's own pixels per MW and
     the map's own bar width, so the key is a measurement, not a decoration. */
  function renderSizeKey() {
    var cfg = CONFIG.map;
    var values = CONFIG.sizeKey.slice().sort(function (a, b) { return b - a; });
    var gapX = 64;
    var padX = 22;
    var baseY = Math.max.apply(null, values) * cfg.pxPerMW + 6;
    var height = baseY + 16;
    var width = padX * 2 + (values.length - 1) * gapX;

    var parts = values.map(function (mw, i) {
      var h = mw * cfg.pxPerMW;
      var cx = padX + i * gapX;
      var w = cfg.barWidthPx;
      return '<rect x="' + (cx - w / 2) + '" y="' + (baseY - h) +
          '" width="' + w + '" height="' + h +
          '" fill="rgba(200,214,232,0.5)" stroke="rgba(226,236,248,0.8)" ' +
          'stroke-width="0.9"></rect>' +
        '<text x="' + cx + '" y="' + (baseY + 13) +
          '" text-anchor="middle" font-size="9" font-weight="700" fill="#9fb0c0">' +
          powerText(mw) + "</text>";
    }).join("");

    var svg = el("size-key-bars");
    svg.setAttribute("viewBox", "0 0 " + width + " " + height);
    svg.setAttribute("width", String(width));
    svg.setAttribute("height", String(height));
    svg.innerHTML = parts;
  }

  function renderTrack(stop) {
    el("track-now").textContent = stop.label;
    el("slider").value = String(stopIndex);

    var fillPct = STOPS.length > 1 ? (stopIndex / (STOPS.length - 1)) * 100 : 0;
    var todayPct = STOPS.length > 1 ? (TODAY_INDEX / (STOPS.length - 1)) * 100 : 100;
    /* Three bands: played, playable-but-not-yet-reached, and the locked
       stretch past Today that the When scene will unlock. */
    el("timeline").style.setProperty("--track-fill",
      "linear-gradient(to right," +
      " var(--accent) 0%, var(--accent) " + fillPct + "%," +
      " rgba(26,26,46,0.22) " + fillPct + "%, rgba(26,26,46,0.22) " + todayPct + "%," +
      " rgba(26,26,46,0.07) " + todayPct + "%, rgba(26,26,46,0.07) 100%)");
  }

  function renderTicks() {
    el("track-ticks").innerHTML = STOPS.map(function (stop, i) {
      var show = stop.isToday || stop.key.endsWith("H1");
      if (!show) return "";
      var pct = STOPS.length > 1 ? (i / (STOPS.length - 1)) * 100 : 0;
      var cls = "track-tick" + (stop.isToday ? " is-today" : (stop.locked ? " is-locked" : ""));
      var text = stop.isToday ? CONFIG.labels.todayStop : stop.key.slice(2, 4);
      return '<span class="' + cls + '" style="left:' + pct + '%">' + text + "</span>";
    }).join("");
  }

  function renderHeadline(stop) {
    var cfg = scene();
    var node = el("headline");
    if (!cfg || !cfg.headline) { node.classList.remove("is-shown"); return; }
    node.textContent = cfg.headline;
    node.classList.toggle("is-shown",
      cfg.headlineAlways ? true : (cfg.headlineAt === "today" && stop.isToday));
  }

  function draw() {
    var stop = STOPS[stopIndex];
    renderCounters(stop);
    renderLegend(stop);
    renderTrack(stop);
    renderHeadline(stop);
    if (pinnedSite) showCard(pinnedSite, true);
  }

  /* ==========================================================================
     "How we know" panel
     ========================================================================== */
  function renderHowPanel() {
    var how = CONFIG.howWeKnow;
    var rule = CHILLER || {};
    var kw = rule.kw_per_fan_display;

    var steps = how.steps.map(function (text, i) {
      return '<div class="how-step">' +
          '<span class="how-step-n">Step ' + (i + 1) + "</span>" +
          escapeHtml(text) +
        "</div>";
    }).join('<div class="how-arrow">\u2192</div>');

    /* The rule of thumb carries one markup tag, so the number is substituted
       into the template after the surrounding text is escaped. */
    var ruleHtml = how.ruleTemplate.replace("{kw}", escapeHtml(String(kw)));
    var ruleNote = how.ruleNote.replace("{models}", escapeHtml(String(rule.models)));

    el("how-panel").innerHTML =
      '<div class="how-head">' +
        '<span class="how-title" id="how-title">' + escapeHtml(how.title) + "</span>" +
        '<button type="button" id="how-close" aria-label="' +
          escapeHtml(how.closeLabel) + '">\u00d7</button>' +
      "</div>" +
      '<p class="how-headline">' + escapeHtml(how.headline) + "</p>" +
      '<div class="how-steps">' + steps + "</div>" +
      '<div class="how-fact">' +
        '<span class="how-fact-label">' + escapeHtml(how.ruleLabel) + "</span>" +
        '<span class="how-fact-value">' + ruleHtml +
          '<span class="how-fact-note">' + ruleNote + "</span></span>" +
      "</div>" +
      '<div class="how-fact">' +
        '<span class="how-fact-label">' + escapeHtml(how.exampleLabel) + "</span>" +
        '<span class="how-fact-value">' + escapeHtml(how.example) + "</span>" +
      "</div>" +
      '<p class="how-footnote">' + escapeHtml(how.footnote) + "</p>";

    el("how-close").addEventListener("click", closeHow);
  }

  function openHow() {
    el("how-panel").classList.add("is-open");
    el("how-scrim").classList.add("is-open");
    el("how-btn").setAttribute("aria-expanded", "true");
    el("how-close").focus();
  }

  function closeHow() {
    el("how-panel").classList.remove("is-open");
    el("how-scrim").classList.remove("is-open");
    el("how-btn").setAttribute("aria-expanded", "false");
  }

  function howIsOpen() {
    return el("how-panel").classList.contains("is-open");
  }

  /* ==========================================================================
     Site card
     ========================================================================== */
  function showCard(site, keepPosition) {
    var stop = STOPS[stopIndex];
    var card = el("site-card");
    var mwNow = powerAt(site, stop);
    var approx = CONFIG.card.approximateWhy[site.geocode_precision];

    card.innerHTML =
      '<div class="card-name">' + escapeHtml(site.name) + "</div>" +
      '<div class="card-owner">' +
        '<span class="legend-swatch" style="background:' + ownerColor(site.owner) + '"></span>' +
        escapeHtml(site.owner) +
      "</div>" +
      '<div class="card-rows">' +
        '<span class="card-key">' + CONFIG.card.users + '</span>' +
          '<span class="card-val">' + escapeHtml(site.users) + "</span>" +
        '<span class="card-key">' + CONFIG.card.state + '</span>' +
          '<span class="card-val">' + escapeHtml(site.state || "&mdash;") + "</span>" +
        '<span class="card-key">' + CONFIG.card.powerNow + '</span>' +
          '<span class="card-val">' + escapeHtml(powerText(mwNow)) + "</span>" +
        '<span class="card-key">' + CONFIG.card.power2030 + '</span>' +
          '<span class="card-val">' + escapeHtml(powerText(site.it_mw_2030h1)) + "</span>" +
        '<span class="card-key">' + CONFIG.card.firstOperational + '</span>' +
          '<span class="card-val">' +
            escapeHtml(site.first_operational || CONFIG.card.noneYet) + "</span>" +
        statusRow(site) +
      "</div>" +
      '<div class="card-note">' +
        (approx
          ? '<span class="card-approx">' + CONFIG.card.approximate + "</span> &middot; " +
            escapeHtml(approx) + "<br>"
          : "") +
        CONFIG.card.source +
      "</div>";

    card.style.display = "block";
    if (!keepPosition) positionCard(lastPointer.x, lastPointer.y);
  }

  /* Only the Who builds scene is about the gap between running and funded,
     so the status line appears there. */
  function siteStatus(site) {
    var text = CONFIG.scenes.who.status;
    if (site.it_mw_as_of <= 0) return text.construction;
    if (site.it_mw_2030h1 > site.it_mw_as_of) return text.expanding;
    return text.live;
  }

  function statusRow(site) {
    if (!isWho()) return "";
    return '<span class="card-key">' + escapeHtml(CONFIG.scenes.who.statusLabel) +
      "</span>" +
      '<span class="card-val card-status">' + escapeHtml(siteStatus(site)) + "</span>";
  }

  function positionCard(x, y) {
    var card = el("site-card");
    var stage = el("stage").getBoundingClientRect();
    var width = card.offsetWidth || 266;
    var height = card.offsetHeight || 190;
    var left = x - stage.left + 16;
    var top = y - stage.top + 16;
    if (left + width > stage.width - 8) left = x - stage.left - width - 16;
    if (top + height > stage.height - 8) top = Math.max(8, y - stage.top - height - 16);
    card.style.left = Math.max(8, left) + "px";
    card.style.top = Math.max(8, top) + "px";
  }

  function hideCard() {
    el("site-card").style.display = "none";
    el("site-card").classList.remove("is-pinned");
  }

  function stageOffset() {
    var rect = el("stage").getBoundingClientRect();
    return { left: rect.left, top: rect.top };
  }

  function onHover(info) {
    if (pinnedSite) return;
    var previous = hoverSite;
    if (info && info.object) {
      hoverSite = info.object.site;
      var off = stageOffset();
      lastPointer = { x: info.x + off.left, y: info.y + off.top };
      showCard(hoverSite, false);
    } else if (hoverSite) {
      hoverSite = null;
      hideCard();
    }
    if ((previous && previous.name) !== (hoverSite && hoverSite.name)) paint();
  }

  function onClick(info) {
    if (info && info.object) {
      pinnedSite = info.object.site;
      var off = stageOffset();
      lastPointer = { x: info.x + off.left, y: info.y + off.top };
      showCard(pinnedSite, false);
      el("site-card").classList.add("is-pinned");
    } else {
      pinnedSite = null;
      hideCard();
    }
    paint();
  }

  /* ==========================================================================
     Timeline control
     ========================================================================== */
  function goTo(index, options) {
    var opts = options || {};
    var clamped = Math.max(0, Math.min(TODAY_INDEX, index));
    if (clamped === stopIndex && !opts.force) return;
    stopIndex = clamped;
    draw();
    startAnimation(STOPS[stopIndex], !!opts.silent);
  }

  function stopPlaying() {
    if (playTimer) { clearInterval(playTimer); playTimer = null; }
    el("play").setAttribute("aria-label", "Play the timeline to today");
  }

  function togglePlay() {
    if (playTimer) { stopPlaying(); return; }
    if (stopIndex >= TODAY_INDEX) goTo(0, { silent: true });
    el("play").setAttribute("aria-label", "Pause the timeline");
    playTimer = setInterval(function () {
      if (stopIndex >= TODAY_INDEX) { stopPlaying(); return; }
      goTo(stopIndex + 1);
    }, 1100);
  }

  function bindControls() {
    var slider = el("slider");
    slider.min = "0";
    slider.max = String(STOPS.length - 1);
    slider.addEventListener("input", function () {
      stopPlaying();
      var wanted = Number(slider.value);
      /* Scene 1 ends at Today; the locked stretch is visible but not
         reachable, so the handle is pulled back rather than silently
         accepting a value the scene cannot render. */
      if (wanted > TODAY_INDEX) { slider.value = String(TODAY_INDEX); wanted = TODAY_INDEX; }
      goTo(wanted);
    });

    el("play").addEventListener("click", togglePlay);

    el("how-btn").addEventListener("click", function () {
      if (howIsOpen()) closeHow(); else openHow();
    });
    /* A click anywhere off the panel closes it: the scrim covers the map. */
    el("how-scrim").addEventListener("click", closeHow);

    el("scene-bar").addEventListener("click", function (event) {
      var btn = event.target.closest(".scene-btn");
      if (btn && btn.dataset.scene) setScene(btn.dataset.scene);
    });

    /* Isolating an owner is only meaningful where two numbers per owner are
       on screen, so it is wired for the Who builds scene alone. */
    el("legend-rows").addEventListener("click", function (event) {
      if (!isWho()) return;
      var row = event.target.closest(".legend-row");
      if (!row || !row.dataset.owner) return;
      highlightOwner = highlightOwner === row.dataset.owner ? null : row.dataset.owner;
      draw();
      paint();
    });

    /* Up and Down are reserved for switching scenes in a later step. */
    document.addEventListener("keydown", function (event) {
      if (howIsOpen() && event.key !== "Escape") return;
      if (event.key === "ArrowLeft") {
        if (isWho()) return;
        stopPlaying(); goTo(stopIndex - 1); event.preventDefault();
      } else if (event.key === "ArrowRight") {
        if (isWho()) return;
        stopPlaying(); goTo(stopIndex + 1); event.preventDefault();
      } else if (event.key === "ArrowUp") {
        stepScene(-1); event.preventDefault();
      } else if (event.key === "ArrowDown") {
        stepScene(1); event.preventDefault();
      } else if (event.key === "Escape") {
        if (howIsOpen()) { closeHow(); return; }
        if (highlightOwner) { highlightOwner = null; draw(); paint(); return; }
        pinnedSite = null; hoverSite = null; hideCard(); paint();
      }
    });

    el("stage").addEventListener("mousemove", function (event) {
      lastPointer = { x: event.clientX, y: event.clientY };
    });
  }

  /* ==========================================================================
     Boot
     ========================================================================== */
  function fail(message) {
    el("stage-status").classList.remove("is-hidden");
    el("stage-status").innerHTML =
      '<div style="max-width:420px">' + escapeHtml(message) + "</div>";
  }

  var stageRevealed = false;
  function revealStage() {
    if (stageRevealed) return;
    stageRevealed = true;
    el("stage-status").classList.add("is-hidden");
  }

  function fittedView() {
    var stage = el("stage");
    var cfg = CONFIG.map;
    var active = scene();
    var viewport = new deck.WebMercatorViewport({
      width: Math.max(320, stage.clientWidth),
      height: Math.max(320, stage.clientHeight)
    });
    var fitted = viewport.fitBounds(cfg.conusBounds, { padding: cfg.fitPadding });

    /* Moving the camera centre north makes the land sit lower on screen. */
    var latitude = fitted.latitude;
    var shift = (active && active.shiftDownPx) || 0;
    if (shift) {
      var degPerPxLon = 360 / (512 * Math.pow(2, fitted.zoom));
      latitude += shift * degPerPxLon * Math.cos(fitted.latitude * Math.PI / 180);
    }

    return {
      longitude: fitted.longitude,
      latitude: latitude,
      zoom: fitted.zoom,
      pitch: cfg.pitch,
      bearing: cfg.bearing
    };
  }

  function applyView(next) {
    viewState = next;
    deckInstance.setProps({ viewState: viewState });
    if (mapInstance) {
      mapInstance.jumpTo({
        center: [next.longitude, next.latitude],
        zoom: next.zoom,
        bearing: next.bearing || 0,
        pitch: next.pitch || 0
      });
    }
    refreshScale();
    paint();
  }

  function initMap(states, mask) {
    var cfg = CONFIG.map;
    viewState = fittedView();

    mapInstance = new maplibregl.Map({
      container: "map",
      style: cfg.style,
      center: [viewState.longitude, viewState.latitude],
      zoom: viewState.zoom,
      pitch: viewState.pitch,
      bearing: viewState.bearing,
      interactive: false,       /* deck.gl owns the camera */
      attributionControl: false
    });

    /* The data parses in milliseconds but the basemap needs a style and a
       round of vector tiles, so hiding the overlay on the data alone shows a
       black rectangle for a second or two. Wait for the basemap's first paint
       as well -- but never longer than the fallback, or an unreachable tile
       CDN would leave the overlay up over a map that is otherwise usable. */
    mapInstance.once("idle", revealStage);
    setTimeout(revealStage, 4000);

    mapInstance.on("load", function () {
      /* A faint wash inside the states, then the outlines, then one dark
         polygon covering the world with the country punched out of it. The
         basemap's own boundary_state layer only draws from zoom 6 and this
         map opens near 3.7, so the outlines come from the local file. */
      mapInstance.addSource("us-states", { type: "geojson", data: states });
      mapInstance.addLayer({
        id: "us-states-fill",
        type: "fill",
        source: "us-states",
        paint: { "fill-color": cfg.stateFillColor }
      });
      mapInstance.addLayer({
        id: "us-states-outline",
        type: "line",
        source: "us-states",
        paint: {
          "line-color": cfg.stateLineColor,
          "line-width": cfg.stateLineWidth
        }
      });
      mapInstance.addSource("us-mask", { type: "geojson", data: mask });
      mapInstance.addLayer({
        id: "us-mask-fill",
        type: "fill",
        source: "us-mask",
        paint: { "fill-color": cfg.maskColor }
      });
    });

    deckInstance = new deck.Deck({
      canvas: "deck-canvas",
      viewState: viewState,
      /* Rotation stays off: this scene is a flat, top-down stage. */
      controller: { dragRotate: false, touchRotate: false, keyboard: false },
      layers: [],
      /* The basemap below shows through; deck paints no surface of its own. */
      parameters: { clearColor: [0, 0, 0, 0] },
      onViewStateChange: function (params) { applyView(params.viewState); },
      onAfterRender: revealStage
    });

    refreshScale();

    var refitTimer = null;
    window.addEventListener("resize", function () {
      clearTimeout(refitTimer);
      refitTimer = setTimeout(function () { applyView(fittedView()); }, 180);
    });
  }

  function boot(payload, states, mask, chiller) {
    SITES = payload.sites.filter(function (s) {
      return typeof s.lat === "number" && typeof s.lon === "number";
    });
    STATES = states.features;
    CHILLER = chiller;
    CONFIG.asOf = payload.meta.as_of;

    STOPS = buildStops(payload.meta.periods);
    TODAY_INDEX = STOPS.findIndex(function (s) { return s.isToday; });

    el("counter-power-label").textContent = CONFIG.labels.power;
    el("counter-sites-label").textContent = CONFIG.labels.sites;
    el("legend-head").textContent = CONFIG.labels.legend;
    el("size-key-head").textContent = CONFIG.labels.sizeKey;
    el("track-hint").textContent = CONFIG.labels.dragHint;
    el("how-btn-label").textContent = CONFIG.howWeKnow.button;
    renderSceneBar();
    renderHowPanel();
    el("footnote-text").textContent = CONFIG.footnote;

    renderTicks();
    renderSizeKey();
    bindControls();
    initMap(states, mask);

    stopIndex = 0;
    goTo(0, { force: true, silent: true });
    setTimeout(revealStage, 3000);

    /* A hook for the browser checks, and for the later scenes to read. */
    window.__dcMap = {
      config: CONFIG,
      sites: SITES,
      stops: STOPS,
      todayIndex: TODAY_INDEX,
      deck: function () { return deckInstance; },
      map: function () { return mapInstance; },
      camera: function () { return viewState; },
      scale: function () { return degPerPx; },
      barPolygon: barPolygon,
      offsets: function () { return offsetDeg; },
      chiller: function () { return CHILLER; },
      openHow: openHow,
      closeHow: closeHow,
      howIsOpen: howIsOpen,
      displayedMW: displayedMW,
      goTo: goTo,
      setScene: setScene,
      stepScene: stepScene,
      sceneId: function () { return sceneId; },
      highlight: function () { return highlightOwner; },
      setHighlight: function (owner) { highlightOwner = owner; draw(); paint(); },
      siteStatus: siteStatus,
      ownerTotals: ownerTotals,
      current: function () { return STOPS[stopIndex]; },
      totals: function (index) {
        var stop = STOPS[index == null ? stopIndex : index];
        var live = liveAt(stop);
        return {
          stop: stop.label,
          mw: live.reduce(function (sum, s) { return sum + powerAt(s, stop); }, 0),
          sites: live.length
        };
      }
    };
  }

  if (!window.deck || !window.maplibregl) {
    fail("The map libraries did not load. Check the network connection and reload.");
    return;
  }

  Promise.all([
    fetch(CONFIG.data.sites).then(function (r) {
      if (!r.ok) throw new Error("sites.json " + r.status);
      return r.json();
    }),
    fetch(CONFIG.data.states).then(function (r) {
      if (!r.ok) throw new Error("us_states.geojson " + r.status);
      return r.json();
    }),
    fetch(CONFIG.data.mask).then(function (r) {
      if (!r.ok) throw new Error("us_mask.geojson " + r.status);
      return r.json();
    }),
    fetch(CONFIG.data.chiller).then(function (r) {
      if (!r.ok) throw new Error("chiller_rule.json " + r.status);
      return r.json();
    })
  ]).catch(function (error) {
    fail("Could not load the site data (" + error.message +
         "). This page reads its JSON over HTTP, so it needs a server rather than a file:// path.");
    throw error;
  }).then(function (results) {
    /* Separate from the fetch catch above: a render fault must not be
       reported as a missing file. */
    try {
      boot(results[0], results[1], results[2], results[3]);
    } catch (error) {
      console.error(error);
      fail("The map failed to draw (" + error.message + ").");
    }
  }, function () { /* already reported */ });
})();
</script>
</body>
</html>
