<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Center Economics | AI / Compute / Data Center</title>
<meta name="description" content="Every tracked US AI data center on one map: bars whose height is linear in IT power, coloured by owner, from the first 48 MW site in 2021 to 12 GW running today. Data: Epoch AI (CC-BY).">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.4.0/maplibre-gl.css"
      integrity="sha512-DBNed2oEjOrfIRj8Czuzs7padWawLWbA64OoDekn8gs2a3J6WOaR5xXfnFgaxKGpxIuSn/rAo/PsgOgO6PZ/vA=="
      crossorigin="anonymous" referrerpolicy="no-referrer">

<style>
  /* ============================================================
     Tokens. The nav and the page chrome reuse the series variables
     from ai-compute-datacenter-economics/index.html so the three parts
     read as one site. The map stage keeps its own dark tokens in both
     light and dark mode -- this page is built to be projected, and a
     light basemap washes out the bars.
     ============================================================ */
  :root {
    --bg: #f5f6f8;
    --glass-bg: #ffffff;
    --glass-border: rgba(0, 0, 0, 0.06);
    --text-primary: #1a1a2e;
    --text-secondary: #4a4a68;
    --text-muted: #8b8ba0;
    --accent: #4f5bd5;
    --accent-soft: rgba(79, 91, 213, 0.1);
    --radius: 12px;
    --page-max: 1440px;
    --page-gutter: 32px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    /* Map stage: fixed, never themed. */
    --stage-bg: #11151a;
    --stage-panel: rgba(12, 16, 21, 0.82);
    --stage-panel-solid: #121820;
    --stage-border: rgba(255, 255, 255, 0.14);
    --stage-text: #f2f5f8;
    --stage-text-dim: #9fb0c0;
    --stage-text-faint: #64748b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- series nav (copied from part 1, three edits applied) ---------- */

  .series-nav {
    --series-tab-pad-x: 14px;
    background: #ffffff;
    border-bottom: 1px solid #e4e5ea;
    overflow-x: hidden;
  }
  .series-nav-inner {
    max-width: var(--page-max); margin: 0 auto; padding: 0 var(--page-gutter);
    display: flex; align-items: stretch; gap: 4px;
    flex-wrap: nowrap;
  }
  .series-tab {
    display: flex; align-items: center; gap: 8px;
    flex: 0 1 auto; min-width: 0;
    padding: 18px var(--series-tab-pad-x) 15px;
    border-bottom: 3px solid transparent;
    font-size: 0.86rem; font-weight: 500; line-height: 1.25;
    color: var(--text-muted);
    text-decoration: none;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .series-tab:first-child { padding-left: 0; }
  .series-tab-label {
    display: block; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  a.series-tab:hover { color: var(--text-primary); }
  .series-nav[data-current="cart"]       .series-tab[data-tab="cart"],
  .series-nav[data-current="compute"]    .series-tab[data-tab="compute"],
  .series-nav[data-current="datacenter"] .series-tab[data-tab="datacenter"] {
    color: var(--text-primary);
    font-weight: 600;
    border-bottom-color: var(--accent);
  }
  .series-tab.is-soon { color: #8e8e9c; cursor: default; }
  .series-tab-flag {
    flex-shrink: 0;
    font-size: 0.58rem; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; white-space: nowrap;
    color: #7c7c8a; background: #eeeef3;
    border-radius: 999px; padding: 3px 8px;
  }
  .series-tab-short { display: none; }

  @media (max-width: 620px) {
    .series-nav { --series-tab-pad-x: 7px; }
    .series-nav-inner { gap: 0; }
    .series-tab { flex-direction: column; align-items: flex-start; gap: 2px; padding: 12px var(--series-tab-pad-x) 10px; font-size: 0.76rem; }
    .series-tab-full { display: none; }
    .series-tab-short { display: inline; }
    .series-tab-flag { font-size: 0.52rem; padding: 2px 6px; letter-spacing: 0.04em; }
  }

  /* ---------- stage ---------- */

  #stage {
    position: relative;
    width: 100%;
    height: calc(100vh - 56px);
    min-height: 560px;
    background: var(--stage-bg);
    overflow: hidden;
    color: var(--stage-text);
  }

  /* Both canvases live in one box, because deck sets its own canvas to
     100% of whatever contains it: moving the box is the only way to move
     the map without fighting an inline style. */
  #map-area {
    position: absolute; inset: 0;
    transition: opacity 0.5s ease;
  }
  #map, #deck-canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
  }

  /* ---------- the text column ----------
     A view inside Why there reads as a column of text with a map beside it,
     so the two stop sharing one space: the column takes the left of the
     stage on the page's own background, and both canvases move over to fill
     what is left. Everything the view has to say lives in the column, which
     is why nothing it says lands on a state label any more. */

  #stage { --text-col: 30%; }

  #text-column {
    position: absolute; z-index: 4;
    top: 0; bottom: 0; left: 0;
    width: var(--text-col);
    display: none;
    background: var(--stage-bg);
    border-right: 1px solid rgba(255, 255, 255, 0.07);
  }
  #stage[data-scene="why"]:not([data-view="headline"]) #text-column {
    display: block;
  }
  #stage[data-scene="why"]:not([data-view="headline"]) #map-area {
    left: var(--text-col);
    width: calc(100% - var(--text-col));
  }

  /* Every piece of a view's text is laid out against the column, stacked
     from the top; the gaps between them are measured in script, because a
     label that wraps changes where the next one starts. */
  #stage[data-scene="why"]:not([data-view="headline"]) #headline,
  #stage[data-scene="why"]:not([data-view="headline"]) #where-note,
  #stage[data-scene="why"]:not([data-view="headline"]) #own-bars {
    left: 28px;
    width: calc(var(--text-col) - 56px);
    max-width: none;
    transform: none;
    text-align: left;
  }
  #stage[data-scene="why"]:not([data-view="headline"]) #headline { top: 148px; }
  #stage[data-scene="why"]:not([data-view="headline"]) #own-bars { top: 148px; }
  #stage[data-scene="why"]:not([data-view="headline"]) #where-note { top: 148px; }
  #stage[data-scene="why"]:not([data-view="headline"]) .where-figure {
    flex-wrap: wrap; gap: 4px 14px;
  }
  /* The headline view of Why there is a block of type with a map behind it,
     so the whole map goes quiet: basemap, state lines, state labels and
     bars all fade together on their two canvases. A view opened from it
     brings them back. */
  #stage[data-scene="why"][data-view="headline"] #map-area { opacity: 0.1; }
  #deck-canvas { z-index: 2; }
  .maplibregl-ctrl-attrib { display: none; }

  .stage-panel {
    background: var(--stage-panel);
    border: 1px solid var(--stage-border);
    border-radius: 10px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  /* ---------- scene buttons ---------- */

  #scene-bar {
    position: absolute; z-index: 5;
    top: 16px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: flex-start; gap: 8px;
  }
  .scene-group { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .scene-btn {
    font-family: inherit;
    font-size: 0.82rem; font-weight: 700; letter-spacing: 0.02em;
    padding: 9px 20px;
    border-radius: 999px;
    border: 1px solid var(--stage-border);
    background: var(--stage-panel);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: var(--stage-text-faint);
    cursor: not-allowed;
  }
  .scene-btn.is-ready { cursor: pointer; }
  .scene-btn.is-ready:hover { color: var(--stage-text); border-color: rgba(255, 255, 255, 0.3); }
  .scene-btn.is-active {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
  }
  .scene-btn[aria-disabled="true"] { opacity: 0.7; }

  /* ---------- beat switches ----------
     The views inside a scene. One flat segmented control sitting directly
     under the scene buttons, shown only by a scene that has beats. */

  #beat-bar {
    position: absolute; z-index: 5;
    top: 59px; left: 50%; transform: translateX(-50%);
    display: none;
    padding: 3px;
    border-radius: 999px;
    border: 1px solid var(--stage-border);
    background: var(--stage-panel);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  #beat-bar.is-shown { display: flex; gap: 2px; }

  /* ---------- entry buttons ----------
     The two ways into Why there, on its overview screen. They are the scene
     buttons' own control, at the scene buttons' size, because that is what
     they are: a way into something, not a switch between views of it. */

  #entry-bar {
    position: absolute; z-index: 5;
    top: 198px; left: 50%; transform: translateX(-50%);
    display: none;
    align-items: stretch; gap: 8px;
  }
  #entry-bar.is-shown { display: flex; }
  .beat-btn {
    font-family: inherit;
    font-size: 0.7rem; font-weight: 700; letter-spacing: 0.04em;
    padding: 5px 15px;
    border: 0; border-radius: 999px;
    background: transparent;
    color: var(--stage-text-faint);
    cursor: not-allowed;
  }
  .beat-btn.is-ready { cursor: pointer; color: var(--stage-text-dim); }
  .beat-btn.is-ready:hover { color: var(--stage-text); }
  .beat-btn.is-active {
    background: rgba(255, 255, 255, 0.14);
    color: var(--stage-text);
  }
  .beat-btn[aria-disabled="true"] { opacity: 0.6; }

  /* ---------- counters ---------- */

  /* The three numbers are the headline of the screen, so they sit in the
     middle under the scene buttons where the caption used to be, with no
     panel behind them. Pointer events pass through: the numbers float over
     the map, and a bar or a state under them stays hoverable. */

  #counters {
    position: absolute; z-index: 5;
    top: 100px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: flex-start; gap: 24px;
    pointer-events: none;
  }
  /* Even columns, so the row holds still while the numbers count: the power
     value is three characters at one stop and six at another, and a row sized
     to its contents would slide sideways on every move. */
  .counter { text-align: center; min-width: 128px; }
  .counter-label {
    display: block;
    font-size: 0.6rem; font-weight: 700; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--stage-text-dim);
    margin-bottom: 2px;
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.85), 0 0 26px rgba(0, 0, 0, 0.7);
  }
  .counter-value {
    display: block;
    font-size: 2.5rem; font-weight: 800; line-height: 1.05;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.85), 0 0 26px rgba(0, 0, 0, 0.7);
  }
  .counter-value .unit { font-size: 1.1rem; font-weight: 700; color: var(--stage-text-dim); margin-left: 4px; }

  /* ---------- Why there: the numbers step aside ----------
     The scene leads with one line, so the counters hand the middle of the
     screen to it and go back to the corner, small and stacked, counting the
     same way they count anywhere else. */

  #stage[data-scene="why"] #counters {
    top: 16px; left: 16px;
    transform: none;
    display: block;
    gap: 0;
  }
  #stage[data-scene="why"] .counter { min-width: 0; text-align: left; }
  #stage[data-scene="why"] .counter + .counter { margin-top: 7px; }
  #stage[data-scene="why"] .counter-label {
    font-size: 0.55rem; margin-bottom: 1px;
  }
  #stage[data-scene="why"] .counter-value { font-size: 1.15rem; }
  #stage[data-scene="why"] .counter-value .unit {
    font-size: 0.7rem; margin-left: 3px;
  }

  /* The line the scene leads with, in the weight the counters had here. */
  /* The block's parts, measured out from the middle of the stage. Scoped to
     the scene as well as the view, because the rule below sets the headline
     where the Where view wants it and the two carry the same weight. */
  #stage[data-scene="why"][data-view="headline"] #headline { top: calc(50% - 122px); }
  #stage[data-scene="why"][data-view="headline"] #why-driver { top: calc(50% - 60px); }
  #stage[data-scene="why"][data-view="headline"] #why-figures { top: calc(50% - 8px); }
  #stage[data-scene="why"][data-view="headline"] #entry-bar { top: calc(50% + 85px); }

  /* Inside a view the entries are sub-tabs: the pill the Price, Own power
     and Cooling switches used, in the same place under the scene buttons.
     After the headline rules above, because the two carry equal weight. */
  #stage[data-scene="why"]:not([data-view="headline"]) #entry-bar {
    top: 59px;
    gap: 2px;
    padding: 3px;
    border-radius: 999px;
    border: 1px solid var(--stage-border);
    background: var(--stage-panel);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  #stage[data-scene="why"] #headline {
    top: 96px;
    max-width: min(760px, calc(100% - 420px));
    font-size: 2.5rem; font-weight: 800; line-height: 1.05;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }
  #stage[data-scene="why"] #headline.is-back { cursor: pointer; }
  #stage[data-scene="why"] #entry-bar { top: 286px; }

  /* The number a view counts to, with the group it belongs to beside it. */
  .where-figure { display: inline-flex; align-items: baseline; gap: 14px; }
  .where-unit {
    font-size: 1.1rem; font-weight: 700;
    color: var(--stage-text-dim); margin-left: 4px;
  }
  .where-group {
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--stage-text-dim);
  }

  /* ---------- time to power ----------
     One block, centred on the screen: the headline, the driver under it, the
     two numbers, and the two ways in. Each part is positioned from the middle
     of the stage rather than from the top, so the block stays centred as a
     whole and the spacing between its parts is the layout. */

  #why-driver {
    position: absolute; z-index: 5;
    top: 142px; left: 50%; transform: translateX(-50%);
    width: max-content; max-width: calc(100% - 420px);
    margin: 0;
    text-align: center;
    font-size: 0.82rem; font-weight: 600; line-height: 1.4;
    color: var(--stage-text-dim);
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.85), 0 0 26px rgba(0, 0, 0, 0.7);
    opacity: 0; visibility: hidden;
    transition: opacity 0.5s ease, visibility 0.5s;
  }
  #why-driver.is-shown { opacity: 1; visibility: visible; }

  #why-figures {
    position: absolute; z-index: 5;
    left: 50%; transform: translateX(-50%);
    display: flex; align-items: flex-start; gap: 64px;
    opacity: 0; visibility: hidden;
    transition: opacity 0.5s ease, visibility 0.5s;
  }
  #why-figures.is-shown { opacity: 1; visibility: visible; }
  .why-figure {
    font-family: inherit;
    display: block; min-width: 150px; padding: 0;
    border: 0; background: none;
    text-align: center;
    color: var(--stage-text);
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.85), 0 0 26px rgba(0, 0, 0, 0.7);
  }
  .why-number {
    display: block;
    font-size: 2.25rem; font-weight: 800; line-height: 1.05;
    font-variant-numeric: tabular-nums;
  }
  .why-unit {
    font-size: 1rem; font-weight: 700;
    color: var(--stage-text-dim); margin-left: 5px;
  }
  .why-caption {
    display: block; margin-top: 6px;
    font-size: 0.7rem; font-weight: 600; line-height: 1.35;
    color: var(--stage-text-dim);
  }
  /* The one figure with something behind it says so by being a button that
     underlines on hover; the other is type. */
  button.why-figure { cursor: pointer; }
  button.why-figure:hover .why-number,
  button.why-figure[aria-expanded="true"] .why-number {
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-underline-offset: 5px;
  }

  /* The one line that arrives under the number when the last group has. */
  #where-note {
    position: absolute; z-index: 5;
    top: 146px; left: 50%; transform: translateX(-50%);
    width: max-content;
    max-width: min(620px, calc(100% - 420px));
    margin: 0;
    text-align: center;
    font-size: 0.82rem; font-weight: 600; line-height: 1.45;
    color: var(--stage-text);
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.85), 0 0 26px rgba(0, 0, 0, 0.7);
    opacity: 0; visibility: hidden;
    transition: opacity 0.9s ease, visibility 0.9s;
  }
  #where-note.is-shown { opacity: 1; visibility: visible; }
  /* A step that compares two sites says so in rows, with its point under
     them; one that has a card behind it says so by being clickable. */
  .note-row {
    display: block;
    font-variant-numeric: tabular-nums;
  }
  .note-line {
    display: block; margin-top: 7px;
    color: var(--stage-text-dim); font-weight: 600;
  }
  #where-note.is-clickable { pointer-events: auto; cursor: pointer; }
  #where-note.is-clickable:hover { text-decoration: underline;
    text-decoration-thickness: 1px; text-underline-offset: 4px; }

  /* ---------- make your own power ----------
     One row per example: how long it took, drawn at one speed so the length
     of a bar is the wait, and a label that names it. The third has no bar,
     because it has not finished. */

  #own-bars {
    position: absolute; z-index: 5;
    top: 156px; left: 50%; transform: translateX(-50%);
    opacity: 0; visibility: hidden;
    transition: opacity 0.5s ease, visibility 0.5s;
  }
  #own-bars.is-shown { opacity: 1; visibility: visible; }
  .own-row + .own-row { margin-top: 12px; }
  .own-row.is-waiting { opacity: 0.35; }
  .own-label {
    display: block; margin-bottom: 4px;
    font-size: 0.72rem; font-weight: 600; line-height: 1.3;
    color: var(--stage-text);
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.85), 0 0 26px rgba(0, 0, 0, 0.7);
  }
  .own-fill {
    display: block;
    width: 0; height: 8px;
    border-radius: 0 4px 4px 0;
    transition-property: width;
    transition-timing-function: linear;
  }

  /* ---------- citations ----------
     A raised number after a claim, and the list it points at along the
     bottom of the same card, so a card carries its own sources. */
  .card-cite {
    font-size: 0.56rem; font-weight: 800;
    vertical-align: super; line-height: 0;
    color: var(--stage-text-dim);
    margin-left: 2px;
  }
  .card-sources {
    margin-top: 9px; padding-top: 8px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    font-size: 0.6rem; line-height: 1.5; color: var(--stage-text-faint);
  }
  .card-source { display: block; }
  .card-source-n { font-weight: 800; margin-right: 4px; }

  /* ---------- how we know ----------
     A quiet link under the counters. It is deliberately small and un-pilled
     so it does not read as a fifth scene button next to Who / Where / Why /
     When. */

  /* Sits at the end of the footnote line rather than beside the counters, so
     the top-left panel carries numbers only. */
  #how-btn {
    font-family: inherit; font-size: inherit; font-weight: 700;
    padding: 0; margin-left: 2px;
    border: 0; background: none;
    color: var(--stage-text-dim);
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
  }
  #how-btn:hover { color: var(--stage-text); }

  #how-scrim {
    position: absolute; inset: 0; z-index: 9;
    background: rgba(6, 9, 13, 0.55);
    display: none;
  }
  #how-scrim.is-open { display: block; }

  #how-panel {
    position: absolute; z-index: 10;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: min(560px, calc(100% - 48px));
    max-height: calc(100% - 64px);
    overflow-y: auto;
    padding: 20px 22px 18px;
    background: var(--stage-panel-solid);
    border: 1px solid var(--stage-border);
    border-radius: 12px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.6);
    display: none;
  }
  #how-panel.is-open { display: block; }

  .how-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; margin-bottom: 12px;
  }
  .how-title {
    font-size: 0.6rem; font-weight: 700; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--stage-text-dim);
  }
  #how-close {
    flex-shrink: 0;
    width: 24px; height: 24px; margin: -4px -4px 0 0;
    border: 1px solid var(--stage-border); border-radius: 6px;
    background: transparent; color: var(--stage-text-dim);
    font-size: 0.9rem; line-height: 1; cursor: pointer;
  }
  #how-close:hover { background: rgba(255, 255, 255, 0.12); color: var(--stage-text); }

  .how-headline {
    margin: 0 0 16px;
    font-size: 1rem; font-weight: 700; line-height: 1.45;
    color: var(--stage-text);
  }

  .how-steps {
    display: flex; align-items: stretch; gap: 0;
    margin-bottom: 16px;
  }
  .how-step {
    flex: 1;
    padding: 10px 12px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    font-size: 0.72rem; line-height: 1.4;
    color: var(--stage-text);
  }
  .how-step-n {
    display: block;
    font-size: 0.56rem; font-weight: 800; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--stage-text-faint);
    margin-bottom: 4px;
  }
  .how-arrow {
    flex-shrink: 0;
    display: flex; align-items: center;
    padding: 0 7px;
    color: var(--stage-text-faint); font-size: 0.9rem;
  }

  .how-fact { display: flex; gap: 10px; font-size: 0.78rem; line-height: 1.5; }
  .how-fact + .how-fact { margin-top: 7px; }
  .how-fact-label {
    flex-shrink: 0; width: 92px;
    font-size: 0.6rem; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--stage-text-faint);
    padding-top: 3px;
  }
  .how-fact-value { color: var(--stage-text); }
  .how-fact-value strong { color: #ffd37a; font-weight: 800; }
  .how-fact-note {
    display: block; margin-top: 2px;
    font-size: 0.64rem; color: var(--stage-text-faint);
  }

  .how-footnote {
    margin: 15px 0 0; padding-top: 11px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    font-size: 0.66rem; line-height: 1.5; color: var(--stage-text-faint);
  }

  @media (max-width: 620px) {
    .how-steps { flex-direction: column; gap: 0; }
    .how-arrow { padding: 4px 0; justify-content: center; transform: rotate(90deg); }
    .how-fact { flex-direction: column; gap: 2px; }
    .how-fact-label { width: auto; padding-top: 0; }
  }

  /* ---------- legend ---------- */

  #legend {
    position: absolute; z-index: 5;
    top: 16px; right: 16px;
    width: 232px;
    max-height: calc(100% - 150px);
    display: flex; flex-direction: column;
    padding: 11px 6px 10px 12px;
  }
  .legend-head {
    font-size: 0.6rem; font-weight: 700; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--stage-text-dim);
    padding-right: 6px; margin-bottom: 8px;
  }
  .legend-rows { overflow-y: auto; padding-right: 6px; min-height: 0; }
  .legend-rows::-webkit-scrollbar { width: 6px; }
  .legend-rows::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.16); border-radius: 3px; }
  .legend-row {
    display: grid; grid-template-columns: 11px 1fr auto;
    align-items: center; gap: 8px;
    padding: 3px 0;
    font-size: 0.74rem;
    transition: opacity 0.25s ease;
  }
  .legend-row.is-zero { opacity: 0.32; }
  .legend-row.is-pickable { cursor: pointer; border-radius: 4px; }
  .legend-row.is-pickable:hover { background: rgba(255, 255, 255, 0.07); }
  .legend-row.is-picked {
    background: rgba(255, 255, 255, 0.12);
    opacity: 1;
  }

  /* Who builds adds a second number per owner, so the row grows a column and
     the head grows matching captions. */
  #legend.is-two-col .legend-row {
    grid-template-columns: 11px 1fr 52px 52px;
  }
  /* Scoped to the owner head: #size-key carries a .legend-head of its own and
     must stay a plain caption rather than becoming a four-column grid. */
  #legend.is-two-col > #legend-head {
    display: grid;
    grid-template-columns: 11px 1fr 52px 52px;
    gap: 8px;
    align-items: end;
  }
  .legend-head-name { grid-column: 1 / span 2; }
  .legend-head-col { text-align: right; }
  .legend-mw-then { color: var(--stage-text); }
  .legend-swatch { width: 11px; height: 11px; border-radius: 3px; }
  .legend-name {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--stage-text);
  }
  .legend-mw {
    font-variant-numeric: tabular-nums;
    color: var(--stage-text-dim); font-weight: 700;
  }

  /* The Why there legend: a diverging ramp with the national average marked
     where it actually falls on the scale, not at a nominal midpoint. */
  #legend-ramp { display: none; flex-shrink: 0; padding-right: 6px; }
  #legend-ramp.is-shown {
    display: block;
    margin-bottom: 10px; padding-bottom: 10px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }
  .ramp-bar { position: relative; height: 10px; border-radius: 2px; }
  .ramp-mark {
    position: absolute; top: -3px; bottom: -3px; width: 1px;
    background: rgba(235, 242, 250, 0.85);
  }
  .ramp-scale {
    display: grid; grid-template-columns: 1fr auto 1fr; gap: 4px;
    margin-top: 7px;
    font-size: 0.57rem; font-weight: 700; letter-spacing: 0.03em;
    color: var(--stage-text-faint);
  }
  .ramp-scale-mid { color: var(--stage-text-dim); }
  .ramp-scale-high { text-align: right; }
  .ramp-note {
    margin-top: 6px;
    font-size: 0.57rem; font-weight: 700; letter-spacing: 0.03em;
    color: var(--stage-text-faint);
  }

  /* ---------- caption ----------
     Directly under the scene buttons at the top, not over the map, so it never
     sits on Texas or the Midwest. Smaller than the old overlay card, and with
     no panel behind it so it reads as a caption rather than a dialog. */

  #headline {
    position: absolute; z-index: 5;
    /* Below the counters, which now hold the spot under the scene buttons
       that this caption used to have. */
    top: 166px; left: 50%; transform: translateX(-50%);
    width: max-content;
    max-width: min(560px, calc(100% - 420px));
    margin: 0;
    text-align: center;
    font-size: 0.82rem; font-weight: 600; line-height: 1.45;
    letter-spacing: 0.01em;
    color: var(--stage-text);
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.85), 0 0 26px rgba(0, 0, 0, 0.7);
    opacity: 0; visibility: hidden;
    transition: opacity 0.9s ease, visibility 0.9s;
  }
  #headline.is-shown { opacity: 1; visibility: visible; }
  .headline-line { display: block; }

  /* ---------- size key ---------- */

  #size-key {
    margin-top: 11px; padding-top: 10px; padding-right: 6px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    flex-shrink: 0;
  }
  #size-key-bars { display: block; margin-top: 2px; }
  /* One line under the scale, at the panel's own caption size and colour.
     It has to stay on one line to read as a single comparison, so it is set
     nowrap rather than left to break after the fraction. */
  #size-key-note {
    margin-top: 7px;
    /* The scale's own 6px gutter is given back: the line needs the panel's
       full width to stay on one line, and it measures 207px against the
       206px the gutter would leave it. */
    margin-right: -6px;
    font-size: 0.6rem; line-height: 1.4;
    color: var(--stage-text-dim);
    white-space: nowrap;
  }

  /* ---------- timeline ---------- */

  #timeline {
    position: absolute; z-index: 5;
    left: 16px; right: 16px; bottom: 44px;
    display: flex; align-items: center; gap: 14px;
    padding: 12px 16px;
  }
  #play {
    flex-shrink: 0;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid var(--stage-border);
    background: rgba(255, 255, 255, 0.08);
    color: var(--stage-text);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s ease;
  }
  #play:hover { background: rgba(255, 255, 255, 0.18); }
  #play svg { display: block; fill: currentColor; }

  .track-wrap { flex: 1; min-width: 0; }
  .track-top {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 0.68rem; color: var(--stage-text-dim);
    margin-bottom: 2px;
  }
  .track-now { font-weight: 800; color: var(--stage-text); font-size: 0.8rem; }

  /* The Who builds scene is a snapshot, so the track is held at Today. */
  #timeline.is-locked #slider { cursor: not-allowed; opacity: 0.55; }
  #timeline.is-locked #play { opacity: 0.4; pointer-events: none; }
  #timeline.is-locked #track-hint::before {
    content: "\01F512";
    margin-right: 5px;
    font-size: 0.8em;
  }

  /* The slider is the primary control, so it gets a real grab handle and a
     generous hit area rather than a hairline. */
  #slider {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 22px;
    background: transparent;
    cursor: grab;
    margin: 0;
  }
  #slider:active { cursor: grabbing; }
  #slider::-webkit-slider-runnable-track {
    height: 4px; border-radius: 2px;
    background: var(--track-fill);
  }
  #slider::-moz-range-track {
    height: 4px; border-radius: 2px;
    background: var(--track-fill);
  }
  #slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: #ffffff;
    border: 2px solid #11151a;
    margin-top: -6px;
    box-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
  }
  #slider::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: #ffffff; border: 2px solid #11151a;
    box-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
  }
  #slider:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

  .track-ticks {
    position: relative; height: 13px;
    font-size: 0.56rem; color: var(--stage-text-faint);
  }
  .track-tick {
    position: absolute; top: 0;
    transform: translateX(-50%);
    white-space: nowrap;
  }
  .track-tick.is-locked { color: #475569; }
  .track-tick.is-today { color: var(--stage-text); font-weight: 800; }

  /* ---------- site card ---------- */

  #site-card, #note-card {
    position: absolute; z-index: 6;
    width: 266px;
    padding: 13px 15px 12px;
    background: var(--stage-panel-solid);
    border: 1px solid var(--stage-border);
    border-radius: 10px;
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.55);
    pointer-events: none;
    display: none;
  }
  #site-card.is-pinned { pointer-events: auto; }
  /* The card behind the grid number: the same card, a little wider, because
     its two lines are sentences rather than a name and a figure. */
  #note-card { width: 302px; pointer-events: auto; }
  #note-card .card-rows { gap: 7px 10px; line-height: 1.45; }
  .card-name { font-size: 0.92rem; font-weight: 800; line-height: 1.25; margin-bottom: 2px; }
  .card-owner {
    display: flex; align-items: center; gap: 6px;
    font-size: 0.72rem; color: var(--stage-text-dim);
    margin-bottom: 9px;
  }
  .card-owner .legend-swatch { width: 9px; height: 9px; }
  .card-rows { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 0.74rem; }
  .card-key { color: var(--stage-text-faint); white-space: nowrap; }
  .card-val { color: var(--stage-text); font-variant-numeric: tabular-nums; }
  .card-note {
    margin-top: 9px; padding-top: 8px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    font-size: 0.64rem; color: var(--stage-text-faint); line-height: 1.45;
  }
  .card-approx { color: #d97e00; font-weight: 700; }
  .card-ground {
    margin-top: 9px; padding-top: 8px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    font-size: 0.72rem; line-height: 1.45; color: var(--stage-text);
  }
  .card-ground-label {
    display: block;
    font-size: 0.57rem; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--stage-text-dim);
    margin-bottom: 3px;
  }
  .card-ground-value { font-weight: 700; }
  .card-status { font-weight: 700; }

  /* ---------- playback ----------
     A view that plays gets the timeline's own panel, in the timeline's own
     place, and the timeline stands down while it is up: one control on
     screen at a time. */

  #where-controls {
    position: absolute; z-index: 5;
    left: 50%; transform: translateX(-50%);
    bottom: 44px;
    display: none;
    align-items: center; gap: 10px;
    padding: 9px 12px;
  }
  #where-controls.is-shown { display: flex; }
  .where-btn {
    font-family: inherit;
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.02em;
    padding: 7px 15px;
    border-radius: 999px;
    border: 1px solid var(--stage-border);
    background: rgba(255, 255, 255, 0.08);
    color: var(--stage-text);
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .where-btn:hover { background: rgba(255, 255, 255, 0.18); }
  .where-btn[aria-disabled="true"] { opacity: 0.4; pointer-events: none; }
  #where-step {
    font-size: 0.68rem; font-weight: 700;
    color: var(--stage-text-dim);
    font-variant-numeric: tabular-nums;
    min-width: 42px; text-align: right;
  }
  #stage[data-view="where"] #timeline,
  #stage[data-view="ownpower"] #timeline { display: none; }

  /* This view's own places for the shared line and its bars. */
  #stage[data-view="ownpower"] #where-note { top: 262px; }

  /* A legend row that replays its group says so by being a button. */
  .legend-row.is-replay { cursor: pointer; }
  .legend-row.is-replay:hover .legend-name { color: var(--stage-text); }

  /* ---------- footnote ---------- */

  #footnote {
    position: absolute; z-index: 5;
    left: 16px; right: 16px; bottom: 12px;
    text-align: center;
    font-size: 0.62rem; line-height: 1.5;
    color: var(--stage-text-faint);
  }

  /* ---------- loading / error ---------- */

  #stage-status {
    position: absolute; inset: 0; z-index: 8;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px;
    background: var(--stage-bg);
    font-size: 0.86rem; color: var(--stage-text-dim);
    text-align: center; padding: 24px;
  }
  #stage-status.is-hidden { display: none; }
  .spinner {
    width: 32px; height: 32px; border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.14);
    border-top-color: #ffffff;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 900px) {
    #legend { display: none; }
    /* The scene buttons move to the bottom at this width, so the numbers
       take the top of the screen rather than leaving it empty. */
    #counters { top: 16px; gap: 10px; }
    .counter { min-width: 92px; }
    .counter-value { font-size: 1.7rem; }
    .counter-value .unit { font-size: 0.85rem; }
    #scene-bar { top: auto; bottom: 150px; }
    .scene-btn { font-size: 0.74rem; padding: 7px 13px; }
    /* No legend at this width, so the caption may use the full column. */
    #headline { top: 150px; max-width: calc(100% - 32px); font-size: 0.74rem; }
    #entry-bar { top: 182px; }
    #stage[data-scene="why"] #counters { top: 16px; left: 16px; }
    #stage[data-scene="why"] #headline { top: 92px; font-size: 1.5rem; }
    #stage[data-scene="why"] #entry-bar { top: 248px; }
    #why-driver { font-size: 0.74rem; max-width: calc(100% - 32px); }
    #why-figures { gap: 28px; }
    .why-figure { min-width: 120px; }
    .why-number { font-size: 1.6rem; }
    #stage[data-scene="why"][data-view="headline"] #headline { top: calc(50% - 88px); }
    #stage[data-scene="why"][data-view="headline"] #why-driver { top: calc(50% - 49px); }
    #stage[data-scene="why"][data-view="headline"] #why-figures { top: calc(50% - 12px); }
    #stage[data-scene="why"][data-view="headline"] #entry-bar { top: calc(50% + 55px); }
    #where-note { top: 126px; max-width: calc(100% - 32px); font-size: 0.74rem; }
    #own-bars { top: 150px; }
    #stage[data-view="ownpower"] #where-note { top: 250px; }
    /* No room for a column beside the map at this width, so it goes above
       it and the map takes what is left below. */
    #stage[data-scene="why"]:not([data-view="headline"]) #text-column {
      top: 0; bottom: auto; left: 0;
      width: 100%; height: 46%;
      border-right: 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }
    #stage[data-scene="why"]:not([data-view="headline"]) #map-area {
      left: 0; width: 100%;
      top: 46%; height: 54%;
    }
    #stage[data-scene="why"]:not([data-view="headline"]) #headline,
    #stage[data-scene="why"]:not([data-view="headline"]) #where-note,
    #stage[data-scene="why"]:not([data-view="headline"]) #own-bars {
      left: 16px; width: calc(100% - 32px);
    }
  }
</style>
</head>
<body>

  <!-- Series nav. Three edits from part 1's copy, as its comment block
       prescribes: data-current is this page's tab, every href is prefixed
       with ../ because the sub-pages sit one level deeper, and the Data
       Center span became an <a> while part 1 went back to being a link. -->
  <nav class="series-nav" data-current="datacenter" aria-label="AI / Compute / Data Center series">
    <div class="series-nav-inner">

      <a class="series-tab" data-tab="cart" href="../">
        <span class="series-tab-label">
          <span class="series-tab-full">AI Unit Economics</span>
          <span class="series-tab-short">AI Economics</span>
        </span>
      </a>

      <span class="series-tab is-soon" data-tab="compute" aria-disabled="true">
        <span class="series-tab-label">
          <span class="series-tab-full">Compute Economics</span>
          <span class="series-tab-short">Compute</span>
        </span>
        <span class="series-tab-flag">
          <span class="series-tab-full">Coming soon</span>
          <span class="series-tab-short">Soon</span>
        </span>
      </span>

      <a class="series-tab" data-tab="datacenter" href="./" aria-current="page">
        <span class="series-tab-label">
          <span class="series-tab-full">Data Center Economics</span>
          <span class="series-tab-short">Data Center</span>
        </span>
      </a>

    </div>
  </nav>

  <main id="stage">
    <div id="text-column"></div>
    <div id="map-area">
      <div id="map"></div>
      <canvas id="deck-canvas"></canvas>
    </div>

    <!-- Five flat buttons in value-chain order, one per scene, filled from
         CONFIG.scenes so a later step only has to flip its scene's `ready`
         flag. The page opens on the first of them. -->
    <div id="scene-bar" role="tablist" aria-label="Scenes"></div>

    <!-- The views inside a scene. Why there is the first scene to have any;
         filled from its own `beats` list, and hidden for scenes without. -->
    <div id="beat-bar" role="tablist" aria-label="Views"></div>

    <!-- The two entries on the Why there overview screen, filled from that
         scene's own `intro` block and shown only while it is up. -->
    <!-- The headline view's own lines: what drives the choice, and how long
         each way to power takes. -->
    <p id="why-driver"></p>
    <div id="why-figures"></div>

    <div id="entry-bar" role="group" aria-label="Entry points"></div>

    <!-- The footnote the Where view ends on, under its number. -->
    <div id="own-bars"></div>
    <p id="where-note"></p>

    <p id="headline"></p>

    <div id="counters">
      <div class="counter">
        <span class="counter-label" id="counter-year-label">Year</span>
        <span class="counter-value" id="counter-year">&mdash;</span>
      </div>
      <div class="counter">
        <span class="counter-label" id="counter-power-label">IT power</span>
        <span class="counter-value" id="counter-power">&mdash;</span>
      </div>
      <div class="counter">
        <span class="counter-label" id="counter-sites-label">Sites live</span>
        <span class="counter-value" id="counter-sites">&mdash;</span>
      </div>
    </div>

    <div id="legend" class="stage-panel">
      <div class="legend-head" id="legend-head">Owner</div>
      <div id="legend-ramp"></div>
      <div class="legend-head" id="legend-sub-head" hidden>Owner</div>
      <div class="legend-rows" id="legend-rows"></div>
      <div id="size-key">
        <div class="legend-head" id="size-key-head">Bar height = IT power</div>
        <svg id="size-key-bars" aria-hidden="true"></svg>
        <div id="size-key-note"></div>
      </div>
    </div>

    <div id="timeline" class="stage-panel">
      <button type="button" id="play" aria-label="Play the timeline to today">
        <svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"></path></svg>
      </button>
      <div class="track-wrap">
        <div class="track-top">
          <span class="track-now" id="track-now">2021 H1</span>
          <span id="track-hint">Drag, or use the left and right arrow keys</span>
        </div>
        <input type="range" id="slider" min="0" max="0" step="1" value="0"
               aria-label="Timeline position">
        <div class="track-ticks" id="track-ticks"></div>
      </div>
    </div>

    <div id="where-controls" class="stage-panel" role="group"
         aria-label="Playback">
      <button type="button" class="where-btn" id="where-back">Back</button>
      <button type="button" class="where-btn" id="where-play">Play</button>
      <button type="button" class="where-btn" id="where-next">Next</button>
      <span id="where-step"></span>
    </div>

    <p id="footnote"><span id="footnote-text"></span>
      <button type="button" id="how-btn" aria-haspopup="dialog" aria-expanded="false"><span id="how-btn-label">Data &amp; method</span></button>
    </p>

    <div id="site-card" role="dialog" aria-label="Site detail"></div>
    <div id="note-card" role="dialog" aria-label="Why the wait"></div>

    <div id="how-scrim"></div>
    <div id="how-panel" role="dialog" aria-modal="true" aria-labelledby="how-title"></div>

    <div id="stage-status">
      <div class="spinner"></div>
      <div id="stage-status-text">Loading sites&hellip;</div>
    </div>
  </main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.4.0/maplibre-gl.js"
        integrity="sha512-V0VCR62R076Ezy2E5xflGqGPDhGYWzebW9NQlh2y2qvAGzBu2xxuCsIF9DXLPasvmNNoQ5bSd+9wl+zOwwJ0Kg=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdn.jsdelivr.net/npm/deck.gl@9.3.11/dist.min.js"></script>

<script>
(function () {
  "use strict";

  /* ==========================================================================
     CONFIG -- every piece of on-screen wording and every colour lives here, so
     later scenes only add entries rather than editing the render code.
     ========================================================================== */
  var CONFIG = {
    data: {
      sites: "data/sites.json",
      states: "data/us_states.geojson",
      mask: "data/us_mask.geojson",
      chiller: "data/chiller_rule.json",
      prices: "data/state_prices.json",
      metros: "data/metros.json"
    },

    /* Owner colours for the dark stage, in two tiers.

       The six owners the demo is about carry vivid, widely separated hues:
       blue, green, amber, red, magenta, violet. That subset measures 16.3
       worst-pair normal-vision delta-E against this surface and 7.4 on the
       CVD test, inside the band that is legal with secondary encoding.

       The seven small owners are muted and spread across lightness as well as
       hue: slate, teal, olive, purple-grey, tan, wine, steel. Colocation was
       a near-white in the earlier dark build and is now a proper mid slate,
       which costs a little separation -- across all thirteen the worst pair
       is 10.1 -- but keeps every bar readable as a colour rather than as
       paper. No two owners share a hue family, and identity never rests on
       colour alone: the legend names every owner, hovering fades the rest,
       and the card repeats the owner in text. */
    ownerColors: {
      "Google":          "#4a9eff",
      "Meta":            "#3ddc84",
      "Amazon":          "#ffb347",

     ========================================================================== */
  function splitPower(mw) {
    if (mw >= 1000) return { value: (mw / 1000).toFixed(1), unit: "GW" };
    return { value: String(Math.round(mw)), unit: "MW" };
  }

  function powerText(mw) {
    var p = splitPower(mw);
    return p.value + " " + p.unit;
  }

  /* Today is a point inside the download year, so it reads as that year
     rather than as the next H1 stop after it. */
  function stopYear(stop) {
    return stop.isToday ? CONFIG.asOf.slice(0, 4) : stop.key.slice(0, 4);
  }

  function stopLabel(stop) {
    if (stop.isToday) return CONFIG.labels.todayStop;
    return stop.key.slice(0, 4);
  }

  function escapeHtml(text) {
    return String(text == null ? "" : text).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function hexToRgb(hex) {
    var h = hex.replace("#", "");
    return [
      parseInt(h.slice(0, 2), 16),
      parseInt(h.slice(2, 4), 16),
      parseInt(h.slice(4, 6), 16)
    ];
  }

  function darken(rgb, factor) {
    return rgb.map(function (c) { return Math.round(c * factor); });
  }

  function lighten(rgb, factor) {
    return rgb.map(function (c) { return Math.min(255, Math.round(c * factor)); });
  }

  function ownerColor(owner) {
    return CONFIG.ownerColors[owner] || CONFIG.ownerFallback;
  }

  /* ==========================================================================
     Timeline model
     ========================================================================== */
  /* ==========================================================================
     Electricity prices

     One state's price against the US average of the same year, as a ratio:
     below 1 means power there is cheaper than the country, above 1 pricier.
     ========================================================================== */
  function priceCfg() { return CONFIG.scenes.why.price; }

  function priceTable() {
    return PRICES ? PRICES[priceCfg().sector] : null;
  }

  function usPrice(year) {
    var table = priceTable();
    if (!table) return null;
    var value = table.us[year || priceCfg().year];
    return typeof value === "number" ? value : null;
  }

  function statePrice(code, year) {
    var table = priceTable();
    if (!table || !code) return null;
    var row = table.states[code];
    var value = row ? row[year || priceCfg().year] : null;
    return typeof value === "number" ? value : null;
  }

  function priceRatio(code, year) {
    var here = statePrice(code, year);
    var us = usPrice(year);
    return here !== null && us ? here / us : null;
  }

  /* Cents per kWh, printed the way a price is read: one decimal under ten
     cents, a round number above, where the decimal stops mattering. */
  function centsText(value) {
    if (typeof value !== "number") return "\u2014";
    return (value < 10 ? value.toFixed(1) : String(Math.round(value))) + "\u00a2";
  }

  function gapPct(ratio) {
    return Math.round(Math.abs(1 - ratio) * 100);
  }

  /* The diverging ramp. Inside the neutral band the fill is flat grey; from
     the edge of that band outwards it runs to teal on the cheap side and to
     orange on the dear one, deepening with the gap. Each half is interpolated
     from the grey rather than across the whole domain, so neither hue leaks
     into the other and the plateau has a real edge. */
  function priceColor(ratio) {
    var cfg = priceCfg();
    if (typeof ratio !== "number") return null;
    var band = cfg.neutralBand;
    var mid = hexToRgb(cfg.colorMid);
    if (Math.abs(ratio - 1) <= band) return mid;

    var to, t;
    if (ratio < 1) {
      to = hexToRgb(cfg.colorCheap);
      t = (1 - band - Math.max(cfg.domain[0], ratio)) / (1 - band - cfg.domain[0]);
    } else {
      to = hexToRgb(cfg.colorPricey);
      t = (Math.min(cfg.domain[1], ratio) - 1 - band) / (cfg.domain[1] - 1 - band);
    }
    return [0, 1, 2].map(function (i) {
      return Math.round(mid[i] + (to[i] - mid[i]) * t);
    });
  }

  /* What a state is worth on this map: the MW it holds today and in 2030, and
     the MW-weighted price its own sites broke ground on, each against the US
     average of that site's own year rather than against one common year. */
  function buildStateFacts() {
    stateFacts = {};
    SITES.forEach(function (site) {
      if (!site.state) return;
      var row = stateFacts[site.state];
      if (!row) {
        row = stateFacts[site.state] =
          { today: 0, then: 0, sites: 0, weighted: 0, weight: 0, groundRatio: null };
      }
      row.today += site.it_mw_as_of;
      row.then += site.it_mw_2030h1;
      row.sites += 1;
      var ratio = priceRatio(site.state, String(site.price_year));
      if (ratio !== null) {
        row.weighted += site.it_mw_2030h1 * ratio;
        row.weight += site.it_mw_2030h1;
      }
    });
    Object.keys(stateFacts).forEach(function (code) {
      var row = stateFacts[code];
      row.groundRatio = row.weight > 0 ? row.weighted / row.weight : null;
    });
  }

  /* One stop per year, read at that year's H1 figure -- the value as of the
     first of January -- plus a Today stop sitting between the year Today
     falls in and the next one. The data still carries half-years; the
     timeline just samples it annually, which is a grain a reader can step
     through without counting. The stops past Today keep going to 2030 and
     stay locked for the When scene. */
  function buildStops(periods) {
    var stops = periods.filter(function (key) {
      return key.slice(4) === "H1";
    }).map(function (key) {
      return { key: key, isToday: false, locked: false };
    });

    var asOfKey = CONFIG.asOf.slice(0, 4) + "H1";
    var insertAt = stops.findIndex(function (s) { return s.key === asOfKey; });
    insertAt = insertAt === -1 ? stops.length - 1 : insertAt;
    stops.splice(insertAt + 1, 0, { key: "today", isToday: true, locked: false });

    stops.forEach(function (stop, i) {
      stop.locked = i > insertAt + 1;
      stop.label = stopLabel(stop);
    });
    return stops;
  }

  function powerAt(site, stop) {
    if (stop.isToday) return site.it_mw_as_of;
    return site.it_mw_by_period[stop.key] || 0;
  }

  function liveAt(stop) {
    return SITES.filter(function (s) { return powerAt(s, stop) > 0; });
  }

  /* ==========================================================================
     Bar geometry

     deck.gl has no screen-space rectangle, so each bar is a four-point polygon
     in lon/lat whose size is converted back from pixels. Longitude degrees per
     pixel is constant in Web Mercator; latitude degrees per pixel shrinks with
     the cosine of the latitude, so a bar in Texas and one in North Dakota need
     different conversions or the northern one comes out visibly taller for the
     same MW.
     ========================================================================== */
  var degPerPx = { lon: 0.01 };
  var offsetDeg = {};          /* sideways nudge per site, in degrees of lon */

  /* Derived from the zoom rather than from a live viewport. deck.gl asserts
     if getViewports() is called before its first render, and the closed form
     is exact anyway: at deck's zoom convention the world is 512 * 2^z pixels
     wide, so a pixel spans 360 / (512 * 2^z) degrees of longitude, and
     cos(latitude) times that in latitude. Checked against unproject at 27, 39
     and 49 degrees north: agreement to within 0.04%. */
  function refreshScale() {
    if (!viewState) return;
    degPerPx.lon = 360 / (512 * Math.pow(2, viewState.zoom));
    layoutOffsets();
  }

  function mercatorY(lat) {
    return Math.log(Math.tan(Math.PI / 4 + (lat * Math.PI / 180) / 2));
  }

  /* Bars standing on nearly the same spot would hide each other, so sites
     whose bases fall within a few pixels are spread sideways around their
     shared centre. The spread is computed from position alone, never from
     height, so a bar does not slide as the timeline moves; and over all 77
     sites rather than the live ones, so it does not shift as sites appear. */
  function layoutOffsets() {
    var cfg = CONFIG.map;
    if (!SITES.length || !viewState) return;

    var worldPx = 512 * Math.pow(2, viewState.zoom);
    var points = SITES.map(function (site) {
      return {
        name: site.name,
        x: (site.lon / 360) * worldPx,
        y: -(mercatorY(site.lat) / (2 * Math.PI)) * worldPx
      };
    }).sort(function (a, b) { return a.x - b.x; });

    /* One sweep along x: a point joins the running cluster when it is close
       to the previous point in x and in the same horizontal band. */
    var clusters = [];
    var current = [points[0]];
    for (var i = 1; i < points.length; i++) {
      var prev = points[i - 1];
      var here = points[i];
      if (here.x - prev.x < cfg.collisionGapPx &&
          Math.abs(here.y - prev.y) < cfg.collisionVicinityPx) {
        current.push(here);
      } else {
        clusters.push(current);
        current = [here];
      }
    }
    clusters.push(current);

    offsetDeg = {};
    clusters.forEach(function (cluster) {
      if (cluster.length === 1) { offsetDeg[cluster[0].name] = 0; return; }
      cluster.forEach(function (point, index) {
        var slot = index - (cluster.length - 1) / 2;
        offsetDeg[point.name] = slot * cfg.collisionGapPx * degPerPx.lon;
      });
    });
  }

  /* A scene either uses the map's own pixels per MW, or asks for a scale that
     makes its tallest drawn value land on a target height. Who builds draws
     2030 totals, which run to 2,263 MW, so it needs its own. */
  function scenePxPerMW(id) {
    var cfg = CONFIG.map;
    var active = CONFIG.scenes[id];
    if (!active || active.pxPerMWFor !== "tallest2030") return cfg.pxPerMW;
    var tallest = SITES.reduce(function (max, site) {
      return Math.max(max, site.it_mw_2030h1);
    }, 0);
    return tallest > 0 ? active.tallestTargetPx / tallest : cfg.pxPerMW;
  }

  function currentPxPerMW() {
    if (scaleAnim.start === 0) return scaleAnim.to || scenePxPerMW(sceneId);
    var t = Math.min(1, (performance.now() - scaleAnim.start) / CONFIG.map.scaleMs);
    return scaleAnim.from + (scaleAnim.to - scaleAnim.from) * easeOut(t);
  }

  function startScaleAnimation() {
    var next = scenePxPerMW(sceneId);
    var now = currentPxPerMW();
    if (scaleAnim.frame) { cancelAnimationFrame(scaleAnim.frame); scaleAnim.frame = null; }
    if (Math.abs(next - now) < 1e-9) {
      scaleAnim.from = scaleAnim.to = next;
      scaleAnim.start = 0;
      renderSizeKey();
      return;
    }
    scaleAnim.from = now;
    scaleAnim.to = next;
    scaleAnim.start = performance.now();
    var ends = scaleAnim.start + CONFIG.map.scaleMs;
    var tick = function () {
      paint();
      renderSizeKey();
      if (performance.now() >= ends) {
        scaleAnim.frame = null;
        scaleAnim.start = 0;
        paint();
        renderSizeKey();
        return;
      }
      scaleAnim.frame = requestAnimationFrame(tick);
    };
    scaleAnim.frame = requestAnimationFrame(tick);
  }

  function barPolygon(site, mw, floorMW) {
    var cfg = CONFIG.map;
    var halfW = (cfg.barWidthPx / 2) * degPerPx.lon;
    var dx = offsetDeg[site.name] || 0;
    var perMW = currentPxPerMW() * degPerPx.lon *
                Math.cos(site.lat * Math.PI / 180);
    var left = site.lon + dx - halfW;
    var right = site.lon + dx + halfW;
    /* floorMW lifts the base, which is how the under-construction outline
       starts where the solid bar stops. */
    var bottom = site.lat + (floorMW || 0) * perMW;
    var top = site.lat + mw * perMW;
    /* Square top: the two upper corners sit at the same latitude. */
    return [[
      [left, bottom],
      [right, bottom],
      [right, top],
      [left, top]
    ]];
  }

  /* ==========================================================================
     Animation

     On every move the displayed MW eases from what is on screen to the new
     value, so a bar that has just come alive grows up from the ground and a
     bar that was already standing slides to its new height.
     ========================================================================== */
  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

  function displayedMW(site) {
    var to = anim.to[site.name] || 0;
    if (anim.start === 0) return to;
    var from = anim.from[site.name] || 0;
    var t = Math.min(1, (performance.now() - anim.start) / CONFIG.map.growMs);
    return from + (to - from) * easeOut(t);
  }

  function startAnimation(stop, instant) {
    var cfg = CONFIG.map;
    anim.from = {};
    anim.to = {};
    SITES.forEach(function (site) {
      var was = shown[site.name] || 0;
      var now = powerAt(site, stop);
      /* A site that has just gone live starts at zero, so its bar rises out
         of the ground rather than appearing at full height. */
      anim.from[site.name] = instant ? now : was;
      anim.to[site.name] = now;
      shown[site.name] = now;
    });

    if (anim.frame) { cancelAnimationFrame(anim.frame); anim.frame = null; }
    if (instant) { anim.start = 0; paint(); return; }

    anim.start = performance.now();
    var ends = anim.start + cfg.growMs;
    var tick = function () {
      paint();
      if (performance.now() >= ends) {
        anim.frame = null;
        anim.start = 0;
        paint();
        return;
      }
      anim.frame = requestAnimationFrame(tick);
    };
    anim.frame = requestAnimationFrame(tick);
  }

  /* ==========================================================================
     Scenes
     ========================================================================== */
  function scene() { return CONFIG.scenes[sceneId]; }
  function isWho() { return sceneId === "who"; }

  /* Two scenes now park the timeline at Today and draw the gap to 2030, so
     those behaviours are read off the scene's own flags rather than off its
     name. */
  function locksTimeline() { var cfg = scene(); return !!(cfg && cfg.lockToToday); }
  /* The faint outline is the gap between what is running now and what is
     funded for 2030, so it only says anything while the timeline is actually
     at now; at 2023 there is no "now" for it to be the gap from. The price
     view draws one solid bar per site instead and so switches it off too. */
  function showsPlanned() {
    var cfg = scene();
    if (!cfg || !cfg.showPlanned || flatBars()) return false;
    return !!(STOPS.length && STOPS[stopIndex] && STOPS[stopIndex].isToday);
  }

  /* ---------- beats: the views inside a scene ---------- */
  function beats() { var cfg = scene(); return (cfg && cfg.beats) || []; }

  function firstReadyBeat() {
    var cfg = scene();
    /* A scene whose views are hidden opens on its overview screen instead,
       so no view is entered and nothing a view draws is reached. */
    if (cfg && cfg.beatsHidden) return null;
    var list = beats();
    for (var i = 0; i < list.length; i++) {
      if (list[i].ready) return list[i].id;
    }
    return null;
  }

  function isPriceView() {
    return sceneId === "why" && beatId === "price" && !!PRICES;
  }

  /* The overview screen a scene opens on while its views are hidden: there is
     no view to be in, so the scene says one line with the map dimmed behind
     it. */
  function introCfg() {
    var cfg = scene();
    return (cfg && cfg.beatsHidden && cfg.intro && !beatId) ? cfg.intro : null;
  }

  /* One solid bar per site at its 2030 figure, rather than the timeline's own
     value with the gap to 2030 outlined. The price view asks one question of
     every site, and the overview screen is only using the bars as a backdrop;
     neither has anything to say about where the timeline is. */
  function flatBars() { return isPriceView() || !!introCfg(); }

  /* ---------- the Where view ----------
     How far each site sits from the nearest metro of a million people or
     more, revealed one start-year group at a time. */

  function whereCfg() { return CONFIG.scenes.why.where; }

  function isWhereView() { return viewId === "where" && !!METROS; }
  function ownCfg() { return CONFIG.scenes.why.ownpower; }
  function isOwnView() { return viewId === "ownpower"; }
  /* The two views that play. Everything the control bar does reads the open
     view's own step count from here. */
  function playsBack() { return isWhereView() || isOwnView(); }
  function playCfg() { return isOwnView() ? ownCfg() : whereCfg(); }

  /* The groups are the data's own, in the data's order; the config says only
     what colour each one wears. */
  function whereGroups() {
    if (!METROS) return [];
    var colors = whereCfg().groups;
    return METROS.groups.map(function (group, i) {
      return {
        id: group.id,
        label: group.label,
        median: group.median_mi,
        count: group.count,
        color: (colors[i] || colors[colors.length - 1]).color
      };
    });
  }

  function whereRow(site) {
    return (METROS && METROS.sites[site.name]) || null;
  }

  function siteGroupIndex(site) {
    var row = whereRow(site);
    if (!row) return -1;
    for (var i = 0; i < METROS.groups.length; i++) {
      if (METROS.groups[i].id === row.group) return i;
    }
    return -1;
  }

  /* ---------- the playback ----------
     Six steps: the metros, then one start-year group each, then the land
     comparison, then the one site that did not wait for the grid. Back, Play
     and Next walk them, and so do the arrow keys and the space bar. */

  function whereSteps() { return playCfg().steps; }

  function drawProgress() {
    if (!whereAnim.start) return 1;
    var t = (performance.now() - whereAnim.start) / whereCfg().drawMs;
    return Math.max(0, Math.min(1, t));
  }

  /* Epoch's own clock for a site: the first dated observation to the first
     operational date, in months. */
  function monthsFor(site) {
    if (!site || !site.start_date || !site.first_operational) return 0;
    var from = Date.parse(site.start_date);
    var to = Date.parse(site.first_operational);
    if (!(to > from)) return 0;
    return (to - from) / 86400000 / 30.44;
  }

  function siteByName(name) {
    for (var i = 0; i < SITES.length; i++) {
      if (SITES[i].name === name) return SITES[i];
    }
    return null;
  }

  /* 0 while a group is still waiting its turn, 1 once its lines have drawn
     all the way to their metro. A group replayed on its own is the only one
     drawn while that lasts. */
  function groupProgress(index) {
    if (!isWhereView() || index < 0) return 0;
    if (whereAnim.solo !== null) {
      return index === whereAnim.solo ? drawProgress() : 0;
    }
    var at = whereAnim.step - 2;
    if (index > at) return 0;
    if (index < at) return 1;
    return drawProgress();
  }

  /* Which group the number and the label beside it speak for. */
  function currentGroupIndex() {
    var groups = whereGroups();
    if (whereAnim.solo !== null) return whereAnim.solo;
    return Math.max(0, Math.min(groups.length - 1, whereAnim.step - 2));
  }

  function showsNumber() {
    if (!isWhereView()) return false;
    if (whereAnim.solo !== null) return true;
    /* The closing steps are about two named sites, not about a median, so
       the big number and its group label step aside for them. */
    if (whereAnim.step >= whereCfg().focusFrom) return false;
    return whereAnim.step >= 2;
  }

  /* Which sites the last steps are about: one at step 6, two at step 7. */
  function focusNames() {
    if (!isWhereView() || whereAnim.solo !== null) return [];
    var cfg = whereCfg();
    if (whereAnim.step >= cfg.steps) {
      return cfg.compare.rows.map(function (row) { return row.site; });
    }
    if (whereAnim.step >= cfg.focusFrom) return [cfg.focusSite];
    return [];
  }

  function isFocusSite(site) {
    return focusNames().indexOf(site.name) !== -1;
  }

  /* True once the view has stopped showing every group and is making a point
     about one or two of them. */
  function focusing() {
    return isWhereView() && whereAnim.solo === null &&
      whereAnim.step >= whereCfg().focusFrom;
  }

  /* Once the sequence has played out a site stops being something being
     shown and becomes something to click. */
  function whereDone() {
    return isWhereView() && whereAnim.step >= whereSteps();
  }

  function whereNumber() {
    if (whereNum.start === 0) return whereNum.to;
    var t = Math.min(1,
      (performance.now() - whereNum.start) / whereCfg().countMs);
    return whereNum.from + (whereNum.to - whereNum.from) * easeOut(t);
  }

  function whereSettled() {
    var cfg = whereCfg();
    return performance.now() >=
      whereAnim.start + Math.max(cfg.drawMs, cfg.countMs);
  }

  function whereFrame() {
    renderHeadline(STOPS[stopIndex]);
    paint();
    if (whereSettled()) {
      whereAnim.frame = null;
      whereNum.start = 0;
      renderHeadline(STOPS[stopIndex]);
      paint();
      return;
    }
    whereAnim.frame = requestAnimationFrame(whereFrame);
  }

  function startWhereFrame() {
    if (!whereAnim.frame) whereAnim.frame = requestAnimationFrame(whereFrame);
  }

  /* What goes under the number, and which it is belongs to the step. */
  function syncWhereNote() {
    var node = el("where-note");
    var html = "";
    var clickable = false;

    if (isWhereView() && whereAnim.solo === null) {
      var cfg = whereCfg();
      if (whereAnim.step >= cfg.steps) {
        /* Two sites on the same grid, with the point under them. */
        html = cfg.compare.rows.map(function (row) {
          return '<span class="note-row">' + escapeHtml(row.label) + "</span>";
        }).join("") +
          '<span class="note-line">' + escapeHtml(cfg.compare.line) + "</span>";
      } else if (whereAnim.step === cfg.steps - 1) {
        html = escapeHtml(cfg.focusNote);
      } else if (whereAnim.step === cfg.steps - 2) {
        html = escapeHtml(cfg.landNote);
      }
    } else if (isOwnView() && whereAnim.step >= ownCfg().steps) {
      /* The closing line has a card behind it, so it says so. */
      html = escapeHtml(ownCfg().closing.line);
      clickable = true;
    }

    node.innerHTML = html;
    node.classList.toggle("is-shown", !!html);
    node.classList.toggle("is-clickable", clickable);
  }

  function gotoWhereStep(step, manual) {
    if (!playsBack()) return;
    var wanted = Math.max(1, Math.min(whereSteps(), step));
    if (manual) pauseWhere();
    whereAnim.solo = null;
    whereAnim.step = wanted;
    whereAnim.start = performance.now();

    if (isWhereView()) {
      var groups = whereGroups();
      var index = wanted - 2;
      if (index < 0) {
        whereNum.from = whereNum.to = 0;
        whereNum.start = 0;
      } else {
        /* Past the last group the number stays on the last median, so the
           closing steps do not blank the figure the groups arrived at. */
        var target = groups[Math.min(index, groups.length - 1)].median;
        whereNum.from = whereNumber();
        whereNum.to = target;
        whereNum.start = whereAnim.start;
      }
    } else if (isOwnView()) {
      syncOwnBars();
    }

    syncWhereNote();
    renderWhereControls();
    startWhereFrame();
    draw();
    syncColumnLayout();
    paint();
  }

  /* A group's own row in the legend replays that group, and only it. */
  function soloWhereGroup(index) {
    if (!isWhereView()) return;
    var groups = whereGroups();
    if (index < 0 || index >= groups.length) return;
    pauseWhere();
    whereAnim.solo = index;
    whereAnim.start = performance.now();
    whereNum.from = 0;
    whereNum.to = groups[index].median;
    whereNum.start = whereAnim.start;
    syncWhereNote();
    renderWhereControls();
    startWhereFrame();
    draw();
    syncColumnLayout();
    paint();
  }

  function clearWhereTimer() {
    if (whereAnim.timer) { clearTimeout(whereAnim.timer); whereAnim.timer = null; }
  }

  function scheduleWhereStep() {
    clearWhereTimer();
    if (!whereAnim.playing) return;
    if (whereAnim.step >= whereSteps()) {
      whereAnim.playing = false;
      renderWhereControls();
      return;
    }
    whereAnim.timer = setTimeout(function () {
      gotoWhereStep(whereAnim.step + 1, false);
      scheduleWhereStep();
    }, whereCfg().stepMs);
  }

  function playWhere() {
    if (!playsBack()) return;
    /* Play at the end starts it over rather than doing nothing. */
    if (whereAnim.step >= whereSteps() || whereAnim.solo !== null) {
      gotoWhereStep(1, true);
    }
    whereAnim.playing = true;
    renderWhereControls();
    scheduleWhereStep();
  }

  function pauseWhere() {
    if (!whereAnim.playing) { clearWhereTimer(); return; }
    whereAnim.playing = false;
    clearWhereTimer();
    renderWhereControls();
  }

  function toggleWherePlay() {
    if (whereAnim.playing) pauseWhere(); else playWhere();
  }

  function renderWhereControls() {
    var bar = el("where-controls");
    var on = playsBack();
    bar.classList.toggle("is-shown", on);
    if (!on) return;
    var labels = whereCfg().controls;   /* one wording for both views */
    el("where-play").textContent = whereAnim.playing ? labels.pause : labels.play;
    el("where-play").setAttribute("aria-pressed",
      whereAnim.playing ? "true" : "false");
    el("where-back").setAttribute("aria-disabled",
      whereAnim.step <= 1 ? "true" : "false");
    el("where-next").setAttribute("aria-disabled",
      whereAnim.step >= whereSteps() ? "true" : "false");
    el("where-step").textContent = labels.step
      .replace("{at}", String(Math.max(1, whereAnim.step)))
      .replace("{of}", String(whereSteps()));
  }

  function stopWhere() {
    clearWhereTimer();
    if (whereAnim.frame) { cancelAnimationFrame(whereAnim.frame); whereAnim.frame = null; }
    whereAnim.step = 0;
    whereAnim.playing = false;
    whereAnim.solo = null;
    whereNum.from = whereNum.to = 0;
    whereNum.start = 0;
    el("where-note").classList.remove("is-shown");
    el("where-note").textContent = "";
  }

  function setView(id) {
    if (!introCfg()) return;
    if (id === "where" && !METROS) return;
    stopWhere();
    hideNoteCard();
    /* A card belongs to the view it was opened in. */
    pinnedSite = null;
    hoverSite = null;
    hideCard();
    viewId = id;
    syncSceneClass();
    renderEntryBar();
    renderIntroPanel(false);
    /* Both views open playing, from their first step. */
    renderOwnBars();
    if (playsBack()) { gotoWhereStep(1, true); playWhere(); }
    renderWhereControls();
    draw();
    syncColumnLayout();
    /* The map has a narrower box now, so it is refit into it. */
    resizeMapArea();
    paint();
  }

  /* The way back out of a view, from the headline, from the entry button
     that opened it, or from the scene button above them. */
  function clearView() {
    if (!viewId) return;
    stopWhere();
    hideNoteCard();
    pinnedSite = null;
    hoverSite = null;
    hideCard();
    viewId = null;
    syncSceneClass();
    renderEntryBar();
    renderWhereControls();
    renderOwnBars();
    /* Back on the headline view, so the numbers count again. */
    renderIntroPanel(true);
    draw();
    syncColumnLayout();
    resizeMapArea();
    paint();
  }

  /* ---------- the headline view's lines ----------
     Shown while the scene's overview screen is up and nothing inside it is
     open. The bars grow at one speed, so each one's duration is its own
     length: four months arrives in a fifth of the time four years takes. */

  /* Where the column's first line starts, and the gap between the pieces
     under it. Measured rather than fixed, because a label that wraps in a
     narrow column changes where the next piece begins. */
  var COLUMN_TOP = 148;
  var COLUMN_GAP = 20;

  function syncColumnLayout() {
    var headline = el("headline");
    var note = el("where-note");
    var bars = el("own-bars");
    if (!playsBack()) {
      headline.style.top = "";
      note.style.top = "";
      bars.style.top = "";
      return;
    }

    var at = COLUMN_TOP;
    var place = function (node, shown) {
      if (!shown) return;
      node.style.top = Math.round(at) + "px";
      at += node.getBoundingClientRect().height + COLUMN_GAP;
    };

    if (isOwnView()) {
      bars.style.top = "";
      place(bars, true);
    } else {
      bars.style.top = "";
      place(headline, showsNumber());
    }
    place(note, note.classList.contains("is-shown"));
  }

  function introPanelOn() { return !!introCfg() && !viewId; }

  function renderIntroPanel(count) {
    var intro = introCfg();
    var on = introPanelOn();
    var driver = el("why-driver");
    var figures = el("why-figures");

    driver.classList.toggle("is-shown", on && !!(intro && intro.driver));
    figures.classList.toggle("is-shown", on && !!(intro && intro.figures));
    if (!on || !intro) {
      stopFigures();
      driver.textContent = "";
      figures.innerHTML = "";
      return;
    }

    driver.textContent = intro.driver || "";
    if (!intro.figures) { figures.innerHTML = ""; return; }

    figures.innerHTML = intro.figures.map(function (figure) {
      /* A figure with a card behind it is a button; the other is type, and
         saying so in the markup is what keeps the difference honest. */
      var tag = figure.note ? "button" : "div";
      return "<" + tag + ' class="why-figure" data-figure="' +
          escapeHtml(figure.id) + '"' +
          (figure.note
            ? ' type="button" aria-expanded="false" aria-label="' +
              escapeHtml(figure.caption + ". " + figure.note.label) + '"'
            : "") + ">" +
        '<span class="why-number">0' +
          '<span class="why-unit">' + escapeHtml(figure.unit) + "</span>" +
        "</span>" +
        '<span class="why-caption">' + escapeHtml(figure.caption) + "</span>" +
      "</" + tag + ">";
    }).join("");

    startFigures(count !== false);
  }

  /* Both numbers count from zero on the same clock, so they arrive together
     rather than racing. */
  function startFigures(animate) {
    stopFigures();
    if (!animate) { paintFigures(1); return; }
    var ms = (introCfg() || {}).countMs || 600;
    figureAnim.start = performance.now();
    var ends = figureAnim.start + ms;
    var tick = function () {
      var now = performance.now();
      paintFigures(easeOut(Math.min(1, (now - figureAnim.start) / ms)));
      if (now >= ends) {
        figureAnim.frame = null;
        figureAnim.start = 0;
        paintFigures(1);
        return;
      }
      figureAnim.frame = requestAnimationFrame(tick);
    };
    figureAnim.frame = requestAnimationFrame(tick);
  }

  function stopFigures() {
    if (figureAnim.frame) {
      cancelAnimationFrame(figureAnim.frame);
      figureAnim.frame = null;
    }
    figureAnim.start = 0;
  }

  function paintFigures(eased) {
    var intro = introCfg();
    if (!intro || !intro.figures) return;
    var nodes = el("why-figures").querySelectorAll(".why-number");
    intro.figures.forEach(function (figure, i) {
      var node = nodes[i];
      if (!node) return;
      node.firstChild.nodeValue = String(Math.round(figure.value * eased));
    });
  }

  /* ---------- the card behind a figure ----------
     The site card's own style, two lines, and any click outside it closes
     it: the same way the pinned site card lets go. */
  function figureNote(id) {
    var intro = introCfg();
    var found = null;
    ((intro && intro.figures) || []).forEach(function (figure) {
      if (figure.id === id && figure.note) found = figure.note;
    });
    return found;
  }

  function showNoteCard(button, note) {
    var card = el("note-card");
    card.innerHTML = '<div class="card-rows">' + note.rows.map(function (row) {
      return '<span class="card-key">' + escapeHtml(row.label) + "</span>" +
        '<span class="card-val">' + escapeHtml(row.text) + "</span>";
    }).join("") + "</div>";
    card.style.display = "block";

    var stage = el("stage").getBoundingClientRect();
    var anchor = button.getBoundingClientRect();
    var width = card.offsetWidth;
    var left = anchor.left - stage.left + anchor.width / 2 - width / 2;
    card.style.left =
      Math.max(8, Math.min(left, stage.width - width - 8)) + "px";
    card.style.top = (anchor.bottom - stage.top + 12) + "px";
    button.setAttribute("aria-expanded", "true");
    noteOpen = button.dataset.figure;
  }

  function hideNoteCard() {
    if (!noteOpen) return;
    noteOpen = null;
    el("note-card").style.display = "none";
    el("note-card").innerHTML = "";
    var open = el("why-figures").querySelector('[aria-expanded="true"]');
    if (open) open.setAttribute("aria-expanded", "false");
  }

  function whereLinkLayers() {
    if (!isWhereView()) return [];
    var cfg = whereCfg();
    var groups = whereGroups();
    var lines = [];
    SITES.forEach(function (site) {
      var index = siteGroupIndex(site);
      var progress = groupProgress(index);
      if (progress <= 0) return;
      var metro = METRO_BY_CODE[whereRow(site).metro];
      if (!metro) return;
      /* The line grows from the site towards its metro, so a group arrives
         as a movement rather than as a finished diagram. */
      var focused = focusing();
      var color = isFocusSite(site)
        ? hexToRgb(cfg.focusColor).concat(cfg.lineAlpha)
        : hexToRgb(groups[index].color)
            .concat(focused ? cfg.fadeLineAlpha : cfg.lineAlpha);
      lines.push({
        from: [site.lon, site.lat],
        to: [site.lon + (metro.lon - site.lon) * progress,
             site.lat + (metro.lat - site.lat) * progress],
        color: color
      });
    });
    return [new deck.LineLayer({
      id: "metro-links",
      data: lines,
      pickable: false,
      widthUnits: "pixels",
      getWidth: cfg.lineWidthPx,
      getSourcePosition: function (d) { return d.from; },
      getTargetPosition: function (d) { return d.to; },
      getColor: function (d) { return d.color; }
    })];
  }

  /* ---------- make your own power ----------
     Three examples, one per step, then the line they add up to. Two of them
     are Epoch sites with a duration; the third is a county with a marker and
     no duration, because it has not finished. */

  function ownExamples() { return ownCfg().examples; }

  function ownRevealed(index) { return isOwnView() && whereAnim.step >= index + 1; }

  function ownMonths(example) {
    return example.site ? monthsFor(siteByName(example.site)) : 0;
  }

  function ownExampleForSite(site) {
    var found = null;
    ownExamples().forEach(function (example, i) {
      if (example.site === site.name && ownRevealed(i)) found = example;
    });
    return found;
  }

  function ownExampleName(example) {
    return example.name || (example.marker ? example.marker.name : example.site);
  }

  /* Built once, when the view opens: every bar starts at nothing and is let
     out on the step its example arrives. */
  function renderOwnBars() {
    var bars = el("own-bars");
    var on = isOwnView();
    bars.classList.toggle("is-shown", on);
    if (!on) { bars.innerHTML = ""; bars.style.width = ""; return; }

    var own = ownCfg();
    var longest = 0;
    ownExamples().forEach(function (example) {
      longest = Math.max(longest, ownMonths(example));
    });
    /* One speed for every bar, so four months arrives while sixteen is still
       going. The scale is the configured one unless the column is narrower
       than that, in which case the longest bar sets it. */
    var msPerMonth = longest ? own.barMs / longest : 0;
    var room = bars.clientWidth || 0;
    var pxPerMonth = (room && longest && longest * own.pxPerMonth > room)
      ? (room - 2) / longest
