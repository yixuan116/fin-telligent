      : own.pxPerMonth;
    bars.innerHTML = ownExamples().map(function (example) {
      var months = ownMonths(example);
      var fill = months
        ? '<span class="own-fill" style="background:' + example.color +
          "; transition-duration:" + Math.round(months * msPerMonth) +
          'ms" data-px="' + Math.round(months * pxPerMonth) + '"></span>'
        : "";
      return '<div class="own-row is-waiting" data-example="' +
        escapeHtml(example.id) + '">' +
        '<span class="own-label">' + escapeHtml(example.label) + "</span>" +
        fill +
      "</div>";
    }).join("");
    syncOwnBars();
  }

  function syncOwnBars() {
    var rows = el("own-bars").querySelectorAll(".own-row");
    ownExamples().forEach(function (example, i) {
      var row = rows[i];
      if (!row) return;
      var out = ownRevealed(i);
      row.classList.toggle("is-waiting", !out);
      var fill = row.querySelector(".own-fill");
      if (fill) fill.style.width = out ? fill.dataset.px + "px" : "0px";
    });
  }

  /* One row per example, with what it took, lit as its step arrives. */
  function renderOwnLegend() {
    var own = ownCfg();
    el("legend").classList.remove("is-two-col");
    el("legend-head").textContent = own.legendHead;
    el("legend-rows").innerHTML = ownExamples().map(function (example, i) {
      var name = ownExampleName(example);
      return '<div class="legend-row' + (ownRevealed(i) ? "" : " is-zero") +
        '" data-example="' + escapeHtml(example.id) + '">' +
        '<span class="legend-swatch" style="background:' + example.color +
          '"></span>' +
        '<span class="legend-name" title="' + escapeHtml(name) + '">' +
          escapeHtml(name) + "</span>" +
        '<span class="legend-mw">' + escapeHtml(example.legend) + "</span>" +
      "</div>";
    }).join("");
  }

  /* The county marker, drawn at the county's own internal point. */
  function ownMarkerLayers() {
    if (!isOwnView()) return [];
    var own = ownCfg();
    var points = [];
    ownExamples().forEach(function (example, i) {
      if (example.marker && ownRevealed(i)) points.push(example);
    });
    if (!points.length) return [];
    return [new deck.ScatterplotLayer({
      id: "own-markers",
      data: points,
      pickable: true,
      stroked: true,
      filled: true,
      radiusUnits: "pixels",
      lineWidthUnits: "pixels",
      getRadius: own.markerRadiusPx,
      getLineWidth: own.markerLineWidthPx,
      getPosition: function (example) {
        return [example.marker.lon, example.marker.lat];
      },
      getFillColor: function (example) {
        return hexToRgb(example.color).concat(215);
      },
      getLineColor: [242, 245, 248, 235],
      onClick: onMarkerClick
    })];
  }

  /* ---------- citations ----------
     A raised number after the claim, and the list it points at along the
     bottom of the same card. */
  function citeHtml(sources) {
    return sources.map(function (source, i) {
      return '<span class="card-cite">' + (i + 1) + "</span>";
    }).join("");
  }

  function sourcesHtml(sources) {
    return '<div class="card-sources">' + sources.map(function (source, i) {
      return '<span class="card-source">' +
        '<span class="card-source-n">' + (i + 1) + "</span>" +
        escapeHtml(source) + "</span>";
    }).join("") + "</div>";
  }

  function claimHtml(note) {
    return '<div class="card-ground">' + escapeHtml(note.text) +
      citeHtml(note.sources) + "</div>";
  }

  function showOwnSiteCard(site, example, keepPosition) {
    var text = ownCfg().card;
    var card = el("site-card");
    card.innerHTML =
      '<div class="card-name">' + escapeHtml(site.name) + "</div>" +
      claimHtml(example.note) +
      '<div class="card-rows">' +
        '<span class="card-key">' + escapeHtml(text.start) + "</span>" +
          '<span class="card-val">' +
            escapeHtml(site.start_date || "\u2014") + "</span>" +
        '<span class="card-key">' + escapeHtml(text.live) + "</span>" +
          '<span class="card-val">' +
            escapeHtml(site.first_operational || "\u2014") + "</span>" +
      "</div>" +
      sourcesHtml(example.note.sources);
    card.style.display = "block";
    if (!keepPosition) positionCard(lastPointer.x, lastPointer.y);
  }

  function showMarkerCard(example) {
    var card = el("site-card");
    card.innerHTML =
      '<div class="card-name">' + escapeHtml(example.marker.name) + "</div>" +
      claimHtml(example.note) +
      sourcesHtml(example.note.sources);
    card.style.display = "block";
    positionCard(lastPointer.x, lastPointer.y);
  }

  function onMarkerClick(info) {
    if (!info || !info.object) return false;
    pauseWhere();
    hideNoteCard();
    pinnedSite = null;
    var off = stageOffset();
    lastPointer = { x: info.x + off.left, y: info.y + off.top };
    showMarkerCard(info.object);
    el("site-card").classList.add("is-pinned");
    return true;
  }

  /* The card behind the closing line, anchored under it. */
  function showClosingCard() {
    var note = ownCfg().closing.note;
    var card = el("note-card");
    card.innerHTML = claimHtml(note) + sourcesHtml(note.sources);
    card.style.display = "block";

    var stage = el("stage").getBoundingClientRect();
    var anchor = el("where-note").getBoundingClientRect();
    var width = card.offsetWidth;
    var left = anchor.left - stage.left + anchor.width / 2 - width / 2;
    card.style.left =
      Math.max(8, Math.min(left, stage.width - width - 8)) + "px";
    card.style.top = (anchor.bottom - stage.top + 12) + "px";
    noteOpen = "closing";
  }

  function whereDotLayers() {
    if (!isWhereView()) return [];
    var cfg = whereCfg();
    return [new deck.ScatterplotLayer({
      id: "metro-dots",
      data: METROS.metros,
      pickable: false,
      stroked: false,
      radiusUnits: "pixels",
      getRadius: cfg.dotRadiusPx,
      getPosition: function (metro) { return [metro.lon, metro.lat]; },
      getFillColor: cfg.dotColor
    })];
  }

  function renderBeatBar() {
    var bar = el("beat-bar");
    var cfg = scene();
    /* `beats` is left intact on a scene that hides its views, so the list and
       everything it drives stay available to be reused. */
    var list = (cfg && cfg.beatsHidden) ? [] : beats();
    bar.classList.toggle("is-shown", list.length > 0);
    bar.innerHTML = list.map(function (beat) {
      var classes = "beat-btn" + (beat.ready ? " is-ready" : "") +
                    (beat.id === beatId ? " is-active" : "");
      return '<button type="button" class="' + classes + '" data-beat="' +
        escapeHtml(beat.id) + '"' +
        (beat.ready ? "" : ' aria-disabled="true" disabled') +
        ' aria-selected="' + (beat.id === beatId ? "true" : "false") + '">' +
        escapeHtml(beat.label) + "</button>";
    }).join("");
    renderEntryBar();
  }

  /* The overview screen's entries. Styled as the view switches are, and
     inert in the same way the views that are not built yet are, so neither
     one promises something that is not there. */
  function renderEntryBar() {
    var bar = el("entry-bar");
    var intro = introCfg();
    var list = (intro && intro.entries) || [];
    bar.classList.toggle("is-shown", list.length > 0);
    bar.innerHTML = list.map(function (entry) {
      /* An entry is only live once the data it reads has arrived. */
      var ready = !!entry.ready && (entry.id !== "where" || !!METROS);
      /* Large and centred while the headline view is up; the sub-tab pill's
         own segments, under the scene buttons, once a view is open. */
      var classes = (viewId ? "beat-btn" : "scene-btn") +
                    (ready ? " is-ready" : "") +
                    (entry.id === viewId ? " is-active" : "");
      return '<button type="button" class="' + classes + '" data-entry="' +
        escapeHtml(entry.id) + '"' +
        (ready ? "" : ' aria-disabled="true" disabled') +
        ' aria-pressed="' + (entry.id === viewId ? "true" : "false") + '">' +
        escapeHtml(entry.label) + "</button>";
    }).join("");
  }

  function setBeat(id) {
    var found = null;
    beats().forEach(function (beat) { if (beat.id === id) found = beat; });
    if (!found || !found.ready || id === beatId) return;
    beatId = id;
    hoverState = null;
    hideCard();
    renderBeatBar();
    syncBasemapLayers();
    draw();
    paint();
  }

  /* The stage carries the scene's name, so a scene that wants its panels
     somewhere else can say so in CSS rather than in layout code. */
  function syncSceneClass() {
    var stage = el("stage");
    stage.dataset.scene = sceneId;
    /* The headline view is the one with no view open inside it; it is named
       rather than left blank so CSS can select it. */
    stage.dataset.view = viewId || "headline";
  }

  /* Every scene that is shown has a button, and the one you are in is the
     one lit. A scene can stand down without leaving the file. */
  function buttonScenes() {
    return CONFIG.sceneOrder.filter(function (id) {
      var cfg = CONFIG.scenes[id];
      return !!cfg && cfg.shown !== false;
    });
  }

  function renderSceneBar() {
    el("scene-bar").innerHTML = buttonScenes().map(function (id) {
      var cfg = CONFIG.scenes[id];
      var classes = "scene-btn" + (cfg.ready ? " is-ready" : "") +
                    (id === sceneId ? " is-active" : "");
      return '<button type="button" class="' + classes + '" data-scene="' + id + '"' +
        (cfg.ready ? '' : ' aria-disabled="true" disabled') +
        ' aria-selected="' + (id === sceneId ? "true" : "false") + '">' +
        escapeHtml(cfg.button) + "</button>";
    }).join("");
  }

  function setScene(id) {
    var cfg = CONFIG.scenes[id];
    if (!cfg || !cfg.ready || id === sceneId) return;

    /* Captured before sceneId moves, because what counts is whether the
       scene being left was the one running the timeline. */
    if (!locksTimeline()) freeStopIndex = stopIndex;

    sceneId = id;
    /* Whatever view was open belonged to the scene being left. */
    stopWhere();
    hideNoteCard();
    viewId = null;
    syncSceneClass();
    renderWhereControls();
    renderOwnBars();
    highlightOwner = null;
    pinnedSite = null;
    hoverSite = null;
    hoverState = null;
    beatId = firstReadyBeat();
    hideCard();
    renderSceneBar();
    renderBeatBar();
    syncBasemapLayers();

    if (locksTimeline()) {
      /* The scene is a snapshot of today against 2030, so the timeline is
         parked at Today and held there. */
      goTo(TODAY_INDEX, { force: true, silent: true });
    } else {
      /* Back to the timeline exactly where it was left. */
      goTo(freeStopIndex, { force: true, silent: true });
    }
    syncTimelineLock();
    startScaleAnimation();
    renderIntroPanel(true);
    draw();
    paint();
  }

  /* Up and Down walk the order. A scene that is not ready yet stops the walk
     rather than being skipped, so the reader never lands somewhere blank. */
  function stepScene(delta) {
    var order = buttonScenes();
    var next = order[order.indexOf(sceneId) + delta];
    if (next && CONFIG.scenes[next] && CONFIG.scenes[next].ready) setScene(next);
  }

  function syncTimelineLock() {
    var slider = el("slider");
    var locked = locksTimeline();
    slider.disabled = locked;
    el("timeline").classList.toggle("is-locked", locked);
    el("track-hint").textContent = locked
      ? (scene().lockHint || CONFIG.labels.dragHint)
      : CONFIG.labels.dragHint;
  }

  /* ==========================================================================
     Layers
     ========================================================================== */
  function focusName() {
    var focus = pinnedSite || hoverSite;
    return focus ? focus.name : null;
  }

  /* How much a site is faded right now, as a multiplier, so the solid bar and
     its under-construction block dim together. */
  function dimFactor(site) {
    var cfg = CONFIG.map;
    var focus = focusName();
    if (focus) return site.name === focus ? 1 : cfg.hoverFadeAlpha / cfg.fillAlpha;
    if (highlightOwner) {
      return site.owner === highlightOwner ? 1 : cfg.ownerFadeAlpha / cfg.fillAlpha;
    }
    return 1;
  }

  /* One colour story per view. In the price view every bar is the same soft
     neutral, because the state underneath is what is being read; everywhere
     else a bar is its owner's colour. */
  function barFill(site) {
    var intro = introCfg();
    if (intro) {
      /* In the Where view a site lights up in its group's colour on the beat
         that group arrives, and waits at the backdrop weight until then. */
      if (isOwnView()) {
        var own = ownCfg();
        var example = ownExampleForSite(site);
        /* The examples carry the view, so every other site steps right back
           rather than competing with them. */
        if (example) {
          return hexToRgb(example.color)
            .concat(Math.round(255 * own.litAlpha * dimFactor(site)));
        }
        return hexToRgb(ownerColor(site.owner))
          .concat(Math.round(255 * own.dimAlpha * dimFactor(site)));
      }
      if (isWhereView()) {
        var where = whereCfg();
        /* The last step is about one site, so that one goes white and every
           other lit site steps back to the backdrop weight. */
        if (isFocusSite(site)) {
          return hexToRgb(where.focusColor)
            .concat(Math.round(255 * where.litAlpha * dimFactor(site)));
        }
        var index = siteGroupIndex(site);
        if (groupProgress(index) > 0) {
          var lit = focusing() ? intro.barAlpha : where.litAlpha;
          return hexToRgb(whereGroups()[index].color)
            .concat(Math.round(255 * lit * dimFactor(site)));
        }
      }
      /* On the headline view the whole canvas is faded to a backdrop, so a
         bar is drawn at its normal weight and the canvas does the fading;
         dimming it here as well would take it to nothing. */
      if (!viewId) {
        return hexToRgb(ownerColor(site.owner)).concat(fillAlphaFor(site));
      }
      /* Inside a view, a site that has not been reached yet waits at the
         backdrop weight on a canvas that is no longer faded. */
      return hexToRgb(ownerColor(site.owner))
        .concat(Math.round(255 * intro.barAlpha * dimFactor(site)));
    }
    if (isPriceView()) {
      var price = priceCfg();
      return hexToRgb(price.barColor)
        .concat(Math.round(255 * price.barAlpha * dimFactor(site)));
    }
    return hexToRgb(ownerColor(site.owner)).concat(fillAlphaFor(site));
  }

  function fillAlphaFor(site) {
    var cfg = CONFIG.map;
    var base = Math.round(255 * cfg.fillAlpha);

    /* Isolating an owner from the legend and hovering a single bar are two
       ways of saying "this one"; hovering wins while it is active. */
    var focus = focusName();
    if (focus) {
      return site.name === focus ? base : Math.round(255 * cfg.hoverFadeAlpha);
    }
    if (highlightOwner) {
      return site.owner === highlightOwner
        ? base
        : Math.round(255 * cfg.ownerFadeAlpha);
    }
    return base;
  }

  /* The price view's state fill. A deck layer rather than a basemap one, so
     the states can be hovered; drawn first, which puts it under the bars. */
  function stateFillLayers() {
    if (!isPriceView()) return [];
    var cfg = priceCfg();
    var alpha = Math.round(255 * cfg.fillAlpha);
    return [new deck.GeoJsonLayer({
      id: "state-prices",
      data: { type: "FeatureCollection", features: STATES },
      pickable: true,
      filled: true,
      stroked: true,
      lineWidthUnits: "pixels",
      lineJointRounded: true,
      getFillColor: function (feature) {
        var rgb = priceColor(priceRatio(feature.properties.code));
        return rgb ? rgb.concat(alpha) : [0, 0, 0, 0];
      },
      getLineColor: cfg.stateLineColor,
      getLineWidth: cfg.stateLineWidth,
      onHover: onStateHover
    })];
  }

  function stateLabelLayers(stop) {
    var cfg = CONFIG.map;
    var priceView = isPriceView();
    var price = priceCfg();
    var liveStates = {};
    liveAt(stop).forEach(function (site) {
      if (site.state) liveStates[site.state] = true;
    });

    /* A state whose label would only collide in the northeast is parked just
       off its own coast, and is shown only once it has something to say. */
    /* An offshore code is parked out at sea on a leader line, so it is only
       worth the clutter once it has something to say. Showing all nine in the
       price view was tried and reverted: the parked positions are spaced for
       a two-letter code, and a price under each one makes the northeast
       unreadable. The shading still answers for them, and the hover card
       gives the number. */
    var labels = STATES.filter(function (f) {
      return f.properties.code &&
        (!f.properties.offshore || liveStates[f.properties.code]);
    });
    var leaders = labels.filter(function (f) { return f.properties.offshore; });

    var layers = [];
    if (leaders.length) {
      layers.push(new deck.LineLayer({
        id: "state-leaders",
        data: leaders,
        widthUnits: "pixels",
        getWidth: 0.8,
        getSourcePosition: function (f) { return f.properties.anchor; },
        getTargetPosition: function (f) { return f.properties.label; },
        getColor: cfg.leaderColor
      }));
    }

    layers.push(new deck.TextLayer({
      id: "state-labels",
      data: labels,
      pickable: false,
      characterSet: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
      fontFamily: '"Helvetica Neue", Helvetica, Arial, sans-serif',
      fontWeight: 600,
      getPosition: function (f) { return f.properties.label; },
      getText: function (f) { return f.properties.code; },
      getSize: cfg.stateLabelSize,
      sizeUnits: "pixels",
      getColor: function (f) {
        return liveStates[f.properties.code] ? cfg.stateLabelLive : cfg.stateLabelDim;
      },
      getTextAnchor: "middle",
      getAlignmentBaseline: "center",
      /* A signed-distance font lets the glyphs carry a dark outline, which is
         what keeps OH, VA, AZ, MS and AL legible against a bar behind them. */
      fontSettings: { sdf: true, radius: 12 },
      outlineWidth: priceView ? price.labelOutlineWidth : cfg.stateLabelOutlineWidth,
      outlineColor: priceView ? price.labelOutlineColor : cfg.stateLabelOutlineColor,
      updateTriggers: {
        getColor: stop.key,
        /* The halo differs between views, and deck would otherwise keep the
           one it compiled the glyphs with. */
        outlineWidth: priceView,
        outlineColor: priceView
      }
    }));

    /* The price under the code, in the same two places the code can be: over
       the state, or out at the end of a leader line off the coast. */
    if (priceView) {
      layers.push(new deck.TextLayer({
        id: "state-price-labels",
        data: labels.filter(function (f) {
          return statePrice(f.properties.code) !== null;
        }),
        pickable: false,
        characterSet: "0123456789.\u00a2",
        fontFamily: '"Helvetica Neue", Helvetica, Arial, sans-serif',
        fontWeight: 600,
        getPosition: function (f) { return f.properties.label; },
        getText: function (f) { return centsText(statePrice(f.properties.code)); },
        getSize: price.labelSize,
        sizeUnits: "pixels",
        getColor: price.labelColor,
        getPixelOffset: price.labelOffset,
        getTextAnchor: "middle",
        getAlignmentBaseline: "center",
        fontSettings: { sdf: true, radius: 12 },
        outlineWidth: price.labelOutlineWidth,
        outlineColor: price.labelOutlineColor
      }));
    }

    return layers;
  }

  function barRows() {
    /* Each row carries the MW currently on screen and, in the Who builds
       scene, the 2030 figure the hollow outline reaches. Sorted tallest
       first so a tall bar is drawn behind the shorter ones in front of it. */
    var planned = showsPlanned();
    var flat = flatBars();
    return SITES.map(function (site) {
      /* The solid bar is always the timeline's own value, eased, so sliding
         into Today grows into the outline rather than snapping to it. The
         price view is the exception: it asks one question of every site --
         where did this capacity choose to land -- so it draws the whole 2030
         figure as one bar instead. */
      var mw = flat ? site.it_mw_2030h1 : displayedMW(site);
      return {
        site: site,
        mw: mw,
        planned: planned ? site.it_mw_2030h1 : 0
      };
    }).filter(function (row) {
      return row.mw > 0.01 || row.planned > 0.01 ||
             (anim.to[row.site.name] || 0) > 0;
    }).sort(function (a, b) {
      return Math.max(b.mw, b.planned) - Math.max(a.mw, a.planned);
    });
  }

  function barLayers() {
    var cfg = CONFIG.map;
    var focus = focusName();
    var rows = barRows();
    var layers = [];

    if (showsPlanned()) {
      /* The gap between what is running and what is funded. Drawn before the
         solid bars so a solid bar always sits in front of its own outline. */
      var planned = rows.filter(function (row) { return row.planned > row.mw + 0.01; });
      layers.push(new deck.PolygonLayer({
        id: "bars-planned",
        data: planned,
        pickable: false,
        filled: true,
        stroked: true,
        extruded: false,
        lineWidthUnits: "pixels",
        lineJointRounded: false,
        getPolygon: function (row) {
          return barPolygon(row.site, row.planned, row.mw);
        },
        getFillColor: function (row) {
          return hexToRgb(ownerColor(row.site.owner))
            .concat(Math.round(255 * cfg.plannedFillAlpha * dimFactor(row.site)));
        },
        getLineColor: function (row) {
          return hexToRgb(ownerColor(row.site.owner))
            .concat(Math.round(255 * cfg.plannedOutlineAlpha * dimFactor(row.site)));
        },
        getLineWidth: cfg.plannedOutlineWidthPx
      }));
    }

    layers.push(new deck.PolygonLayer({
      id: "bars",
      data: rows,
      pickable: true,
      filled: true,
      /* No outline where the bars are drawn flat: a lightened edge on a bar
         that is already near-white only thickens it, and one at full weight
         on a bar dimmed to a backdrop would be all that was left of it. */
      stroked: !flatBars(),
      extruded: false,
      lineWidthUnits: "pixels",
      lineJointRounded: false,
      getPolygon: function (row) { return barPolygon(row.site, row.mw); },
      getFillColor: function (row) { return barFill(row.site); },
      getLineColor: function (row) {
        var isFocus = row.site.name === focus;
        /* On a dark stage the outline reads as a highlight, so it lightens
           the fill rather than darkening it. */
        return lighten(hexToRgb(ownerColor(row.site.owner)),
                       isFocus ? cfg.outlineLighten * 1.25 : cfg.outlineLighten)
          .concat(isFocus ? 255 : fillAlphaFor(row.site));
      },
      getLineWidth: function (row) {
        return row.site.name === focus ? cfg.outlineWidthPx * 2.2 : cfg.outlineWidthPx;
      },
      onHover: onHover,
      onClick: onClick
    }));

    return layers;
  }

  function paint() {
    if (!deckInstance) return;
    var stop = STOPS[stopIndex];
    deckInstance.setProps({
      /* Bars first, labels second: a state code has to stay readable where a
         bar stands on top of it, so the type is drawn over the bars rather
         than under them. */
      layers: stateFillLayers()
        .concat(whereLinkLayers())
        .concat(barLayers())
        .concat(whereDotLayers())
        .concat(ownMarkerLayers())
        .concat(stateLabelLayers(stop))
    });
  }

  /* ==========================================================================
     Panels
     ========================================================================== */
  function countsAt(stop) {
    var live = liveAt(stop);
    return {
      year: Number(stopYear(stop)),
      power: live.reduce(function (sum, s) { return sum + powerAt(s, stop); }, 0),
      sites: live.length
    };
  }

  function sameCounts(a, b) {
    return a.year === b.year && a.power === b.power && a.sites === b.sites;
  }

  /* What is on screen right now: the eased point between from and to, or the
     target once the easing has finished. */
  function displayedCounts() {
    if (!countAnim.to) return null;
    if (countAnim.start === 0) return countAnim.to;
    var t = Math.min(1, (performance.now() - countAnim.start) / CONFIG.map.countMs);
    var e = easeOut(t);
    var from = countAnim.from;
    var to = countAnim.to;
    return {
      year: from.year + (to.year - from.year) * e,
      power: from.power + (to.power - from.power) * e,
      sites: from.sites + (to.sites - from.sites) * e
    };
  }

  function paintCounters() {
    var v = displayedCounts();
    if (!v) return;
    var p = splitPower(v.power);
    el("counter-year").textContent = String(Math.round(v.year));
    el("counter-power").innerHTML =
      escapeHtml(p.value) + '<span class="unit">' + p.unit + "</span>";
    el("counter-sites").textContent = String(Math.round(v.sites));
  }

  function renderCounters(stop, instant) {
    var next = countsAt(stop);
    /* Already heading there: leave the easing that is running alone, so the
       repeated draws a scene or legend click makes do not restart it. */
    if (!instant && countAnim.to && sameCounts(next, countAnim.to)) return;

    var current = displayedCounts();
    if (countAnim.frame) { cancelAnimationFrame(countAnim.frame); countAnim.frame = null; }
    countAnim.to = next;

    if (instant || !current) {
      countAnim.from = next;
      countAnim.start = 0;
      paintCounters();
      return;
    }

    /* From whatever is on screen rather than from the last target, so a move
       made mid-ease carries on from where the numbers actually are. */
    countAnim.from = current;
    countAnim.start = performance.now();
    var ends = countAnim.start + CONFIG.map.countMs;
    var tick = function () {
      paintCounters();
      if (performance.now() >= ends) {
        countAnim.frame = null;
        countAnim.start = 0;
        paintCounters();
        return;
      }
      countAnim.frame = requestAnimationFrame(tick);
    };
    countAnim.frame = requestAnimationFrame(tick);
  }

  /* One row per group, each carrying the median the number counted to.
     Re-rendered when a group arrives, not every frame: nothing in it moves
     between those beats. */
  function renderWhereLegend() {
    var cfg = whereCfg();
    el("legend").classList.remove("is-two-col");
    el("legend-head").textContent = cfg.legendHead;
    el("legend-rows").innerHTML = whereGroups().map(function (group, i) {
      /* A row lights up on the beat its group arrives, which is this call,
         so it goes by the step rather than by how far the lines have drawn.
         Every row is a way to replay its own group, lit or not. */
      var lit = whereAnim.solo === null
        ? i <= whereAnim.step - 2
        : i === whereAnim.solo;
      return '<div class="legend-row is-replay' + (lit ? "" : " is-zero") +
        '" data-group="' + i + '" title="' +
        escapeHtml(whereCfg().card.replayHint) + '">' +
        '<span class="legend-swatch" style="background:' + group.color +
          '"></span>' +
        '<span class="legend-name" title="' + escapeHtml(group.label) + '">' +
          escapeHtml(group.label) + "</span>" +
        '<span class="legend-mw">' +
          (lit ? Math.round(group.median) + " " + escapeHtml(cfg.unit)
               : "&ndash;") +
        "</span>" +
      "</div>";
    }).join("");
  }

  function ownerTotals(key, stop) {
    var totals = {};
    Object.keys(CONFIG.ownerColors).forEach(function (owner) { totals[owner] = 0; });
    SITES.forEach(function (site) {
      if (!(site.owner in totals)) totals[site.owner] = 0;
      totals[site.owner] += key === "stop" ? powerAt(site, stop) : site[key];
    });
    return totals;
  }

  function legendRowHtml(owner, cells, muted) {
    var classes = "legend-row" + (muted ? " is-zero" : "") +
      (highlightOwner === owner ? " is-picked" : "") +
      (isWho() ? " is-pickable" : "");
    return '<div class="' + classes + '" data-owner="' + escapeHtml(owner) + '">' +
      '<span class="legend-swatch" style="background:' + ownerColor(owner) + '"></span>' +
      '<span class="legend-name" title="' + escapeHtml(owner) + '">' +
        escapeHtml(owner) + "</span>" +
      cells +
    "</div>";
  }

  /* The Why there legend is the diverging price ramp and nothing else. The
     bars in this view are one neutral colour, so there is no owner key to
     give: the only thing on the map carrying a colour is the state fill, and
     this is the key to it. The ramp is sampled from priceColor itself, so the
     flat grey band in the middle is the same band the map uses rather than a
     drawing of one. */
  function renderPriceLegend() {
    var cfg = priceCfg();
    var low = cfg.domain[0];
    var high = cfg.domain[1];
    var steps = 20;
    var stops = [];
    for (var i = 0; i <= steps; i++) {
      var pct = (i / steps) * 100;
      var rgb = priceColor(low + (high - low) * (i / steps));
      stops.push("rgb(" + rgb.join(",") + ") " + pct.toFixed(1) + "%");
    }
    var midPct = ((1 - low) / (high - low)) * 100;

    el("legend").classList.remove("is-two-col");
    el("legend-head").textContent = cfg.legendHead;

    var ramp = el("legend-ramp");
    ramp.classList.add("is-shown");
    ramp.innerHTML =
      '<div class="ramp-bar" style="background:linear-gradient(to right,' +
          stops.join(",") + ')">' +
        '<span class="ramp-mark" style="left:' + midPct + '%"></span>' +
      "</div>" +
      '<div class="ramp-scale">' +
        "<span>" + escapeHtml(cfg.rampLow) + "</span>" +
        '<span class="ramp-scale-mid">' +
          escapeHtml(cfg.rampMid.replace("{price}", centsText(usPrice()))) +
        "</span>" +
        '<span class="ramp-scale-high">' + escapeHtml(cfg.rampHigh) + "</span>" +
      "</div>" +
      '<div class="ramp-note">' + escapeHtml(cfg.rampNote) + "</div>";

    el("legend-sub-head").hidden = true;
    el("legend-rows").innerHTML = "";
  }

  function renderLegend(stop) {
    var who = CONFIG.scenes.who;

    /* Every branch below owns the whole panel, so the price ramp and its
       sub-head are cleared here rather than in each of them. */
    if (!isPriceView()) {
      el("legend-ramp").classList.remove("is-shown");
      el("legend-ramp").innerHTML = "";
      el("legend-sub-head").hidden = true;
    } else {
      renderPriceLegend();
      return;
    }

    /* The bars are coloured by group in the Where view, so the panel keys
       the groups rather than the owners it would otherwise contradict. */
    if (isWhereView() && whereAnim.step >= 0) {
      renderWhereLegend();
      return;
    }
    if (isOwnView()) { renderOwnLegend(); return; }

    if (!isWho()) {
      el("legend").classList.remove("is-two-col");
      el("legend-head").textContent = CONFIG.labels.legend;
      var totals = ownerTotals("stop", stop);
      var rows = Object.keys(totals).map(function (owner) {
        return { owner: owner, mw: totals[owner] };
      }).sort(function (a, b) {
        return b.mw - a.mw || a.owner.localeCompare(b.owner);
      });
      el("legend-rows").innerHTML = rows.map(function (row) {
        return legendRowHtml(row.owner,
          '<span class="legend-mw">' +
            (row.mw > 0 ? escapeHtml(powerText(row.mw)) : "&ndash;") + "</span>",
          row.mw <= 0);
      }).join("");
      return;
    }

    /* Who builds: today beside 2030, ordered by 2030 because that is the
       claim the scene is making. */
    el("legend").classList.add("is-two-col");
    el("legend-head").innerHTML =
      '<span class="legend-head-name">' + escapeHtml(CONFIG.labels.legend) + "</span>" +
      '<span class="legend-head-col">' + escapeHtml(who.legendToday) + "</span>" +
      '<span class="legend-head-col">' + escapeHtml(who.legend2030) + "</span>";

    var nowT = ownerTotals("it_mw_as_of");
    var thenT = ownerTotals("it_mw_2030h1");
    var ranked = Object.keys(thenT).map(function (owner) {
      return { owner: owner, now: nowT[owner], then: thenT[owner] };
    }).sort(function (a, b) {
      return b.then - a.then || a.owner.localeCompare(b.owner);
    });

    el("legend-rows").innerHTML = ranked.map(function (row) {
      return legendRowHtml(row.owner,
        '<span class="legend-mw">' +
          (row.now > 0 ? escapeHtml(powerText(row.now)) : "&ndash;") + "</span>" +
        '<span class="legend-mw legend-mw-then">' +
          (row.then > 0 ? escapeHtml(powerText(row.then)) : "&ndash;") + "</span>",
        row.then <= 0);
    }).join("");
  }

  /* Three reference bars, drawn at exactly the map's own pixels per MW and
     the map's own bar width, so the key is a measurement, not a decoration. */
  function renderSizeKey() {
    var cfg = CONFIG.map;
    var perMW = currentPxPerMW();
    var values = CONFIG.sizeKey.slice().sort(function (a, b) { return b - a; });
    var gapX = 64;
    var padX = 22;
    /* Drawn at whatever scale the map is using right now, so the key moves
       with the scene rather than describing the one it left. */
    var baseY = Math.max.apply(null, values) * perMW + 6;
    var height = baseY + 16;
    var width = padX * 2 + (values.length - 1) * gapX;

    var parts = values.map(function (mw, i) {
      var h = mw * perMW;
      var cx = padX + i * gapX;
      var w = cfg.barWidthPx;
      return '<rect x="' + (cx - w / 2) + '" y="' + (baseY - h) +
          '" width="' + w + '" height="' + h +
          '" fill="rgba(200,214,232,0.5)" stroke="rgba(226,236,248,0.8)" ' +
          'stroke-width="0.9"></rect>' +
        '<text x="' + cx + '" y="' + (baseY + 13) +
          '" text-anchor="middle" font-size="9" font-weight="700" fill="#9fb0c0">' +
          powerText(mw) + "</text>";
    }).join("");

    var svg = el("size-key-bars");
    svg.setAttribute("viewBox", "0 0 " + width + " " + height);
    svg.setAttribute("width", String(width));
    svg.setAttribute("height", String(height));
    svg.innerHTML = parts;
  }

  function renderTrack(stop) {
    el("track-now").textContent = stop.label;
    el("slider").value = String(stopIndex);

    var fillPct = STOPS.length > 1 ? (stopIndex / (STOPS.length - 1)) * 100 : 0;
    var todayPct = STOPS.length > 1 ? (TODAY_INDEX / (STOPS.length - 1)) * 100 : 100;
    /* Three bands: played, playable-but-not-yet-reached, and the locked
       stretch past Today that the When scene will unlock. */
    el("timeline").style.setProperty("--track-fill",
      "linear-gradient(to right," +
      " var(--accent) 0%, var(--accent) " + fillPct + "%," +
      " rgba(26,26,46,0.22) " + fillPct + "%, rgba(26,26,46,0.22) " + todayPct + "%," +
      " rgba(26,26,46,0.07) " + todayPct + "%, rgba(26,26,46,0.07) 100%)");
  }

  function renderTicks() {
    el("track-ticks").innerHTML = STOPS.map(function (stop, i) {
      var show = stop.isToday || stop.key.endsWith("H1");
      if (!show) return "";
      var pct = STOPS.length > 1 ? (i / (STOPS.length - 1)) * 100 : 0;
      var cls = "track-tick" + (stop.isToday ? " is-today" : (stop.locked ? " is-locked" : ""));
      var text = stop.isToday ? CONFIG.labels.todayStop : stop.key.slice(2, 4);
      return '<span class="' + cls + '" style="left:' + pct + '%">' + text + "</span>";
    }).join("");
  }

  function renderHeadline(stop) {
    var cfg = scene();
    var node = el("headline");
    /* A scene gives either one line or several; both arrive and leave as one
       caption, so a scene that has something in two sentences does not have
       to say it in one. */
    /* The overview screen speaks for its scene while it is up; the caption
       the scene's own views carry waits below it. */
    var intro = introCfg();

    /* A view inside it answers with one number, so the line the screen leads
       with becomes that number and the way back out of the view. */
    node.classList.toggle("is-back", !!viewId);
    if (showsNumber()) {
      var group = whereGroups()[currentGroupIndex()];
      node.innerHTML =
        '<span class="where-figure">' +
          "<span>" + Math.round(whereNumber()) +
            '<span class="where-unit">' + escapeHtml(whereCfg().unit) +
            "</span>" +
          "</span>" +
          '<span class="where-group">' + escapeHtml(group.label) + "</span>" +
        "</span>";
      node.title = whereCfg().backHint;
      node.classList.add("is-shown");
      return;
    }
    node.title = "";

    /* Inside a view this line is the view's own; with nothing to put here it
       stays empty, because the scene's headline belongs to the headline
       view and not to what opens from it. */
    if (viewId) {
      node.classList.remove("is-shown");
      node.innerHTML = "";
      return;
    }

    var lines = intro
      ? [intro.headline]
      : (cfg && (cfg.headlineLines ||
                 (cfg.headline ? [cfg.headline] : null)));
    if (!lines) { node.classList.remove("is-shown"); node.innerHTML = ""; return; }
    node.innerHTML = lines.map(function (line) {
      return '<span class="headline-line">' + escapeHtml(line) + "</span>";
    }).join("");
    node.classList.toggle("is-shown",
      (intro || cfg.headlineAlways)
        ? true
        : (cfg.headlineAt === "today" && stop.isToday));
  }

  function draw(instant) {
    var stop = STOPS[stopIndex];
    renderCounters(stop, instant);
    renderLegend(stop);
    renderTrack(stop);
    renderHeadline(stop);
    if (pinnedSite) showCard(pinnedSite, true);
  }

  /* ==========================================================================
     "How we know" panel
     ========================================================================== */
  function renderHowPanel() {
    var how = CONFIG.howWeKnow;
    var rule = CHILLER || {};
    var kw = rule.kw_per_fan_display;

    var steps = how.steps.map(function (text, i) {
      return '<div class="how-step">' +
          '<span class="how-step-n">Step ' + (i + 1) + "</span>" +
          escapeHtml(text) +
        "</div>";
    }).join('<div class="how-arrow">\u2192</div>');

    /* The rule of thumb carries one markup tag, so the number is substituted
       into the template after the surrounding text is escaped. */
    var ruleHtml = how.ruleTemplate.replace("{kw}", escapeHtml(String(kw)));
    var ruleNote = how.ruleNote.replace("{models}", escapeHtml(String(rule.models)));

    el("how-panel").innerHTML =
      '<div class="how-head">' +
        '<span class="how-title" id="how-title">' + escapeHtml(how.title) + "</span>" +
        '<button type="button" id="how-close" aria-label="' +
          escapeHtml(how.closeLabel) + '">\u00d7</button>' +
      "</div>" +
      '<p class="how-headline">' + escapeHtml(how.headline) + "</p>" +
      '<div class="how-steps">' + steps + "</div>" +
      '<div class="how-fact">' +
        '<span class="how-fact-label">' + escapeHtml(how.ruleLabel) + "</span>" +
        '<span class="how-fact-value">' + ruleHtml +
          '<span class="how-fact-note">' + ruleNote + "</span></span>" +
      "</div>" +
      '<div class="how-fact">' +
        '<span class="how-fact-label">' + escapeHtml(how.exampleLabel) + "</span>" +
        '<span class="how-fact-value">' + escapeHtml(how.example) + "</span>" +
      "</div>" +
      '<div class="how-fact">' +
        '<span class="how-fact-label">' + escapeHtml(how.priceLabel) + "</span>" +
        '<span class="how-fact-value">' + escapeHtml(how.price) +
          '<span class="how-fact-note">' + escapeHtml(how.priceSource) +
          "</span></span>" +
      "</div>" +
      '<p class="how-footnote">' + escapeHtml(how.footnote) + "</p>";

    el("how-close").addEventListener("click", closeHow);
  }

  function openHow() {
    el("how-panel").classList.add("is-open");
    el("how-scrim").classList.add("is-open");
    el("how-btn").setAttribute("aria-expanded", "true");
    el("how-close").focus();
  }

  function closeHow() {
    el("how-panel").classList.remove("is-open");
    el("how-scrim").classList.remove("is-open");
    el("how-btn").setAttribute("aria-expanded", "false");
  }

  function howIsOpen() {
    return el("how-panel").classList.contains("is-open");
  }

  /* ==========================================================================
     Site card
     ========================================================================== */
  function showCard(site, keepPosition) {
    var stop = STOPS[stopIndex];
    var card = el("site-card");
    var mwNow = powerAt(site, stop);
    var approx = CONFIG.card.approximateWhy[site.geocode_precision];

    card.innerHTML =
      '<div class="card-name">' + escapeHtml(site.name) + "</div>" +
      '<div class="card-owner">' +
        /* The swatch is a key to the bar's colour, so it goes where the bars
           are not owner-coloured; the name stays either way. */
        (isPriceView() ? "" :
          '<span class="legend-swatch" style="background:' +
            ownerColor(site.owner) + '"></span>') +
        escapeHtml(site.owner) +
      "</div>" +
      '<div class="card-rows">' +
        '<span class="card-key">' + CONFIG.card.users + '</span>' +
          '<span class="card-val">' + escapeHtml(site.users) + "</span>" +
        '<span class="card-key">' + CONFIG.card.state + '</span>' +
          '<span class="card-val">' + escapeHtml(site.state || "&mdash;") + "</span>" +
        '<span class="card-key">' + CONFIG.card.powerNow + '</span>' +
          '<span class="card-val">' + escapeHtml(powerText(mwNow)) + "</span>" +
        '<span class="card-key">' + CONFIG.card.power2030 + '</span>' +
          '<span class="card-val">' + escapeHtml(powerText(site.it_mw_2030h1)) + "</span>" +
        '<span class="card-key">' + CONFIG.card.firstOperational + '</span>' +
          '<span class="card-val">' +
            escapeHtml(site.first_operational || CONFIG.card.noneYet) + "</span>" +
        statusRow(site) +
      "</div>" +
      '<div class="card-note">' +
        (approx
          ? '<span class="card-approx">' + CONFIG.card.approximate + "</span> &middot; " +
            escapeHtml(approx) + "<br>"
          : "") +
        CONFIG.card.source +
      "</div>";

    card.style.display = "block";
    if (!keepPosition) positionCard(lastPointer.x, lastPointer.y);
  }

  /* Only the Who builds scene is about the gap between running and funded,
     so the status line appears there. */
  function siteStatus(site) {
    var text = CONFIG.scenes.who.status;
    if (site.it_mw_as_of <= 0) return text.construction;
    if (site.it_mw_2030h1 > site.it_mw_as_of) return text.expanding;
    return text.live;
  }

  function statusRow(site) {
    if (!showsPlanned()) return "";
    return '<span class="card-key">' + escapeHtml(CONFIG.scenes.who.statusLabel) +
      "</span>" +
      '<span class="card-val card-status">' + escapeHtml(siteStatus(site)) + "</span>";
  }

  /* The state card in the price view. Same card element, different content:
     what power costs there now, and what it cost the sites that chose it. */
  function showStateCard(feature, keepPosition) {
    var text = priceCfg().card;
    var code = feature.properties.code;
    var facts = stateFacts[code];
    var here = statePrice(code);
    var us = usPrice();

    var ground;
    if (!facts || !facts.sites || facts.groundRatio === null) {
      ground = escapeHtml(text.noSites);
    } else {
      var ratio = facts.groundRatio;
      var pct = gapPct(ratio);
      var line = pct === 0
        ? text.level
        : (ratio < 1 ? text.cheaper : text.pricier).replace("{pct}", String(pct));
      ground = '<span class="card-ground-value">' + escapeHtml(line) + "</span>";
    }

    var card = el("site-card");
    card.innerHTML =
      '<div class="card-name">' + escapeHtml(feature.properties.name) + "</div>" +
      '<div class="card-rows">' +
        '<span class="card-key">' + escapeHtml(text.price) + "</span>" +
          '<span class="card-val">' + escapeHtml(centsText(here)) + "</span>" +
        '<span class="card-key">' + escapeHtml(text.usAverage) + "</span>" +
          '<span class="card-val">' + escapeHtml(centsText(us)) + "</span>" +
        '<span class="card-key">' + escapeHtml(text.powerToday) + "</span>" +
          '<span class="card-val">' +
            escapeHtml(facts ? powerText(facts.today) : powerText(0)) + "</span>" +
        '<span class="card-key">' + escapeHtml(text.power2030) + "</span>" +
          '<span class="card-val">' +
            escapeHtml(facts ? powerText(facts.then) : powerText(0)) + "</span>" +
      "</div>" +
      '<div class="card-ground">' +
        '<span class="card-ground-label">' + escapeHtml(text.groundLabel) + "</span>" +
        ground +
      "</div>" +
      '<div class="card-note">' + escapeHtml(text.source) + "</div>";

    card.style.display = "block";
    if (!keepPosition) positionCard(lastPointer.x, lastPointer.y);
  }

  /* The card a site opens in the Where view: where it is, how far that is,
     and when it broke ground. The late group's median sits in a gap between
     two clusters, so a site in that group says so. */
  function showWhereSiteCard(site, keepPosition) {
    var cfg = whereCfg();
    var text = cfg.card;
    var row = whereRow(site);
    var metro = row ? METRO_BY_CODE[row.metro] : null;
    var dash = "\u2014";
    var cluster = (row && row.group === text.clusterGroup)
      ? '<div class="card-note">' + escapeHtml(text.clusters) + "</div>"
      : "";

    var card = el("site-card");
    card.innerHTML =
      '<div class="card-name">' + escapeHtml(site.name) + "</div>" +
      '<div class="card-rows">' +
        '<span class="card-key">' + escapeHtml(text.metro) + "</span>" +
          '<span class="card-val">' +
            escapeHtml(metro ? metro.name : dash) + "</span>" +
        '<span class="card-key">' + escapeHtml(text.distance) + "</span>" +
          '<span class="card-val">' +
            escapeHtml(row ? Math.round(row.mi) + " " + cfg.unit : dash) +
          "</span>" +
        '<span class="card-key">' + escapeHtml(text.start) + "</span>" +
          '<span class="card-val">' +
            escapeHtml(row && row.start_year ? String(row.start_year) : dash) +
          "</span>" +
      "</div>" + cluster;

    card.style.display = "block";
    if (!keepPosition) positionCard(lastPointer.x, lastPointer.y);
  }

  function positionCard(x, y) {
    var card = el("site-card");
    var stage = el("stage").getBoundingClientRect();
    var width = card.offsetWidth || 266;
    var height = card.offsetHeight || 190;
    var left = x - stage.left + 16;
    var top = y - stage.top + 16;
    if (left + width > stage.width - 8) left = x - stage.left - width - 16;
    if (top + height > stage.height - 8) top = Math.max(8, y - stage.top - height - 16);
    card.style.left = Math.max(8, left) + "px";
    card.style.top = Math.max(8, top) + "px";
  }

  function hideCard() {
    el("site-card").style.display = "none";
    el("site-card").classList.remove("is-pinned");
  }

  /* Deck reports a pointer in canvas coordinates, and a card is placed in
     stage coordinates, so this is the canvas's own offset rather than the
     stage's: in a view that gives the left of the screen to a column of
     text, the two are no longer the same point. */
  function stageOffset() {
    var rect = el("deck-canvas").getBoundingClientRect();
    return { left: rect.left, top: rect.top };
  }

  /* Two pickable layers now sit under the pointer -- a bar and the state it
     stands on -- and deck tells each of them separately when it is entered
     and left. Which card is showing is therefore decided from both pieces of
     state at the end of either handler, not from the event that arrived, so
     the result does not depend on which of the two fires last. */
  function refreshHoverCard() {
    if (pinnedSite) return;
    if (hoverSite) {
      /* One card vocabulary per view: in the Where view a site answers in
         miles, and only once the sequence has played out. */
      if (isWhereView()) {
        if (whereDone()) showWhereSiteCard(hoverSite, false); else hideCard();
        return;
      }
      /* Make your own power answers on a click, not on a hover: the cards
         there are three claims, not sixty readings. */
      if (isOwnView()) { hideCard(); return; }
      showCard(hoverSite, false);
      return;
    }
    if (hoverState && isPriceView()) { showStateCard(hoverState, false); return; }
    hideCard();
  }

  function onHover(info) {
    if (pinnedSite) return;
    var previous = hoverSite;
    if (info && info.object) {
      hoverSite = info.object.site;
      var off = stageOffset();
      lastPointer = { x: info.x + off.left, y: info.y + off.top };
    } else {
      hoverSite = null;
    }
    refreshHoverCard();
    if ((previous && previous.name) !== (hoverSite && hoverSite.name)) paint();
  }

  /* Hovering a state only ever changes the card: the fill stays as it is, so
     there is nothing to repaint. */
  function onStateHover(info) {
    if (pinnedSite) return;
    if (info && info.object) {
      hoverState = info.object;
      var off = stageOffset();
      lastPointer = { x: info.x + off.left, y: info.y + off.top };
    } else {
      hoverState = null;
    }
    refreshHoverCard();
  }

  function onClick(info) {
    hideNoteCard();
    if (isOwnView()) {
      pauseWhere();
      var example = info && info.object
        ? ownExampleForSite(info.object.site) : null;
      if (example) {
        pinnedSite = info.object.site;
        var at = stageOffset();
        lastPointer = { x: info.x + at.left, y: info.y + at.top };
        showOwnSiteCard(pinnedSite, example, false);
        el("site-card").classList.add("is-pinned");
      } else {
        pinnedSite = null;
        hideCard();
      }
      paint();
      return;
    }
    if (isWhereView()) {
      /* A click on the map is a manual move, so playback stands down. */
      pauseWhere();
      if (info && info.object && whereDone()) {
        pinnedSite = info.object.site;
        var where = stageOffset();
        lastPointer = { x: info.x + where.left, y: info.y + where.top };
        showWhereSiteCard(pinnedSite, false);
        el("site-card").classList.add("is-pinned");
      } else {
        pinnedSite = null;
        hideCard();
      }
      paint();
      return;
    }
    if (info && info.object) {
      pinnedSite = info.object.site;
      var off = stageOffset();
      lastPointer = { x: info.x + off.left, y: info.y + off.top };
      showCard(pinnedSite, false);
      el("site-card").classList.add("is-pinned");
    } else {
      pinnedSite = null;
      hideCard();
    }
    paint();
  }

  /* ==========================================================================
     Timeline control
     ========================================================================== */
  function goTo(index, options) {
    var opts = options || {};
    var clamped = Math.max(0, Math.min(TODAY_INDEX, index));
    if (clamped === stopIndex && !opts.force) return;
    stopIndex = clamped;
    draw(!!opts.silent);
    startAnimation(STOPS[stopIndex], !!opts.silent);
  }

  function stopPlaying() {
    if (playTimer) { clearInterval(playTimer); playTimer = null; }
    el("play").setAttribute("aria-label", "Play the timeline to today");
  }

  function togglePlay() {
    if (playTimer) { stopPlaying(); return; }
    if (stopIndex >= TODAY_INDEX) goTo(0, { silent: true });
    el("play").setAttribute("aria-label", "Pause the timeline");
    playTimer = setInterval(function () {
      if (stopIndex >= TODAY_INDEX) { stopPlaying(); return; }
      goTo(stopIndex + 1);
    }, 1100);
  }

  function bindControls() {
    var slider = el("slider");
    slider.min = "0";
    slider.max = String(STOPS.length - 1);
    slider.addEventListener("input", function () {
      stopPlaying();
      var wanted = Number(slider.value);
      /* Scene 1 ends at Today; the locked stretch is visible but not
         reachable, so the handle is pulled back rather than silently
         accepting a value the scene cannot render. */
      if (wanted > TODAY_INDEX) { slider.value = String(TODAY_INDEX); wanted = TODAY_INDEX; }
      goTo(wanted);
    });

    el("play").addEventListener("click", togglePlay);

    el("where-back").addEventListener("click", function () {
      gotoWhereStep(whereAnim.step - 1, true);
    });
    el("where-next").addEventListener("click", function () {
      gotoWhereStep(whereAnim.step + 1, true);
    });
    el("where-play").addEventListener("click", toggleWherePlay);

    el("how-btn").addEventListener("click", function () {
      if (howIsOpen()) closeHow(); else openHow();
    });
    /* A click anywhere off the panel closes it: the scrim covers the map. */
    el("how-scrim").addEventListener("click", closeHow);

    el("scene-bar").addEventListener("click", function (event) {
      var btn = event.target.closest(".scene-btn");
      if (!btn || !btn.dataset.scene) return;
      /* The button of the scene you are already in is the way back out of a
         view inside it, and does nothing when there is none. */
      if (btn.dataset.scene === sceneId) { clearView(); return; }
      setScene(btn.dataset.scene);
    });

    el("entry-bar").addEventListener("click", function (event) {
      var btn = event.target.closest("button[data-entry]");
      if (!btn) return;
      if (btn.dataset.entry === viewId) { clearView(); return; }
      setView(btn.dataset.entry);
    });

    /* The line the screen leads with is the way back from a view. */
    el("headline").addEventListener("click", function () { clearView(); });

    el("where-note").addEventListener("click", function () {
      if (!el("where-note").classList.contains("is-clickable")) return;
      pauseWhere();
      if (noteOpen === "closing") { hideNoteCard(); return; }
      hideNoteCard();
      showClosingCard();
    });

    el("why-figures").addEventListener("click", function (event) {
      var button = event.target.closest("button.why-figure");
      if (!button) return;
      var note = figureNote(button.dataset.figure);
      if (!note) return;
      if (noteOpen === button.dataset.figure) { hideNoteCard(); return; }
      hideNoteCard();
      showNoteCard(button, note);
    });

    /* Anywhere else closes it, the map included. */
    document.addEventListener("click", function (event) {
      if (!noteOpen) return;
      if (event.target.closest("#note-card")) return;
      if (event.target.closest("button.why-figure")) return;
      if (event.target.closest("#where-note")) return;
      hideNoteCard();
    });

    el("beat-bar").addEventListener("click", function (event) {
      var btn = event.target.closest(".beat-btn");
      if (btn && btn.dataset.beat) setBeat(btn.dataset.beat);
    });

    /* Isolating an owner is only meaningful where two numbers per owner are
       on screen, so it is wired for the Who builds scene alone. */
    el("legend-rows").addEventListener("click", function (event) {
      /* In the Where view a row replays its own group. */
      if (isWhereView()) {
        var group = event.target.closest(".legend-row");
        if (group && group.dataset.group) {
          soloWhereGroup(Number(group.dataset.group));
        }
        return;
      }
      if (!isWho()) return;
      var row = event.target.closest(".legend-row");
      if (!row || !row.dataset.owner) return;
      highlightOwner = highlightOwner === row.dataset.owner ? null : row.dataset.owner;
      draw();
      paint();
    });

    /* Up and Down are reserved for switching scenes in a later step. */
    document.addEventListener("keydown", function (event) {
      if (howIsOpen() && event.key !== "Escape") return;
      /* A view that plays owns the same keys the timeline owns elsewhere. */
      if (isWhereView()) {
        if (event.key === "ArrowLeft") {
          gotoWhereStep(whereAnim.step - 1, true); event.preventDefault(); return;
        }
        if (event.key === "ArrowRight") {
          gotoWhereStep(whereAnim.step + 1, true); event.preventDefault(); return;
        }
        if (event.key === " " || event.key === "Spacebar") {
          toggleWherePlay(); event.preventDefault(); return;
        }
      }
      if (event.key === "ArrowLeft") {
        if (locksTimeline()) return;
        stopPlaying(); goTo(stopIndex - 1); event.preventDefault();
      } else if (event.key === "ArrowRight") {
        if (locksTimeline()) return;
        stopPlaying(); goTo(stopIndex + 1); event.preventDefault();
      } else if (event.key === "ArrowUp") {
        stepScene(-1); event.preventDefault();
      } else if (event.key === "ArrowDown") {
        stepScene(1); event.preventDefault();
      } else if (event.key === "Escape") {
        if (howIsOpen()) { closeHow(); return; }
        if (highlightOwner) { highlightOwner = null; draw(); paint(); return; }
        pinnedSite = null; hoverSite = null; hoverState = null; hideCard(); paint();
      }
    });

    el("stage").addEventListener("mousemove", function (event) {
      lastPointer = { x: event.clientX, y: event.clientY };
    });
  }

  /* ==========================================================================
     Boot
     ========================================================================== */
  function fail(message) {
    el("stage-status").classList.remove("is-hidden");
    el("stage-status").innerHTML =
      '<div style="max-width:420px">' + escapeHtml(message) + "</div>";
  }

  /* The sources line at the bottom is long enough to wrap, and how far it
     wraps depends on the viewport, so the timeline is parked above whatever
     height it actually comes out at rather than above a guessed one. Both are
     positioned from the bottom of the stage, so without this the second line
     of the sources would be drawn over the timeline panel. */
  var FOOTNOTE_GAP = 12;
  function syncFootnoteSpace() {
    /* Measured from where the line actually starts rather than from its own
       height: it is a <p>, so its margins sit outside the height and reading
       the height alone left the timeline 2px off it. */
    var stage = el("stage").getBoundingClientRect();
    var top = el("footnote").getBoundingClientRect().top;
    var bottom = Math.round(stage.bottom - top + FOOTNOTE_GAP) + "px";
    el("timeline").style.bottom = bottom;
    /* The playback control takes the timeline's place, so it takes its
       distance from the sources line too. */
    el("where-controls").style.bottom = bottom;
  }

  var stageRevealed = false;
  function revealStage() {
    if (stageRevealed) return;
    stageRevealed = true;
    el("stage-status").classList.add("is-hidden");
  }

  function fittedView() {
    /* The canvas, not the stage: a view that gives part of the screen to a
       column of text leaves the map a narrower box, and the camera has to
       fit the box the map actually has. */
    var canvas = el("deck-canvas");
    var stage = el("stage");
    var cfg = CONFIG.map;
    var viewport = new deck.WebMercatorViewport({
      width: Math.max(320, canvas.clientWidth || stage.clientWidth),
      height: Math.max(320, canvas.clientHeight || stage.clientHeight)
    });
    /* Every scene shares one camera. The bars change scale between scenes,
       the map does not. */
    var fitted = viewport.fitBounds(cfg.conusBounds, { padding: cfg.fitPadding });
    return {
      longitude: fitted.longitude,
      latitude: fitted.latitude,
      zoom: fitted.zoom,
      pitch: cfg.pitch,
      bearing: cfg.bearing
    };
  }

  /* The canvases change size when a view opens or closes, so the basemap is
     told and the camera is refit once the new box exists. */
  function resizeMapArea() {
    if (!mapInstance || !deckInstance) return;
    requestAnimationFrame(function () {
      mapInstance.resize();
      applyView(fittedView());
      syncColumnLayout();
    });
  }

  function applyView(next) {
    viewState = next;
    deckInstance.setProps({ viewState: viewState });
    if (mapInstance) {
      mapInstance.jumpTo({
        center: [next.longitude, next.latitude],
        zoom: next.zoom,
        bearing: next.bearing || 0,
        pitch: next.pitch || 0
      });
    }
    refreshScale();
    paint();
  }

  /* The price view paints the states itself, in deck, so they can be hovered.
     The basemap's own wash and outlines would sit underneath and muddy the
     fill, so they are switched off while that view is up. */
  function syncBasemapLayers() {
    if (!mapInstance || !mapInstance.getLayer("us-states-fill")) return;
    var visibility = isPriceView() ? "none" : "visible";
    mapInstance.setLayoutProperty("us-states-fill", "visibility", visibility);
    mapInstance.setLayoutProperty("us-states-outline", "visibility", visibility);
  }

  function initMap(states, mask) {
    var cfg = CONFIG.map;
    viewState = fittedView();

    mapInstance = new maplibregl.Map({
      container: "map",
      style: cfg.style,
      center: [viewState.longitude, viewState.latitude],
      zoom: viewState.zoom,
      pitch: viewState.pitch,
      bearing: viewState.bearing,
      interactive: false,       /* deck.gl owns the camera */
      attributionControl: false
    });

    /* The data parses in milliseconds but the basemap needs a style and a
       round of vector tiles, so hiding the overlay on the data alone shows a
       black rectangle for a second or two. Wait for the basemap's first paint
       as well -- but never longer than the fallback, or an unreachable tile
       CDN would leave the overlay up over a map that is otherwise usable. */
    mapInstance.once("idle", revealStage);
    setTimeout(revealStage, 4000);

    mapInstance.on("load", function () {
      /* A faint wash inside the states, then the outlines, then one dark
         polygon covering the world with the country punched out of it. The
         basemap's own boundary_state layer only draws from zoom 6 and this
         map opens near 3.7, so the outlines come from the local file. */
      mapInstance.addSource("us-states", { type: "geojson", data: states });
      mapInstance.addLayer({
        id: "us-states-fill",
        type: "fill",
        source: "us-states",
        paint: { "fill-color": cfg.stateFillColor }
      });
      mapInstance.addLayer({
        id: "us-states-outline",
        type: "line",
        source: "us-states",
        paint: {
          "line-color": cfg.stateLineColor,
          "line-width": cfg.stateLineWidth
        }
      });
      mapInstance.addSource("us-mask", { type: "geojson", data: mask });
      mapInstance.addLayer({
        id: "us-mask-fill",
        type: "fill",
        source: "us-mask",
        paint: { "fill-color": cfg.maskColor }
      });
      /* The style can finish loading after a scene change, so the wash is
         reconciled with whatever scene is up by the time it does. */
      syncBasemapLayers();
    });

    deckInstance = new deck.Deck({
      canvas: "deck-canvas",
      viewState: viewState,
      /* Rotation stays off: this scene is a flat, top-down stage. */
      controller: { dragRotate: false, touchRotate: false, keyboard: false },
      layers: [],
      /* The basemap below shows through; deck paints no surface of its own. */
      parameters: { clearColor: [0, 0, 0, 0] },
      onViewStateChange: function (params) { applyView(params.viewState); },
      /* The bars layer answers for clicks that land on a bar; this answers
         for the ones that do not, which is how a card is let go of in the
         Where view. Scoped to that view, so every other scene keeps the
         click behaviour it had. */
      onClick: function (info) {
        if (info && info.object) return;
        if (!playsBack()) return;
        pauseWhere();
        hideNoteCard();
        pinnedSite = null;
        hideCard();
        paint();
      },
      onAfterRender: revealStage
    });

    refreshScale();

    var refitTimer = null;
    window.addEventListener("resize", function () {
      clearTimeout(refitTimer);
      refitTimer = setTimeout(function () {
        syncFootnoteSpace();
        if (mapInstance) mapInstance.resize();
        applyView(fittedView());
        renderOwnBars();
        syncColumnLayout();
      }, 180);
    });
  }

  function boot(payload, states, mask, chiller, prices, metros) {
    SITES = payload.sites.filter(function (s) {
      return typeof s.lat === "number" && typeof s.lon === "number";
    });
    STATES = states.features;
    CHILLER = chiller;
    PRICES = prices;
    METROS = metros;
    METRO_BY_CODE = {};
    METROS.metros.forEach(function (metro) { METRO_BY_CODE[metro.code] = metro; });
    CONFIG.asOf = payload.meta.as_of;
    buildStateFacts();

    STOPS = buildStops(payload.meta.periods);
    TODAY_INDEX = STOPS.findIndex(function (s) { return s.isToday; });

    el("counter-year-label").textContent = CONFIG.labels.year;
    el("counter-power-label").textContent = CONFIG.labels.power;
    el("counter-sites-label").textContent = CONFIG.labels.sites;
    el("legend-head").textContent = CONFIG.labels.legend;
    el("size-key-head").textContent = CONFIG.labels.sizeKey;
    el("size-key-note").textContent = CONFIG.labels.sizeKeyNote;
    el("track-hint").textContent = CONFIG.labels.dragHint;
    el("how-btn-label").textContent = CONFIG.howWeKnow.button;
    syncSceneClass();
    renderSceneBar();
    renderBeatBar();
    renderHowPanel();
    el("footnote-text").textContent = CONFIG.footnote;
    syncFootnoteSpace();

    renderTicks();
    renderSizeKey();
    bindControls();
    initMap(states, mask);

    scaleAnim.from = scaleAnim.to = scenePxPerMW(sceneId);
    renderSizeKey();

    stopIndex = 0;
    goTo(0, { force: true, silent: true });
    setTimeout(revealStage, 3000);

    /* A hook for the browser checks, and for the later scenes to read. */
    window.__dcMap = {
      config: CONFIG,
      sites: SITES,
      stops: STOPS,
      todayIndex: TODAY_INDEX,
      deck: function () { return deckInstance; },
      map: function () { return mapInstance; },
      camera: function () { return viewState; },
      scale: function () { return degPerPx; },
      barPolygon: barPolygon,
      offsets: function () { return offsetDeg; },
      chiller: function () { return CHILLER; },
      prices: function () { return PRICES; },
      metros: function () { return METROS; },
      view: function () { return viewId; },
      whereStep: function () { return whereAnim.step; },
      whereGroups: whereGroups,
      setView: setView,
      clearView: clearView,
      stateFacts: function () { return stateFacts; },
      statePrice: statePrice,
      usPrice: usPrice,
      priceRatio: priceRatio,
      priceColor: priceColor,
      beat: function () { return beatId; },
      setBeat: setBeat,
      isPriceView: isPriceView,
      hoverStateByCode: function (code) {
        var found = null;
        STATES.forEach(function (f) {
          if (f.properties.code === code) found = f;
        });
        if (!found) return null;
        hoverState = found;
        hoverSite = null;
        pinnedSite = null;
        refreshHoverCard();
        return found.properties.name;
      },
      openHow: openHow,
      closeHow: closeHow,
      howIsOpen: howIsOpen,
      displayedMW: displayedMW,
      goTo: goTo,
      setScene: setScene,
      stepScene: stepScene,
      sceneId: function () { return sceneId; },
      highlight: function () { return highlightOwner; },
      setHighlight: function (owner) { highlightOwner = owner; draw(); paint(); },
      siteStatus: siteStatus,
      pxPerMW: currentPxPerMW,
      scenePxPerMW: scenePxPerMW,
      ownerTotals: ownerTotals,
      current: function () { return STOPS[stopIndex]; },
      totals: function (index) {
        var stop = STOPS[index == null ? stopIndex : index];
        var live = liveAt(stop);
        return {
          stop: stop.label,
          mw: live.reduce(function (sum, s) { return sum + powerAt(s, stop); }, 0),
          sites: live.length
        };
      }
    };
  }

  if (!window.deck || !window.maplibregl) {
    fail("The map libraries did not load. Check the network connection and reload.");
    return;
  }

  /* no-cache forces a conditional request rather than a blind cache hit: the
     file names never change, so a reader who has the page cached would
     otherwise keep last deploy's data until the max-age expired. An unchanged
     file still answers 304 and costs nothing. */
  var fetchData = function (url) {
    return fetch(url, { cache: "no-cache" });
  };

  Promise.all([
    fetchData(CONFIG.data.sites).then(function (r) {
      if (!r.ok) throw new Error("sites.json " + r.status);
      return r.json();
    }),
    fetchData(CONFIG.data.states).then(function (r) {
      if (!r.ok) throw new Error("us_states.geojson " + r.status);
      return r.json();
    }),
    fetchData(CONFIG.data.mask).then(function (r) {
      if (!r.ok) throw new Error("us_mask.geojson " + r.status);
      return r.json();
    }),
    fetchData(CONFIG.data.chiller).then(function (r) {
      if (!r.ok) throw new Error("chiller_rule.json " + r.status);
      return r.json();
    }),
    fetchData(CONFIG.data.prices).then(function (r) {
      if (!r.ok) throw new Error("state_prices.json " + r.status);
      return r.json();
    }),
    fetchData(CONFIG.data.metros).then(function (r) {
      if (!r.ok) throw new Error("metros.json " + r.status);
      return r.json();
    })
  ]).catch(function (error) {
    fail("Could not load the site data (" + error.message +
         "). This page reads its JSON over HTTP, so it needs a server rather than a file:// path.");
    throw error;
  }).then(function (results) {
    /* Separate from the fetch catch above: a render fault must not be
       reported as a missing file. */
    try {
      boot(results[0], results[1], results[2], results[3], results[4],
           results[5]);
    } catch (error) {
      console.error(error);
      fail("The map failed to draw (" + error.message + ").");
    }
  }, function () { /* already reported */ });
})();
</script>
</body>
</html>
