function taskOrder(list){
 const open=list.filter(t=>!t.done),done=list.filter(t=>t.done);
 done.sort((a,b)=>{
  const x=a.doneAt||'',y=b.doneAt||'';
  if(x===y)return 0;
  if(!x)return 1;if(!y)return -1;
  return tsort==='newest'?y.localeCompare(x):x.localeCompare(y);
 });
 return [...open,...done];
}
function renderTasks(c){
 const L=S.tasks[c.id]=S.tasks[c.id]||[],n=L.length,d=L.filter(t=>t.done).length;
 const line=t=>`<label class="tk${t.done?' done':''}"><input type="checkbox" data-tk="${t.id}" ${t.done?'checked':''}><span>${esc(t.text)}</span>${t.done&&t.doneAt?`<em class="dd">${fromKey(t.doneAt).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</em>`:''}<button class="x" data-rmtk="${t.id}" aria-label="Remove">×</button></label>`;
 const blocks=tgroup==='status'
  ? [['To do',L.filter(t=>!t.done)],['Done',taskOrder(L.filter(t=>t.done))]]
    .filter(([,list])=>list.length).map(([g,list])=>`<h4>${g}</h4>${list.map(line).join('')}`).join('')
  : [...new Set(L.map(t=>t.group||''))]
    .map(g=>`${g?`<h4>${esc(g)}</h4>`:''}${taskOrder(L.filter(t=>(t.group||'')===g)).map(line).join('')}`).join('');
 $('#canvas').innerHTML=`<div class="tasks"><h1>${esc(c.name)}</h1><div class="prog"><i style="width:${n?Math.round(d/n*100):0}%"></i></div><p class="pc">${d} of ${n} done</p>
 <div class="tsw">
  <div class="seg" role="group" aria-label="Group by"><button data-tg="section" aria-pressed="${tgroup==='section'}">Section</button><button data-tg="status" aria-pressed="${tgroup==='status'}">Status</button></div>
  <div class="seg" role="group" aria-label="Sort by"><button data-ts="newest" aria-pressed="${tsort==='newest'}">Newest</button><button data-ts="oldest" aria-pressed="${tsort==='oldest'}">Oldest</button></div>
 </div>
 ${blocks}
 <input class="addtk" id="addtk" placeholder="+ Task"></div>`;
}
/* ---- a page you write on ----
   Blocks in a list: a kind, some text, sometimes a picture. That is the
   whole format, which is what lets two devices merge a page block by
   block the way they merge everything else. Typing saves the block it is
   in and redraws nothing, so the caret stays where you put it; only a
   change of shape redraws. */
const BLOCK_KINDS=[['h','Heading'],['p','Text'],['todo','Checklist'],['li','Bullet'],['img','Image']];
const pageOf=cid=>(S.pages[cid]=S.pages[cid]||[]);
const blockById=(cid,bid)=>pageOf(cid).find(b=>b.id===bid);
const activeId=()=>S.active;
let menuFor=null;   /* the block whose slash menu is open */
let bdrag=null;     /* a block being carried to a new place */

function blockHtml(b,hint){
 const handle=`<span class="bh" data-bh="${b.id}" aria-label="Drag to reorder" role="button" tabindex="-1"></span>`;
 if(b.t==='img')
  return `<div class="bl img" data-b="${b.id}" data-t="img">${handle}
   ${b.photo?`<img src="/api/photo/${encodeURIComponent(b.photo)}" alt="">`
    :`<label class="bimg">Choose a picture<input type="file" accept="image/*" data-bimg="${b.id}"></label>`}
   <button class="bx" data-bx="${b.id}" aria-label="Remove this block">×</button></div>`;
 const box=`<div class="bt" contenteditable="plaintext-only" data-bt="${b.id}" data-hint="${esc(hint||'')}" role="textbox" aria-multiline="true">${esc(b.text||'')}</div>`;
 if(b.t==='todo')
  return `<div class="bl todo${b.done?' done':''}" data-b="${b.id}" data-t="todo">${handle}<input type="checkbox" data-bck="${b.id}" ${b.done?'checked':''} aria-label="Done">${box}</div>`;
 if(b.t==='li')
  return `<div class="bl li" data-b="${b.id}" data-t="li">${handle}<span class="bul" aria-hidden="true"></span>${box}</div>`;
 return `<div class="bl ${b.t==='h'?'h':'p'}" data-b="${b.id}" data-t="${b.t==='h'?'h':'p'}">${handle}${box}</div>`;
}

function renderPage(c){
 const L=pageOf(c.id);
 /* An untouched page still shows one line to write on; it only becomes a
    block once there is something in it. */
 const draw=L.length?L:[{id:nid(),t:'p',text:''}];
 const hint=i=>L.length?(i===L.length-1?'Type / for a block':''):'Start writing.';
 $('#canvas').innerHTML=`<div class="page">
  <div class="phead">
   <h1 class="ptitle" contenteditable="plaintext-only" data-ptitle="${esc(c.id)}" role="textbox" data-hint="Untitled">${esc(c.name)}</h1>
   <button class="pset" data-pset="${esc(c.id)}" aria-label="Page settings" aria-expanded="false">⋯</button>
   <div class="pmenu" id="pmenu" hidden></div>
  </div>
  <div class="blocks" id="blocks">${draw.map((b,i)=>blockHtml(b,hint(i))).join('')}</div>
  <div class="pfill" data-pfill="${esc(c.id)}"></div>
 </div>`;
}

/* The caret goes to the end of a block, which is where writing carries
   on from. */
function focusBlock(bid){
 const el=document.querySelector(`[data-bt="${bid}"]`);if(!el)return;
 el.focus();
 try{const r=document.createRange();r.selectNodeContents(el);r.collapse(false);
  const s=getSelection();s.removeAllRanges();s.addRange(r)}catch(e){}
}
const atStart=()=>{const s=getSelection();return s&&s.isCollapsed&&s.anchorOffset===0};

function newBlockAfter(cid,bid){
 const L=pageOf(cid),i=L.findIndex(b=>b.id===bid),cur=L[i];
 /* Enter on an empty list item leaves the list rather than extending it. */
 if(cur&&(cur.t==='todo'||cur.t==='li')&&!cur.text){cur.t='p';save();render();focusBlock(bid);return}
 const nb={id:nid(),t:(cur&&(cur.t==='todo'||cur.t==='li'))?cur.t:'p',text:''};
 L.splice(i<0?L.length:i+1,0,nb);
 save();render();focusBlock(nb.id);
}
function removeBlock(cid,bid){
 const L=pageOf(cid),i=L.findIndex(b=>b.id===bid);
 if(i<0)return;
 if(L[i].photo)dropPhoto(L[i].photo);
 L.splice(i,1);save();render();
 const prev=L[i-1];if(prev&&prev.t!=='img')focusBlock(prev.id);
}
function setKind(cid,bid,k){
 closeMenu();
 let b=blockById(cid,bid);
 if(!b){b={id:bid,t:'p',text:''};pageOf(cid).push(b)}
 b.text='';b.t=k;if(k!=='img')delete b.photo;
 save();render();
 if(k!=='img')focusBlock(bid);
}

/* ---- the slash menu ---- */
function closeMenu(){menuFor=null;const m=document.querySelector('.bmenu');if(m)m.remove()}
function openMenu(el,bid,q){
 const items=BLOCK_KINDS.filter(([k,l])=>!q||l.toLowerCase().startsWith(q)||k.startsWith(q));
 if(!items.length){closeMenu();return}
 let m=document.querySelector('.bmenu');
 if(!m||menuFor!==bid){closeMenu();m=document.createElement('div');m.className='bmenu';el.closest('.bl').appendChild(m)}
 menuFor=bid;
 m.innerHTML=items.map(([k,l],i)=>`<button data-bk="${k}" data-bbid="${bid}" class="${i?'':'on'}">${l}</button>`).join('');
}
function menuMove(d){
 const m=document.querySelector('.bmenu');if(!m)return;
 const bs=[...m.querySelectorAll('button')],i=bs.findIndex(b=>b.classList.contains('on'));
 const j=Math.max(0,Math.min(bs.length-1,(i<0?0:i)+d));
 bs.forEach((b,k)=>b.classList.toggle('on',k===j));
}
const menuPick=()=>{const b=document.querySelector('.bmenu button.on');if(b)b.click()};

/* ---- writing ---- */
$('#canvas').addEventListener('input',ev=>{
 const t=ev.target.closest('[data-ptitle]');
 if(t){const c=S.canvases.find(x=>x.id===t.dataset.ptitle);
  if(c){c.name=t.textContent.replace(/\s+/g,' ').trim().slice(0,40)||'Untitled';save();renderTabs()}return}
 const el=ev.target.closest('[data-bt]');if(!el)return;
 const cid=activeId(),bid=+el.dataset.bt;
 let b=blockById(cid,bid);
 if(!b){b={id:bid,t:el.closest('.bl').dataset.t||'p',text:''};pageOf(cid).push(b)}
 b.text=el.textContent.slice(0,4000);
 save();
 const m=/^\/(\w*)$/.exec(b.text);
 if(m)openMenu(el,bid,m[1].toLowerCase());else closeMenu();
});
$('#canvas').addEventListener('keydown',ev=>{
 if(ev.target.closest('[data-ptitle]')&&ev.key==='Enter'){ev.preventDefault();ev.target.blur();return}
 const el=ev.target.closest('[data-bt]');if(!el)return;
 const cid=activeId(),bid=+el.dataset.bt;
 if(menuFor===bid){
  if(ev.key==='Escape'){ev.preventDefault();closeMenu();return}
  if(ev.key==='ArrowDown'){ev.preventDefault();menuMove(1);return}
  if(ev.key==='ArrowUp'){ev.preventDefault();menuMove(-1);return}
  if(ev.key==='Enter'){ev.preventDefault();menuPick();return}
 }
 if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();newBlockAfter(cid,bid);return}
 if(ev.key==='Backspace'&&!el.textContent&&atStart()){
  const L=pageOf(cid);
  if(L.length>1||L.findIndex(b=>b.id===bid)<0){ev.preventDefault();removeBlock(cid,bid)}
 }
});
/* Clicking the room under the last block carries on from there. */
$('#canvas').addEventListener('click',ev=>{
 const f=ev.target.closest('[data-pfill]');if(!f)return;
 const cid=f.dataset.pfill,L=pageOf(cid),last=L[L.length-1];
 if(!L.length){const el=document.querySelector('.blocks [data-bt]');if(el){focusBlock(+el.dataset.bt);return}}
 if(last&&last.t!=='img'&&!last.text){focusBlock(last.id);return}
 const nb={id:nid(),t:'p',text:''};L.push(nb);save();render();focusBlock(nb.id);
});
$('#canvas').addEventListener('click',ev=>{
 const k=ev.target.closest('[data-bk]');
 if(k){ev.preventDefault();setKind(activeId(),+k.dataset.bbid,k.dataset.bk);return}
 const x=ev.target.closest('[data-bx]');
 if(x){ev.preventDefault();removeBlock(activeId(),+x.dataset.bx);return}
});
$('#canvas').addEventListener('change',ev=>{
 const c=ev.target.closest('[data-bck]');if(!c)return;
 const b=blockById(activeId(),+c.dataset.bck);if(!b)return;
 b.done=c.checked;c.closest('.bl').classList.toggle('done',c.checked);save();
});
$('#canvas').addEventListener('change',async ev=>{
 const el=ev.target.closest('[data-bimg]');if(!el)return;
 const file=el.files&&el.files[0];if(!file)return;
 const cid=activeId(),bid=+el.dataset.bimg,b=blockById(cid,bid);
 const host=el.closest('.bl');if(host)host.classList.add('busy');
 try{
  /* Filed under the page it sits on, so taking the page away takes its
     pictures too. */
  const key=await uploadPhoto(file,cid);
  if(b){b.photo=key;save();render()}
 }catch(e){if(host)host.classList.remove('busy');alert(e.message||'That picture did not go through.')}
});

/* ---- carrying a block somewhere else ----
   A pointer, not the drag-and-drop API, so this works the same under a
   finger as under a mouse. */
$('#canvas').addEventListener('pointerdown',ev=>{
 const h=ev.target.closest('[data-bh]');if(!h)return;
 const list=document.querySelector('#blocks');if(!list)return;
 ev.preventDefault();closeMenu();
 bdrag={bid:+h.dataset.bh,list,to:-1};
 try{h.setPointerCapture(ev.pointerId)}catch(e){}
 h.closest('.bl').classList.add('lift');
});
$('#canvas').addEventListener('pointermove',ev=>{
 if(!bdrag)return;
 const els=[...bdrag.list.querySelectorAll('.bl')];
 let idx=els.length;
 for(let i=0;i<els.length;i++){const r=els[i].getBoundingClientRect();if(ev.clientY<r.top+r.height/2){idx=i;break}}
 bdrag.to=idx;
 els.forEach((e,i)=>e.classList.toggle('dropline',i===idx));
 bdrag.list.classList.toggle('dropend',idx===els.length);
});
const endDrag=()=>{
 if(!bdrag)return;
 const {bid,to}=bdrag;bdrag=null;
 const cid=activeId(),L=pageOf(cid),from=L.findIndex(b=>b.id===bid);
 if(from<0||to<0){render();return}
 let t=to;if(t>from)t--;
 if(t!==from){const[x]=L.splice(from,1);L.splice(t,0,x);save()}
 render();
};
$('#canvas').addEventListener('pointerup',endDrag);
$('#canvas').addEventListener('pointercancel',endDrag);

/* ---- what to do with the page itself ---- */
function deletePage(cid){
 (S.pages[cid]||[]).forEach(b=>{if(b.photo)dropPhoto(b.photo)});
 delete S.pages[cid];delete S.tasks[cid];delete (S.minds||{})[cid];
 if(mindFor===cid){mindFor=null;mindRoot=null;mindSel=null;mindBusy=false}
 S.canvases=S.canvases.filter(c=>c.id!==cid);
 if(!S.canvases.length)S.canvases=[{id:'cal',name:'Calendar',type:'calendar'}];
 S.active=S.canvases[0].id;
 save();render();
}
$('#canvas').addEventListener('click',ev=>{
 const b=ev.target.closest('[data-pset]');
 const m=document.querySelector('#pmenu');
 if(b&&m){ev.preventDefault();
  const open=!m.hidden;
  m.hidden=open;b.setAttribute('aria-expanded',String(!open));
  if(!open)m.innerHTML=`<button data-pdel="${esc(b.dataset.pset)}">Delete page</button>`;
  return}
 const d=ev.target.closest('[data-pdel]');
 if(d&&m){ev.preventDefault();
  m.innerHTML=`<p>Delete this page, everything on it and its pictures? This cannot be undone.</p>
   <button class="warn" data-pdel2="${esc(d.dataset.pdel)}">Delete</button><button data-pcancel>Keep it</button>`;
  return}
 const d2=ev.target.closest('[data-pdel2]');
 if(d2){ev.preventDefault();deletePage(d2.dataset.pdel2);return}
 if(ev.target.closest('[data-pcancel]')&&m){ev.preventDefault();m.hidden=true;m.innerHTML='';return}
 /* A click anywhere else closes what is open. */
 if(m&&!m.hidden&&!ev.target.closest('.phead')){m.hidden=true;m.innerHTML=''}
 if(menuFor!==null&&!ev.target.closest('.bmenu'))closeMenu();
});

function renderTicker(){
 const mk=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}`,cur=`${view.y}-${pad(view.m+1)}`;
 const hl=S.events.filter(e=>e.big&&e.date.startsWith(cur)).sort((a,b)=>a.date.localeCompare(b.date));
 const st=S.settings;
 const items=[...(st.showTheme&&st.theme?[`<span>${st.themeLabel?`<span class="lab">${esc(st.themeLabel)}</span>`:''}<span class="th">${esc(st.theme)}</span></span>`]:[]),
  ...(hl.length?[`<span><span class="lab">${MONTHS[view.m]} highlights</span></span>`]:[]),
  ...hl.map(e=>{const d=fromKey(e.date);return `<span><span class="star">◆</span><span class="k">${d.toLocaleDateString('en-US',{weekday:'short',day:'numeric'})}</span>${esc(e.title)}</span>`})];
  $('#ticker').style.display=st.ticker&&items.length?'':'none';
 const one=`<span class="grp">${items.join('')}</span>`,still=items.length<2;
 $('#track').classList.toggle('still',still);
 $('#track').innerHTML=still?one:one+one;
 const f={slow:1.6,normal:1,fast:.55}[st.speed]||1;
 $('#track').style.setProperty('--dur',Math.max(24,items.length*9)*f+'s');
}

const FONT_OK=/^[A-Za-z0-9 ]{2,40}$/,HEX=/^#[0-9a-fA-F]{6}$/;
function loadFont(n){if(!FONT_OK.test(n)||document.querySelector(`link[data-f="${n}"]`))return;const l=document.createElement('link');l.rel='stylesheet';l.dataset.f=n;l.href='https://fonts.googleapis.com/css2?family='+encodeURIComponent(n).replace(/%20/g,'+')+':wght@300;400;500;600&display=swap';document.head.appendChild(l)}
function applySettings(){
 const st=S.settings,r=document.documentElement.style;
 $('#mark').textContent=st.name||'';
 document.title=st.name||'Personal Agent';
 [['accent','--blue'],['background','--bg'],['ink','--ink'],['paper','--paper']].forEach(([k,v])=>HEX.test(st[k]||'')?r.setProperty(v,st[k]):r.removeProperty(v));
 if(st.displayFont&&FONT_OK.test(st.displayFont)){loadFont(st.displayFont);r.setProperty('--fd',`"${st.displayFont}"`)}else r.removeProperty('--fd');
 if(st.bodyFont&&FONT_OK.test(st.bodyFont)){loadFont(st.bodyFont);document.body.style.fontFamily=`"${st.bodyFont}",system-ui,sans-serif`}else document.body.style.fontFamily='';
}
/* Month, week or day, chosen here and remembered here: which shape suits
   is a property of the screen in your hand, not of the account. */

let viewMode='month';
try{const v=localStorage.getItem(VIEWKEY);if(VIEWS.includes(v))viewMode=v}catch(e){}
const setView=v=>{if(!VIEWS.includes(v)||v===viewMode)return;viewMode=v;
 try{localStorage.setItem(VIEWKEY,v)}catch(e){}
 editing=null;render()};
const viewSwitch=()=>`<div class="seg vsw" role="group" aria-label="View">${
 VIEWS.map(v=>`<button data-vw="${v}" aria-pressed="${v===viewMode}">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}</div>`;

const phone=()=>narrow.matches;
if(narrow.addEventListener)narrow.addEventListener('change',()=>render());
else if(narrow.addListener)narrow.addListener(()=>render());

  ?(viewMode==='week'?renderWeek():viewMode==='day'?renderDay():viewMode==='year'?renderYear():renderCal())

/* parsing a sentence into an event */
const WD=['sun','mon','tue','wed','thu','fri','sat'];
const CNWD={'日':0,'天':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6};
const MON=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
function parse(text){
 let s=' '+text+' ',date=null,time=null;
 const cut=re=>{s=s.replace(re,' ')};
 let m;
 if(/\b(today|tonight)\b|今天|今晚/i.test(s)){date=new Date(today);cut(/\b(today|tonight)\b|今天|今晚/ig)}
 else if(/\btomorrow\b|明天/i.test(s)){date=addDays(today,1);cut(/\btomorrow\b|明天/ig)}
 else if(m=s.match(/\b(next\s+)?(sun|mon|tue|wed|thu|fri|sat)[a-z]*\b/i)){
  const t=WD.indexOf(m[2].toLowerCase());let diff=(t-today.getDay()+7)%7;if(m[1])diff+=diff===0?7:7;date=addDays(today,diff);cut(m[0]);
 }else if(m=s.match(/(下)?(?:周|星期|礼拜)([一二三四五六日天])/)){
  const t=CNWD[m[2]];let diff=(t-today.getDay()+7)%7;if(m[1])diff+=7;date=addDays(today,diff);cut(m[0]);
 }
 if(!date&&(m=s.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(st|nd|rd|th)?\b/i))){
  date=new Date(today.getFullYear(),MON.indexOf(m[1].toLowerCase()),+m[2]);if(date<today)date.setFullYear(date.getFullYear()+1);cut(m[0]);
 }
 if(!date&&(m=s.match(/(\d{1,2})月(\d{1,2})[日号]?/))){date=new Date(today.getFullYear(),m[1]-1,+m[2]);if(date<today)date.setFullYear(date.getFullYear()+1);cut(m[0])}
 if(!date&&(m=s.match(/\b(\d{1,2})\/(\d{1,2})\b/))){date=new Date(today.getFullYear(),m[1]-1,+m[2]);if(date<today)date.setFullYear(date.getFullYear()+1);cut(m[0])}
 if(m=s.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i)){let h=+m[1]%12;if(m[3].toLowerCase()==='pm')h+=12;time=`${pad(h)}:${m[2]||'00'}`;cut(m[0])}
 else if(m=s.match(/(上午|早上|中午|下午|晚上)?(\d{1,2})[点:：](半|(\d{2})分?)?/)){let h=+m[2];if(/下午|晚上/.test(m[1]||'')&&h<12)h+=12;const mm=m[3]==='半'?'30':(m[4]||'00');time=`${pad(h)}:${mm}`;cut(m[0])}
 else if(m=s.match(/\b(\d{1,2}):(\d{2})\b/)){time=`${pad(+m[1])}:${m[2]}`;cut(m[0])}
 const title=s.replace(/\b(at|on|this|next)\b/ig,' ').replace(/\s+/g,' ').replace(/^[\s,.;:]+|[\s,.;:]+$/g,'').trim();
 return {date,time,title};
}

function reply(text,img){
 const c=S.canvases.find(c=>c.id===S.active);
 if(c.type!=='calendar')return {text:`Noted for ${c.name}. This canvas comes to life in the next build; for now the calendar is listening.`};
 const p=parse(text||'');
 if(img&&!p.date&&!p.time)return {text:'Screenshot received. In the live build, the model reads it and places the event for you. For this preview, add a line such as "Interview Dec 3 2pm".'};
 if(!p.date&&!p.time)return {text:'Yixuan and Alex are getting closer soon',
  html:`<span class="pair"><img class="av" src="cat.svg" alt="" width="64" height="64"><img class="av" src="raccoon.svg" alt="" width="64" height="64">Yixuan and Alex are getting closer soon</span><span class="soon">Chat opening soon. Stay tuned.</span>`};
 const date=p.date||today,title=p.title||'Untitled';
 const big=/!|\bhighlight\b|大事|重要/i.test(text||'');
 const e={id:nid(),date:key(date),time:p.time,title:title.replace(/!+|\bhighlight\b|大事|重要/ig,'').trim()||'Untitled',big};
 S.events.push(e);sel=e.date;view={y:date.getFullYear(),m:date.getMonth()};
 const dl=date.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
 return {html:`Added <b>${esc(e.title)}</b>${big?' as a highlight':''} · ${esc(dl)} · ${esc(tlabel(e)||'no time')}${shanghai(e.date,e.time)?` <span style="color:var(--soft)">(${esc(shanghai(e.date,e.time))})</span>`:''}`};
}

/* events */
const TOOLS=()=>[

const brief=()=>JSON.stringify({today:key(today),weekday:today.toLocaleDateString('en-US',{weekday:'long'}),timezone:'America/Los_Angeles',

const dataBlob=u=>{const [h,b]=u.split(',');const bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:h.slice(5).split(';')[0]})};
let busy=false;
async function ask(text,img){
 const sample=await (typeof claude!=='undefined'&&claude.use?claude.use('sample'):null);
 if(!sample)return null;
 const hist=S.msgs.filter(m=>!m.wait).slice(-9,-1).map(m=>`${m.who==='me'?'User':'Assistant'}: ${m.text||(m.html?m.html.replace(/<[^>]+>/g,''):'')}`).join('\n');
 const prompt=`You are the conversation box at the bottom of Personal Agent, a private calendar and daily tracking page. Users write in English or Chinese, by typing, voice or screenshot.

What the page itself offers, so you can point people to it: a month grid above; clicking a day opens it on the right; on that day panel (a bottom sheet on phones) there are daily items of several kinds (check, good/bad, a typed time, number, text and photo) with a plus at the end of the row to add more, then Plans (events) and "+ Add to this day". Each day cell shows a short summary of its values. Clicking an event edits title, date, time (Time, TBD or No time) and "Highlight of the month". Events can be dragged to another day. Highlights scroll in the ticker at the top. The gear at top right opens Appearance (name, year theme, ticker, colours, fonts, weekend tint, Shanghai time, week start). The conversation box itself is resized by dragging the handle on its top edge, and folds away with a tap on it. Images can be attached with the paperclip, dragged onto the chat, or pasted. The mic turns speech into text.

Use the tools to act: events, daily fields and their values (one spoken sentence may set several fields at once, for example sleep range, weight number, exercise text and ticks), and appearance. Match what the user says to existing fields by meaning before creating a new field. Resolve relative dates from today; times are Pacific. If an image is attached, read it and add what it shows. Only state facts you can see in State; never guess where data came from. Act first, then reply in one or two short sentences in the user's language. No apologies beyond a few words, no dashes, no filler. If a request needs something the tools and page do not offer, say so in one sentence and add that it can be built in the next version.

State:\n${brief()}\n\nRecent conversation:\n${hist||'(none)'}\n\nUser: ${text||'(image only)'}`;
 const opts={tools:TOOLS(),cache:false,modelTier:'default'};
 if(img){try{if((await sample.limits()).images)opts.images=[dataBlob(img)]}catch(e){}}
 const r=await sample(prompt,opts);
 return r.text;
}

/* Pull the grip to set the height, let go without moving to fold it. */
(()=>{
 const g=$('#grip'),d=$('#dock');if(!g)return;
 let from=null,dragged=false;
 g.addEventListener('pointerdown',ev=>{
  dragged=false;
  if(dockDown)return;                       /* folded: the tap speaks for itself */
  from={y:ev.clientY,h:d.getBoundingClientRect().height};
  try{g.setPointerCapture(ev.pointerId)}catch(e){}
  d.classList.add('sizing');
 });
 g.addEventListener('pointermove',ev=>{
  if(!from)return;
  const {min,max}=dockLimits();
  const h=Math.min(max,Math.max(min,Math.round(from.h+(from.y-ev.clientY))));
  if(Math.abs(h-from.h)>2)dragged=true;
  dockH=h;d.style.setProperty('--dockh',h+'px');
 });
 const stop=()=>{if(!from)return;from=null;d.classList.remove('sizing');if(dragged)rememberDock()};
 g.addEventListener('pointerup',stop);
 g.addEventListener('pointercancel',stop);
 g.addEventListener('click',ev=>{
  ev.preventDefault();
  /* A drag ends in a click of its own; only a still tap folds. */
  if(dragged){dragged=false;return}
  dockDown=!dockDown;applyDock();rememberDock();
 });
 g.addEventListener('keydown',ev=>{
  const {min,max}=dockLimits();
  if(ev.key==='ArrowUp'||ev.key==='ArrowDown'){
   ev.preventDefault();
   dockH=Math.min(max,Math.max(min,(dockH||d.getBoundingClientRect().height)+(ev.key==='ArrowUp'?24:-24)));
   dockDown=false;applyDock();rememberDock();
  }
 });
 applyDock();
})();
const takeImage=f=>{if(!f||!/^image\//.test(f.type))return false;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=im.width*k;cv.height=im.height*k;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);pendingImg=cv.toDataURL('image/jpeg',.8);$('#thumb').innerHTML=`<img src="${pendingImg}" alt="">`;$('#q').focus()};im.src=rd.result};rd.readAsDataURL(f);return true};

/* ---- photos ----
   The phone shrinks the picture before it leaves: a day's photo is a
   record, not a print, so 1280px of JPEG is plenty and it fits in the
   free tier. The state keeps only the key; the bytes live in R2. */
const PHOTO_MAX=1280,PHOTO_BYTES=2*1024*1024;
async function shrink(file){
 const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)});
 const sc=Math.min(1,PHOTO_MAX/Math.max(img.width,img.height));
 const c=document.createElement('canvas');
 c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
 c.getContext('2d').drawImage(img,0,0,c.width,c.height);
 URL.revokeObjectURL(img.src);
 const blob=q=>new Promise(r=>c.toBlob(r,'image/jpeg',q));
 let b=await blob(.72);
 if(b&&b.size>PHOTO_BYTES)b=await blob(.5);
 return b;
}
/* A replaced or cleared picture is not left behind in the bucket. Best
   effort: if the delete fails the state has already moved on. */
const dropPhoto=k=>{if(k)fetch('/api/photo/'+encodeURIComponent(k),{method:'DELETE'}).catch(()=>{})};
async function uploadPhoto(file,group){
 const b=await shrink(file);
 if(!b)throw new Error('could not read that image');
 if(b.size>PHOTO_BYTES)throw new Error('that image is too large');
 const r=await fetch('/api/photo'+(group?'?p='+encodeURIComponent(group):''),{method:'POST',headers:{'content-type':'image/jpeg'},body:b});
 if(!r.ok)throw new Error('upload failed');
 return (await r.json()).key;
}

/* daily fields */
const setVal=(date,f,val)=>{S.vals[date]=S.vals[date]||{};const o=S.vals[date];
 const gone=val===''||val===false||val==null||(typeof val==='object'&&emptyBag(val));
 if(gone)delete o[f.id];else o[f.id]=val;
 if(!Object.keys(o).length)delete S.vals[date]};
/* A control carries the day it writes to, because the week shows seven of
   them at once. */
$('#canvas').addEventListener('change',ev=>{const el=ev.target.closest('[data-f]');if(!el)return;
 const f=fieldById(+el.dataset.f);if(!f)return;
 const dk=el.dataset.d||sel;
 let v;
 if(f.type==='check')v=el.checked;
 else if(f.type==='number')v=el.value===''?'':+el.value;
 else if(f.type==='range'){const cur={...((S.vals[dk]||{})[f.id]||{})};cur[el.dataset.p]=el.value;v=cur}
 else if(f.type==='photo'){
  const cur={...((S.vals[dk]||{})[f.id]||{})},k=el.dataset.pk;
  cur[k]=k==='time'?clockValue(el.value):el.value.trim().slice(0,200);
  if(!cur[k])delete cur[k];
  if(emptyBag(cur)&&cur.photo)dropPhoto(cur.photo);
  v=cur;
 }
 else if(f.type==='time')v=clockValue(el.value);
 else v=el.value.trim().slice(0,200);
 setVal(dk,f,v);save();render()});

$('#canvas').addEventListener('input',ev=>{const el=ev.target;
 if(el.matches&&el.matches('.wkv.txt input'))el.style.width=chw(el.value)},true);

/* A check-in is on or it is nothing: an empty box is never recorded as a
   miss, so unticking removes the record rather than storing false. */
$('#canvas').addEventListener('click',ev=>{const b=ev.target.closest('[data-chk]');if(!b)return;
 ev.preventDefault();ev.stopPropagation();
 const f=fieldById(+b.dataset.chk);if(!f)return;
 const dk=b.dataset.d||sel;
 setVal(dk,f,!((S.vals[dk]||{})[f.id]));save();render()},true);
const addField=()=>{const n=$('#nf').value.trim();if(!n)return;S.fields.push({id:nid(),name:n.slice(0,40),type:$('#nft').value});save();render();$('#nf').focus()};
$('#canvas').addEventListener('keydown',ev=>{if(ev.target.id==='nf'&&ev.key==='Enter'){ev.preventDefault();addField()}},true);
/* blank, good, bad, blank: one tap each, like ruling a line through a box
   and then crossing it out. */
$('#canvas').addEventListener('click',ev=>{const t=ev.target.closest('[data-tri]');if(!t)return;ev.preventDefault();ev.stopPropagation();
 const f=fieldById(+t.dataset.tri);if(!f)return;
 const dk=t.dataset.d||sel;
 setVal(dk,f,triNext((S.vals[dk]||{})[f.id]));save();render()},true);
$('#canvas').addEventListener('click',ev=>{const x=ev.target.closest('[data-rmf]');if(!x)return;ev.preventDefault();ev.stopPropagation();S.fields=S.fields.filter(f=>f.id!==+x.dataset.rmf);save();render()},true);
/* ---- the icon library ----
   1,600 icons are a third of a megabyte, so they are not part of the
   page: the picker fetches them the first time it opens, and what you
   choose is copied into the state and never fetched again. Tags come
   with them, so "meal" finds the fork and knife. */
const LUCIDE='https://cdn.jsdelivr.net/npm/lucide-static@0.544.0/';
let LIB=null,TAGS={},libP=null;
const nodeSvg=nodes=>nodes.map(([tag,at])=>`<${tag} ${Object.entries(at).map(([k,v])=>`${k}="${esc(v)}"`).join(' ')} />`).join('');
function loadIconLib(){
 if(libP)return libP;
 libP=Promise.all([
  fetch(LUCIDE+'icon-nodes.json').then(r=>r.ok?r.json():Promise.reject(new Error('icons'))),
  fetch(LUCIDE+'tags.json').then(r=>r.ok?r.json():{}).catch(()=>({}))
 ]).then(([n,t])=>{LIB=n;TAGS=t||{};return n}).catch(e=>{libP=null;throw e});
 return libP;
}
/* A state written before the library existed names icons it does not
   carry. Fetch those once, quietly, and the page keeps its faces. */
function healIcons(){
 const want=[...S.fields,...S.retired].map(f=>f&&f.icon).filter(v=>isName(v)&&!svgFor(v));
 if(!want.length)return;
 loadIconLib().then(()=>{
  let got=false;
  want.forEach(n=>{if(LIB[n]){S.iconlib[n]=nodeSvg(LIB[n]);got=true}});
  if(got){save();render()}
 }).catch(()=>{});
}

/* ---- the daily list, edited where it is used ----
   A plus at the end of the row adds an item; a long press on one takes it
   off the list. Taking it off never touches a day that already has a
   value: the field moves to the archive and those days still show it. */
/* `range`, `time`, `number` and `photo` still render wherever they were
   used; what can be made now is the row of marks and nothing else. */
/* The colours are shown, not named. */
const swatches=cur=>COLORS.map(c=>`<button class="cw${c===cur?' on':''}" data-sw2="${c}" style="--c:var(--f-${c})" aria-label="${c}" aria-pressed="${c===cur}"></button>`).join('');

function addFieldForm(host){
 let mk='check',co='c1';
 host.innerHTML=`<div class="addf">
  <div class="r"><input id="af-name" placeholder="Name" aria-label="Item name" autocomplete="off"></div>
  <div class="r">
   <span id="af-mark">${markRow(mk)}</span>
   <span class="sws" id="af-color">${swatches(co)}</span>
  </div>
  <div class="r"><button class="ok" id="af-add">Add</button><button class="cancel" id="af-cancel">Cancel</button></div>
 </div>`;
 const name=$('#af-name');name.focus();
 const drawMarks=()=>{$('#af-mark').innerHTML=markRow(mk)};
 $('#af-mark').addEventListener('click',e=>{
  const plus=e.target.closest('[data-mkadd]');
  if(plus){e.preventDefault();e.stopPropagation();askEmoji(plus,v=>{if(v)mk=v;drawMarks()});return}
  const rm=e.target.closest('[data-mkrm]');
  if(rm){e.preventDefault();e.stopPropagation();
   const v=rm.dataset.mkrm;S.marks=S.marks.filter(m=>m!==v);save();
   if(mk===v)mk='check';drawMarks();return}
  const b=e.target.closest('[data-mk]');if(!b)return;
  e.preventDefault();e.stopPropagation();mk=b.dataset.mk;drawMarks()});
 $('#af-color').addEventListener('click',e=>{const b=e.target.closest('[data-sw2]');if(!b)return;
  e.preventDefault();e.stopPropagation();co=b.dataset.sw2;$('#af-color').innerHTML=swatches(co)});
 const add=()=>{
  const n=name.value.trim();if(!n)return;
  S.fields.push(applyMark({id:nid(),name:n.slice(0,40),color:co},mk));
  /* The form closes with the add, so a second tap cannot repeat it. */
  host.innerHTML='';
  save();render();syncPanel();
 };
 $('#af-add').addEventListener('click',add);
 name.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();add()}});
 $('#af-cancel').addEventListener('click',()=>{host.innerHTML='';});
}
/* The years, and a day in the grid: a day opens as a day. */
$('#canvas').addEventListener('click',ev=>{
 const y=ev.target.closest('[data-ynav]');
 if(y){ev.preventDefault();ev.stopPropagation();yearShown+=+y.dataset.ynav;render();return}
 const d=ev.target.closest('[data-yd]');
 if(d){ev.preventDefault();ev.stopPropagation();
  const k=d.dataset.yd;
  sel=k;sheet=true;editing=null;
  const dd=fromKey(k);view={y:dd.getFullYear(),m:dd.getMonth()};
  if(viewMode!=='day')setView('day');else render();
  return}
 const t=ev.target.closest('[data-pertog]');
 if(t){ev.preventDefault();ev.stopPropagation();
  const k=t.dataset.pertog;setPeriod(k,!isPeriod(k));return}
},true);

$('#canvas').addEventListener('click',ev=>{const b=ev.target.closest('[data-addf]');if(!b)return;
 ev.preventDefault();ev.stopPropagation();
 sel=b.dataset.addf;sheet=true;render();
 const host=$('#addfield');if(host)addFieldForm(host);
},true);

/* Taking an item off the list throws nothing away: the item itself is
   kept, every value it holds is kept, and Settings can put it back. */
function retire(f){
 S.fields=S.fields.filter(x=>x.id!==f.id);
 f.removedAt=key(today);
 if(!S.retired.some(x=>x.id===f.id))S.retired.push(f);
 save();render();syncPanel();
 note(`${f.name} is off the list. Nothing is deleted \u2014 Settings can bring it back.`);
 setTimeout(()=>note(''),5000);
}
function restore(f){
 S.retired=S.retired.filter(x=>x.id!==f.id);
 delete f.removedAt;
 if(!S.fields.some(x=>x.id===f.id))S.fields.push(f);
 save();render();syncPanel();
 note(`${f.name} is back on the list.`);
 setTimeout(()=>note(''),4000);
}
/* ---- taking an item off the list ----
   A press held on a cell, or a right click, asks; the asking is in two
   steps, because this is the one thing here that cannot be undone from
   the page. Nothing already written is touched: the item stops appearing
   from today, and every day that holds a value still shows it. */
let fmenu=null;
function closeFieldMenu(){if(fmenu){fmenu.remove();fmenu=null}}
function confirmRemove(f,x,y,after){
 closeFieldMenu();
 const m=document.createElement('div');
 m.className='fmenu';m.setAttribute('role','dialog');m.setAttribute('aria-label',f.name);
 m.innerHTML=`<p>Delete ${esc(f.name)}? It leaves the list from today. A day that already holds a value for it still shows it, and Settings can bring it back.</p>
  <button class="warn" data-fdel2="${f.id}">Delete</button><button data-fkeep="1">Keep it</button>`;
 document.body.appendChild(m);
 fmenu=m;
 const place=()=>{const r=m.getBoundingClientRect();
  m.style.left=Math.round(Math.max(8,Math.min(x,window.innerWidth-r.width-8)))+'px';
  m.style.top=Math.round(Math.max(8,Math.min(y,window.innerHeight-r.height-8)))+'px'};
 place();
 m.addEventListener('click',ev=>{
  const b=ev.target.closest('button');if(!b)return;
  ev.preventDefault();ev.stopPropagation();
  closeFieldMenu();
  if(after)after();
  if(b.dataset.fdel2)retire(f);
 });
}
/* A cell is for tapping and a tap is a tick: nothing else can be reached
   from there, by press, by hold or by right click. Renaming and removing
   both live on the name under the cell, where neither can be reached by
   accident. */
const nameAt=t=>{
 if(!t||!t.closest)return null;
 const n=t.closest('[data-fnm]');if(!n||n.isContentEditable)return null;
 const f=fieldById(+n.dataset.fnm);return f?{f,n}:null;
};

/* ---- the name of an item, changed where it is read ----
   The name belongs to the item (Sleep); what the cell holds belongs to
   the day (23:40 to 7:10). Renaming one never touches the other. */
function editName(n){
 const f=fieldById(+n.dataset.fnm);if(!f||n.isContentEditable)return;
 const was=f.name;
 const item=n.closest('.chkitem');if(item)item.classList.add('naming');
 n.contentEditable='plaintext-only';n.classList.add('editing');n.focus();
 const r=document.createRange();r.selectNodeContents(n);
 const sl=getSelection();sl.removeAllRanges();sl.addRange(r);
 /* Taking the item off is offered here and nowhere else, beside the open
    name, and it still asks before it does anything. */
 const del=document.createElement('button');
 del.className='delnm';del.type='button';del.textContent='Delete';
 del.setAttribute('aria-label',`Delete ${f.name}`);
 n.after(del);
 const done=()=>{
  if(!n.isContentEditable)return;
  n.contentEditable='false';n.classList.remove('editing');
  del.remove();if(item)item.classList.remove('naming');
  const v=n.textContent.replace(/\s+/g,' ').trim().slice(0,40);
  if(v&&v!==was){f.name=v;save();render();syncPanel()}
  else{n.textContent=was}
 };
 /* Pointerdown, not click: a click would arrive after the name had lost
    focus and taken this button away with it. */
 del.addEventListener('pointerdown',e=>{
  e.preventDefault();e.stopPropagation();
  const b=del.getBoundingClientRect();
  confirmRemove(f,b.left,b.bottom+6,done);
 });
 n.addEventListener('blur',()=>setTimeout(()=>{if(!fmenu)done()},0));
 n.addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();n.blur()}
  if(e.key==='Escape'){n.textContent=was;n.blur()}});
}
$('#canvas').addEventListener('click',ev=>{
 const hit=nameAt(ev.target);if(!hit)return;
 ev.preventDefault();ev.stopPropagation();editName(hit.n);},true);
/* Anywhere else, and the question goes away unanswered. */
document.addEventListener('pointerdown',ev=>{if(fmenu&&!ev.target.closest('.fmenu'))closeFieldMenu()},true);
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeFieldMenu()});

/* keyboard on day cells, enter key in form */
$('#canvas').addEventListener('keydown',ev=>{const d=ev.target.closest&&ev.target.closest('[data-day]');if(d&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();d.click()}
 if(ev.key==='Enter'&&ev.target.id==='et'){const sv=$('[data-act=save]');sv&&sv.click()}if(ev.key==='Escape'&&editing!=null){editing=null;render()}});
/* drag to reschedule */
let dragId=null;
$('#canvas').addEventListener('dragstart',ev=>{const t=ev.target.closest('[data-drag]');if(!t)return;dragId=+t.dataset.drag;ev.dataTransfer.effectAllowed='move';try{ev.dataTransfer.setData('text/plain',String(dragId))}catch(e){}});
$('#canvas').addEventListener('dragover',ev=>{const d=ev.target.closest('[data-day]');if(!d||dragId==null)return;ev.preventDefault();document.querySelectorAll('.day.drop').forEach(x=>x!==d&&x.classList.remove('drop'));d.classList.add('drop')});
$('#canvas').addEventListener('dragleave',ev=>{const d=ev.target.closest('[data-day]');d&&!d.contains(ev.relatedTarget)&&d.classList.remove('drop')});
$('#canvas').addEventListener('drop',ev=>{const d=ev.target.closest('[data-day]');if(!d||dragId==null)return;ev.preventDefault();const e=S.events.find(x=>x.id===dragId);if(e){e.date=d.dataset.day;sel=e.date}dragId=null;editing=null;save();render()});
$('#canvas').addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.day.drop').forEach(x=>x.classList.remove('drop'))});
/* inline edit: name */
$('#mark').addEventListener('click',()=>{const m=$('#mark');if(m.isContentEditable)return;m.contentEditable='true';m.focus();const r=document.createRange();r.selectNodeContents(m);const sl=getSelection();sl.removeAllRanges();sl.addRange(r)});
const doneName=()=>{const m=$('#mark');if(!m.isContentEditable)return;m.contentEditable='false';S.settings.name=m.textContent.trim().slice(0,40);save();render();syncPanel()};
$('#mark').addEventListener('blur',doneName);
$('#mark').addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();$('#mark').blur()}if(ev.key==='Escape'){$('#mark').textContent=S.settings.name;$('#mark').blur()}});
/* inline edit: ticker */
$('#ticker').addEventListener('click',()=>{
 if($('.tedit'))return;
 if(!S.settings.showTheme){$('#gear').click();return}
 const inp=document.createElement('input');inp.className='tedit';inp.value=S.settings.theme||'';inp.setAttribute('aria-label','Ticker text');
 $('#track').style.display='none';$('#ticker').appendChild(inp);inp.focus();inp.select();
 const done=()=>{S.settings.theme=inp.value.trim().slice(0,80);inp.remove();$('#track').style.display='';save();render();syncPanel()};
 inp.addEventListener('keydown',e=>{if(e.key==='Enter')inp.blur();if(e.key==='Escape'){inp.value=S.settings.theme;inp.blur()}});
 inp.addEventListener('blur',done,{once:true});
});
/* appearance panel */
const SW={accent:['#23408e','#141414','#8a2b2b','#2f5d50','#b4834a','#6b5b95'],background:['#fcfcfa','#ffffff','#f6f3ee','#f2f4f7','#f4efe9','#101114']};
function renderFieldList(){
 const host=$('#flist');if(!host)return;
 host.innerHTML=S.fields.length?S.fields.map((f,i)=>`
  <div class="fitem" style="--fc:${fcol(f)}">
   <span class="face">${markFace(markOf(f))}</span>
   <input class="nm" data-fname="${f.id}" value="${esc(f.name)}" aria-label="Name">
   <span class="acts">
    <button data-fup="${f.id}" aria-label="Move up"${i?'':' disabled style="opacity:.3"'}>↑</button>
    <button data-fdown="${f.id}" aria-label="Move down"${i===S.fields.length-1?' disabled style="opacity:.3"':''}>↓</button>
    <button class="rm" data-frm="${f.id}" aria-label="Remove ${esc(f.name)}">×</button>
   </span>
   <span class="sel2">
    ${markRow(markOf(f),`data-fmk="${f.id}"`)}
    <span class="sws" data-fsw="${f.id}">${swatches(f.color)}</span>
   </span>
  </div>`).join(''):'<p class="hint2">Nothing yet. Add what you want to log each day.</p>';
}

/* Nothing here is gone; this is the shelf it was put on. */
function renderRemoved(){
 const host=$('#rlist');if(!host)return;
 const gone=[...S.retired].reverse();
 host.innerHTML=gone.length?`<p class="hint2">Taken off the list. Everything they hold is still here.</p>`+gone.map(f=>`
  <div class="fitem gone" style="--fc:${fcol(f)}">
   <span class="face">${markFace(markOf(f))}</span>
   <b>${esc(f.name)}${f.removedAt?` <i>${esc(f.removedAt)}</i>`:''}</b>
   <span class="acts"><button class="back" data-fback="${f.id}">Bring back</button></span>
  </div>`).join(''):'';
}
function syncPanel(){
 const st=S.settings;
 renderFieldList();renderRemoved();
 document.querySelectorAll('#panel [data-k]').forEach(el=>{const v=st[el.dataset.k];if(el.type==='range')el.value=v||27;else el.value=v||''});
 document.querySelectorAll('#panel [data-seg]').forEach(g=>{const v=String(st[g.dataset.seg]);g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v))});
 document.querySelectorAll('#panel [data-sw]').forEach(g=>{const k=g.dataset.sw,cur=st[k]||'';
  g.innerHTML=SW[k].map(c=>`<button style="background:${c}" data-c="${c}" aria-label="${c}" aria-pressed="${cur.toLowerCase()===c}"></button>`).join('')+`<input type="color" value="${HEX.test(cur)?cur:SW[k][0]}" aria-label="Custom colour">`});
}
const setK=(k,v)=>{S.settings[k]=v;save();render()};
$('#gear').addEventListener('click',()=>{syncPanel();$('#panel').classList.add('open');$('#panel').setAttribute('aria-hidden','false')});
$('#pclose').addEventListener('click',()=>{$('#panel').classList.remove('open');$('#panel').setAttribute('aria-hidden','true')});
/* The list: rename, re-icon, recolour, reorder, remove. */
$('#panel').addEventListener('input',ev=>{const el=ev.target;
 if(el.dataset.fname){const f=S.fields.find(x=>x.id===+el.dataset.fname);if(f){f.name=el.value.slice(0,40);save();render()}return}
 if(el.dataset.k){setK(el.dataset.k,el.type==='range'?+el.value:el.value)}
 if(el.type==='color'){const g=el.closest('[data-sw]');setK(g.dataset.sw,el.value);g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','false'))}});
$('#panel').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;
 if(b.id==='pf-new'){addFieldForm($('#pf-add'));return}
 const move=b.dataset.fup||b.dataset.fdown;
 if(move){const id=+move,i=S.fields.findIndex(f=>f.id===id),j=i+(b.dataset.fup?-1:1);
  if(i>=0&&j>=0&&j<S.fields.length){const[x]=S.fields.splice(i,1);S.fields.splice(j,0,x);save();render();syncPanel()}return}
 if(b.dataset.frm){const f=S.fields.find(x=>x.id===+b.dataset.frm);if(f)retire(f);return}
 if(b.dataset.fback){const f=S.retired.find(x=>x.id===+b.dataset.fback);if(f)restore(f);return}
 const mrow=b.closest('[data-fmk]');
 if(mrow){const f=S.fields.find(x=>x.id===+mrow.dataset.fmk);if(!f)return;
  if(b.dataset.mkadd){askEmoji(b,v=>{if(v)applyMark(f,v);save();render();syncPanel()});return}
  /* Out of the row, but the items wearing it keep it. */
  if(b.dataset.mkrm){S.marks=S.marks.filter(m=>m!==b.dataset.mkrm);save();syncPanel();return}
  if(b.dataset.mk){applyMark(f,b.dataset.mk);save();render();syncPanel()}return}
 const fsw=b.closest('[data-fsw]');
 if(fsw&&b.dataset.sw2){const f=S.fields.find(x=>x.id===+fsw.dataset.fsw);
  if(f){f.color=b.dataset.sw2;save();render();syncPanel()}return}
 const seg=b.closest('[data-seg]');if(seg){const k=seg.dataset.seg;setK(k,(k==='ticker'||k==='shTime'||k==='showTheme'||k==='weekend')?b.dataset.v==='true':b.dataset.v);syncPanel();return}
 const sw=b.closest('[data-sw]');if(sw){setK(sw.dataset.sw,b.dataset.c);syncPanel();return}
 if(b.id==='preset'){const keep={theme:S.settings.theme,name:S.settings.name};S.settings=Object.assign({name:'',theme:'',themeLabel:'',weekStart:'mon',ticker:true,speed:'normal',shTime:false,showTheme:false,weekend:true},keep);save();render();syncPanel()}});

render();renderMsgs();pull();healIcons();
}
</script>
