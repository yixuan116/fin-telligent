<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Personal Agent</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agent">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fcfcfa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101114" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: quiet, assured, effortless; the page says little and means it
   IDEA: a desk diary between two cities, ruled paper with one ink colour
   PICTURE: the month itself, hairline grid, days set like a printed agenda
   COLOUR and TYPE: chalk white, ink black, one bleu de France; Cormorant for titles, Jost for the hand
   LAYOUT: canvas above, conversation docked below; on phones the dock folds to one line */
:root{color-scheme:light dark;
--bg:light-dark(#fcfcfa,#101114);--paper:light-dark(#ffffff,#16171b);
--ink:light-dark(#141414,#ecebe6);--soft:light-dark(#6f6d68,#9b9993);
--rule:light-dark(#e6e4df,#2a2b30);--blue:light-dark(#23408e,#8ea8ec);
--wash:light-dark(#eef1f8,#1c2233);
/* Field identity, every colour of it here and nowhere else. A field stores
   the key, "sage"; the stylesheet owns what sage is. Muted, no emoji. */
--f-indigo:light-dark(#4b4f7d,#9095cd);      /* dusk, for sleep */
--f-sage:light-dark(#5c7a5e,#93b094);        /* green, for weight and for done */
--f-coral:light-dark(#b16a5a,#d99486);       /* muted, for a cross */
--f-terracotta:light-dark(#a86549,#d49074);  /* warm */
--f-slate:light-dark(#596371,#9aa4b4);       /* the quiet default */
--done:var(--f-sage)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:300 16px/1.55 Jost,system-ui,sans-serif;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:1.5px solid var(--blue);outline-offset:3px}
.app{height:100dvh;display:grid;grid-template-rows:auto auto 1fr auto auto}
.ticker{overflow:hidden;background:var(--ink);color:var(--bg);font-size:13px;letter-spacing:.02em;white-space:nowrap}
.track{display:inline-flex;padding:9px 0;animation:roll var(--dur,40s) linear infinite}
.grp{display:inline-flex;gap:44px;padding-right:44px;min-width:100vw;justify-content:space-around}
.track.still{animation:none;display:flex;justify-content:center;width:100%}.track.still .grp{min-width:0;padding:0}
.ticker:hover .track{animation-play-state:paused}
.track span{display:inline-flex;gap:10px;align-items:baseline}
.track .th{font:italic 500 16px/1 var(--fd,"Cormorant Garamond"),serif}
.track .k{opacity:.6}
.track .star{color:light-dark(#b9c8f0,#23408e)}
@keyframes roll{to{transform:translateX(-50%)}}

/* top bar */
.top{display:flex;align-items:center;gap:28px;padding:calc(18px + env(safe-area-inset-top)) max(4vw,18px) 0;border-bottom:1px solid var(--rule)}
.mark{font:500 24px/1 var(--fd,"Cormorant Garamond"),serif;letter-spacing:.01em;padding-bottom:14px;white-space:nowrap}
.mark{cursor:text;outline:none;min-width:1ch}
.mark{position:relative}.mark:empty{width:26px;margin-right:-10px}
.mark:empty::before{content:"Name";position:absolute;left:0;font-size:15px;top:4px;color:var(--soft);opacity:0;transition:opacity .2s;white-space:nowrap;background:var(--bg);padding-right:6px}
.top:hover .mark:empty::before,.mark:focus:empty::before{opacity:.5}
.gear{width:44px;height:44px;display:grid;place-items:center;color:var(--soft);margin-bottom:8px;flex:none}
.gear:hover{color:var(--ink)}
.ticker{cursor:text}
.tedit{width:100%;border:0;background:var(--ink);color:var(--bg);font:italic 500 16px/1 var(--fd,"Cormorant Garamond"),serif;padding:9px max(4vw,18px);outline:none}
.seg{display:flex;border:1px solid var(--rule);border-radius:20px;width:max-content;overflow:hidden}
.seg button{padding:6px 14px;font-size:13px;color:var(--soft);min-height:34px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.addev{color:var(--blue);font-size:14px;padding:14px 0;min-height:44px;text-align:left}
.day.drop{background:var(--wash);box-shadow:inset 0 0 0 1.5px var(--blue)}
[draggable=true]{cursor:grab}
.panel{position:fixed;inset:0 0 0 auto;width:min(380px,100%);background:var(--paper);border-left:1px solid var(--ink);z-index:9;padding:22px 26px 40px;overflow:auto;transform:translateX(102%);transition:transform .3s ease}
.panel.open{transform:none}
.panel h3{font:500 28px/1.1 var(--fd,"Cormorant Garamond"),serif;margin:0 0 18px;display:flex;justify-content:space-between;align-items:center}
.panel h3 button{font:300 15px Jost,sans-serif;color:var(--soft);min-height:44px}
.pf{display:grid;gap:6px;padding:12px 0;border-top:1px solid var(--rule)}
.pf>span{font-size:12px;color:var(--soft)}
.pf input[type=text],.pf select{border:0;border-bottom:1px solid var(--rule);background:none;padding:6px 0;font-size:16px;outline:none;width:100%}
.pf input[type=range]{width:100%;accent-color:var(--blue)}
.sw{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw button{width:30px;height:30px;border-radius:50%;border:1px solid var(--rule)}
.sw button[aria-pressed=true]{box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--ink)}
.sw input[type=color]{width:34px;height:34px;border:0;background:none;padding:0}
.reset{color:var(--soft);font-size:14px;margin-top:18px;min-height:44px}
.tabs{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;flex:1}
.tab{padding:6px 0 14px;font-size:15px;color:var(--soft);border-bottom:1.5px solid transparent;white-space:nowrap;min-height:44px}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--ink)}
.add{color:var(--soft);font-size:15px;padding-bottom:14px;min-height:44px;white-space:nowrap}
.add:hover{color:var(--blue)}
.newtab{border:0;border-bottom:1px solid var(--blue);background:none;font-size:15px;width:140px;padding:6px 0;margin-bottom:12px;outline:none}

/* canvas */
.canvas{overflow:auto;padding:clamp(20px,3vw,40px) max(4vw,18px)}
.cal{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);max-width:1240px;margin:0 auto}
.mhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
h1{font:500 clamp(34px,4.4vw,48px)/1.05 var(--fd,"Cormorant Garamond"),serif;margin:0;letter-spacing:-.01em}
h1 em{font-style:italic;color:var(--soft);font-weight:500}
.nav{display:flex;gap:6px}
.nav button{width:44px;height:44px;border:1px solid var(--rule);border-radius:50%;font-size:17px;color:var(--soft)}
.nav button:hover{color:var(--ink);border-color:var(--ink)}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow span{font-size:12px;color:var(--soft);padding:0 0 8px 8px}
.grid{border-top:1px solid var(--ink);border-left:1px solid var(--rule)}
.day{min-height:clamp(86px,13dvh,132px);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:7px 8px;text-align:left;display:flex;flex-direction:column;gap:3px;background:var(--paper);transition:background .25s}
.day:hover{background:var(--wash)}
.day.out{background:transparent;color:var(--soft);opacity:.55}
.wkend .day.we:not(.out){background:var(--wash)}
.wkend .dow span.we{color:var(--blue)}
.daily{margin:0 0 22px}
.daily h4,.flex h4,.donel h4{font:500 12px/1 Jost,sans-serif;color:var(--soft);margin:0 0 8px;letter-spacing:.02em}
.fd{display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr) 28px;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--rule);font-size:15px;min-height:46px}
.fd:last-of-type{border-bottom:1px solid var(--rule)}
.fd>span{color:var(--soft);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fd input[type=checkbox]{width:20px;height:20px;accent-color:var(--blue);justify-self:start}
.fd .tri{width:30px;height:30px;border:1px solid var(--rule);border-radius:7px;display:grid;place-items:center;font-size:15px;line-height:1;color:var(--soft);justify-self:start}
.fd .tri.good{color:var(--blue);border-color:var(--blue)}
.fd .tri.bad{color:var(--ink);border-color:var(--ink)}
.fd input[type=number],.fd input[type=text],.fd input[type=time]{border:0;border-bottom:1px solid transparent;background:none;font-size:16px;padding:4px 0;outline:none;width:100%}
.fd input:focus{border-bottom-color:var(--blue)}
.fd .rg{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.fd .rg input{width:7.6em}.fd .rg em{font-style:normal;color:var(--soft);font-size:13px;white-space:nowrap}
.fd .x{color:var(--soft);opacity:.0;font-size:18px;width:28px;height:28px}.fd:hover .x,.fd:focus-within .x{opacity:1}
/* One toggle, three places: the week row, the day sheet, the settings
   list. 44px square so a thumb can find it. */
.ic{width:20px;height:20px;display:block;flex:none}
.tgl{width:44px;height:44px;border:1px solid var(--rule);border-radius:11px;display:grid;place-items:center;color:var(--soft);background:none;flex:none}
.tgl .ic{color:var(--fc,var(--f-slate));opacity:.45}
.tgl.on{border-color:var(--done);background:color-mix(in srgb,var(--done) 12%,transparent)}
.tgl.on .ic{color:var(--done);opacity:1}
.tgl.good{border-color:var(--f-sage);background:color-mix(in srgb,var(--f-sage) 12%,transparent)}
.tgl.good .ic{color:var(--f-sage);opacity:1}
.tgl.bad{border-color:var(--f-coral);background:color-mix(in srgb,var(--f-coral) 12%,transparent)}
.tgl.bad .ic{color:var(--f-coral);opacity:1}
.tgl.adding{border-style:dashed}
.fname{display:flex;align-items:center;gap:8px;min-width:0}
.fname .ic{width:17px;height:17px;color:var(--fc,var(--f-slate))}
.fname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* The view switcher, under the month name in every view. */
.vsw{margin:0 0 14px}
.vsw button{min-height:40px;padding:6px 16px;font-size:14px}

/* A month cell on a phone carries marks, not words. */
.marks{display:none;gap:3px;flex-wrap:wrap;justify-content:center;margin-top:auto;align-items:center}
.mk{display:block;line-height:0}
.mk.dot{width:6px;height:6px;border-radius:50%;background:var(--fc,var(--f-slate))}
.mk .ic{width:11px;height:11px}
.mk.good{color:var(--f-sage)}
.mk.bad{color:var(--f-coral)}

/* One day on its own. */
.dayview{max-width:720px;margin:0 auto}
.dayview .mhead{margin-bottom:12px}
.dayview h1 em{font-size:.62em}

/* The week, one row a day, its fields running across. */
.week{max-width:760px;margin:0 auto}
.wk{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--rule)}
.wk:last-of-type{border-bottom:1px solid var(--rule)}
.wk.today .wd b{background:var(--ink);color:var(--bg)}
.wd{display:flex;align-items:center;gap:7px;min-height:44px;color:var(--ink);font-size:16px}
.wd b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:500;font-size:15px;flex:none}
.wd i{font-style:normal;color:var(--soft);font-size:13px}
.wkf{display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none;padding:1px 0}
.wkf::-webkit-scrollbar{display:none}
.wkv{display:flex;align-items:center;gap:6px;height:44px;padding:0 10px;border:1px solid var(--rule);border-radius:11px;font-size:16px;flex:none;color:var(--ink)}
.wkv .ic{width:17px;height:17px;color:var(--fc,var(--f-slate));opacity:.75}
.wkv input{border:0;background:none;outline:none;font-size:16px;width:4.6em;padding:0;color:inherit}
.wkv input[type=time]{width:6.4em}
.wkv.set{border-color:var(--fc,var(--f-slate))}
.wkv b{font-weight:400;font-size:15px;font-variant-numeric:tabular-nums}
button.wkv{padding:0 9px;gap:5px;color:var(--soft)}
button.wkv.set{color:var(--ink)}
/* A day with plans says so beside its number, so the row of fields keeps
   the whole width it has. */
.wd u{width:5px;height:5px;border-radius:50%;background:var(--blue);display:block;flex:none;text-decoration:none}

/* The day's items, as a row of toggles with their names under them. */
.chkrow{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:flex-start;padding:4px 0 12px}
.chkitem{display:flex;flex-direction:column;align-items:center;gap:5px;width:60px;text-align:center}
.chkitem em{font-style:normal;font-size:11px;line-height:1.25;color:var(--soft);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.chkitem .wkv{height:44px}
.chkitem:has(.wkv){width:auto}
/* A time is typed, so it needs no more room than it shows, and a value
   before five in the morning says which night it belongs to. */
.wkv input.tmi{width:4.4em;font-variant-numeric:tabular-nums}
.wkv .nb{font-style:normal;font-size:10px;color:var(--soft);white-space:nowrap}
/* A photo field is a row of its own: the picture, then its note and its
   time beside it. */
.chkitem:has(.pho){width:100%;flex-direction:row;align-items:center;gap:10px;text-align:left}
.chkitem:has(.pho) em{order:-1;-webkit-line-clamp:1;flex:none;max-width:5em}
.pho{display:flex;align-items:center;gap:8px;flex:1;min-width:0;max-width:460px}
.pho.busy{opacity:.5;pointer-events:none}
.shot{width:44px;height:44px;flex:none;border:1px solid var(--rule);border-radius:11px;display:grid;place-items:center;overflow:hidden;cursor:pointer}
.pho.set .shot{border-color:var(--fc,var(--f-slate))}
.shot .ic{width:19px;height:19px;color:var(--fc,var(--f-slate));opacity:.55}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot input{display:none}
.phf{display:flex;gap:6px;flex:1;min-width:0}
.phf input{height:44px;min-width:0;border:1px solid var(--rule);border-radius:11px;background:none;color:var(--ink);font-size:16px;padding:0 10px;outline:none}
.phf input[data-pk=text]{flex:1}
.phf input.tmi{width:5.2em;flex:none}
.phx{width:28px;height:28px;flex:none;border:0;background:none;color:var(--soft);font-size:18px;line-height:1;cursor:pointer}
button.wkv.pht{padding:0;width:44px;overflow:hidden}
button.wkv.pht img{width:100%;height:100%;object-fit:cover}
.addf{display:grid;gap:8px;padding:10px 0 2px;border-top:1px solid var(--rule)}
.addf .r{display:flex;gap:8px;align-items:center}
.addf input{flex:1;border:0;border-bottom:1px solid var(--rule);background:none;font-size:16px;padding:9px 0;outline:none;min-height:44px}
.addf input:focus{border-color:var(--blue)}
.addf select{border:1px solid var(--rule);border-radius:10px;background:none;font-size:15px;padding:10px;color:var(--ink);min-height:44px}
.addf .ok{color:var(--blue);font-size:15px;min-height:44px;padding:0 6px}
.addf .cancel{color:var(--soft);font-size:15px;min-height:44px;padding:0 6px}
/* ---- choosing a face and a colour ----
   The button shows the icon it holds; the swatches show the colours
   themselves. Nothing here is a list of names. */
.pickb{width:44px;height:44px;flex:none;border:1px solid var(--rule);border-radius:11px;display:grid;place-items:center;color:var(--fc,var(--ink))}
.sws{display:flex;gap:6px;align-items:center;flex:none}
.sw{width:26px;height:26px;border-radius:50%;background:var(--c);border:1px solid color-mix(in srgb,var(--ink) 12%,transparent)}
.sw.on{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--c)}
.ipick{display:grid;gap:8px;border:1px solid var(--rule);border-radius:12px;padding:8px;background:var(--paper)}
.irow{display:flex;gap:4px;flex-wrap:wrap}
.irow2{display:flex;gap:8px}
.ipick input{border:1px solid var(--rule);border-radius:9px;background:none;font-size:16px;padding:8px 10px;color:var(--ink);outline:none;min-height:40px}
.isearch{flex:1;min-width:0}
.iemo{width:5.2em;flex:none;text-align:center}
.ipick input:focus{border-color:var(--blue)}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:3px;max-height:200px;overflow-y:auto;overscroll-behavior:contain}
.igrid:empty{display:none}
.ib{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;color:var(--ink);border:1px solid transparent}
.ib:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.ib.on{border-color:var(--blue)}
.ihint{margin:0;font-size:12px;color:var(--soft)}
/* An emoji brings its own colours, so it is only ever placed, never
   painted. */
.emo{display:grid;place-items:center;font-size:15px;line-height:1;font-style:normal;overflow:visible}
.tgl .emo{font-size:19px}
.mk .emo{font-size:9px}
.ib .emo{font-size:18px}
.pickb .emo{font-size:20px}

/* The settings list of items. */
.flist{display:grid;gap:2px;padding:2px 0}
.fitem{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule);min-height:44px}
.fitem .ic{width:18px;height:18px;color:var(--fc,var(--f-slate))}
.fitem b{font-weight:400;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fitem .acts{display:flex;gap:2px}
.fitem .acts button{width:36px;height:36px;color:var(--soft);font-size:15px;border-radius:8px}
.fitem .acts button:hover{color:var(--ink)}
.fitem .acts .rm:hover{color:var(--f-coral)}
.fitem .sel2{grid-column:1/-1;display:flex;gap:8px;padding-bottom:2px}
.fitem .sel2 select{flex:1;min-width:0;border:1px solid var(--rule);border-radius:9px;background:none;font-size:14px;padding:8px;color:var(--ink);min-height:40px}
.fitem .sel2 .pickb{width:40px;height:40px}
.fitem .fpick{grid-column:1/-1}
.fitem .fpick:empty{display:none}
.fitem input.nm{border:0;background:none;font-size:15px;padding:4px 0;outline:none;width:100%;color:var(--ink)}
.fitem input.nm:focus{border-bottom:1px solid var(--blue)}
.hint2{font-size:12px;color:var(--soft);margin:8px 0 0;line-height:1.5}

/* Adding an item without leaving the day. */
.newf{display:flex;gap:8px;align-items:center;margin-top:6px}
.newf input{flex:1;border:0;border-bottom:1px solid var(--rule);background:none;font-size:15px;padding:8px 0;outline:none}
.newf input:focus{border-color:var(--blue)}
.newf select{border:1px solid var(--rule);border-radius:16px;background:none;font-size:13px;padding:6px 10px;color:var(--soft)}
.day .sum{margin-top:auto;font-size:11px;line-height:1.3;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.shut{display:none}
.tasks{max-width:760px;margin:0 auto}
.tasks .prog{height:3px;background:var(--rule);margin:14px 0 6px;border-radius:2px;overflow:hidden}.tasks .prog i{display:block;height:100%;background:var(--blue);transition:width .4s ease}
.tasks .pc{font-size:13px;color:var(--soft);margin:0 0 26px}
.tasks h4{font:500 12px/1 Jost,sans-serif;color:var(--soft);margin:26px 0 8px}
.tk{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--rule);font-size:16px;cursor:pointer}
.tk input{width:19px;height:19px;accent-color:var(--blue);flex:none}
.tk span{flex:1}.tk.done span{color:var(--soft);text-decoration:line-through;text-decoration-color:var(--rule)}
.tk .dd{font-style:normal;font-size:12px;color:var(--soft);white-space:nowrap}
.donel{margin-top:22px}.donel .dn{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--rule);font-size:15px}.donel .dn b{color:var(--blue);font-weight:500}
.tk .x{color:var(--soft);opacity:0;font-size:18px;width:28px;height:28px}.tk:hover .x{opacity:1}
.addtk{border:0;border-bottom:1px solid var(--rule);background:none;font-size:15px;padding:10px 0;width:100%;outline:none;margin-top:18px}
.dock.drag{box-shadow:inset 0 0 0 2px var(--blue)}
.day .n{font-size:14px;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;margin:-3px 0 0 -4px}
.day.today .n{background:var(--ink);color:var(--bg)}
.day.sel{box-shadow:inset 0 0 0 1.5px var(--blue)}
.chip{font-size:12px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.chip::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--blue);margin:0 6px 2px 0}
.chip.big{font-weight:500}.chip.big::before{border-radius:0;transform:rotate(45deg)}
.ev .ttl .hl{color:var(--blue);font-size:13px;margin-left:8px}
.tog{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--soft)}
.more{font-size:11px;color:var(--soft)}
/* A long title is cut at the edge of its own day rather than running into
   the next one: the cell clips, the chips stack, each one is a block that
   can be ellipsed. */
.day{overflow:hidden}.day .chips{display:flex;flex-direction:column;gap:2px;min-width:0;width:100%}.chip{display:block;max-width:100%}

/* agenda */
.agenda h2{font:500 30px/1.1 var(--fd,"Cormorant Garamond"),serif;margin:6px 0 4px}
.agenda .sub{color:var(--soft);font-size:14px;margin:0 0 22px}
.ev{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:16px;padding:16px 0;border-top:1px solid var(--rule);width:100%;text-align:left}
.ev:last-of-type{border-bottom:1px solid var(--rule)}
.ev.nt{grid-template-columns:minmax(0,1fr)}.ev.nt .t{display:none}
.ev .t{font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ev .ttl{font-size:17px;font-weight:400}
.ev .sh{font-size:12.5px;color:var(--soft);margin-top:2px}
.empty{color:var(--soft);font:italic 500 20px/1.4 var(--fd,"Cormorant Garamond"),serif;padding:18px 0;border-top:1px solid var(--rule)}
.edit{display:grid;gap:10px;padding:4px 0 18px}
.edit input{border:0;border-bottom:1px solid var(--rule);background:none;padding:8px 0;font-size:16px;outline:none}
.edit input:focus{border-color:var(--blue)}
.row{display:flex;gap:18px;font-size:14px}
.row .del{color:var(--soft)}.row .ok{color:var(--blue)}
/* ---- a page of blocks ---- */
.page{max-width:720px;margin:0 auto;padding-bottom:10vh}
.phead{position:relative;display:flex;align-items:flex-start;gap:8px}
.ptitle{font:400 clamp(28px,4vw,40px)/1.15 var(--fd,'Cormorant Garamond',serif);margin:0 0 14px;flex:1;outline:none}
.ptitle:focus{border-bottom:1px solid var(--rule)}
.ptitle:empty::before{content:attr(data-hint);color:var(--soft)}
.pset{width:36px;height:36px;border-radius:9px;color:var(--soft);font-size:18px;line-height:1;flex:none}
.pset:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 6%,transparent)}
.pmenu{position:absolute;right:0;top:40px;z-index:5;min-width:210px;display:grid;gap:6px;padding:10px;border:1px solid var(--rule);border-radius:12px;background:var(--paper);box-shadow:0 10px 30px rgba(0,0,0,.12)}
.pmenu[hidden]{display:none}
.pmenu p{margin:0;font-size:13px;color:var(--soft)}
.pmenu button{text-align:left;font-size:15px;padding:8px;border-radius:8px;min-height:40px}
.pmenu button:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.pmenu .warn{color:var(--f-coral)}
.blocks{display:grid}
.bl{position:relative;display:flex;align-items:flex-start;gap:8px;padding:2px 0 2px 22px;border-radius:6px}
.bl.lift{opacity:.5}
.bl.busy{opacity:.5;pointer-events:none}
.bl.dropline::before{content:'';position:absolute;left:22px;right:0;top:-1px;height:2px;background:var(--blue)}
.blocks.dropend::after{content:'';display:block;height:2px;margin-left:22px;background:var(--blue)}
/* The handle sits in the margin and only shows itself when you are near
   the block, so a page of writing stays a page of writing. */
.bh{position:absolute;left:0;top:4px;width:18px;height:24px;cursor:grab;touch-action:none;opacity:0;transition:opacity .12s;
 background:radial-gradient(circle at 5px 6px,var(--soft) 1.3px,transparent 1.4px),radial-gradient(circle at 11px 6px,var(--soft) 1.3px,transparent 1.4px),
  radial-gradient(circle at 5px 12px,var(--soft) 1.3px,transparent 1.4px),radial-gradient(circle at 11px 12px,var(--soft) 1.3px,transparent 1.4px),
  radial-gradient(circle at 5px 18px,var(--soft) 1.3px,transparent 1.4px),radial-gradient(circle at 11px 18px,var(--soft) 1.3px,transparent 1.4px)}
.bl:hover .bh,.bl:focus-within .bh{opacity:.75}
.bt{flex:1;min-width:0;outline:none;white-space:pre-wrap;word-break:break-word;padding:3px 0;line-height:1.6}
.bt:empty::before{content:attr(data-hint);color:var(--soft);pointer-events:none}
.bl.h .bt{font:400 clamp(19px,2.4vw,23px)/1.35 var(--fd,'Cormorant Garamond',serif);padding-top:14px}
.bl.todo input{width:17px;height:17px;margin:7px 0 0;accent-color:var(--done);flex:none}
.bl.todo.done .bt{color:var(--soft);text-decoration:line-through}
.bul{width:17px;flex:none;text-align:center;color:var(--soft);line-height:1.9}
.bul::before{content:'\2022'}
.bl.img{align-items:center}
.bl.img img{max-width:100%;border-radius:10px;display:block}
.bimg{display:inline-grid;place-items:center;min-height:88px;padding:0 20px;border:1px dashed var(--rule);border-radius:10px;color:var(--soft);font-size:14px;cursor:pointer}
.bimg input{display:none}
.bx{opacity:0;width:28px;height:28px;color:var(--soft);font-size:17px;flex:none}
.bl.img:hover .bx,.bl.img:focus-within .bx{opacity:1}
.bmenu{position:absolute;left:22px;top:100%;z-index:6;min-width:170px;display:grid;gap:2px;padding:6px;border:1px solid var(--rule);border-radius:11px;background:var(--paper);box-shadow:0 10px 30px rgba(0,0,0,.12)}
.bmenu button{text-align:left;font-size:15px;padding:8px 10px;border-radius:8px;min-height:38px}
.bmenu button.on{background:var(--wash)}
.pfill{min-height:34vh;cursor:text}
.blank{max-width:640px;margin:12vh auto 0;text-align:center}
.blank p{color:var(--soft)}
/* Until the chat answers, nothing on the page offers it. */
.nochat .dock,.nochat .chatonly{display:none}
.note{font-size:12px;color:var(--soft);margin-top:26px}

/* chat dock */
.dock{border-top:1px solid var(--ink);background:var(--paper);height:var(--dockh,clamp(190px,27dvh,300px));display:grid;grid-template-rows:1fr auto}
.msgs{overflow:auto;padding:16px max(4vw,18px) 6px;display:flex;flex-direction:column;gap:10px}
.sync{margin:0;padding:6px max(4vw,18px);font-size:12.5px;color:var(--soft);border-top:1px solid var(--rule)}
.sync[hidden]{display:none}
.m{max-width:min(620px,85%);font-size:15px;line-height:1.5;animation:in .35s ease}
.m.me{align-self:flex-end;background:var(--wash);padding:8px 14px;border-radius:14px 14px 3px 14px}
.m.ai{align-self:flex-start;color:var(--ink)}
.m.ai b{font-weight:500;color:var(--blue)}
.m.ai.wait{color:var(--soft);font-style:italic}
.m img{display:block;max-width:180px;border-radius:8px;margin-bottom:6px}
.bar{display:flex;align-items:center;gap:10px;padding:10px max(4vw,18px) max(14px,env(safe-area-inset-bottom))}
.clip{width:44px;height:44px;border-radius:50%;border:1px solid var(--rule);display:grid;place-items:center;flex:none;color:var(--soft);cursor:pointer}
.clip:hover{color:var(--ink);border-color:var(--ink)}
.clip input{display:none}
.mic{display:grid}
.mic.on{color:var(--bg);background:var(--blue);border-color:var(--blue);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--blue) 18%,transparent)}}
.field{flex:1;display:flex;align-items:center;border:1px solid var(--rule);border-radius:24px;padding:0 6px 0 18px;min-height:46px;background:var(--bg)}
.field:focus-within{border-color:var(--ink)}
.field input{flex:1;border:0;background:none;outline:none;font-size:16px;padding:10px 0}
.send{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.thumb{position:relative;flex:none}
.thumb img{width:36px;height:36px;object-fit:cover;border-radius:6px;display:block;margin-right:8px}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ticker{overflow-x:auto}}

/* phone */
@media(max-width:760px){
 .top{gap:16px}.mark{font-size:21px}
 .cal{grid-template-columns:minmax(0,1fr)}
 .day{min-height:52px;padding:5px;align-items:center}
 /* The week is the phone's calendar; the sheet is where a day is edited. */
 .week{max-width:none}
 .mhead{margin-bottom:12px}
 h1{font-size:clamp(26px,7vw,34px)}
 .nav button{width:44px;height:44px}
 .chkitem{width:56px}
 .tgl,.wkv{min-height:44px}
 /* Five items and a date fit across a phone without a sideways scroll. */
 .wk{grid-template-columns:46px minmax(0,1fr);gap:8px}
 .wd{gap:5px}
 .wd b{width:28px;height:28px;font-size:14px}
 .wd i{display:none}
 .wkf{gap:6px}
 button.wkv{max-width:82px;padding:0 8px}
 button.wkv b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .agenda .daily{padding-bottom:4px}
 .day .n{margin:0;font-size:13px}
 .chip{font-size:0;width:5px;height:5px}.chip::before{margin:0}
 /* Dots, not titles, so they run across the cell: the column direction
    above is for the wide layout only. */
 .day .chips{display:flex;flex-direction:row;align-items:center;gap:3px;justify-content:center;flex-wrap:wrap}
 .more{display:none}
 .dow span{padding-left:0;text-align:center}
 .dock{height:auto}
 .day .sum{display:none}
 .marks{display:flex}
 .agenda{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--paper);border-top:1px solid var(--ink);border-radius:16px 16px 0 0;padding:14px 18px max(24px,env(safe-area-inset-bottom));max-height:78dvh;overflow:auto;transform:translateY(105%);transition:transform .28s ease;box-shadow:0 -10px 30px rgba(0,0,0,.12)}
 .agenda.up{transform:none}
 .shut{display:block;margin-left:auto;color:var(--soft);font-size:15px;min-height:40px}
 .fd .x{opacity:.6}
 .msgs{display:none;max-height:42dvh}
 .dock.open .msgs{display:flex}
}
</style>
</head>
<body>
<div class="app">
 <header class="top">
  <div class="mark" id="mark"></div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <button class="add" id="add" aria-label="Add canvas">+ Canvas</button>
  <button class="gear" id="gear" aria-label="Appearance" title="Appearance"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button>
 </header>

 <div class="ticker" id="ticker" aria-label="Highlights, click to edit" title="Click to edit"><div class="track" id="track"></div></div>
 <main class="canvas" id="canvas"></main>
 <p class="sync" id="sync" role="status" hidden></p>

 <section class="dock" id="dock" aria-label="Conversation">
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <form class="bar" id="form">
   <label class="clip" title="Attach an image" aria-label="Attach an image">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 12.5l-8.6 8.6a5.5 5.5 0 01-7.8-7.8l9.2-9.2a3.7 3.7 0 015.2 5.2l-9.2 9.2a1.8 1.8 0 01-2.6-2.6l8.5-8.5"/></svg>
    <input type="file" id="file" accept="image/*">
   </label>
   <button type="button" class="clip mic" id="mic" aria-label="Speak" title="Speak">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
   </button>
   <div class="field">
    <span class="thumb" id="thumb"></span>
    <input id="q" autocomplete="off" placeholder="Add a plan, or change the page" aria-label="Message">
    <button class="send" aria-label="Send"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
   </div>
  </form>
 </section>
</div>
<aside class="panel" id="panel" aria-label="Appearance" aria-hidden="true">
 <h3>Appearance <button id="pclose">Close</button></h3>
 <label class="pf"><span>Name</span><input type="text" data-k="name" placeholder="Leave empty to hide"></label>
 <label class="pf"><span>Year theme</span><input type="text" data-k="theme"></label>
 <div class="pf"><span>Year theme in ticker</span><div class="seg" data-seg="showTheme"><button data-v="true">Show</button><button data-v="false">Hide</button></div></div>
 <label class="pf"><span>Ticker label</span><input type="text" data-k="themeLabel" placeholder="Optional"></label>
 <div class="pf"><span>Ticker</span><div class="seg" data-seg="ticker"><button data-v="true">Show</button><button data-v="false">Hide</button></div></div>
 <div class="pf"><span>Ticker speed</span><div class="seg" data-seg="speed"><button data-v="slow">Slow</button><button data-v="normal">Normal</button><button data-v="fast">Fast</button></div></div>
 <div class="pf"><span>Daily items</span>
  <div class="flist" id="flist"></div>
  <button class="ok" id="pf-new" style="color:var(--blue);font-size:15px;min-height:44px;text-align:left">+ Add an item</button>
  <div id="pf-add"></div>
  <p class="hint2">Changes apply from now on. A day that already has a value keeps it.</p>
 </div>
 <div class="pf"><span>Accent</span><div class="sw" data-sw="accent"></div></div>
 <div class="pf"><span>Background</span><div class="sw" data-sw="background"></div></div>
 <label class="pf"><span>Title font</span><select data-k="displayFont"><option value="">Cormorant Garamond</option><option>Playfair Display</option><option>Fraunces</option><option>DM Serif Display</option><option>Libre Caslon Text</option><option>Instrument Serif</option><option>Inter</option></select></label>
 <label class="pf"><span>Text font</span><select data-k="bodyFont"><option value="">Jost</option><option>Inter</option><option>DM Sans</option><option>Manrope</option><option>Work Sans</option><option>IBM Plex Sans</option></select></label>
 <label class="pf chatonly"><span>Chat height</span><input type="range" min="15" max="70" step="1" data-k="dockHeight"></label>
 <div class="pf"><span>Weekend tint</span><div class="seg" data-seg="weekend"><button data-v="true">On</button><button data-v="false">Off</button></div></div>
 <div class="pf"><span>Shanghai time under each event</span><div class="seg" data-seg="shTime"><button data-v="true">Show</button><button data-v="false">Hide</button></div></div>
 <div class="pf"><span>Week starts on</span><div class="seg" data-seg="weekStart"><button data-v="mon">Monday</button><button data-v="sun">Sunday</button></div></div>
 <button class="reset" id="preset">Reset to default</button>
</aside>

<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const today=new Date();today.setHours(0,0,0,0);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

const seed=()=>({
 canvases:[{id:'cal',name:'Calendar',type:'calendar'}],
 active:'cal',
 events:[],

 msgs:[{who:'ai',text:'Tell me what is coming up, or what to change on this page. A sentence or a screenshot works.'}],
 seq:10
});
/* Everything a stored state needs before the page can draw it: defaults for
   settings added since it was written, and the older shapes carried
   forward. Runs on whatever arrives, from the cache or from the server. */
function prepare(){
 S.settings=Object.assign({name:'Personal Agent',theme:'',themeLabel:'',weekStart:'mon',ticker:true,speed:'normal'},S.settings||{});
 S.msgs=(S.msgs||[]).filter(m=>!m.wait);
 if(S.settings.shTime===undefined)S.settings.shTime=false;
 if(S.settings.showTheme===undefined)S.settings.showTheme=false;
 if(!S.m3){if(!S.settings.name)S.settings.name='Personal Agent';S.m3=true}
 S.fields=S.fields||(S.habits||[]).map(h=>({id:h.id,name:h.name,type:'check'}));S.vals=S.vals||{};
 if(S.checks){for(const [d,ids] of Object.entries(S.checks)){S.vals[d]=S.vals[d]||{};ids.forEach(id=>S.vals[d][id]=true)}}
 delete S.habits;delete S.checks;
 if(S.settings.weekend===undefined)S.settings.weekend=true;
 S.tasks=S.tasks||{};
 /* A page is a list of blocks, kept per canvas. Each block has an id, so
    two devices writing different blocks of the same page both keep their
    work. */
 S.pages=(S.pages&&typeof S.pages==='object'&&!Array.isArray(S.pages))?S.pages:{};

 /* Fields gain an icon and a colour, and a removed one is archived rather
    than dropped, so a day that already carries its value keeps the name it
    was written under. Nothing recorded is touched. */
 if(!S.m10){
  const guess=n=>{const t=String(n).toLowerCase();
   if(/slept|sleep|bed|lights|asleep/.test(t))return['moon','indigo'];
   if(/woke|wake|sunrise/.test(t))return['sunrise','indigo'];
   if(/weight|scale|kg|lb/.test(t))return['scale','sage'];
   return['check','slate']};
  (S.fields||[]).forEach(f=>{const[i,c]=guess(f.name);if(!f.icon)f.icon=i;if(!f.color)f.color=c});
  S.m10=true;
 }
 S.retired=Array.isArray(S.retired)?S.retired:[];
 /* The drawing of every icon in use travels with the state; the library
    itself is only ever a search away. Anything no longer referenced is
    dropped, so this cannot grow without end. */
 S.iconlib=(S.iconlib&&typeof S.iconlib==='object')?S.iconlib:{};
 S.iconsUsed=Array.isArray(S.iconsUsed)?S.iconsUsed.filter(v=>typeof v==='string').slice(0,24):[];
 {const keep=new Set([...S.fields,...S.retired].map(f=>f&&f.icon).concat(S.iconsUsed).filter(Boolean));
  Object.keys(S.iconlib).forEach(k=>{if(!keep.has(k))delete S.iconlib[k]})}
 if(!S.m4){S.msgs=[{who:'ai',text:'Tell me what is coming up, or what to change on this page. A sentence, a voice note or a screenshot works.'}];S.m4=true}
 S.seq=S.seq||10;
}

/* The conversation is written and works, but there is nobody at the other
   end of it yet, so it is switched off here rather than taken out. One
   flag hides the dock, its setting, and every line that points at it. */
const CHAT_LIVE=false;
document.body.classList.toggle('nochat',!CHAT_LIVE);

const CACHE='shsf-proto';
let S;
/* The cache paints the page at once; the server is the record and arrives a
   moment later. */
try{S=JSON.parse(localStorage.getItem(CACHE))}catch(e){}
if(!S||!S.canvases)S=seed();
prepare();
let view={y:today.getFullYear(),m:today.getMonth()},sel=key(today),editing=null,pendingImg=null,sheet=false;

/* ---- sync ----
   A write lands in the cache at once and on the server on a lazy timer.
   Every 5 seconds, and whenever the page comes back into view, the page
   pulls the latest. Two devices never overwrite each other: each keeps the
   last server copy it saw (the base) and merges item by item, so an event
   added on the phone and a task ticked on the Mac both survive. The server
   refuses any write not built on its current version. */
const BASE='shsf-base',OWNER='shsf-owner';
/* Which account this device's cache was built from. A browser is shared
   furniture: two people, or one person with two links, land on the same
   localStorage. Until the server says whose turn it is, the cache is
   drawn but never sent. */
let ownerId='';
try{ownerId=localStorage.getItem(OWNER)||''}catch(e){}
let online=false,sending=false,timer=null,pulling=false,firstPull=true;
let dirty=false,syncBase=null,baseAt=0;
try{const m=JSON.parse(localStorage.getItem(BASE));if(m){syncBase=m.state;baseAt=m.at||0;dirty=!!m.dirty}else if(localStorage.getItem(CACHE))dirty=true}catch(e){}
const cache=()=>{try{localStorage.setItem(CACHE,JSON.stringify(S));localStorage.setItem(BASE,JSON.stringify({state:syncBase,at:baseAt,dirty}));
 if(ownerId)localStorage.setItem(OWNER,ownerId)}catch(e){}};
const note=t=>{const n=$('#sync');n.textContent=t||'';n.hidden=!t};
const save=()=>{dirty=true;cache();if(online)queue()};
function queue(){clearTimeout(timer);timer=setTimeout(push,1200)}
const clone=o=>JSON.parse(JSON.stringify(o));
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
/* The two keys are written together but can still come apart, for instance

   <button class="wd" data-day="${k}" aria-label="${d.toDateString()}${ev?', '+ev+' plan'+(ev>1?'s':''):''}"><b>${d.getDate()}</b><i>${d.toLocaleDateString('en-US',{weekday:'short'})}</i>${ev?'<u></u>':''}</button>
   <div class="wkf">${fs.map(f=>control(f,k,true)).join('')}</div></div>`;
 }
 const m=fromKey(sel);
 $('#canvas').innerHTML=`<div class="week">
  <div class="mhead"><h1>${MONTHS[m.getMonth()]} <em>${m.getFullYear()}</em></h1>
   <div class="nav"><button data-wnav="-7" aria-label="Previous week">‹</button><button data-wnav="7" aria-label="Next week">›</button></div></div>
  ${viewSwitch()}
  ${rows}
 </div>
 ${sheetHtml()}`;
}

 </div>`;
}

function renderTasks(c){
 const L=S.tasks[c.id]=S.tasks[c.id]||[],n=L.length,d=L.filter(t=>t.done).length,groups=[...new Set(L.map(t=>t.group||''))];
 $('#canvas').innerHTML=`<div class="tasks"><h1>${esc(c.name)}</h1><div class="prog"><i style="width:${n?Math.round(d/n*100):0}%"></i></div><p class="pc">${d} of ${n} done</p>
 ${groups.map(g=>`${g?`<h4>${esc(g)}</h4>`:''}${L.filter(t=>(t.group||'')===g).map(t=>`<label class="tk${t.done?' done':''}"><input type="checkbox" data-tk="${t.id}" ${t.done?'checked':''}><span>${esc(t.text)}</span>${t.done&&t.doneAt?`<em class="dd">${fromKey(t.doneAt).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</em>`:''}<button class="x" data-rmtk="${t.id}" aria-label="Remove">×</button></label>`).join('')}`).join('')}
 <input class="addtk" id="addtk" placeholder="+ Task"></div>`;

/* ---- a page you write on ----
   Blocks in a list: a kind, some text, sometimes a picture. That is the
   whole format, which is what lets two devices merge a page block by
   block the way they merge everything else. Typing saves the block it is
   in and redraws nothing, so the caret stays where you put it; only a
   change of shape redraws. */
const BLOCK_KINDS=[['h','Heading'],['p','Text'],['todo','Checklist'],['li','Bullet'],['img','Image']];
const pageOf=cid=>(S.pages[cid]=S.pages[cid]||[]);
const blockById=(cid,bid)=>pageOf(cid).find(b=>b.id===bid);
const activeId=()=>S.active;
let menuFor=null;   /* the block whose slash menu is open */
let bdrag=null;     /* a block being carried to a new place */

function blockHtml(b,hint){
 const handle=`<span class="bh" data-bh="${b.id}" aria-label="Drag to reorder" role="button" tabindex="-1"></span>`;
 if(b.t==='img')
  return `<div class="bl img" data-b="${b.id}" data-t="img">${handle}
   ${b.photo?`<img src="/api/photo/${encodeURIComponent(b.photo)}" alt="">`
    :`<label class="bimg">Choose a picture<input type="file" accept="image/*" data-bimg="${b.id}"></label>`}
   <button class="bx" data-bx="${b.id}" aria-label="Remove this block">×</button></div>`;
 const box=`<div class="bt" contenteditable="plaintext-only" data-bt="${b.id}" data-hint="${esc(hint||'')}" role="textbox" aria-multiline="true">${esc(b.text||'')}</div>`;
 if(b.t==='todo')
  return `<div class="bl todo${b.done?' done':''}" data-b="${b.id}" data-t="todo">${handle}<input type="checkbox" data-bck="${b.id}" ${b.done?'checked':''} aria-label="Done">${box}</div>`;
 if(b.t==='li')
  return `<div class="bl li" data-b="${b.id}" data-t="li">${handle}<span class="bul" aria-hidden="true"></span>${box}</div>`;
 return `<div class="bl ${b.t==='h'?'h':'p'}" data-b="${b.id}" data-t="${b.t==='h'?'h':'p'}">${handle}${box}</div>`;
}

function renderPage(c){
 const L=pageOf(c.id);
 /* An untouched page still shows one line to write on; it only becomes a
    block once there is something in it. */
 const draw=L.length?L:[{id:nid(),t:'p',text:''}];
 const hint=i=>L.length?(i===L.length-1?'Type / for a block':''):'Start writing.';
 $('#canvas').innerHTML=`<div class="page">
  <div class="phead">
   <h1 class="ptitle" contenteditable="plaintext-only" data-ptitle="${esc(c.id)}" role="textbox" data-hint="Untitled">${esc(c.name)}</h1>
   <button class="pset" data-pset="${esc(c.id)}" aria-label="Page settings" aria-expanded="false">⋯</button>
   <div class="pmenu" id="pmenu" hidden></div>
  </div>
  <div class="blocks" id="blocks">${draw.map((b,i)=>blockHtml(b,hint(i))).join('')}</div>
  <div class="pfill" data-pfill="${esc(c.id)}"></div>
 </div>`;
}

/* The caret goes to the end of a block, which is where writing carries
   on from. */
function focusBlock(bid){
 const el=document.querySelector(`[data-bt="${bid}"]`);if(!el)return;
 el.focus();
 try{const r=document.createRange();r.selectNodeContents(el);r.collapse(false);
  const s=getSelection();s.removeAllRanges();s.addRange(r)}catch(e){}
}
const atStart=()=>{const s=getSelection();return s&&s.isCollapsed&&s.anchorOffset===0};

function newBlockAfter(cid,bid){
 const L=pageOf(cid),i=L.findIndex(b=>b.id===bid),cur=L[i];
 /* Enter on an empty list item leaves the list rather than extending it. */
 if(cur&&(cur.t==='todo'||cur.t==='li')&&!cur.text){cur.t='p';save();render();focusBlock(bid);return}
 const nb={id:nid(),t:(cur&&(cur.t==='todo'||cur.t==='li'))?cur.t:'p',text:''};
 L.splice(i<0?L.length:i+1,0,nb);
 save();render();focusBlock(nb.id);
}
function removeBlock(cid,bid){
 const L=pageOf(cid),i=L.findIndex(b=>b.id===bid);
 if(i<0)return;
 if(L[i].photo)dropPhoto(L[i].photo);
 L.splice(i,1);save();render();
 const prev=L[i-1];if(prev&&prev.t!=='img')focusBlock(prev.id);
}
function setKind(cid,bid,k){
 closeMenu();
 let b=blockById(cid,bid);
 if(!b){b={id:bid,t:'p',text:''};pageOf(cid).push(b)}
 b.text='';b.t=k;if(k!=='img')delete b.photo;
 save();render();
 if(k!=='img')focusBlock(bid);
}

/* ---- the slash menu ---- */
function closeMenu(){menuFor=null;const m=document.querySelector('.bmenu');if(m)m.remove()}
function openMenu(el,bid,q){
 const items=BLOCK_KINDS.filter(([k,l])=>!q||l.toLowerCase().startsWith(q)||k.startsWith(q));
 if(!items.length){closeMenu();return}
 let m=document.querySelector('.bmenu');
 if(!m||menuFor!==bid){closeMenu();m=document.createElement('div');m.className='bmenu';el.closest('.bl').appendChild(m)}
 menuFor=bid;
 m.innerHTML=items.map(([k,l],i)=>`<button data-bk="${k}" data-bbid="${bid}" class="${i?'':'on'}">${l}</button>`).join('');
}
function menuMove(d){
 const m=document.querySelector('.bmenu');if(!m)return;
 const bs=[...m.querySelectorAll('button')],i=bs.findIndex(b=>b.classList.contains('on'));
 const j=Math.max(0,Math.min(bs.length-1,(i<0?0:i)+d));
 bs.forEach((b,k)=>b.classList.toggle('on',k===j));
}
const menuPick=()=>{const b=document.querySelector('.bmenu button.on');if(b)b.click()};

/* ---- writing ---- */
$('#canvas').addEventListener('input',ev=>{
 const t=ev.target.closest('[data-ptitle]');
 if(t){const c=S.canvases.find(x=>x.id===t.dataset.ptitle);
  if(c){c.name=t.textContent.replace(/\s+/g,' ').trim().slice(0,40)||'Untitled';save();renderTabs()}return}
 const el=ev.target.closest('[data-bt]');if(!el)return;
 const cid=activeId(),bid=+el.dataset.bt;
 let b=blockById(cid,bid);
 if(!b){b={id:bid,t:el.closest('.bl').dataset.t||'p',text:''};pageOf(cid).push(b)}
 b.text=el.textContent.slice(0,4000);
 save();
 const m=/^\/(\w*)$/.exec(b.text);
 if(m)openMenu(el,bid,m[1].toLowerCase());else closeMenu();
});
$('#canvas').addEventListener('keydown',ev=>{
 if(ev.target.closest('[data-ptitle]')&&ev.key==='Enter'){ev.preventDefault();ev.target.blur();return}
 const el=ev.target.closest('[data-bt]');if(!el)return;
 const cid=activeId(),bid=+el.dataset.bt;
 if(menuFor===bid){
  if(ev.key==='Escape'){ev.preventDefault();closeMenu();return}
  if(ev.key==='ArrowDown'){ev.preventDefault();menuMove(1);return}
  if(ev.key==='ArrowUp'){ev.preventDefault();menuMove(-1);return}
  if(ev.key==='Enter'){ev.preventDefault();menuPick();return}
 }
 if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();newBlockAfter(cid,bid);return}
 if(ev.key==='Backspace'&&!el.textContent&&atStart()){
  const L=pageOf(cid);
  if(L.length>1||L.findIndex(b=>b.id===bid)<0){ev.preventDefault();removeBlock(cid,bid)}
 }
});
/* Clicking the room under the last block carries on from there. */
$('#canvas').addEventListener('click',ev=>{
 const f=ev.target.closest('[data-pfill]');if(!f)return;
 const cid=f.dataset.pfill,L=pageOf(cid),last=L[L.length-1];
 if(!L.length){const el=document.querySelector('.blocks [data-bt]');if(el){focusBlock(+el.dataset.bt);return}}
 if(last&&last.t!=='img'&&!last.text){focusBlock(last.id);return}
 const nb={id:nid(),t:'p',text:''};L.push(nb);save();render();focusBlock(nb.id);
});
$('#canvas').addEventListener('click',ev=>{
 const k=ev.target.closest('[data-bk]');
 if(k){ev.preventDefault();setKind(activeId(),+k.dataset.bbid,k.dataset.bk);return}
 const x=ev.target.closest('[data-bx]');
 if(x){ev.preventDefault();removeBlock(activeId(),+x.dataset.bx);return}
});
$('#canvas').addEventListener('change',ev=>{
 const c=ev.target.closest('[data-bck]');if(!c)return;
 const b=blockById(activeId(),+c.dataset.bck);if(!b)return;
 b.done=c.checked;c.closest('.bl').classList.toggle('done',c.checked);save();
});
$('#canvas').addEventListener('change',async ev=>{
 const el=ev.target.closest('[data-bimg]');if(!el)return;
 const file=el.files&&el.files[0];if(!file)return;
 const cid=activeId(),bid=+el.dataset.bimg,b=blockById(cid,bid);
 const host=el.closest('.bl');if(host)host.classList.add('busy');
 try{
  /* Filed under the page it sits on, so taking the page away takes its
     pictures too. */
  const key=await uploadPhoto(file,cid);
  if(b){b.photo=key;save();render()}
 }catch(e){if(host)host.classList.remove('busy');alert(e.message||'That picture did not go through.')}
});

/* ---- carrying a block somewhere else ----
   A pointer, not the drag-and-drop API, so this works the same under a
   finger as under a mouse. */
$('#canvas').addEventListener('pointerdown',ev=>{
 const h=ev.target.closest('[data-bh]');if(!h)return;
 const list=document.querySelector('#blocks');if(!list)return;
 ev.preventDefault();closeMenu();
 bdrag={bid:+h.dataset.bh,list,to:-1};
 try{h.setPointerCapture(ev.pointerId)}catch(e){}
 h.closest('.bl').classList.add('lift');
});
$('#canvas').addEventListener('pointermove',ev=>{
 if(!bdrag)return;
 const els=[...bdrag.list.querySelectorAll('.bl')];
 let idx=els.length;
 for(let i=0;i<els.length;i++){const r=els[i].getBoundingClientRect();if(ev.clientY<r.top+r.height/2){idx=i;break}}
 bdrag.to=idx;
 els.forEach((e,i)=>e.classList.toggle('dropline',i===idx));
 bdrag.list.classList.toggle('dropend',idx===els.length);
});
const endDrag=()=>{
 if(!bdrag)return;
 const {bid,to}=bdrag;bdrag=null;
 const cid=activeId(),L=pageOf(cid),from=L.findIndex(b=>b.id===bid);
 if(from<0||to<0){render();return}
 let t=to;if(t>from)t--;
 if(t!==from){const[x]=L.splice(from,1);L.splice(t,0,x);save()}
 render();
};
$('#canvas').addEventListener('pointerup',endDrag);
$('#canvas').addEventListener('pointercancel',endDrag);

/* ---- what to do with the page itself ---- */
function deletePage(cid){
 (S.pages[cid]||[]).forEach(b=>{if(b.photo)dropPhoto(b.photo)});
 delete S.pages[cid];delete S.tasks[cid];
 S.canvases=S.canvases.filter(c=>c.id!==cid);
 if(!S.canvases.length)S.canvases=[{id:'cal',name:'Calendar',type:'calendar'}];
 S.active=S.canvases[0].id;
 save();render();
}
$('#canvas').addEventListener('click',ev=>{
 const b=ev.target.closest('[data-pset]');
 const m=document.querySelector('#pmenu');
 if(b&&m){ev.preventDefault();
  const open=!m.hidden;
  m.hidden=open;b.setAttribute('aria-expanded',String(!open));
  if(!open)m.innerHTML=`<button data-pdel="${esc(b.dataset.pset)}">Delete page</button>`;
  return}
 const d=ev.target.closest('[data-pdel]');
 if(d&&m){ev.preventDefault();
  m.innerHTML=`<p>Delete this page, everything on it and its pictures? This cannot be undone.</p>
   <button class="warn" data-pdel2="${esc(d.dataset.pdel)}">Delete</button><button data-pcancel>Keep it</button>`;
  return}
 const d2=ev.target.closest('[data-pdel2]');
 if(d2){ev.preventDefault();deletePage(d2.dataset.pdel2);return}
 if(ev.target.closest('[data-pcancel]')&&m){ev.preventDefault();m.hidden=true;m.innerHTML='';return}
 /* A click anywhere else closes what is open. */
 if(m&&!m.hidden&&!ev.target.closest('.phead')){m.hidden=true;m.innerHTML=''}
 if(menuFor!==null&&!ev.target.closest('.bmenu'))closeMenu();
});

function renderTicker(){

const FONT_OK=/^[A-Za-z0-9 ]{2,40}$/,HEX=/^#[0-9a-fA-F]{6}$/;
function loadFont(n){if(!FONT_OK.test(n)||document.querySelector(`link[data-f="${n}"]`))return;const l=document.createElement('link');l.rel='stylesheet';l.dataset.f=n;l.href='https://fonts.googleapis.com/css2?family='+encodeURIComponent(n).replace(/%20/g,'+')+':wght@300;400;500;600&display=swap';document.head.appendChild(l)}
function applySettings(){

 $('#mark').textContent=st.name||'';
 document.title=st.name||'Personal Agent';
 [['accent','--blue'],['background','--bg'],['ink','--ink'],['paper','--paper']].forEach(([k,v])=>HEX.test(st[k]||'')?r.setProperty(v,st[k]):r.removeProperty(v));
 if(st.displayFont&&FONT_OK.test(st.displayFont)){loadFont(st.displayFont);r.setProperty('--fd',`"${st.displayFont}"`)}else r.removeProperty('--fd');
 if(st.bodyFont&&FONT_OK.test(st.bodyFont)){loadFont(st.bodyFont);document.body.style.fontFamily=`"${st.bodyFont}",system-ui,sans-serif`}else document.body.style.fontFamily='';
 const h=+st.dockHeight;h>=15&&h<=70?r.setProperty('--dockh',h+'dvh'):r.removeProperty('--dockh');
}

try{const v=localStorage.getItem(VIEWKEY);if(VIEWS.includes(v))viewMode=v}catch(e){}

/* parsing a sentence into an event */
const WD=['sun','mon','tue','wed','thu','fri','sat'];
const CNWD={'日':0,'天':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6};
const MON=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
function parse(text){
 let s=' '+text+' ',date=null,time=null;
 const cut=re=>{s=s.replace(re,' ')};
 let m;
 if(/\b(today|tonight)\b|今天|今晚/i.test(s)){date=new Date(today);cut(/\b(today|tonight)\b|今天|今晚/ig)}
 else if(/\btomorrow\b|明天/i.test(s)){date=addDays(today,1);cut(/\btomorrow\b|明天/ig)}
 else if(m=s.match(/\b(next\s+)?(sun|mon|tue|wed|thu|fri|sat)[a-z]*\b/i)){
  const t=WD.indexOf(m[2].toLowerCase());let diff=(t-today.getDay()+7)%7;if(m[1])diff+=diff===0?7:7;date=addDays(today,diff);cut(m[0]);
 }else if(m=s.match(/(下)?(?:周|星期|礼拜)([一二三四五六日天])/)){
  const t=CNWD[m[2]];let diff=(t-today.getDay()+7)%7;if(m[1])diff+=7;date=addDays(today,diff);cut(m[0]);
 }
 if(!date&&(m=s.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(st|nd|rd|th)?\b/i))){
  date=new Date(today.getFullYear(),MON.indexOf(m[1].toLowerCase()),+m[2]);if(date<today)date.setFullYear(date.getFullYear()+1);cut(m[0]);
 }
 if(!date&&(m=s.match(/(\d{1,2})月(\d{1,2})[日号]?/))){date=new Date(today.getFullYear(),m[1]-1,+m[2]);if(date<today)date.setFullYear(date.getFullYear()+1);cut(m[0])}
 if(!date&&(m=s.match(/\b(\d{1,2})\/(\d{1,2})\b/))){date=new Date(today.getFullYear(),m[1]-1,+m[2]);if(date<today)date.setFullYear(date.getFullYear()+1);cut(m[0])}
 if(m=s.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i)){let h=+m[1]%12;if(m[3].toLowerCase()==='pm')h+=12;time=`${pad(h)}:${m[2]||'00'}`;cut(m[0])}
 else if(m=s.match(/(上午|早上|中午|下午|晚上)?(\d{1,2})[点:：](半|(\d{2})分?)?/)){let h=+m[2];if(/下午|晚上/.test(m[1]||'')&&h<12)h+=12;const mm=m[3]==='半'?'30':(m[4]||'00');time=`${pad(h)}:${mm}`;cut(m[0])}
 else if(m=s.match(/\b(\d{1,2}):(\d{2})\b/)){time=`${pad(+m[1])}:${m[2]}`;cut(m[0])}
 const title=s.replace(/\b(at|on|this|next)\b/ig,' ').replace(/\s+/g,' ').replace(/^[\s,.;:]+|[\s,.;:]+$/g,'').trim();
 return {date,time,title};
}

function reply(text,img){
 const c=S.canvases.find(c=>c.id===S.active);
 if(c.type!=='calendar')return {text:`Noted for ${c.name}. This canvas comes to life in the next build; for now the calendar is listening.`};
 const p=parse(text||'');
 if(img&&!p.date&&!p.time)return {text:'Screenshot received. In the live build, the model reads it and places the event for you. For this preview, add a line such as "Interview Dec 3 2pm".'};
 if(!p.date&&!p.time)return {text:'I could not find a day or a time. Try "Lunch with Claire tomorrow 12:30" or "下周三下午3点 面试".'};
 const date=p.date||today,title=p.title||'Untitled';
 const big=/!|\bhighlight\b|大事|重要/i.test(text||'');
 const e={id:nid(),date:key(date),time:p.time,title:title.replace(/!+|\bhighlight\b|大事|重要/ig,'').trim()||'Untitled',big};
 S.events.push(e);sel=e.date;view={y:date.getFullYear(),m:date.getMonth()};
 const dl=date.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
 return {html:`Added <b>${esc(e.title)}</b>${big?' as a highlight':''} · ${esc(dl)} · ${esc(tlabel(e)||'no time')}${shanghai(e.date,e.time)?` <span style="color:var(--soft)">(${esc(shanghai(e.date,e.time))})</span>`:''}`};
}

/* events */
const TOOLS=()=>[

const brief=()=>JSON.stringify({today:key(today),weekday:today.toLocaleDateString('en-US',{weekday:'long'}),timezone:'America/Los_Angeles',

const dataBlob=u=>{const [h,b]=u.split(',');const bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:h.slice(5).split(';')[0]})};
let busy=false;
async function ask(text,img){
 const sample=await (typeof claude!=='undefined'&&claude.use?claude.use('sample'):null);
 if(!sample)return null;
 const hist=S.msgs.filter(m=>!m.wait).slice(-9,-1).map(m=>`${m.who==='me'?'User':'Assistant'}: ${m.text||(m.html?m.html.replace(/<[^>]+>/g,''):'')}`).join('\n');
 const prompt=`You are the conversation box at the bottom of Personal Agent, a private calendar and daily tracking page. Users write in English or Chinese, by typing, voice or screenshot.

What the page itself offers, so you can point people to it: a month grid above; clicking a day opens it on the right; on that day panel (a bottom sheet on phones) there are daily items of several kinds (check, good/bad, a typed time, number, text and photo) with a plus at the end of the row to add more, then Plans (events) and "+ Add to this day". Each day cell shows a short summary of its values. Clicking an event edits title, date, time (Time, TBD or No time) and "Highlight of the month". Events can be dragged to another day. Highlights scroll in the black ticker at the top. The gear at top right opens Appearance (name, year theme, ticker, colours, fonts, chat height, weekend tint, Shanghai time, week start). Images can be attached with the paperclip, dragged onto the chat, or pasted. The mic turns speech into text.

Use the tools to act: events, daily fields and their values (one spoken sentence may set several fields at once, for example sleep range, weight number, exercise text and ticks), and appearance. Match what the user says to existing fields by meaning before creating a new field. Resolve relative dates from today; times are Pacific. If an image is attached, read it and add what it shows. Only state facts you can see in State; never guess where data came from. Act first, then reply in one or two short sentences in the user's language. No apologies beyond a few words, no dashes, no filler. If a request needs something the tools and page do not offer, say so in one sentence and add that it can be built in the next version.

State:\n${brief()}\n\nRecent conversation:\n${hist||'(none)'}\n\nUser: ${text||'(image only)'}`;
 const opts={tools:TOOLS(),cache:false,modelTier:'default'};
 if(img){try{if((await sample.limits()).images)opts.images=[dataBlob(img)]}catch(e){}}
 const r=await sample(prompt,opts);
 return r.text;
}
$('#form').addEventListener('submit',async ev=>{
 ev.preventDefault();
 if(busy)return;
 const text=$('#q').value.trim(),img=pendingImg;
 if(!text&&!img)return;
 S.msgs.push({who:'me',text,img});
 const w={who:'ai',wait:true,text:'Thinking…'};S.msgs.push(w);
 $('#q').value='';pendingImg=null;$('#thumb').innerHTML='';
 renderMsgs();busy=true;
 let out=null;
 try{out=await ask(text,img)}catch(e){out=e&&e.code==='rate_limited'?'Too many requests just now. Try again in a minute.':(e&&e.code==='not_granted'?null:'Something went wrong on my side. Try once more.')}
 S.msgs=S.msgs.filter(m=>m!==w);
 if(out==null){const r=reply(text,img);S.msgs.push({who:'ai',...r})}
 else S.msgs.push({who:'ai',text:out.trim()});
 busy=false;save();let dict=null,base='',spoke=false;
const use=n=>typeof claude!=='undefined'&&claude.use?claude.use(n):Promise.resolve(null);
use('dictation').then(d=>{if(!d)return;dict=d;$('#mic').classList.add('ready');
 d.onPartial(({text})=>{$('#q').value=(base+' '+text).trim()});
 d.onFinal(({text})=>{base=(base+' '+text).trim();$('#q').value=base;spoke=true});
 d.onState(({state})=>{const on=state==='listening';$('#mic').classList.toggle('on',on);$('#mic').setAttribute('aria-label',on?'Stop':'Speak');
  if(!on&&spoke&&$('#q').value.trim()){spoke=false;$('#form').requestSubmit()}});
}).catch(()=>{});
$('#mic').addEventListener('click',()=>{
 if(!dict){S.msgs.push({who:'ai',text:'Voice is not available in this window. Open the page in Chrome or the Claude desktop app to speak.'});renderMsgs();$('#dock').classList.add('open');return}
 if($('#mic').classList.contains('on')){dict.stop().catch(()=>{});return}
 base=$('#q').value.trim();spoke=false;$('#dock').classList.add('open');
 dict.start().catch(e=>{if(e&&e.code==='not_granted'){dict=null}});
});
render();renderMsgs();
});

/* ---- photos ----
   The phone shrinks the picture before it leaves: a day's photo is a
   record, not a print, so 1280px of JPEG is plenty and it fits in the
   free tier. The state keeps only the key; the bytes live in R2. */
const PHOTO_MAX=1280,PHOTO_BYTES=2*1024*1024;
async function shrink(file){
 const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)});
 const sc=Math.min(1,PHOTO_MAX/Math.max(img.width,img.height));
 const c=document.createElement('canvas');
 c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
 c.getContext('2d').drawImage(img,0,0,c.width,c.height);
 URL.revokeObjectURL(img.src);
 const blob=q=>new Promise(r=>c.toBlob(r,'image/jpeg',q));
 let b=await blob(.72);
 if(b&&b.size>PHOTO_BYTES)b=await blob(.5);
 return b;
}
/* A replaced or cleared picture is not left behind in the bucket. Best
   effort: if the delete fails the state has already moved on. */
const dropPhoto=k=>{if(k)fetch('/api/photo/'+encodeURIComponent(k),{method:'DELETE'}).catch(()=>{})};
async function uploadPhoto(file,group){
 const b=await shrink(file);
 if(!b)throw new Error('could not read that image');
 if(b.size>PHOTO_BYTES)throw new Error('that image is too large');
 const r=await fetch('/api/photo'+(group?'?p='+encodeURIComponent(group):''),{method:'POST',headers:{'content-type':'image/jpeg'},body:b});
 if(!r.ok)throw new Error('upload failed');
 return (await r.json()).key;
}

/* ---- the icon library ----
   1,600 icons are a third of a megabyte, so they are not part of the
   page: the picker fetches them the first time it opens, and what you
   choose is copied into the state and never fetched again. Tags come
   with them, so "meal" finds the fork and knife. */
const LUCIDE='https://cdn.jsdelivr.net/npm/lucide-static@0.544.0/';
let LIB=null,TAGS={},libP=null;
const nodeSvg=nodes=>nodes.map(([tag,at])=>`<${tag} ${Object.entries(at).map(([k,v])=>`${k}="${esc(v)}"`).join(' ')} />`).join('');
function loadIconLib(){
 if(libP)return libP;
 libP=Promise.all([
  fetch(LUCIDE+'icon-nodes.json').then(r=>r.ok?r.json():Promise.reject(new Error('icons'))),
  fetch(LUCIDE+'tags.json').then(r=>r.ok?r.json():{}).catch(()=>({}))
 ]).then(([n,t])=>{LIB=n;TAGS=t||{};return n}).catch(e=>{libP=null;throw e});
 return libP;
}
/* Name first, then the rest of the name, then what it is a picture of. */
function searchIcons(q,max=72){
 if(!LIB)return [];
 const t=q.trim().toLowerCase().replace(/\s+/g,'-');
 if(!t)return [];
 const a=[],b=[],c=[];
 for(const n in LIB){
  const i=n.indexOf(t);
  if(i===0)a.push(n);
  else if(i>0)b.push(n);
  else if((TAGS[n]||[]).some(x=>x.includes(t.replace(/-/g,' '))||x.includes(t)))c.push(n);
 }
 return [...a,...b,...c].slice(0,max);
}
/* Remember the drawing, and that this one was picked most recently. */
function keepIcon(v){
 if(isName(v)&&LIB&&LIB[v]&&!UI_ICONS[v])S.iconlib[v]=nodeSvg(LIB[v]);
 S.iconsUsed=[v,...S.iconsUsed.filter(x=>x!==v)].slice(0,24);
}
/* A state written before the library existed names icons it does not
   carry. Fetch those once, quietly, and the page keeps its faces. */
function healIcons(){
 const want=[...S.fields,...S.retired].map(f=>f&&f.icon).filter(v=>isName(v)&&!svgFor(v));
 if(!want.length)return;
 loadIconLib().then(()=>{
  let got=false;
  want.forEach(n=>{if(LIB[n]){S.iconlib[n]=nodeSvg(LIB[n]);got=true}});
  if(got){save();render()}
 }).catch(()=>{});
}

/* ---- the daily list, edited where it is used ----
   A plus at the end of the row adds an item; a long press on one takes it
   off the list. Taking it off never touches a day that already has a
   value: the field moves to the archive and those days still show it. */
/* `range` still renders wherever it was used, but a new field is one of
   these: a time is typed, and a photo carries its own note and time. */
const typeOptions=sel=>[['check','Check'],['tri','Good / bad'],['time','Time'],['number','Number'],['text','Text'],['photo','Photo']]
 .map(([v,l])=>`<option value="${v}"${v===sel?' selected':''}>${l}</option>`).join('');
/* The colours are shown, not named. */
const swatches=cur=>COLORS.map(c=>`<button class="sw${c===cur?' on':''}" data-sw2="${c}" style="--c:var(--f-${c})" aria-label="${c}" aria-pressed="${c===cur}"></button>`).join('');

/* The picker: what you have used lately, a search over the whole
   library, and a box for an emoji. No list of favourites chosen for
   you. */
function openPicker(host,current,onPick){
 if(!host)return;
 if(host.dataset.open==='1'){host.innerHTML='';host.dataset.open='';return}
 const recent=S.iconsUsed.filter(v=>svgFor(v)||!isName(v)).slice(0,14);
 host.dataset.open='1';
 host.innerHTML=`<div class="ipick">
  ${recent.length?`<div class="irow">${recent.map(v=>`<button class="ib${v===current?' on':''}" data-ic="${esc(v)}" title="${esc(v)}" aria-label="${esc(v)}">${icon(v)}</button>`).join('')}</div>`:''}
  <div class="irow2">
   <input class="isearch" type="search" placeholder="Search icons" aria-label="Search icons" autocomplete="off">
   <input class="iemo" placeholder="emoji" aria-label="Use an emoji instead" autocomplete="off">
  </div>
  <div class="igrid"></div>
  <p class="ihint" aria-live="polite"></p>
 </div>`;
 const grid=host.querySelector('.igrid'),hint=host.querySelector('.ihint'),q=host.querySelector('.isearch'),em=host.querySelector('.iemo');
 const pick=v=>{host.innerHTML='';host.dataset.open='';onPick(v)};
 host.addEventListener('click',ev=>{const b=ev.target.closest('[data-ic]');if(!b)return;
  ev.preventDefault();ev.stopPropagation();pick(b.dataset.ic)});
 const takeEmoji=()=>{const v=emoji(em.value);if(v)pick(v)};
 em.addEventListener('change',takeEmoji);
 em.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();takeEmoji()}});
 const draw=()=>{
  const t=q.value.trim();
  if(!t){grid.innerHTML='';hint.textContent=LIB?'Search for an icon, or type an emoji.':hint.textContent;return}
  const r=searchIcons(t);
  grid.innerHTML=r.map(n=>`<button class="ib" data-ic="${n}" title="${n}" aria-label="${n}"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${nodeSvg(LIB[n])}</svg></button>`).join('');
  hint.textContent=r.length?'':'Nothing by that name. Try another word, or an emoji.';
 };
 let t=null;
 q.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(draw,90)});
 hint.textContent='Fetching the icons\u2026';
 loadIconLib().then(()=>{hint.textContent='Search for an icon, or type an emoji.';draw();try{q.focus()}catch(e){}})
  .catch(()=>{hint.textContent='The icon library is out of reach. An emoji still works.'});
}

function addFieldForm(host){
 let ic='check',co='slate';
 host.innerHTML=`<div class="addf">
  <div class="r"><input id="af-name" placeholder="Name" aria-label="Item name" autocomplete="off"></div>
  <div class="r">
   <button class="pickb" id="af-icon" aria-label="Choose an icon">${icon(ic)}</button>
   <span class="sws" id="af-color">${swatches(co)}</span>
   <select id="af-type" aria-label="Kind">${typeOptions('check')}</select>
  </div>
  <div id="af-pick"></div>
  <div class="r"><button class="ok" id="af-add">Add</button><button class="cancel" id="af-cancel">Cancel</button></div>
 </div>`;
 const name=$('#af-name');name.focus();
 $('#af-icon').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();
  openPicker($('#af-pick'),ic,v=>{ic=v;keepIcon(v);$('#af-icon').innerHTML=icon(v);save()})});
 $('#af-color').addEventListener('click',e=>{const b=e.target.closest('[data-sw2]');if(!b)return;
  e.preventDefault();e.stopPropagation();co=b.dataset.sw2;$('#af-color').innerHTML=swatches(co)});
 const add=()=>{
  const n=name.value.trim();if(!n)return;
  S.fields.push({id:nid(),name:n.slice(0,40),type:$('#af-type').value,icon:ic,color:co});
  /* The form closes with the add, so a second tap cannot repeat it. */
  host.innerHTML='';
  save();render();syncPanel();
 };
 $('#af-add').addEventListener('click',add);
 name.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();add()}});
 $('#af-cancel').addEventListener('click',()=>{host.innerHTML='';});
}
$('#canvas').addEventListener('click',ev=>{const b=ev.target.closest('[data-addf]');if(!b)return;
 ev.preventDefault();ev.stopPropagation();
 if(longPressed)return;
 sel=b.dataset.addf;sheet=true;render();
 const host=$('#addfield');if(host)addFieldForm(host);
},true);

function retire(f){
 S.fields=S.fields.filter(x=>x.id!==f.id);
 if(!S.retired.some(x=>x.id===f.id))S.retired.push(f);
 save();render();syncPanel();
 note(`${f.name} is off the daily list. Days that already have it keep it.`);
 setTimeout(()=>note(''),4000);
}
/* A press held on an item takes it off the list. The flag stops the tap
   that ends the press from also toggling the value. */
let longTimer=null,longPressed=false;
const startPress=ev=>{
 const holder=ev.target.closest('[data-chk],[data-tri]');if(!holder)return;
 const f=fieldById(+(holder.dataset.chk||holder.dataset.tri));if(!f)return;
 longPressed=false;
 clearTimeout(longTimer);
 longTimer=setTimeout(()=>{longPressed=true;retire(f)},600);
};
const endPress=()=>{clearTimeout(longTimer);setTimeout(()=>{longPressed=false},0)};
$('#canvas').addEventListener('pointerdown',startPress,true);
['pointerup','pointercancel','pointerleave','scroll'].forEach(t=>$('#canvas').addEventListener(t,endPress,true));

/* keyboard on day cells, enter key in form */
$('#canvas').addEventListener('keydown',ev=>{const d=ev.target.closest&&ev.target.closest('[data-day]');if(d&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();d.click()}
 if(ev.key==='Enter'&&ev.target.id==='et'){const sv=$('[data-act=save]');sv&&sv.click()}if(ev.key==='Escape'&&editing!=null){editing=null;render()}});
/* drag to reschedule */
let dragId=null;
$('#canvas').addEventListener('dragstart',ev=>{const t=ev.target.closest('[data-drag]');if(!t)return;dragId=+t.dataset.drag;ev.dataTransfer.effectAllowed='move';try{ev.dataTransfer.setData('text/plain',String(dragId))}catch(e){}});
$('#canvas').addEventListener('dragover',ev=>{const d=ev.target.closest('[data-day]');if(!d||dragId==null)return;ev.preventDefault();document.querySelectorAll('.day.drop').forEach(x=>x!==d&&x.classList.remove('drop'));d.classList.add('drop')});
$('#canvas').addEventListener('dragleave',ev=>{const d=ev.target.closest('[data-day]');d&&!d.contains(ev.relatedTarget)&&d.classList.remove('drop')});
$('#canvas').addEventListener('drop',ev=>{const d=ev.target.closest('[data-day]');if(!d||dragId==null)return;ev.preventDefault();const e=S.events.find(x=>x.id===dragId);if(e){e.date=d.dataset.day;sel=e.date}dragId=null;editing=null;save();render()});
$('#canvas').addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.day.drop').forEach(x=>x.classList.remove('drop'))});
/* inline edit: name */
$('#mark').addEventListener('click',()=>{const m=$('#mark');if(m.isContentEditable)return;m.contentEditable='true';m.focus();const r=document.createRange();r.selectNodeContents(m);const sl=getSelection();sl.removeAllRanges();sl.addRange(r)});
const doneName=()=>{const m=$('#mark');if(!m.isContentEditable)return;m.contentEditable='false';S.settings.name=m.textContent.trim().slice(0,40);save();render();syncPanel()};
$('#mark').addEventListener('blur',doneName);
$('#mark').addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();$('#mark').blur()}if(ev.key==='Escape'){$('#mark').textContent=S.settings.name;$('#mark').blur()}});
/* inline edit: ticker */
$('#ticker').addEventListener('click',()=>{
 if($('.tedit'))return;
 if(!S.settings.showTheme){$('#gear').click();return}
 const inp=document.createElement('input');inp.className='tedit';inp.value=S.settings.theme||'';inp.setAttribute('aria-label','Ticker text');
 $('#track').style.display='none';$('#ticker').appendChild(inp);inp.focus();inp.select();
 const done=()=>{S.settings.theme=inp.value.trim().slice(0,80);inp.remove();$('#track').style.display='';save();render();syncPanel()};
 inp.addEventListener('keydown',e=>{if(e.key==='Enter')inp.blur();if(e.key==='Escape'){inp.value=S.settings.theme;inp.blur()}});
 inp.addEventListener('blur',done,{once:true});
});
/* appearance panel */
const SW={accent:['#23408e','#141414','#8a2b2b','#2f5d50','#b4834a','#6b5b95'],background:['#fcfcfa','#ffffff','#f6f3ee','#f2f4f7','#f4efe9','#101114']};
function renderFieldList(){
 const host=$('#flist');if(!host)return;
 host.innerHTML=S.fields.length?S.fields.map((f,i)=>`
  <div class="fitem" style="--fc:${fcol(f)}">
   ${icon(ficon(f))}
   <input class="nm" data-fname="${f.id}" value="${esc(f.name)}" aria-label="Name">
   <span class="acts">
    <button data-fup="${f.id}" aria-label="Move up"${i?'':' disabled style="opacity:.3"'}>↑</button>
    <button data-fdown="${f.id}" aria-label="Move down"${i===S.fields.length-1?' disabled style="opacity:.3"':''}>↓</button>
    <button class="rm" data-frm="${f.id}" aria-label="Remove ${esc(f.name)}">×</button>
   </span>
   <span class="sel2">
    <button class="pickb" data-fpick="${f.id}" aria-label="Icon for ${esc(f.name)}">${icon(ficon(f))}</button>
    <span class="sws" data-fsw="${f.id}">${swatches(f.color)}</span>
    <select data-ftype="${f.id}" aria-label="Kind">${typeOptions(f.type)}</select>
   </span>
   <div class="fpick"></div>
  </div>`).join(''):'<p class="hint2">Nothing yet. Add what you want to log each day.</p>';
}

function syncPanel(){
 const st=S.settings;
 renderFieldList();
 document.querySelectorAll('#panel [data-k]').forEach(el=>{const v=st[el.dataset.k];if(el.type==='range')el.value=v||27;else el.value=v||''});
 document.querySelectorAll('#panel [data-seg]').forEach(g=>{const v=String(st[g.dataset.seg]);g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v))});
 document.querySelectorAll('#panel [data-sw]').forEach(g=>{const k=g.dataset.sw,cur=st[k]||'';
  g.innerHTML=SW[k].map(c=>`<button style="background:${c}" data-c="${c}" aria-label="${c}" aria-pressed="${cur.toLowerCase()===c}"></button>`).join('')+`<input type="color" value="${HEX.test(cur)?cur:SW[k][0]}" aria-label="Custom colour">`});
}
const setK=(k,v)=>{S.settings[k]=v;save();render()};
$('#gear').addEventListener('click',()=>{syncPanel();$('#panel').classList.add('open');$('#panel').setAttribute('aria-hidden','false')});
$('#pclose').addEventListener('click',()=>{$('#panel').classList.remove('open');$('#panel').setAttribute('aria-hidden','true')});
/* The list: rename, re-icon, recolour, reorder, remove. */
$('#panel').addEventListener('change',ev=>{
 const el=ev.target,id=+(el.dataset.ftype||0);
 if(!id)return;
 const f=S.fields.find(x=>x.id===id);if(!f)return;
 if(el.dataset.ftype)f.type=el.value;
 save();render();syncPanel();
});
$('#panel').addEventListener('input',ev=>{const el=ev.target;
 if(el.dataset.fname){const f=S.fields.find(x=>x.id===+el.dataset.fname);if(f){f.name=el.value.slice(0,40);save();render()}return}
 if(el.dataset.k){setK(el.dataset.k,el.type==='range'?+el.value:el.value)}
 if(el.type==='color'){const g=el.closest('[data-sw]');setK(g.dataset.sw,el.value);g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','false'))}});
$('#panel').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;
 if(b.id==='pf-new'){addFieldForm($('#pf-add'));return}
 const move=b.dataset.fup||b.dataset.fdown;
 if(move){const id=+move,i=S.fields.findIndex(f=>f.id===id),j=i+(b.dataset.fup?-1:1);
  if(i>=0&&j>=0&&j<S.fields.length){const[x]=S.fields.splice(i,1);S.fields.splice(j,0,x);save();render();syncPanel()}return}
 if(b.dataset.frm){const f=S.fields.find(x=>x.id===+b.dataset.frm);if(f)retire(f);return}
 if(b.dataset.fpick){const f=S.fields.find(x=>x.id===+b.dataset.fpick);
  if(f)openPicker(b.closest('.fitem').querySelector('.fpick'),ficon(f),v=>{f.icon=v;keepIcon(v);save();render();syncPanel()});return}
 const fsw=b.closest('[data-fsw]');
 if(fsw&&b.dataset.sw2){const f=S.fields.find(x=>x.id===+fsw.dataset.fsw);
  if(f){f.color=b.dataset.sw2;save();render();syncPanel()}return}
 const seg=b.closest('[data-seg]');if(seg){const k=seg.dataset.seg;setK(k,(k==='ticker'||k==='shTime'||k==='showTheme'||k==='weekend')?b.dataset.v==='true':b.dataset.v);syncPanel();return}
 const sw=b.closest('[data-sw]');if(sw){setK(sw.dataset.sw,b.dataset.c);syncPanel();return}
 if(b.id==='preset'){const keep={theme:S.settings.theme,name:S.settings.name};S.settings=Object.assign({name:'',theme:'',themeLabel:'',weekStart:'mon',ticker:true,speed:'normal',shTime:false,showTheme:false,weekend:true},keep);save();render();syncPanel()}});

render();renderMsgs();pull();healIcons();
}
</script>
</body>
