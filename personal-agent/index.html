<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Personal Agent</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agent">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fcfcfa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101114" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: quiet, assured, effortless; the page says little and means it
   IDEA: a desk diary between two cities, ruled paper with one ink colour
   PICTURE: the month itself, hairline grid, days set like a printed agenda
   COLOUR and TYPE: chalk white, ink black, one bleu de France; Cormorant for titles, Jost for the hand
   LAYOUT: canvas above, conversation docked below; on phones the dock folds to one line */
:root{color-scheme:light dark;
--bg:light-dark(#fcfcfa,#101114);--paper:light-dark(#ffffff,#16171b);
--ink:light-dark(#141414,#ecebe6);--soft:light-dark(#6f6d68,#9b9993);
--rule:light-dark(#e6e4df,#2a2b30);--blue:light-dark(#23408e,#8ea8ec);
--wash:light-dark(#eef1f8,#1c2233);
/* Structural edges are a warm hairline and a little shadow, never a black
   rule: the page is paper, not a form. */
--edge:light-dark(#ddd9d1,#2f3137);
/* The ticker is a strip of sky: flat, no gradient, and a muted navy of
   the same temperature after dark. */
--tick-bg:light-dark(#e6edf7,#161d2b);
--tick-ink:light-dark(#1f3354,#c3cee2);
--tick-lab:light-dark(#5b6f8f,#8695af);
/* Field identity, every colour of it here and nowhere else. A field stores
   the key, "c3"; the stylesheet owns what c3 is. Six, in picker order. */
--f-c1:#d9829b;   /* rose */
--f-c2:#ff9f94;   /* salmon */
--f-c3:#6fd3a8;   /* mint */
--f-c4:#7cb8ff;   /* sky */
--f-c5:#b79cff;   /* violet */
--f-c6:#ffc94d;   /* amber */
/* Not a field's to choose: good, bad, done, and the quiet fallback for an
   icon that has no colour of its own. */
--f-sage:light-dark(#5c7a5e,#93b094);
--f-coral:light-dark(#b16a5a,#d99486);
--f-slate:light-dark(#596371,#9aa4b4);
--done:var(--f-sage)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:300 16px/1.55 Jost,system-ui,sans-serif;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:1.5px solid var(--blue);outline-offset:3px}
.app{height:100dvh;display:grid;grid-template-rows:auto auto 1fr auto auto}
.ticker{overflow:hidden;background:var(--tick-bg);color:var(--tick-ink);font-size:13px;letter-spacing:.02em;white-space:nowrap}
.track{display:inline-flex;padding:9px 0;animation:roll var(--dur,40s) linear infinite}
.grp{display:inline-flex;gap:44px;padding-right:44px;min-width:100vw;justify-content:space-around}
.track.still{animation:none;display:flex;justify-content:center;width:100%}.track.still .grp{min-width:0;padding:0}
.ticker:hover .track{animation-play-state:paused}
.track span{display:inline-flex;gap:10px;align-items:baseline}
.track .th{font:italic 500 16px/1 var(--fd,"Cormorant Garamond"),serif;color:var(--tick-ink)}
/* A date and its diamond carry the accent; the word "highlights" steps back. */
.track .k{color:var(--blue)}
.track .lab{color:var(--tick-lab)}
.track .star{color:var(--blue)}
@keyframes roll{to{transform:translateX(-50%)}}

/* top bar */
.top{display:flex;align-items:center;gap:28px;padding:calc(18px + env(safe-area-inset-top)) max(4vw,18px) 0;border-bottom:1px solid var(--rule)}
.mark{font:500 24px/1 var(--fd,"Cormorant Garamond"),serif;letter-spacing:.01em;padding-bottom:14px;white-space:nowrap}
.mark{cursor:text;outline:none;min-width:1ch}
.mark{position:relative}.mark:empty{width:26px;margin-right:-10px}
.mark:empty::before{content:"Name";position:absolute;left:0;font-size:15px;top:4px;color:var(--soft);opacity:0;transition:opacity .2s;white-space:nowrap;background:var(--bg);padding-right:6px}
.top:hover .mark:empty::before,.mark:focus:empty::before{opacity:.5}
.gear{width:44px;height:44px;display:grid;place-items:center;color:var(--soft);margin-bottom:8px;flex:none}
.gear:hover{color:var(--ink)}
.ticker{cursor:text}
.tedit{width:100%;border:0;background:var(--tick-bg);color:var(--tick-ink);font:italic 500 16px/1 var(--fd,"Cormorant Garamond"),serif;padding:9px max(4vw,18px);outline:none}
.seg{display:flex;border:1px solid var(--rule);border-radius:20px;width:max-content;overflow:hidden}
.seg button{padding:6px 14px;font-size:13px;color:var(--soft);min-height:34px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.addev{color:var(--blue);font-size:14px;padding:14px 0;min-height:44px;text-align:left}
.day.drop{background:var(--wash);box-shadow:inset 0 0 0 1.5px var(--blue)}
[draggable=true]{cursor:grab}
.panel{position:fixed;inset:0 0 0 auto;width:min(380px,100%);background:var(--paper);border-left:1px solid var(--edge);box-shadow:-20px 0 50px rgba(0,0,0,.07);z-index:9;padding:22px 26px 40px;overflow:auto;transform:translateX(102%);transition:transform .3s ease}
.panel.open{transform:none}
.panel h3{font:500 28px/1.1 var(--fd,"Cormorant Garamond"),serif;margin:0 0 18px;display:flex;justify-content:space-between;align-items:center}
.panel h3 button{font:300 15px Jost,sans-serif;color:var(--soft);min-height:44px}
.pf{display:grid;gap:6px;padding:12px 0;border-top:1px solid var(--rule)}
.pf>span{font-size:12px;color:var(--soft)}
.pf input[type=text],.pf select{border:0;border-bottom:1px solid var(--rule);background:none;padding:6px 0;font-size:16px;outline:none;width:100%}
.pf input[type=range]{width:100%;accent-color:var(--blue)}
/* One colour setting is one row in normal flow: the label above, every
   swatch beside the next below it. No height is set here; the row is as
   tall as the circles in it. */
.pf .sw{display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:8px;width:100%;min-width:0}
.pf .sw button{width:28px;height:28px;flex:none;padding:0;border-radius:50%;border:1px solid var(--rule)}
.pf .sw button[aria-pressed=true]{box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--blue)}
.pf .sw input[type=color]{width:28px;height:28px;flex:none;border:1px solid var(--rule);background:none;padding:0;border-radius:50%;overflow:hidden}
/* The native colour well is square until it is told otherwise. */
.pf .sw input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.pf .sw input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
.reset{color:var(--soft);font-size:14px;margin-top:18px;min-height:44px}
.tabs{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;flex:1}
.tab{padding:6px 0 14px;font-size:15px;color:var(--soft);border-bottom:1.5px solid transparent;white-space:nowrap;min-height:44px}
.tab[aria-selected=true]{color:var(--ink);border-color:color-mix(in srgb,var(--ink) 55%,var(--bg))}
.add{color:var(--soft);font-size:15px;padding-bottom:14px;min-height:44px;white-space:nowrap}
.add:hover{color:var(--blue)}
.newtab{border:0;border-bottom:1px solid var(--blue);background:none;font-size:15px;width:140px;padding:6px 0;margin-bottom:12px;outline:none}
.newc{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctype{display:inline-flex;gap:4px;margin-bottom:12px}
.ctype button{font-size:13px;padding:5px 10px;border:1px solid var(--rule);border-radius:999px;color:var(--soft);min-height:32px}
.ctype button[aria-pressed=true]{color:var(--ink);border-color:var(--ink)}
/* Map or outline, and a copy of the outline for elsewhere. */
.mviews{display:flex;align-items:center;gap:8px;flex:none;padding-top:4px}
.mviews .seg{flex:none}
.ocopy{font-size:13px;color:var(--soft);padding:0 10px;min-height:34px;border:1px solid var(--rule);border-radius:999px;white-space:nowrap}
.ocopy:hover{color:var(--ink);border-color:var(--ink)}
.mbody{flex:1;min-height:0;display:flex;flex-direction:column}
/* The outline: a title, then the branches as they hang. */
.mout{flex:1;min-height:0;overflow:auto;padding:2px 2px 40px;max-width:720px}
.otitle{font:400 clamp(21px,2.4vw,27px)/1.25 var(--fd,'Cormorant Garamond',serif);margin:0 0 14px}
.orow{display:flex;align-items:baseline;gap:9px;padding:3px 0;min-height:30px}
.obul{color:var(--soft);font-size:14px;line-height:1.5;flex:none;width:12px;text-align:center}
.otext{flex:1;min-width:0;outline:none;font-size:16px;line-height:1.5;padding:1px 2px;border-radius:5px;
 white-space:pre-wrap;overflow-wrap:anywhere}
.otext:empty::before{content:attr(data-hint);color:var(--soft);opacity:.55}
.otext:focus{background:color-mix(in srgb,var(--blue) 7%,transparent)}
.otitle .otext{font:inherit}
/* A first-level branch is underlined in the colour it wears on the sheet. */
.orow.lead .otext{border-bottom:2px solid var(--pc);display:inline-block;flex:0 1 auto;max-width:100%}
.orow.lead .obul{color:var(--pc)}

/* A mind map is a sheet you scroll, with the nodes placed on it. */
.mindc{height:100%;display:flex;flex-direction:column;min-height:0}
.mindc .phead{flex:none}
.msheet{flex:1;min-height:0;border:1px solid var(--rule);border-radius:14px;overflow:auto;background:var(--paper);position:relative;overscroll-behavior:contain}
.mpaper{position:relative}
.mlines{position:absolute;inset:0;pointer-events:none}
.mnode{position:absolute;transform:translate(-50%,-50%);max-width:220px}
.mtext{border:2px solid var(--pc);background:var(--paper);color:var(--ink);border-radius:11px;
 padding:8px 14px;font-size:15px;line-height:1.35;min-width:120px;min-height:40px;max-width:220px;cursor:grab;
 display:flex;align-items:center;justify-content:center;
 white-space:pre-wrap;overflow-wrap:anywhere;text-align:center;touch-action:none;-webkit-user-select:none;user-select:none}
/* An empty node says what to do with it. */
.mtext:empty::before{content:'Type';color:var(--soft);opacity:.55;pointer-events:none}
.mnode.root .mtext{border-color:var(--ink);background:var(--ink);color:var(--paper);font-size:16px}
.mnode.sel .mtext{box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 35%,transparent)}
.mnode.lift{z-index:3}
.mnode.lift .mtext{cursor:grabbing;box-shadow:0 8px 20px rgba(0,0,0,.14)}
.mtext.editing{cursor:text;outline:none;-webkit-user-select:text;user-select:text;background:var(--paper);color:var(--ink)}
/* The four ways on, and the one way off: shown to a pointer that is over
   the node, and to a finger once the node is picked. */
.mplus,.mx{position:absolute;opacity:0;transition:opacity .12s;border:1px solid var(--rule);
 background:var(--paper);color:var(--soft);border-radius:50%;display:grid;place-items:center;
 width:22px;height:22px;font-size:15px;line-height:1;padding:0;z-index:2}
.mplus:hover{color:var(--ink);border-color:var(--ink)}
/* Twelve pixels clear of the border, so nothing ever sits over what the
   node says. */
.mx{top:-34px;right:0;color:var(--f-coral);font-size:14px}
.mx:hover{border-color:var(--f-coral)}
.mplus.up{top:-34px;left:50%;margin-left:-11px}
.mplus.down{bottom:-34px;left:50%;margin-left:-11px}
.mplus.left{left:-34px;top:50%;margin-top:-11px}
.mplus.right{right:-34px;top:50%;margin-top:-11px}
.mnode:hover .mplus,.mnode:hover .mx,.mnode.sel .mplus,.mnode.sel .mx{opacity:1}
.mnode.lift .mplus,.mnode.lift .mx{opacity:0}
/* Nothing in the way of the words while they are being written. */
.mnode.typing .mplus,.mnode.typing .mx{opacity:0;pointer-events:none}
@media(hover:none){.mnode .mplus,.mnode .mx{opacity:0}.mnode.sel .mplus,.mnode.sel .mx{opacity:1}}

/* canvas */
.canvas{overflow:auto;padding:clamp(20px,3vw,40px) max(4vw,18px)}
.cal{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);max-width:1240px;margin:0 auto}
.mhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
h1{font:500 clamp(34px,4.4vw,48px)/1.05 var(--fd,"Cormorant Garamond"),serif;margin:0;letter-spacing:-.01em}
h1 em{font-style:italic;color:var(--soft);font-weight:500}
.nav{display:flex;gap:6px}
.nav button{width:44px;height:44px;border:1px solid var(--rule);border-radius:50%;font-size:17px;color:var(--soft)}
.nav button:hover{color:var(--ink);border-color:var(--ink)}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow span{font-size:12px;color:var(--soft);padding:0 0 8px 8px}
.grid{border-top:1px solid var(--edge);border-left:1px solid var(--rule)}
/* A short stroke under the number, as wide as the number is: enough to
   see across a year, little enough to leave the day alone. */
.pbar{position:absolute;left:0;right:0;bottom:-2px;height:3px;border-radius:2px;
 background:var(--pc);transform:rotate(-7deg);pointer-events:none}
.day .n,.day .chips,.day .more,.day .sum,.day .marks{position:relative;z-index:1}
.yd i,.day .n{position:relative}
/* The number's box is drawn tight around the digits, so the line below
   it belongs plainly to that day and not to the next. */
.yd i .pbar{bottom:-3px;height:2px}
/* The year, as a paper planner holds one. */
.year{max-width:1100px;margin:0 auto;height:100%;display:flex;flex-direction:column;min-height:0}
.ygrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;flex:1;min-height:0;padding-bottom:4px}
/* The floor goes on the track, not on the cell: a cell taller than its
   own row would sit on top of the day below it. */
.ycol{display:grid;grid-template-rows:auto repeat(31,minmax(var(--yrow,20px),1fr));gap:1px;min-width:0;min-height:0}
.ycol b{font-weight:400;font-size:12px;color:var(--soft);text-align:center;padding-bottom:4px;letter-spacing:.04em}
.yd{position:relative;display:grid;place-items:center;font-size:11px;color:var(--ink);
 border-radius:3px;background:none;font-variant-numeric:tabular-nums}
.yd i{font-style:normal;line-height:1;display:inline-block}
.yd.we{color:var(--soft)}
.yd.none{visibility:hidden}
.yd:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.yd.today i{font-weight:500;color:var(--blue)}
/* The switch beside the day's own items: the stroke itself, pale until
   the day is marked. */
.pertog{display:inline-flex;align-items:center;justify-content:center;position:relative;margin:2px 0 10px;
 width:48px;min-height:36px;border:1px solid var(--rule);border-radius:999px}
.pertog .pbar{position:static;transform:rotate(-7deg);width:20px;height:3px;left:auto;right:auto;bottom:auto;flex:none;opacity:.28}
.pertog.on{border-color:var(--pc)}
.pertog.on .pbar{opacity:1}
.day{position:relative;min-height:clamp(86px,13dvh,132px);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:7px 8px;text-align:left;display:flex;flex-direction:column;gap:3px;background:var(--paper);transition:background .25s}
.day:hover{background:var(--wash)}
.day.out{background:transparent;color:var(--soft);opacity:.55}
.wkend .day.we:not(.out){background:var(--wash)}
.wkend .dow span.we{color:var(--blue)}
.daily{margin:0 0 22px}
.daily h4,.flex h4,.donel h4{font:500 12px/1 Jost,sans-serif;color:var(--soft);margin:0 0 8px;letter-spacing:.02em}
.fd{display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr) 28px;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--rule);font-size:15px;min-height:46px}
.fd:last-of-type{border-bottom:1px solid var(--rule)}
.fd>span{color:var(--soft);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fd input[type=checkbox]{width:20px;height:20px;accent-color:var(--blue);justify-self:start}
.fd .tri{width:30px;height:30px;border:1px solid var(--rule);border-radius:7px;display:grid;place-items:center;font-size:15px;line-height:1;color:var(--soft);justify-self:start}
.fd .tri.good{color:var(--blue);border-color:var(--blue)}
.fd .tri.bad{color:var(--ink);border-color:var(--ink)}
.fd input[type=number],.fd input[type=text],.fd input[type=time]{border:0;border-bottom:1px solid transparent;background:none;font-size:16px;padding:4px 0;outline:none;width:100%}
.fd input:focus{border-bottom-color:var(--blue)}
.fd .rg{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.fd .rg input{width:7.6em}.fd .rg em{font-style:normal;color:var(--soft);font-size:13px;white-space:nowrap}
.fd .x{color:var(--soft);opacity:.0;font-size:18px;width:28px;height:28px}.fd:hover .x,.fd:focus-within .x{opacity:1}
/* One toggle, three places: the week row, the day sheet, the settings
   list. 44px square so a thumb can find it. */
.ic{width:20px;height:20px;display:block;flex:none}
.tgl{width:44px;height:44px;border:1px solid var(--rule);border-radius:11px;display:grid;place-items:center;color:var(--soft);background:none;flex:none}
.tgl .ic{color:var(--fc,var(--f-slate));opacity:.45}
.tgl.on{border-color:var(--done);background:color-mix(in srgb,var(--done) 12%,transparent)}
.tgl.on .ic{color:var(--done);opacity:1}
.tgl.good{border-color:var(--f-sage);background:color-mix(in srgb,var(--f-sage) 12%,transparent)}
.tgl.good .ic{color:var(--f-sage);opacity:1}
.tgl.bad{border-color:var(--f-coral);background:color-mix(in srgb,var(--f-coral) 12%,transparent)}
.tgl.bad .ic{color:var(--f-coral);opacity:1}
.tgl.adding{border-style:dashed}
.fname{display:flex;align-items:center;gap:8px;min-width:0}
.fname .ic{width:17px;height:17px;color:var(--fc,var(--f-slate))}
.fname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* The view switcher, under the month name in every view. */
.vsw{margin:0 0 14px}
.vsw button{min-height:40px;padding:6px 16px;font-size:14px}

/* A month cell on a phone carries marks, not words. */
.marks{display:none;gap:3px;flex-wrap:wrap;justify-content:center;margin-top:auto;align-items:center}
.mk{display:block;line-height:0}
.mk.dot{width:6px;height:6px;border-radius:50%;background:var(--fc,var(--f-slate))}
.mk .ic{width:11px;height:11px}
.mk.good{color:var(--f-sage)}
.mk.bad{color:var(--f-coral)}

/* One day on its own. */
.dayview{max-width:720px;margin:0 auto}
.dayview .mhead{margin-bottom:12px}
.dayview h1 em{font-size:.62em}

/* The week, one row a day, its fields running across. */
.week{max-width:760px;margin:0 auto}
.wk{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--rule)}
.wk:last-of-type{border-bottom:1px solid var(--rule)}
.wk.today .wd b{background:var(--ink);color:var(--bg)}
.wd{display:flex;align-items:center;gap:7px;min-height:44px;color:var(--ink);font-size:16px}
.wd b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:500;font-size:15px;flex:none}
.wd i{font-style:normal;color:var(--soft);font-size:13px}
.wkf{display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none;padding:1px 0}
.wkf::-webkit-scrollbar{display:none}
.wkv{display:flex;align-items:center;gap:6px;height:44px;padding:0 10px;border:1px solid var(--rule);border-radius:11px;font-size:16px;flex:none;color:var(--ink)}
.wkv .ic{width:17px;height:17px;color:var(--fc,var(--f-slate));opacity:.75}
.wkv input{border:0;background:none;outline:none;font-size:16px;width:4.6em;padding:0;color:inherit}
.wkv input[type=time]{width:6.4em}
.wkv.set{border-color:var(--fc,var(--f-slate))}
.wkv b{font-weight:400;font-size:15px;font-variant-numeric:tabular-nums}
button.wkv{padding:0 9px;gap:5px;color:var(--soft)}
button.wkv.set{color:var(--ink)}
/* A day with plans says so beside its number, so the row of fields keeps
   the whole width it has. */
.wd u{width:5px;height:5px;border-radius:50%;background:var(--blue);display:block;flex:none;text-decoration:none}

/* The day's items, as a row of toggles with their names under them. */
.chkrow{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:flex-start;padding:4px 0 12px}
.chkitem{display:flex;flex-direction:column;align-items:center;gap:5px;width:60px;max-width:100%;min-width:0;text-align:center}
.chkitem em{font-style:normal;font-size:11px;line-height:1.25;color:var(--soft);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
/* The name is the item's own; a tap opens it for writing and a long
   press asks to take it off. The phone is told not to offer its own
   menu over it, so the press stays ours. */
.fnm{cursor:text;border-radius:5px;padding:0 3px;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.fnm:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
/* An open name makes room for itself and for the one red thing on the
   page. */
.chkitem.naming{display:grid;grid-template-columns:auto auto;justify-items:center;align-items:center;gap:5px 8px;width:auto}
.chkitem.naming>:first-child{grid-column:1/-1}
.delnm{color:var(--f-coral);font-size:12px;padding:2px 6px;border-radius:7px;white-space:nowrap;flex:none}
.delnm:hover{background:color-mix(in srgb,var(--f-coral) 12%,transparent)}
.rmmk{color:var(--f-coral);font-size:13px;padding:0 8px;height:40px;border-radius:9px;flex:none}
.rmmk:hover{background:color-mix(in srgb,var(--f-coral) 12%,transparent)}
.tgl .plus{font-size:21px;line-height:1;color:var(--soft)}
/* Two faces and a line that sits with them. */
.pair{display:inline-flex;align-items:center;gap:6px}
.pair .av{width:1.45em;height:1.45em;width:1lh;height:1lh;flex:none;vertical-align:middle}
.soon{display:block;margin-top:2px;font-size:12px;line-height:1.4;color:var(--soft)}
.fnm.editing{-webkit-user-select:text;user-select:text;display:block;-webkit-line-clamp:none;color:var(--ink);outline:none;background:color-mix(in srgb,var(--blue) 10%,transparent)}
.fitem.gone b i{font-style:normal;color:var(--soft);font-size:12px}
.fitem.gone .back{width:auto;padding:0 10px;font-size:13px;color:var(--blue)}
.chkitem .wkv{height:44px}
.chkitem:has(.wkv){width:auto}
/* A time is typed, so it needs no more room than it shows, and a value
   before five in the morning says which night it belongs to. */
.wkv input.tmi{width:4.4em;font-variant-numeric:tabular-nums}
.wkv .nb{font-style:normal;font-size:10px;color:var(--soft);white-space:nowrap}
/* A photo field is a row of its own: the picture, then its note and its
   time beside it. */
.chkitem:has(.pho){width:100%;flex-direction:row;align-items:center;gap:10px;text-align:left}
.chkitem:has(.pho) em{order:-1;-webkit-line-clamp:1;flex:none;max-width:5em}
.pho{display:flex;align-items:center;gap:8px;flex:1;min-width:0;max-width:460px}
.pho.busy{opacity:.5;pointer-events:none}
.shot{width:44px;height:44px;flex:none;border:1px solid var(--rule);border-radius:11px;display:grid;place-items:center;overflow:hidden;cursor:pointer}
.pho.set .shot{border-color:var(--fc,var(--f-slate))}
.shot .ic{width:19px;height:19px;color:var(--fc,var(--f-slate));opacity:.55}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot input{display:none}
.phf{display:flex;gap:6px;flex:1;min-width:0}
.phf input{height:44px;min-width:0;border:1px solid var(--rule);border-radius:11px;background:none;color:var(--ink);font-size:16px;padding:0 10px;outline:none}
.phf input[data-pk=text]{flex:1}
.phf input.tmi{width:5.2em;flex:none}
.phx{width:28px;height:28px;flex:none;border:0;background:none;color:var(--soft);font-size:18px;line-height:1;cursor:pointer}
button.wkv.pht{padding:0;width:44px;overflow:hidden}
button.wkv.pht img{width:100%;height:100%;object-fit:cover}
.addf{display:grid;gap:8px;padding:10px 0 2px;border-top:1px solid var(--rule)}
.addf .r{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.addf input{flex:1;border:0;border-bottom:1px solid var(--rule);background:none;font-size:16px;padding:9px 0;outline:none;min-height:44px}
.addf input:focus{border-color:var(--blue)}
.addf select{border:1px solid var(--rule);border-radius:10px;background:none;font-size:15px;padding:10px;color:var(--ink);min-height:44px}
.addf .ok{color:var(--blue);font-size:15px;min-height:44px;padding:0 6px}
.addf .cancel{color:var(--soft);font-size:15px;min-height:44px;padding:0 6px}
/* ---- choosing a face and a colour ----
   The button shows the icon it holds; the swatches show the colours
   themselves. Nothing here is a list of names. */
/* A field's colour wells. They were called .sw, which is also the name of
   the Appearance panel's colour row, so this rule was sizing that row to
   26px and spilling its swatches over everything below. Their own name
   now. */
.sws{display:flex;gap:6px;align-items:center;flex:none}
.cw{width:26px;height:26px;flex:none;border-radius:50%;background:var(--c);border:1px solid color-mix(in srgb,var(--ink) 12%,transparent)}
.cw.on{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--c)}
/* An emoji brings its own colours, so it is only ever placed, never
   painted. */
.emo{display:grid;place-items:center;font-size:15px;line-height:1;font-style:normal;overflow:visible}
.tgl .emo{font-size:19px}
.mk .emo{font-size:9px}

/* The settings list of items. */
.flist{display:grid;gap:2px;padding:2px 0}
/* The kinds as one row: a tick, a tick or a cross, free text, then every
   emoji added so far, then a plus for one more. */
.mrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.mk2{width:40px;height:40px;flex:none;border:1px solid var(--rule);border-radius:10px;display:grid;place-items:center;color:var(--ink)}
.mk2:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.mk2.on{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.mk2 .two{display:flex;align-items:center;gap:1px}
.mk2 .two .ic{width:13px;height:13px}
.mk2.addm{color:var(--soft);font-size:21px;line-height:1}
.aa{font-size:14px;line-height:1;letter-spacing:.02em}
.emoin{width:64px;height:40px;flex:none;border:1px solid var(--blue);border-radius:10px;background:none;text-align:center;font-size:19px;padding:0;outline:none;color:var(--ink)}
/* Free text is as wide as what it says, and no wider than the cell it
   sits in. */
.wkv.txt{max-width:100%}
.wkv.txt input{max-width:100%;min-width:4ch}
.wkv.txt input::placeholder{color:var(--soft);opacity:.6}
/* One question, where the cell is. */
.fmenu{position:fixed;z-index:60;min-width:190px;max-width:280px;display:grid;gap:6px;padding:10px;
 border:1px solid var(--rule);border-radius:12px;background:var(--paper);box-shadow:0 10px 30px rgba(0,0,0,.14)}
.fmenu p{margin:0;font-size:13px;color:var(--soft);line-height:1.45}
.fmenu button{text-align:left;font-size:15px;padding:8px;border-radius:8px;min-height:40px}
.fmenu button:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.fmenu .warn{color:var(--f-coral)}
.fitem{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule);min-height:44px}
.fitem .ic{width:18px;height:18px;color:var(--fc,var(--f-slate))}
.fitem .face{display:grid;place-items:center;color:var(--fc,var(--f-slate))}
.fitem .face .two .ic{width:11px;height:11px}
.fitem .face .aa{font-size:13px}
.fitem b{font-weight:400;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fitem .acts{display:flex;gap:2px}
.fitem .acts button{width:36px;height:36px;color:var(--soft);font-size:15px;border-radius:8px}
.fitem .acts button:hover{color:var(--ink)}
.fitem .acts .rm:hover{color:var(--f-coral)}
.fitem .sel2{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding-bottom:2px}
.fitem input.nm{border:0;background:none;font-size:15px;padding:4px 0;outline:none;width:100%;color:var(--ink)}
.fitem input.nm:focus{border-bottom:1px solid var(--blue)}
.hint2{font-size:12px;color:var(--soft);margin:8px 0 0;line-height:1.5}

/* Adding an item without leaving the day. */
.newf{display:flex;gap:8px;align-items:center;margin-top:6px}
.newf input{flex:1;border:0;border-bottom:1px solid var(--rule);background:none;font-size:15px;padding:8px 0;outline:none}
.newf input:focus{border-color:var(--blue)}
.newf select{border:1px solid var(--rule);border-radius:16px;background:none;font-size:13px;padding:6px 10px;color:var(--soft)}
.day .sum{margin-top:auto;font-size:11px;line-height:1.3;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.shut{display:none}
.tasks{max-width:760px;margin:0 auto}
.tasks .prog{height:3px;background:var(--rule);margin:14px 0 6px;border-radius:2px;overflow:hidden}.tasks .prog i{display:block;height:100%;background:var(--blue);transition:width .4s ease}
.tasks .pc{font-size:13px;color:var(--soft);margin:0 0 12px}
/* How the list is read: by section or by what is left, and the finished
   ones newest or oldest first. */
.tsw{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.tsw .seg{flex:none}
.tasks h4{font:500 12px/1 Jost,sans-serif;color:var(--soft);margin:26px 0 8px}
.tk{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--rule);font-size:16px;cursor:pointer}
.tk input{width:19px;height:19px;accent-color:var(--blue);flex:none}
.tk span{flex:1}.tk.done span{color:var(--soft);text-decoration:line-through;text-decoration-color:var(--rule)}
.tk .dd{font-style:normal;font-size:12px;color:var(--soft);white-space:nowrap}
.donel{margin-top:22px}.donel .dn{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--rule);font-size:15px}.donel .dn b{color:var(--blue);font-weight:500}
.tk .x{color:var(--soft);opacity:0;font-size:18px;width:28px;height:28px}.tk:hover .x{opacity:1}
.addtk{border:0;border-bottom:1px solid var(--rule);background:none;font-size:15px;padding:10px 0;width:100%;outline:none;margin-top:18px}
.dock.drag{box-shadow:inset 0 0 0 2px var(--blue)}
.day .n{font-size:14px;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;margin:-3px 0 0 -4px}
.day.today .n{background:var(--ink);color:var(--bg)}
.day.sel{box-shadow:inset 0 0 0 1.5px var(--blue)}
.chip{font-size:12px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.chip::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--blue);margin:0 6px 2px 0}
.chip.big{font-weight:500}.chip.big::before{border-radius:0;transform:rotate(45deg)}
.ev .ttl .hl{color:var(--blue);font-size:13px;margin-left:8px}
.tog{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--soft)}
.more{font-size:11px;color:var(--soft)}
/* A long title is cut at the edge of its own day rather than running into
   the next one: the cell clips, the chips stack, each one is a block that
   can be ellipsed. */
.day{overflow:hidden}.day .chips{display:flex;flex-direction:column;gap:2px;min-width:0;width:100%}.chip{display:block;max-width:100%}

/* agenda */
.agenda h2{font:500 30px/1.1 var(--fd,"Cormorant Garamond"),serif;margin:6px 0 4px}
.agenda .sub{color:var(--soft);font-size:14px;margin:0 0 22px}
.ev{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:16px;padding:16px 0;border-top:1px solid var(--rule);width:100%;text-align:left}
.ev:last-of-type{border-bottom:1px solid var(--rule)}
.ev.nt{grid-template-columns:minmax(0,1fr)}.ev.nt .t{display:none}
.ev .t{font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ev .ttl{font-size:17px;font-weight:400}
.ev .sh{font-size:12.5px;color:var(--soft);margin-top:2px}
.empty{color:var(--soft);font:italic 500 20px/1.4 var(--fd,"Cormorant Garamond"),serif;padding:18px 0;border-top:1px solid var(--rule)}
.edit{display:grid;gap:10px;padding:4px 0 18px}
.edit input{border:0;border-bottom:1px solid var(--rule);background:none;padding:8px 0;font-size:16px;outline:none}
.edit input:focus{border-color:var(--blue)}
.row{display:flex;gap:18px;font-size:14px}
.row .del{color:var(--soft)}.row .ok{color:var(--blue)}
/* ---- a page of blocks ---- */
.page{max-width:720px;margin:0 auto;padding-bottom:10vh}
.phead{position:relative;display:flex;align-items:flex-start;gap:8px}
.ptitle{font:400 clamp(28px,4vw,40px)/1.15 var(--fd,'Cormorant Garamond',serif);margin:0 0 14px;flex:1;outline:none}
.ptitle:focus{border-bottom:1px solid var(--rule)}
.ptitle:empty::before{content:attr(data-hint);color:var(--soft)}
.pset{width:36px;height:36px;border-radius:9px;color:var(--soft);font-size:18px;line-height:1;flex:none}
.pset:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 6%,transparent)}
.pmenu{position:absolute;right:0;top:40px;z-index:5;min-width:210px;display:grid;gap:6px;padding:10px;border:1px solid var(--rule);border-radius:12px;background:var(--paper);box-shadow:0 10px 30px rgba(0,0,0,.12)}
.pmenu[hidden]{display:none}
.pmenu p{margin:0;font-size:13px;color:var(--soft)}
.pmenu button{text-align:left;font-size:15px;padding:8px;border-radius:8px;min-height:40px}
.pmenu button:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.pmenu .warn{color:var(--f-coral)}
.blocks{display:grid}
.bl{position:relative;display:flex;align-items:flex-start;gap:8px;padding:2px 0 2px 22px;border-radius:6px}
.bl.lift{opacity:.5}
.bl.busy{opacity:.5;pointer-events:none}
.bl.dropline::before{content:'';position:absolute;left:22px;right:0;top:-1px;height:2px;background:var(--blue)}
.blocks.dropend::after{content:'';display:block;height:2px;margin-left:22px;background:var(--blue)}
/* The handle sits in the margin and only shows itself when you are near
   the block, so a page of writing stays a page of writing. */
.bh{position:absolute;left:0;top:4px;width:18px;height:24px;cursor:grab;touch-action:none;opacity:0;transition:opacity .12s;
 background:radial-gradient(circle at 5px 6px,var(--soft) 1.3px,transparent 1.4px),radial-gradient(circle at 11px 6px,var(--soft) 1.3px,transparent 1.4px),
  radial-gradient(circle at 5px 12px,var(--soft) 1.3px,transparent 1.4px),radial-gradient(circle at 11px 12px,var(--soft) 1.3px,transparent 1.4px),
  radial-gradient(circle at 5px 18px,var(--soft) 1.3px,transparent 1.4px),radial-gradient(circle at 11px 18px,var(--soft) 1.3px,transparent 1.4px)}
.bl:hover .bh,.bl:focus-within .bh{opacity:.75}
.bt{flex:1;min-width:0;outline:none;white-space:pre-wrap;word-break:break-word;padding:3px 0;line-height:1.6}
.bt:empty::before{content:attr(data-hint);color:var(--soft);pointer-events:none}
.bl.h .bt{font:400 clamp(19px,2.4vw,23px)/1.35 var(--fd,'Cormorant Garamond',serif);padding-top:14px}
.bl.todo input{width:17px;height:17px;margin:7px 0 0;accent-color:var(--done);flex:none}
.bl.todo.done .bt{color:var(--soft);text-decoration:line-through}
.bul{width:17px;flex:none;text-align:center;color:var(--soft);line-height:1.9}
.bul::before{content:'\2022'}
.bl.img{align-items:center}
.bl.img img{max-width:100%;border-radius:10px;display:block}
.bimg{display:inline-grid;place-items:center;min-height:88px;padding:0 20px;border:1px dashed var(--rule);border-radius:10px;color:var(--soft);font-size:14px;cursor:pointer}
.bimg input{display:none}
.bx{opacity:0;width:28px;height:28px;color:var(--soft);font-size:17px;flex:none}
.bl.img:hover .bx,.bl.img:focus-within .bx{opacity:1}
.bmenu{position:absolute;left:22px;top:100%;z-index:6;min-width:170px;display:grid;gap:2px;padding:6px;border:1px solid var(--rule);border-radius:11px;background:var(--paper);box-shadow:0 10px 30px rgba(0,0,0,.12)}
.bmenu button{text-align:left;font-size:15px;padding:8px 10px;border-radius:8px;min-height:38px}
.bmenu button.on{background:var(--wash)}
.pfill{min-height:34vh;cursor:text}
.blank{max-width:640px;margin:12vh auto 0;text-align:center}
.blank p{color:var(--soft)}
/* Until the chat answers, nothing on the page offers it. */
.nochat .dock,.nochat .chatonly{display:none}
.note{font-size:12px;color:var(--soft);margin-top:26px}

/* chat dock */
.dock{border-top:1px solid var(--edge);box-shadow:0 -16px 40px rgba(0,0,0,.05);background:var(--paper);height:var(--dockh,clamp(190px,27dvh,300px));display:grid;grid-template-rows:auto 1fr auto}
/* The grip is the whole top edge: drag it to resize, tap it to fold the
   conversation down to this bar and tap again to bring it back. */
.grip{height:22px;display:grid;place-items:center;cursor:ns-resize;touch-action:none;color:var(--soft);background:none;width:100%;border-radius:0}
.grip::before{content:'';width:38px;height:3px;border-radius:2px;background:var(--edge)}
.grip:hover::before{background:var(--soft)}
.dock.down{height:auto}
.dock.down .msgs,.dock.down .bar,.dock.down .sync{display:none}
.dock.down .grip{height:34px;cursor:pointer}
.dock.down .grip::before{width:54px}
.dock.sizing{user-select:none}
.msgs{overflow:auto;padding:16px max(4vw,18px) 6px;display:flex;flex-direction:column;gap:10px}
.sync{margin:0;padding:6px max(4vw,18px);font-size:12.5px;color:var(--soft);border-top:1px solid var(--edge)}
.sync[hidden]{display:none}
.m{max-width:min(620px,85%);font-size:15px;line-height:1.5;animation:in .35s ease}
.m.me{align-self:flex-end;background:var(--wash);padding:8px 14px;border-radius:14px 14px 3px 14px}
.m.ai{align-self:flex-start;color:var(--ink);max-width:100%}
.m.ai b{font-weight:500;color:var(--blue)}
.m.ai.wait{color:var(--soft);font-style:italic}
.m img{display:block;max-width:180px;border-radius:8px;margin-bottom:6px}
.bar{display:flex;align-items:center;gap:10px;padding:10px max(4vw,18px) max(14px,env(safe-area-inset-bottom))}
.clip{width:44px;height:44px;border-radius:50%;border:1px solid var(--rule);display:grid;place-items:center;flex:none;color:var(--soft);cursor:pointer}
.clip:hover{color:var(--ink);border-color:var(--edge)}
.clip input{display:none}
.mic{display:grid}
.mic.on{color:var(--bg);background:var(--blue);border-color:var(--blue);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--blue) 18%,transparent)}}
.field{flex:1;display:flex;align-items:center;border:1px solid var(--rule);border-radius:24px;padding:0 6px 0 18px;min-height:46px;background:var(--bg)}
.field:focus-within{border-color:var(--blue)}
.field input{flex:1;border:0;background:none;outline:none;font-size:16px;padding:10px 0}
.send{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.thumb{position:relative;flex:none}
.thumb img{width:36px;height:36px;object-fit:cover;border-radius:6px;display:block;margin-right:8px}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ticker{overflow-x:auto}}

/* phone */
@media(max-width:760px){
 .top{gap:16px}.mark{font-size:21px}
 .cal{grid-template-columns:minmax(0,1fr)}
 .day{min-height:52px;padding:5px;align-items:center}
 /* The week is the phone's calendar; the sheet is where a day is edited. */
 .week{max-width:none}
 .mhead{margin-bottom:12px}
 h1{font-size:clamp(26px,7vw,34px)}
 .nav button{width:44px;height:44px}
 .chkitem{width:56px}
 .tgl,.wkv{min-height:44px}
 /* Five items and a date fit across a phone without a sideways scroll. */
 .wk{grid-template-columns:46px minmax(0,1fr);gap:8px}
 .wd{gap:5px}
 .wd b{width:28px;height:28px;font-size:14px}
 .wd i{display:none}
 .wkf{gap:6px}
 button.wkv{max-width:82px;padding:0 8px}
 button.wkv b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .agenda .daily{padding-bottom:4px}
 .day .n{margin:0;font-size:13px}
 .chip{font-size:0;width:5px;height:5px}.chip::before{margin:0}
 /* Dots, not titles, so they run across the cell: the column direction
    above is for the wide layout only. */
 .day .chips{display:flex;flex-direction:row;align-items:center;gap:3px;justify-content:center;flex-wrap:wrap}
 .more{display:none}
 .dow span{padding-left:0;text-align:center}
 .dock{height:auto}
 .ygrid{gap:2px}
 .ycol b{font-size:10px}
 .ycol{--yrow:16px}
 .yd{font-size:9.5px}
 .day .sum{display:none}
 .marks{display:flex}

<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const today=new Date();today.setHours(0,0,0,0);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

const seed=()=>({
 canvases:[{id:'cal',name:'Calendar',type:'calendar'}],
 active:'cal',
 events:[],

 msgs:[{who:'ai',text:'Tell me what is coming up, or what to change on this page. A sentence or a screenshot works.'}],
 seq:10
});
/* Everything a stored state needs before the page can draw it: defaults for
   settings added since it was written, and the older shapes carried
   forward. Runs on whatever arrives, from the cache or from the server. */
function prepare(){
 S.settings=Object.assign({name:'Personal Agent',theme:'',themeLabel:'',weekStart:'mon',ticker:true,speed:'normal'},S.settings||{});
 S.msgs=(S.msgs||[]).filter(m=>!m.wait);
 if(S.settings.shTime===undefined)S.settings.shTime=false;
 if(S.settings.showTheme===undefined)S.settings.showTheme=false;
 if(!S.m3){if(!S.settings.name)S.settings.name='Personal Agent';S.m3=true}
 S.fields=S.fields||(S.habits||[]).map(h=>({id:h.id,name:h.name,type:'check'}));S.vals=S.vals||{};
 if(S.checks){for(const [d,ids] of Object.entries(S.checks)){S.vals[d]=S.vals[d]||{};ids.forEach(id=>S.vals[d][id]=true)}}
 delete S.habits;delete S.checks;
 if(S.settings.weekend===undefined)S.settings.weekend=true;
 S.tasks=S.tasks||{};
 /* A page is a list of blocks, kept per canvas. Each block has an id, so
    two devices writing different blocks of the same page both keep their
    work. */
 S.pages=(S.pages&&typeof S.pages==='object'&&!Array.isArray(S.pages))?S.pages:{};
 /* One mind map per canvas that holds one. */
 S.minds=(S.minds&&typeof S.minds==='object'&&!Array.isArray(S.minds))?S.minds:{};

 /* Fields gain an icon and a colour, and a removed one is archived rather
    than dropped, so a day that already carries its value keeps the name it
    was written under. Nothing recorded is touched. */
 if(!S.m10){
  const guess=n=>{const t=String(n).toLowerCase();
   if(/slept|sleep|bed|lights|asleep/.test(t))return['moon','c5'];
   if(/woke|wake|sunrise/.test(t))return['sunrise','c5'];
   if(/weight|scale|kg|lb/.test(t))return['scale','c3'];
   return['check','c1']};
  (S.fields||[]).forEach(f=>{const[i,c]=guess(f.name);if(!f.icon)f.icon=i;if(!f.color)f.color=c});
  S.m10=true;
 }
 S.retired=Array.isArray(S.retired)?S.retired:[];
 /* The palette is new; each field keeps its place in the old order, so a
    name is all that changes and nothing recorded is touched. */
 if(!S.m11){
  const moved={indigo:'c1',sage:'c2',coral:'c3',terracotta:'c4',slate:'c5'};
  [...(S.fields||[]),...S.retired].forEach(f=>{if(f&&moved[f.color])f.color=moved[f.color]});
  S.m11=true;
 }
 /* One row of marks replaced the kind dropdown: a time or a number is
    free text now, and every character already typed stays as typed. A
    photo keeps its own kind, so the pictures still show. */
 if(!S.m12){
  [...(S.fields||[]),...S.retired].forEach(f=>{if(f&&(f.type==='time'||f.type==='number'))f.type='text'});
  S.m12=true;
 }
 /* The emoji the row offers. Anything an item already wears is offered
    again, so a face can always be given back. */
 {/* The emoji added with the plus, and only those: the tick, the tick or
     cross, Aa and the shoes are fixed and live in the code. An emoji is
     anything that is not a lucide name, spelled out here because the
     icon helpers are declared further down. */
  const named=v=>/^[a-z0-9-]+$/.test(String(v||''));
  S.marks=Array.isArray(S.marks)?S.marks.filter(v=>typeof v==='string'&&v&&!named(v)&&v!=='🩰').slice(0,24):[];}
 /* The drawing of every icon in use travels with the state; the library
    itself is only ever a search away. Anything no longer referenced is
    dropped, so this cannot grow without end. */
 S.iconlib=(S.iconlib&&typeof S.iconlib==='object')?S.iconlib:{};
 S.iconsUsed=Array.isArray(S.iconsUsed)?S.iconsUsed.filter(v=>typeof v==='string').slice(0,24):[];
 {const keep=new Set([...S.fields,...S.retired].map(f=>f&&f.icon).concat(S.iconsUsed).filter(Boolean));
  Object.keys(S.iconlib).forEach(k=>{if(!keep.has(k))delete S.iconlib[k]})}
 /* The year moved into the calendar's own switch, so the tab it had for
    a day is taken down again. Only that one: a canvas anybody made by
    hand is left alone. */
 if(!S.m14){
  const mine=S.canvases.findIndex(c=>c&&c.id==='year'&&c.type==='year');
  if(mine>=0){S.canvases.splice(mine,1);if(S.active==='year')S.active=(S.canvases[0]||{}).id}
  S.m14=true;
 }
 if(!S.m4){S.msgs=[{who:'ai',text:'Tell me what is coming up, or what to change on this page. A sentence, a voice note or a screenshot works.'}];S.m4=true}
 S.seq=S.seq||10;
}

/* The conversation is on. One flag still governs it: set this to false
   and the dock, its grip and every line that points at it disappear,
   without anything being taken out. */
const CHAT_LIVE=true;
document.body.classList.toggle('nochat',!CHAT_LIVE);

/* How tall the conversation is, and whether it is folded away: both are
   facts about this screen, not about the account, so they stay here. */
const DOCKH='shsf-dockh',DOCKC='shsf-dockc';
let dockH=0,dockDown=false;
try{dockH=+localStorage.getItem(DOCKH)||0;dockDown=localStorage.getItem(DOCKC)==='1'}catch(e){}
const dockLimits=()=>({min:120,max:Math.max(200,Math.round(innerHeight*.7))});
function applyDock(){
 if(!CHAT_LIVE)return;
 const d=$('#dock'),g=$('#grip');if(!d)return;
 const {min,max}=dockLimits();
 if(dockH)d.style.setProperty('--dockh',Math.min(max,Math.max(min,dockH))+'px');
 else d.style.removeProperty('--dockh');
 d.classList.toggle('down',dockDown);
 if(g)g.setAttribute('aria-expanded',String(!dockDown));
}
const rememberDock=()=>{try{localStorage.setItem(DOCKH,String(dockH));localStorage.setItem(DOCKC,dockDown?'1':'0')}catch(e){}};

const CACHE='shsf-proto';
let S;
/* The cache paints the page at once; the server is the record and arrives a
   moment later. */
try{S=JSON.parse(localStorage.getItem(CACHE))}catch(e){}
if(!S||!S.canvases)S=seed();
prepare();
let view={y:today.getFullYear(),m:today.getMonth()},sel=key(today),editing=null,pendingImg=null,sheet=false;

/* ---- sync ----
   A write lands in the cache at once and on the server on a lazy timer.
   Every 5 seconds, and whenever the page comes back into view, the page
   pulls the latest. Two devices never overwrite each other: each keeps the
   last server copy it saw (the base) and merges item by item, so an event
   added on the phone and a task ticked on the Mac both survive. The server
   refuses any write not built on its current version. */
const BASE='shsf-base',OWNER='shsf-owner';
/* Which account this device's cache was built from. A browser is shared
   furniture: two people, or one person with two links, land on the same
   localStorage. Until the server says whose turn it is, the cache is
   drawn but never sent. */
let ownerId='';
try{ownerId=localStorage.getItem(OWNER)||''}catch(e){}
let online=false,sending=false,timer=null,pulling=false,firstPull=true;
let dirty=false,syncBase=null,baseAt=0;
try{const m=JSON.parse(localStorage.getItem(BASE));if(m){syncBase=m.state;baseAt=m.at||0;dirty=!!m.dirty}else if(localStorage.getItem(CACHE))dirty=true}catch(e){}
const cache=()=>{try{localStorage.setItem(CACHE,JSON.stringify(S));localStorage.setItem(BASE,JSON.stringify({state:syncBase,at:baseAt,dirty}));
 if(ownerId)localStorage.setItem(OWNER,ownerId)}catch(e){}};
const note=t=>{const n=$('#sync');n.textContent=t||'';n.hidden=!t};
const save=()=>{dirty=true;cache();if(online)queue()};
function queue(){clearTimeout(timer);timer=setTimeout(push,1200)}
const clone=o=>JSON.parse(JSON.stringify(o));
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
/* The two keys are written together but can still come apart, for instance
   when a full disk loses one of them. With nothing unsent, the base is the
   copy this device has already had acknowledged, so it is the better of the
   two and the page starts from it. */
if(!dirty&&syncBase&&!same(S,syncBase)){S=clone(syncBase);prepare()}
const isObj=o=>o&&typeof o==='object'&&!Array.isArray(o);
const byId=a=>Array.isArray(a)&&a.length>0&&a.every(x=>isObj(x)&&x.id!=null);
/* Three-way merge: whichever side changed something since the base wins;
   if both changed it, objects merge key by key and lists merge item by id.
   On a true clash this device wins, and a deletion never beats an edit. */
function merge(b,l,r){
 if(same(l,r))return l;
 if(same(l,b))return r;
 if(same(r,b))return l;
 if(l===undefined)return r;
 if(r===undefined)return l;
 if((byId(l)||byId(r))&&Array.isArray(l)&&Array.isArray(r))return mergeList(Array.isArray(b)?b:[],l,r);
 if(isObj(l)&&isObj(r)){const o={},bb=isObj(b)?b:{};for(const k of new Set([...Object.keys(r),...Object.keys(l)])){const v=merge(bb[k],l[k],r[k]);if(v!==undefined)o[k]=v}return o}
 return l;
}
function mergeList(b,l,r){
 const m=a=>new Map(a.map(x=>[String(x.id),x]));const bm=m(b),lm=m(l),rm=m(r),out=[];
 const take=(id)=>{
  const bi=bm.get(id),li=lm.get(id),ri=rm.get(id);
  /* Same id added on both sides with different content: an id clash, not
     an edit. Keep both. */
  if(bi===undefined&&li&&ri&&!same(li,ri)){out.push(ri);out.push({...li,id:typeof li.id==='number'?nid():li.id+'-'+nid()});return}
  const v=merge(bi,li,ri);if(v!==undefined)out.push(v);
 };
 for(const x of r)take(String(x.id));
 for(const x of l)if(!rm.has(String(x.id)))take(String(x.id));
 return out;
}
/* Ids that two devices will not both hand out. */
const nid=()=>Date.now()*1000+Math.floor(Math.random()*1000);
/* Bring in a server copy: merge if this device has unsent changes. */
function adopt(remote,at){
 const act=S.active;
 S=dirty?merge(syncBase||{},S,remote):clone(remote);
 if(S.canvases&&S.canvases.some(c=>c.id===act))S.active=act;  /* the open tab stays per device */
 syncBase=clone(remote);baseAt=at;prepare();cache();render();renderMsgs();
 /* A copy from another device may name icons this one has never drawn. */
 healIcons();
}
/* Hold incoming changes while something is being typed or edited. */
const busyEditing=()=>{const a=document.activeElement;return editing!==null||busy||!!(a&&a.id!=='q'&&(a.isContentEditable||a.tagName==='TEXTAREA'||a.tagName==='SELECT'||(a.tagName==='INPUT'&&!/^(checkbox|radio|range|color|file|button)$/.test(a.type))))};
async function push(){
 /* Nothing leaves this device until the server has said which account it
    is talking to and the cache has been shown to belong to it. */
 if(!online||sending||!dirty||!ownerId)return;
 if(pulling){queue();return}
 sending=true;
 const snap=clone(S);
 try{
  const r=await fetch('/api/state',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({state:snap,baseUpdatedAt:baseAt,owner:ownerId})});
  if(r.status===401){online=false;note('Signed out on this device. Open your private link again.')}
  else if(r.status===409){const body=await r.json().catch(()=>null);if(body&&body.state){adopt(body.state,body.updatedAt)}else note('Reload the page to keep saving.')}
  else if(r.ok){const body=await r.json();syncBase=snap;baseAt=body.updatedAt;dirty=!same(S,snap);cache();note('')}
 }catch(e){note('Offline. Changes are kept on this device.')}
 sending=false;
 if(dirty&&online)queue();
}
async function pull(){
 if(pulling||sending)return;
 pulling=true;
 try{
  let r;
  try{r=await fetch('/api/state',{headers:{accept:'application/json'},cache:'no-store'})}
  catch(e){note('Offline. Changes are kept on this device.');return}
  if(r.status===401){online=false;note('Open your private link to save across devices.');return}
  if(!r.ok){note('The server did not answer. Changes are kept on this device.');return}
  online=true;note('');
  let body=null;try{body=await r.json()}catch(e){}
  const stored=body&&body.state;
  const who=(body&&body.userId)||'';

  /* A cache belonging to someone else, or to nobody yet, is not this
     account's to keep or to send. The server is the record: take what is
     up there, or start empty, and throw the stranger's copy away. */
  if(who&&who!==ownerId){
   const fresh=ownerId?'This device was signed in to another account. Showing what the server has.':'';
   /* Unsent work is set aside rather than destroyed: it is not published
      anywhere, but it is still on the device if it turns out to matter. */
   if(dirty){try{localStorage.setItem('shsf-orphan',JSON.stringify({at:Date.now(),state:S}))}catch(e){}}
   ownerId=who;dirty=false;firstPull=false;
   if(stored&&stored.canvases){S=clone(stored);syncBase=clone(stored);baseAt=body.updatedAt}
   else{S=seed();syncBase=null;baseAt=0}
   prepare();cache();render();renderMsgs();healIcons();
   if(fresh){note(fresh);setTimeout(()=>note(''),6000)}
   return;
  }
  if(!who){note('The server did not say which account this is. Changes are kept on this device.');return}

  /* Same account, nothing up there yet: this device's own copy seeds it. */
  if(!stored||!stored.canvases){baseAt=0;syncBase=null;dirty=true;firstPull=false;queue();return}
  /* The first answer is taken whatever the base says. A device whose cache
     failed to write can hold a base that already matches the server while
     showing something older, and would otherwise never catch up. */
  if(firstPull||(body.updatedAt!==baseAt&&!busyEditing()))adopt(stored,body.updatedAt);
  firstPull=false;
  if(dirty)queue();
 }finally{pulling=false}
}
setInterval(()=>{if(!document.hidden)pull()},5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
window.addEventListener('focus',pull);
window.addEventListener('online',pull);

const tlabel=e=>e.time?t12(e.time):(e.tmode==='tbd'?'TBD':'');
const t12=t=>{if(!t)return '';let [h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${pad(m)} ${ap}`};
const shanghai=(dk,t)=>{
 if(!t||!S.settings.shTime)return '';
 const [h,m]=t.split(':').map(Number);const d=fromKey(dk);d.setHours(h,m);
 const f=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Shanghai',hour:'numeric',minute:'2-digit',weekday:'short'});
 return 'Shanghai '+f.format(d);
};

/* The field a value was written under, even if it has since left the list. */
const fieldById=id=>S.fields.find(f=>f.id===id)||S.retired.find(f=>f.id===id);
/* Which fields a day shows: the current list, plus anything retired that
   this particular day still holds a value for. */
function fieldsOn(dk){
 const vs=S.vals[dk]||{};
 return S.fields.concat(S.retired.filter(f=>vs[f.id]!==undefined));
}
const triNext=v=>v==='good'?'bad':v==='bad'?'':'good';

/* ---- the period, kept in one place ----
   A day is in it or it is not; there is no second copy. Days that touch
   are one spell, and the spells take these colours in turn. Nothing is
   predicted, counted or named. */
const PCOL=['#d9829b','#6fd3a8','#7cb8ff','#ffc94d','#ff9f94','#b79cff'];
const isPeriod=dk=>!!(S.period&&S.period[dk]);
function setPeriod(dk,on){
 S.period=S.period||{};
 if(on)S.period[dk]=true;else delete S.period[dk];
 save();render();
}
/* Every day in the period, with the colour of the spell it belongs to. */
function periodPaint(){
 const days=Object.keys(S.period||{}).filter(k=>S.period[k]).sort();
 const paint={};let run=-1,prev=null;
 for(const d of days){
  if(!prev||key(addDays(fromKey(prev),1))!==d)run++;
  paint[d]=PCOL[run%PCOL.length];prev=d;
 }
 return paint;
}
const pbar=c=>c?`<span class="pbar" style="--pc:${c}"></span>`:'';
/* Wide enough for what is written, and no wider; the cell's own maximum
   stops it running off a phone. */
const chw=v=>Math.min(42,Math.max(4,String(v??'').length+1))+'ch';

/* One toggle or one small value, the same in the week and in the day
   sheet. `dk` is the day it writes to.

   Compact is the week row: a tick or a mark is tapped in place, but a field
   that wants a keyboard shows what it holds and sends you to the sheet,
   which is where a day is edited and where there is room for it. */
function control(f,dk,compact){
 const v=(S.vals[dk]||{})[f.id];
 const st=`style="--fc:${fcol(f)}"`;
 const lbl=esc(f.name);
 if(f.type==='check')
  return `<button class="tgl${v?' on':''}" ${st} data-chk="${f.id}" data-d="${dk}" aria-pressed="${v?'true':'false'}" aria-label="${lbl}">${icon(ficon(f))}</button>`;
 if(f.type==='tri')
  /* Blank shows no mark at all, just the square to tap. */
  return `<button class="tgl${v?' '+v:''}" ${st} data-tri="${f.id}" data-d="${dk}" aria-label="${lbl}: ${v||'blank'}">${v==='good'?icon('check'):v==='bad'?icon('x'):''}</button>`;
 const shown=f.type==='range'?((v&&(v.from||v.to))?`${v.from||'?'}\u2013${v.to||'?'}`:'')
  :f.type==='photo'?(hasVal(f,v)?short(f,v):'')
  :(v===undefined||v===''?'':String(v));
 if(f.type==='photo'&&compact)
  /* The picture itself is the control: tap it to open the day. */
  return `<button class="wkv pht${hasVal(f,v)?' set':''}" ${st} data-day="${dk}" title="${lbl}" aria-label="${lbl}">${v&&v.photo?`<img src="/api/photo/${encodeURIComponent(v.photo)}" alt="">`:icon(ficon(f))}</button>`;
 if(f.type==='photo'){
  const cur=v||{};
  return `<div class="pho${hasVal(f,cur)?' set':''}" ${st}>
   <label class="shot" title="${lbl}">${cur.photo?`<img src="/api/photo/${encodeURIComponent(cur.photo)}" alt="${lbl}">`:icon('camera')}
    <input type="file" accept="image/*" data-ph="${f.id}" data-d="${dk}" aria-label="${lbl} photo"></label>
   <div class="phf">
    <input type="text" data-f="${f.id}" data-pk="text" data-d="${dk}" value="${esc(cur.text||'')}" placeholder="Note" aria-label="${lbl} note">
    <input type="text" inputmode="numeric" class="tmi" data-f="${f.id}" data-pk="time" data-d="${dk}" value="${esc(cur.time||'')}" placeholder="Time" aria-label="${lbl} time">
   </div>
   ${cur.photo?`<button class="phx" data-phx="${f.id}" data-d="${dk}" aria-label="Remove photo">\u00d7</button>`:''}
  </div>`;
 }
 if(f.type==='text'){
  /* Free text shows all of what it holds: the box grows with the writing
     rather than cutting it off, and wears no tick to be mistaken for
     one. */
  if(compact)
   return `<button class="wkv txt${shown?' set':''}" ${st} data-day="${dk}" title="${lbl}" aria-label="${lbl}${shown?': '+esc(shown):''}">${shown?`<b>${esc(shown)}</b>`:'<span class="aa">Aa</span>'}</button>`;
  return `<label class="wkv txt${v?' set':''}" ${st} title="${lbl}"><input type="text" data-f="${f.id}" data-d="${dk}" value="${esc(v??'')}" style="width:${chw(v)}" placeholder="Aa" aria-label="${lbl}"></label>`;
 }
 if(compact)
  /* Empty, the icon says what it is; filled, the value does, and the
     colour of the border keeps it tied to its field. */
  return `<button class="wkv${shown?' set':''}" ${st} data-day="${dk}" title="${lbl}" aria-label="${lbl}${shown?': '+esc(shown):''}">${shown?`<b>${esc(shown)}</b>`:icon(ficon(f))}</button>`;
 if(f.type==='time')
  /* Typed, not picked: "2315" and "11.15pm" both land on 23:15, and what
     cannot be read is kept as written rather than thrown away. */
  return `<label class="wkv${v?' set':''}" ${st} title="${lbl}">${icon(ficon(f))}<input type="text" inputmode="numeric" class="tmi" data-f="${f.id}" data-d="${dk}" value="${esc(v||'')}" placeholder="--:--" aria-label="${lbl}">${nightBefore(v)?'<em class="nb">night before</em>':''}</label>`;
 if(f.type==='number')
  return `<label class="wkv${v!==undefined&&v!==''?' set':''}" ${st} title="${lbl}">${icon(ficon(f))}<input type="number" inputmode="decimal" step="any" data-f="${f.id}" data-d="${dk}" value="${esc(v??'')}" aria-label="${lbl}"></label>`;
 if(f.type==='range')
  return `<label class="wkv${v&&(v.from||v.to)?' set':''}" ${st} title="${lbl}">${icon(ficon(f))}<input type="time" data-f="${f.id}" data-p="from" data-d="${dk}" value="${esc(v?.from||'')}" aria-label="${lbl} start"><input type="time" data-f="${f.id}" data-p="to" data-d="${dk}" value="${esc(v?.to||'')}" aria-label="${lbl} end"></label>`;
 return `<label class="wkv${v?' set':''}" ${st} title="${lbl}">${icon(ficon(f))}<input type="text" data-f="${f.id}" data-d="${dk}" value="${esc(v??'')}" aria-label="${lbl}"></label>`;
}

function renderTabs(){
 $('#tabs').innerHTML=S.canvases.map(c=>`<button class="tab" role="tab" data-id="${esc(c.id)}" aria-selected="${c.id===S.active}">${esc(c.name)}</button>`).join('');
}

const hrs=(a,b)=>{if(!a||!b)return '';const [h1,m1]=a.split(':').map(Number),[h2,m2]=b.split(':').map(Number);let m=(h2*60+m2)-(h1*60+m1);if(m<=0)m+=1440;return `${Math.floor(m/60)}h${m%60?` ${m%60}m`:''}`};
/* A photo field holds any mix of a picture, a note and a time, so its
   value is a small object; everything else is a scalar. */
const PHOTO_PARTS=['photo','text','time'];
const emptyBag=v=>!v||typeof v!=='object'||!Object.values(v).some(x=>x!==''&&x!=null&&x!==false);
const hasVal=(f,v)=>f.type==='photo'||f.type==='range'?!emptyBag(v)
 :v!==undefined&&v!==null&&v!==''&&v!==false;
/* ---- icons ----
   Three marks are the page's own furniture and are inlined (lucide
   0.544.0, ISC); there is no preset list beyond them. A field's icon is
   either an emoji or a lucide name, and the drawing of every name in use
   is kept in the state, so the page draws what you chose while offline
   and only reaches for the library when you open the picker. */
const UI_ICONS={"check":'<path d="M20 6 9 17l-5-5" />',"x":'<path d="M18 6 6 18" /> <path d="m6 6 12 12" />',"camera":'<path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z" /> <circle cx="12" cy="13" r="3" />'};
const svgFor=n=>UI_ICONS[n]||(S.iconlib&&S.iconlib[n])||null;
/* A name is a lucide name; anything else you typed is an emoji. */
const isName=v=>/^[a-z0-9-]+$/.test(String(v||''));
const emoji=v=>{const c=[...String(v||'').trim()];
 try{const sg=new Intl.Segmenter();return [...sg.segment(String(v||'').trim())][0]?.segment||c[0]||''}catch(e){return c[0]||''}};
const icon=n=>{
 const g=svgFor(n);
 if(g)return `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${g}</svg>`;
 if(n&&!isName(n))return `<span class="ic emo" aria-hidden="true">${esc(emoji(n))}</span>`;
 return `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${UI_ICONS.check}</svg>`;
};
const COLORS=['c1','c2','c3','c4','c5','c6'];
const fcol=f=>`var(--f-${COLORS.includes(f&&f.color)?f.color:'slate'})`;
const ficon=f=>(f&&f.icon&&(svgFor(f.icon)||!isName(f.icon)))?f.icon:'check';
/* The box left of the colours holds the mark, and there are two of them:
   a tick, or a pair of pointe shoes. Tapping it turns one into the other,
   and a field that wears neither starts at the tick. */
/* What an item logs is one choice, not two. A tick, a tick-or-cross, or
   free text; or an emoji, which ticks like a tick and is the face of the
   item as well. The row is the whole vocabulary, and the plus adds to
   it. */
const markOf=f=>!f?'':f.type==='tri'?'tri'
 :(f.type==='text'||f.type==='time'||f.type==='number')?'text'
 :f.type==='check'?((f.icon&&!isName(f.icon))?f.icon:'check'):'';
function applyMark(f,m){
 if(m==='tri'){f.type='tri';f.icon='check'}
 else if(m==='text'){f.type='text';f.icon='check'}
 else if(m==='check'){f.type='check';f.icon='check'}
 else{f.type='check';f.icon=m}
 return f;
}
const markName=m=>m==='tri'?'Tick or cross':m==='text'?'Free text':m==='check'?'Tick':m;
const markFace=m=>m==='tri'?`<span class="two">${icon('check')}${icon('x')}</span>`
 :m==='text'?'<span class="aa">Aa</span>':icon(m);
/* An emoji already worn by an item is always offered again, even if the
   list it was added from has since been replaced. */
/* Four are the furniture and stay; everything after them was added with
   the plus and can be taken out again. An item already wearing one keeps
   it either way, so the row also shows whatever is chosen right now. */
const FIXED=['check','tri','text','🩰'];
function markRow(cur,attr=''){
 const opts=[...FIXED,...S.marks.filter(m=>!FIXED.includes(m))];
 if(cur&&!opts.includes(cur))opts.push(cur);
 const removable=S.marks.includes(cur)&&!FIXED.includes(cur);
 return `<span class="mrow" role="group" aria-label="What this item logs"${attr?' '+attr:''}>${
  opts.map(m=>`<button class="mk2${m===cur?' on':''}" data-mk="${esc(m)}" aria-pressed="${m===cur}" title="${esc(markName(m))}" aria-label="${esc(markName(m))}">${markFace(m)}</button>`).join('')
 }<button class="mk2 addm" data-mkadd="1" title="Add an emoji" aria-label="Add an emoji">+</button>${
  removable?`<button class="rmmk" data-mkrm="${esc(cur)}" aria-label="Remove ${esc(cur)} from the row">Remove</button>`:''}</span>`;
}
/* The plus hands the job to whatever emoji keyboard the device has: the
   keyboard's own emoji key on a phone, ctrl-cmd-space on a Mac. Whatever
   lands in the box joins the row and stays there. */
function askEmoji(btn,then){
 const inp=document.createElement('input');
 inp.className='emoin';inp.placeholder='emoji';inp.setAttribute('aria-label','Pick an emoji');
 btn.replaceWith(inp);inp.focus();
 let done=false;
 const take=()=>{if(done)return;done=true;
  const v=emoji(inp.value);inp.remove();
  if(v&&!S.marks.includes(v)&&!FIXED.includes(v)){S.marks=[...S.marks,v].slice(-24);save()}
  then(v||null)};
 const drop=()=>{if(done)return;done=true;inp.remove();then(null)};
 inp.addEventListener('input',()=>{if(emoji(inp.value))take()});
 inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();take()}if(e.key==='Escape')drop()});
 inp.addEventListener('blur',()=>setTimeout(take,0));
}
/* "2315", "23:15", "11:15pm", "11.15", "7", "7am" are all a time. Anything
   else is kept exactly as it was typed: a note beats a rejection, and
   nothing here ever refuses to save. */
function parseClock(raw){
 const t=String(raw).trim().toLowerCase().replace(/\s+/g,'').replace(/[\uFF0E\u3002]/g,'.');
 if(!t)return '';
 let m,h,mi=0,ap=null;
 if(m=t.match(/^(\d{1,2})[:.](\d{1,2})(am|pm|a|p)?$/)){h=+m[1];mi=+m[2];ap=m[3]}
 else if(m=t.match(/^(\d{3,4})(am|pm|a|p)?$/)){h=+m[1].slice(0,-2);mi=+m[1].slice(-2);ap=m[2]}
 else if(m=t.match(/^(\d{1,2})(am|pm|a|p)?$/)){h=+m[1];ap=m[2]}
 else return null;
 if(mi>59)return null;
 if(ap){if(h<1||h>12)return null;h=h%12+(ap[0]==='p'?12:0)}
 else if(h>23)return null;
 return pad(h)+':'+pad(mi);
}
const clockValue=raw=>{const v=parseClock(raw);return v===null?String(raw).trim().slice(0,40):v};
/* A time before five in the morning belongs to the evening before. */
const nightBefore=v=>/^0[0-4]:/.test(v||'');

const TRI={good:'\u2212',bad:'\u2715'};
const short=(f,v)=>f.type==='range'?`${v.from||'?'}→${v.to||'?'}`
 :f.type==='photo'?([v.time,v.text].filter(Boolean).join(' ')||'photo')
 :f.type==='check'?'':f.type==='tri'?(TRI[v]||''):String(v);
const doneOn=k=>{const out=[];Object.entries(S.tasks).forEach(([cid,L])=>L.forEach(t=>{if(t.done&&t.doneAt===k)out.push(t)}));return out};
function summary(k){
 const vs=S.vals[k]||{},parts=[];let cn=0,cd=0;
 S.fields.forEach(f=>{const v=vs[f.id];if(f.type==='check'){cn++;if(v)cd++}else if(hasVal(f,v))parts.push(short(f,v))});
 if(cn&&cd)parts.push(`${cd}/${cn}`);
 const dn=doneOn(k).length;if(dn)parts.push(`✓${dn}`);
 return parts.join(' · ');
}
function renderCal(){

 const byDay={};S.events.forEach(e=>(byDay[e.date]??=[]).push(e));
 Object.values(byDay).forEach(a=>a.sort((a,b)=>(a.time||'').localeCompare(b.time||'')));
 const paint=periodPaint();
 let cells='';
 for(let i=0;i<42;i++){
  const d=addDays(start,i),k=key(d),ev=byDay[k]||[];
  const we=d.getDay()===0||d.getDay()===6;

     own colour, and the sleep mark as itself. */
  const marks=fieldsOn(k).filter(f=>hasVal(f,(S.vals[k]||{})[f.id])).map(f=>{
   const v=(S.vals[k]||{})[f.id];
   if(f.type==='tri')return `<i class="mk ${v}">${v==='good'?icon('check'):icon('x')}</i>`;
   return `<i class="mk dot" style="--fc:${fcol(f)}" title="${esc(f.name)}"></i>`;
  }).join('');

  cells+=`<div role="button" tabindex="0" class="${cls}" data-day="${k}" aria-label="${d.toDateString()}, ${ev.length} events"><span class="n">${d.getDate()}${pbar(paint[k])}</span><span class="chips">${ev.slice(0,2).map(e=>`<span class="chip${e.big?' big':''}" draggable="true" data-drag="${e.id}">${esc(e.title)}</span>`).join('')}</span>${ev.length>2?`<span class="more">+${ev.length-2} more</span>`:''}${sm?`<span class="sum">${esc(sm)}</span>`:''}${marks?`<span class="marks">${marks}</span>`:''}</div>`;
 }
 $('#canvas').innerHTML=`
 <div class="cal${S.settings.weekend?' wkend':''}">
  <section>
   <div class="mhead"><h1>${MONTHS[view.m]} <em>${view.y}</em></h1>
    <div class="nav"><button data-nav="-1" aria-label="Previous month">‹</button><button data-nav="1" aria-label="Next month">›</button></div></div>
   ${viewSwitch()}
   <div class="dow">${(S.settings.weekStart==='sun'?['Sun','Mon','Tue','Wed','Thu','Fri','Sat']:['Mon','Tue','Wed','Thu','Fri','Sat','Sun']).map(d=>`<span class="${d==='Sat'||d==='Sun'?'we':''}">${d}</span>`).join('')}</div>
   <div class="grid">${cells}</div>

 </div>`;

/* ---- the year, the way a paper planner holds one ----
   Twelve columns, thirty-one rows, no colour of its own. A day opens
   itself. The marks are drawn, never set, here. */
let yearShown=today.getFullYear();
const YM=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function renderYear(){
 const paint=periodPaint();
 let cols='';
 for(let m=0;m<12;m++){
  const last=new Date(yearShown,m+1,0).getDate();
  let days='';
  for(let i=1;i<=31;i++){
   if(i>last){days+=`<span class="yd none" aria-hidden="true"></span>`;continue}
   const k=`${yearShown}-${pad(m+1)}-${pad(i)}`;
   const d=new Date(yearShown,m,i),we=d.getDay()===0||d.getDay()===6;

/* ---- a mind map, drawn here ----
   A map is a sheet with nodes placed on it, not a tree that arranges
   itself: every node, the root included, stays exactly where it is put.
   A node carries its own place, so the whole map is a flat set of nodes
   that merges one node at a time like everything else in the state.

   Nothing is fetched for this: no library, no network, and it works
   offline like the rest of the page. */
const MINDC=['#d9829b','#6fd3a8','#7cb8ff','#b79cff','#ffc94d','#ff9f94'];
const MSHEET={w:3200,h:2200},MSTEP={x:210,y:130};

/* A map written by the old library was a tree; it becomes a sheet, with
   each branch laid out where the tree had it. Nothing written is lost. */
function fromTree(d,name){
 const nodes={};
 const place=(n,x,y,parent)=>{
  const id=String(n.id||nid());
  nodes[id]={id,text:String(n.topic||n.text||''),x,y,parent:parent||null};
  return id;
 };
 const rootObj=d&&d.nodeData?d.nodeData:{topic:name||'Idea'};
 const rid=place(rootObj,MSHEET.w/2,MSHEET.h/2,null);
 const kids=rootObj.children||[];
 const side={0:[],1:[]};
 kids.forEach((k,i)=>side[k.direction===0||k.direction===1?k.direction:i%2].push(k));
 for(const dir of [0,1]){
  const list=side[dir],sx=dir===0?-1:1;
  list.forEach((k,i)=>{
   const y=MSHEET.h/2+(i-(list.length-1)/2)*MSTEP.y*1.4;
   const kid=place(k,MSHEET.w/2+sx*MSTEP.x,y,rid);
   const walk=(n,pid,depth,base)=>{
    (n.children||[]).forEach((g,j)=>{
     const gy=base+(j-((n.children.length-1)/2))*MSTEP.y;
     const gid=place(g,MSHEET.w/2+sx*MSTEP.x*(depth+1),gy,pid);
     walk(g,gid,depth+1,gy);
    });
   };
   walk(k,kid,1,y);
  });
 }
 return {root:rid,nodes};
}
/* The map this canvas holds, made or brought forward if need be. */

/* A list can be read by the part of the work it belongs to, or by what

/* What is still open keeps the order it was written in and stays at the
