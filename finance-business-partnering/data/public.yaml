# Finance Business Partnering :: story bank (public data)
#
# This file is committed and served online, so it holds nothing confidential.
# data/private.yaml is gitignored, lives only on the local machine, and
# overlays this file story by story on matching `id`.
#
# The *_zh keys carry the original Chinese wording as reference data only.
# The page renders English exclusively and never displays them.

meta:
  # One line methodology statement, shown under the page title.
  methodology: "TODO: one line methodology statement."

# ---------------------------------------------------------------------------
# Needs taxonomy. Render order is the order written here: tracks top to
# bottom, stages left to right, needs left to right inside a stage.
# A stage with no label renders its needs without a stage heading.
# ---------------------------------------------------------------------------
tracks:
  - id: spend
    label: Spend
    stages:
      - id: plan
        label: Plan
        needs:
          - id: budget_setting
            label: Budget Setting
            label_zh: 制定预算
          - id: incremental_ask
            label: Incremental Ask
            label_zh: 追加预算
      - id: execute
        label: Execute
        needs:
          - id: contract_structuring
            label: Contract Structuring
            label_zh: 合作合同
          - id: annual_cost_down
            label: Annual Cost-Down
            label_zh: 年降
          - id: peak_ad_hoc
            label: Peak Ad Hoc Approval
            label_zh: 旺季临时批预算
      - id: control
        label: Control
        needs:
          - id: overrun_control
            label: Overrun Control
            label_zh: 超支管控
      - id: impact
        label: Impact
        needs:
          - id: spend_impact
            label: Spend Impact Visibility
            label_zh: 花得听得见响
          - id: roi
            label: ROI
            label_zh: 投资回报

  - id: earn
    label: Earn
    stages:
      - id: earn
        label: null
        needs:
          - id: dynamic_pricing
            label: Dynamic Pricing
            label_zh: 动态定价
          - id: revenue_sharing
            label: Revenue Sharing
            label_zh: 分润

# ---------------------------------------------------------------------------
# Counterparty enum. `none` is selectable on a story but is not offered as a
# filter; the filter row is All / Related Party / External.
# ---------------------------------------------------------------------------
counterparties:
  - id: related_party
    label: Related Party
    label_zh: 关联方
  - id: external
    label: External
    label_zh: 外部
  - id: none
    label: None

# ---------------------------------------------------------------------------
# Companies, in wall order.
# ---------------------------------------------------------------------------
companies:
  - Alibaba
  - NIO
  - Ford
  - XTransfer

# ---------------------------------------------------------------------------
# Stories. Public fields only.
#   id                 stable key, also the overlay key for private.yaml
#   company            one of `companies` above
#   title_en           rendered on the card and in the drawer
#   title_zh           reference only, never rendered
#   hook               one line, rendered on the card
#   goal_and_need      drawer section 1
#   model_and_analysis drawer section 2
#   result             drawer section 3
#   needs_primary      need ids this story squarely answers
#   needs_secondary    need ids it touches
#   counterparty       one counterparty id
# ---------------------------------------------------------------------------
stories:
  - id: cainiao_tiered_pricing
    company: Alibaba
    title_en: Cainiao Tiered Pricing
    title_zh: 菜鸟阶梯定价
    hook: TODO
    goal_and_need: TODO
    model_and_analysis: TODO
    result: TODO
    needs_primary:
      - contract_structuring
      - dynamic_pricing
    needs_secondary:
      - annual_cost_down
    counterparty: related_party

  - id: nio_training_data
    company: NIO
    title_en: Training Data Prioritization
    title_zh: 训练数据投资排序
    hook: TODO
    goal_and_need: TODO
    model_and_analysis: TODO
    result: TODO
    needs_primary:
      - overrun_control
      - roi
    needs_secondary:
      - spend_impact
    counterparty: external

  - id: ford_hf45_investment
    company: Ford
    title_en: HF45 Localization Investment
    title_zh: HF45投资决策
    hook: TODO
    goal_and_need: TODO
    model_and_analysis: TODO
    result: TODO
    needs_primary:
      - budget_setting
      - revenue_sharing
    needs_secondary:
      - roi
    counterparty: related_party
