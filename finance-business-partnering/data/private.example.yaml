# Template for data/private.yaml.
#
# Copy to data/private.yaml and fill in. private.yaml is gitignored: it stays
# on the local machine and is never committed or published. The page fetches
# it, and if the fetch 404s or the parse fails it falls back to public data
# with no error shown.
#
# Everything in this repo is English, including this template. Your own
# private.yaml is local only, so it is the one place you can keep notes in
# another language if you want to. Nothing below is ever rendered in another
# language anyway: the page renders English and only the fields marked as
# rendered reach the screen.

# ---------------------------------------------------------------------------
# Optional. Alternative wording for the fixed taxonomy, keyed by need id and
# counterparty id. Read onto the taxonomy as `label_zh` and never rendered, so
# it is reference data for you rather than page content. Uncomment to use.
# ---------------------------------------------------------------------------
# labels:
#   budget_setting: your own wording for this need
#   roi: your own wording for this need

# ---------------------------------------------------------------------------
# Per story overlay. Only `id` is required, and it has to match an id in
# public.yaml. Every other key is optional; whatever is present overlays the
# public story, so public fields left as TODO can be filled here instead.
# ---------------------------------------------------------------------------
stories:
  - id: cainiao_tiered_pricing

    # Optional alternative title. Carried onto the story and never rendered.
    # title_zh: your own title for this story

    # Link to the working chat or thread behind the story. Rendered in the
    # drawer as a link.
    chat_url: https://example.com/chat/cainiao-tiered-pricing

    # Which interview slot this story is held for. Rendered in the drawer.
    interviewer_slot: Round 2, business finance lead

    # Free text, kept out of the public file. Rendered in the drawer.
    notes: |
      Lead with the step function in the rate card, not the volume forecast.
      Expect a push on how the floor was set.

    # Real numbers, kept out of the public file. Rendered in the drawer as
    # "Figures", directly after Result.
    absolute_figures: |
      Annual contract value 142M across 11 lanes.
      Realized rate 3.86 per parcel against a 4.20 list.
      Cost-down signed at 6.5 percent, against an 8 percent ask.
